      target: main.pyとConsoleの2行
      expected: 同じ変数に2を足して5を表示する
      nextAction: 答えを直接書かず、同じ変数に2を足してprintで表示してください。
    hintId: python-basics-ch01-l01-e01-h02
    relatedSlideId: python-basics-ch01-l01-s03
hints:
  - id: python-basics-ch01-l01-e01-h01
    text: 引用符で囲むと、その文字列を表示します。変数の値を表示するときは、引用符を外して変数名を書きます。
    level: 1
    title: 引用符を比べる
    relatedSlideId: python-basics-ch01-l01-s02
  - id: python-basics-ch01-l01-e01-h02
    text: 最初の行で付けた名前を、両方のprintで使います。答えの3や5を直接書くだけでは、変数を使った理由を確認できません。
    level: 2
    title: 同じ名前を使う
    relatedSlideId: python-basics-ch01-l01-s03
  - id: python-basics-ch01-l01-e01-h03
    level: 3
    title: 変数と足し算を表示する
    text: count = 3、print(count)、print(count + 2)の順に書きます。答えを直接表示する方法と何が違うか説明しましょう。
    relatedSlideId: python-basics-ch01-l01-s03
