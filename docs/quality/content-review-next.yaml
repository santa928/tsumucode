    notes:
      公開回復候補4a017a7eb0e79dd4bb0ec4a38417637158cb8046への適用確認。9教材hash・学習画面・固定依存は元b809b15・d55127b・c16beec・965ff06と不変。元読解b809b15・原UI観測B91と3personaのSource・担当・原本hash・制限を保持し、新しい読解や実操作へ付け替えない。今回の3差分はBrowser証拠のmkdir/copy/公式mergeを作成側appコンテナ内へまとめ、厳格workflow
      guardと負対照を同期するもの。sudo/chmod/chown・権限追加・製品/API/TTL・検査範囲・閾値の変更はない。Linux
      root所有0755とrunner相当UID1001で旧失敗を再現し、新処理の正対照・失敗保持・片blob欠落拒否を確認した。公開run40314031651の2blob原本を再利用した実結合で647成功・既存2skip・失敗/Flaky0を確認し、元Source
      main2446547の結果として保持する。新SourceのBrowser実行や公開成功へ付け替えない。3担当の今回限定承認と未変更範囲承認、新SourceのNative・静的583ファイル完全一致を結合する。前段の補助32件は元5e8f8df、追加観測18件は元d0e787fとして保持する。Cookie取消の旧原因は未断定、実人受講・物理低端末・認証Cookieの留保を維持する。
