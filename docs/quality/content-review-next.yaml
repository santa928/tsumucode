    notes: 公開回復候補c16beec9538f6c19c59ce29c5427e66c26322624への適用確認。9教材hash・学習画面・固定依存は元efa0e78・d55127b・775ed87と不変。元読解b809b15と原UI観測B91のSource・担当・制限を保持し、新規読解や実操作へ付け替えない。差分は公開横断テストの同期、既存UI変更への確認済み5画像追随、全3Browser・1workerの工程分離と証拠結合。全649検査の集合・Tailwind全49Fixtureの所有範囲・最大240分の運用枠を記録し、既存3担当が限定差分を承認。固定32件の補助CIは元Source5e8f8dfのまま保持し、新SourceのNative原本・実CLI・最終CI・公開後確認とは分けて結合する。Cookie取消の旧原因は未断定で、実人受講・物理低端末・認証Cookieの留保を維持する。
