    notes: 公開回復候補775ed87495fff6de0f283acb0023b1dc4648efcaへの適用確認。9教材hash・学習画面・固定依存は元efa0e78およびd55127bと不変。元読解b809b15と原UI観測B91のSource・担当・制限は原本のまま保持し、新しい読解や実操作へ付け替えない。今回の差分はNode専用テストのbyte-identical命名と明示起動パスの修正で、テスト16件・assert・期限・失敗条件・他のVitest280ファイルを維持し、既存3担当が限定差分を承認。公開タグ検証のCLI依存分離は前候補d10ca8aの有効な検証を保持する。新SourceのNative原本と実CLI・最終CI・公開後確認を別々に結ぶ。Cookie取消の旧原因は未断定で、実人受講・物理低端末・認証Cookieの留保を維持する。
