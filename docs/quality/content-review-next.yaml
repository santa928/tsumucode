    notes:
      公開回復候補965ff069e37227beafc863d84187b9a9b7db5e3eへの適用確認。9教材hash・学習画面・固定依存は元efa0e78・d55127b・775ed87・c16beecと不変。元読解b809b15と原UI観測B91のSource・担当・制限を保持し、新規読解や実操作へ付け替えない。既存の公開横断テスト同期、確認済み5画像追随、全3Browser・1workerの工程分離と証拠結合に加え、最終workflow
      guardを2工程の完全な条件照合へ同期した。Firefox自動化のreloadがnavigate/0を報告する実観測に対し、製品の排他・4秒Leaseを維持し、永続保存と準備完了を条件待ちして元の検査を行う。期限前write拒否・期限後再取得・旧proof拒否の回帰検査を追加し、不要な観測wrapperは削除した。全649検査・Tailwind全49Fixture・最大240分運用枠を維持。既存3担当の未変更範囲承認と今回5差分の承認、新Source
      Native原本・静的成果物583ファイル完全一致を結合する。補助CI32件は元5e8f8df、追加観測18件は元d0e787fとして保持し、新Sourceへ付け替えない。Cookie取消の旧原因は未断定で、実人受講・物理低端末・認証Cookieの留保を維持する。
