interactionScenarios:
  - id: quiz-practice-flow
    label: 累積得点を保って同問へ再回答し、再挑戦する
    actions:
      - id: name
        kind: fill
        selector: '#name'
        value: Ada
      - id: early-next
        kind: click
        selector: '#next'
      - id: correct
        kind: click
        selector: '[id="2"]'
      - id: next
        kind: click
        selector: '#next'
      - id: wrong
        kind: click
        selector: '[id="true"]'
      - id: second-correct
        kind: click
        selector: '[id="false"]'
      - id: duplicate
        kind: click
        selector: '[id="false"]'
      - id: result
        kind: click
        selector: '#next'
      - id: retry
        kind: click
        selector: '#retry'
    checkpoints:
      - id: name
        afterActionId: name
        expectations:
          - id: name
            kind: input-value
            selector: '#name'
            equals: Ada
          - id: score
            kind: selector-text
            selector: '#score'
            equals: '0'
          - id: question
            kind: selector-text
            selector: '#question'
            equals: 1 + 1 の結果は？
      - id: early-next
        afterActionId: early-next
        expectations:
          - id: name
            kind: input-value
            selector: '#name'
            equals: Ada
          - id: score
            kind: selector-text
            selector: '#score'
            equals: '0'
          - id: question
            kind: selector-text
            selector: '#question'
            equals: 1 + 1 の結果は？
      - id: correct
        afterActionId: correct
        expectations:
          - id: name
            kind: input-value
            selector: '#name'
            equals: Ada
          - id: score
            kind: selector-text
            selector: '#score'
            equals: '1'
          - id: question
            kind: selector-text
            selector: '#question'
            equals: 1 + 1 の結果は？
          - id: received
            kind: selector-text
            selector: '#received'
            equals: '2'
      - id: next
        afterActionId: next
        expectations:
          - id: name
            kind: input-value
            selector: '#name'
            equals: Ada
          - id: score
            kind: selector-text
            selector: '#score'
            equals: '1'
          - id: question
            kind: selector-text
            selector: '#question'
            equals: 3 > 5 の結果は？
      - id: wrong
        afterActionId: wrong
        expectations:
          - id: name
            kind: input-value
            selector: '#name'
            equals: Ada
          - id: score
            kind: selector-text
            selector: '#score'
            equals: '1'
          - id: question
            kind: selector-text
            selector: '#question'
            equals: 3 > 5 の結果は？
          - id: received
            kind: selector-text
            selector: '#received'
            equals: 'true'
          - id: retry-choice
            kind: selector-exists
            selector: '[id="false"]:enabled'
      - id: second-correct
        afterActionId: second-correct
        expectations:
          - id: name
            kind: input-value
            selector: '#name'
            equals: Ada
          - id: score
            kind: selector-text
            selector: '#score'
            equals: '2'
          - id: question
            kind: selector-text
            selector: '#question'
            equals: 3 > 5 の結果は？
          - id: received
            kind: selector-text
            selector: '#received'
            equals: 'false'
      - id: duplicate
        afterActionId: duplicate
        expectations:
          - id: name
            kind: input-value
            selector: '#name'
            equals: Ada
          - id: score
            kind: selector-text
            selector: '#score'
            equals: '2'
          - id: question
            kind: selector-text
            selector: '#question'
            equals: 3 > 5 の結果は？
          - id: received
            kind: selector-text
            selector: '#received'
            equals: 'false'
      - id: result
        afterActionId: result
        expectations:
          - id: name
            kind: input-value
            selector: '#name'
            equals: Ada
          - id: score
            kind: selector-text
            selector: '#score'
            equals: '2'
          - id: result
            kind: selector-text
            selector: '#result'
            equals: 全問終了
      - id: retry
        afterActionId: retry
        expectations:
          - id: name
            kind: input-value
            selector: '#name'
            equals: Ada
          - id: score
            kind: selector-text
            selector: '#score'
            equals: '0'
          - id: question
            kind: selector-text
            selector: '#question'
            equals: 1 + 1 の結果は？
          - id: received
            kind: selector-text
            selector: '#received'
            equals: 未回答
  - id: quiz-practice-wrong-next
    label: 誤答では次問へ進まず同じ問題を続ける
    actions:
      - id: wrong
        kind: click
        selector: '[id="3"]'
      - id: next
        kind: click
        selector: '#next'
    checkpoints:
      - id: wrong
        afterActionId: wrong
        expectations:
          - id: question
            kind: selector-text
            selector: '#question'
            equals: 1 + 1 の結果は？
          - id: score
            kind: selector-text
            selector: '#score'
            equals: '0'
      - id: next
        afterActionId: next
        expectations:
          - id: question
            kind: selector-text
            selector: '#question'
            equals: 1 + 1 の結果は？
          - id: score
            kind: selector-text
            selector: '#score'
            equals: '0'
