hints:
  - id: react-ch03-l01-e01-h01
    level: 1
    title: 修正位置を探す
    text: Briefの「正解時だけ回答済み」「誤答では累積得点を保持」を、Guidedとの差として並べます。
    relatedSlideId: react-ch03-l01-s02
  - id: react-ch03-l01-e01-h02
    level: 2
    title: Briefと値をつなぐ
    text: CardのKeyとCallbackを保ち、answerの得点とansweredを別々に考えます。1問目正解の後に2問目を誤答して、リセットとの違いを見ます。
    relatedSlideId: react-ch03-l01-s02
  - id: react-ch03-l01-e01-h03
    level: 3
    title: 別の対象の局所例
    text: '別の例なら、const nextCount = accepted ? previousCount + 1 :
      previousCount;。受理しないとき元の累積値を保つ考え方を応用します。'
    relatedSlideId: react-ch03-l01-s02
