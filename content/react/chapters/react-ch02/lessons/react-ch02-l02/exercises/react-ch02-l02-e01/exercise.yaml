  - id: 'react-ch02-l02-e01-h01'
    level: 1
    title: '最初の手掛かり'
    text: '表示をまとめて変える値は、各カードより共通の親へ置きます。'
    relatedSlideId: 'react-ch02-l02-s01'
  - id: 'react-ch02-l02-e01-h02'
    level: 2
    title: '値と操作の流れを追う'
    text: 'State更新関数で直前の配列を受け取り、IDが合う本だけ違う値へします。'
    relatedSlideId: 'react-ch02-l02-s01'
  - id: 'react-ch02-l02-e01-h03'
    level: 3
    title: '小さい例で確かめる'
    text: 'mapの中でbook.id === idを確かめます。該当する本は{ ...book, read: !book.read }、他の本は元のbookを使うと、元配列を直接変えずに更新できます。'
    relatedSlideId: 'react-ch02-l02-s01'
