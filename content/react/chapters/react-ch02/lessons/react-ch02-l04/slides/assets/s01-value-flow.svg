<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 232" role="img" aria-labelledby="title description">
  <title id="title">受け取った数値を表示する部品の一例</title>
  <desc id="description">数値3をvalueへ渡すと、ValueTextが受け取った値をpに表示して3が見える。温度のStateや操作の置き場所は示していない。</desc>
  <rect width="480" height="232" rx="16" fill="#f8fafc"/>
  <g font-family="sans-serif" font-size="18" text-anchor="middle" fill="#0f172a">
    <rect x="16" y="16" width="448" height="52" rx="10" fill="#e0f2fe" stroke="#0369a1"/>
    <text x="240" y="48">数値3をvalueへ渡す</text>
    <path d="M240 71 v12 m-5 -5 5 5 5 -5" fill="none" stroke="#0369a1" stroke-width="2"/>
    <rect x="16" y="88" width="448" height="52" rx="10" fill="#e0f2fe" stroke="#0369a1"/>
    <text x="240" y="120">ValueTextがvalueをpに表示する</text>
    <path d="M240 143 v12 m-5 -5 5 5 5 -5" fill="none" stroke="#0369a1" stroke-width="2"/>
    <rect x="16" y="160" width="448" height="52" rx="10" fill="#e0f2fe" stroke="#0369a1"/>
    <text x="240" y="192">画面には3が見える</text>
  </g>
</svg>
