interactionScenarios:
  - id: temperature-synchronized-operations
    label: 両方の温度と、最初に戻した後の操作を確かめる
    actions:
      - id: increase-once
        kind: click
        selector: '#increase'
      - id: increase-again
        kind: click
        selector: '#increase'
      - id: decrease
        kind: click
        selector: '#decrease'
      - id: reset
        kind: click
        selector: '#reset'
      - id: decrease-after-reset
        kind: click
        selector: '#decrease'
      - id: reset-again
        kind: click
        selector: '#reset'
      - id: increase-after-reset
        kind: click
        selector: '#increase'
    checkpoints:
      - id: after-increase-once
        afterActionId: increase-once
        expectations:
          - id: celsius
            kind: selector-text
            selector: '#celsius'
            equals: '21'
          - id: fahrenheit
            kind: selector-text
            selector: '#fahrenheit'
            equals: '69.8'
      - id: after-increase-again
        afterActionId: increase-again
        expectations:
          - id: celsius
            kind: selector-text
            selector: '#celsius'
            equals: '22'
          - id: fahrenheit
            kind: selector-text
            selector: '#fahrenheit'
            equals: '71.6'
      - id: after-decrease
        afterActionId: decrease
        expectations:
          - id: celsius
            kind: selector-text
            selector: '#celsius'
            equals: '21'
          - id: fahrenheit
            kind: selector-text
            selector: '#fahrenheit'
            equals: '69.8'
      - id: after-reset
        afterActionId: reset
        expectations:
          - id: celsius
            kind: selector-text
            selector: '#celsius'
            equals: '20'
          - id: fahrenheit
            kind: selector-text
            selector: '#fahrenheit'
            equals: '68'
      - id: after-decrease-after-reset
        afterActionId: decrease-after-reset
        expectations:
          - id: celsius
            kind: selector-text
            selector: '#celsius'
            equals: '19'
          - id: fahrenheit
            kind: selector-text
            selector: '#fahrenheit'
            equals: '66.2'
      - id: after-reset-again
        afterActionId: reset-again
        expectations:
          - id: celsius
            kind: selector-text
            selector: '#celsius'
            equals: '20'
          - id: fahrenheit
            kind: selector-text
            selector: '#fahrenheit'
            equals: '68'
      - id: after-increase-after-reset
        afterActionId: increase-after-reset
        expectations:
          - id: celsius
            kind: selector-text
            selector: '#celsius'
            equals: '21'
          - id: fahrenheit
            kind: selector-text
            selector: '#fahrenheit'
            equals: '69.8'
hints:
  - id: react-ch02-l04-e01-h01
    level: 1
    title: 設計の手掛かり
    text: '同じ温度が必要な表示を探し、どの部品が覚えると値を渡しやすいか考えます。StateをAppへ置くことは必須ではありません。'
    relatedSlideId: react-ch02-l04-s02
  - id: react-ch02-l04-e01-h02
    level: 2
    title: 値と操作の流れを確かめる
    text: '温度を覚える部品から数値をPropsで表示部品へ渡します。操作するbuttonを別部品へ分けたら、引数のないCallbackを渡せます。'
    relatedSlideId: react-ch02-l04-s02
  - id: react-ch02-l04-e01-h03
    level: 3
    title: 小さい書き方を確かめる
    text: '数値を受け取るProps型はinterfaceやtypeで作れます。たとえばreadonly value: numberです。摂氏をcとすると、華氏の式はc * 9 / 5 + 32です。更新関数には次の数値かprevious => previous + 1の形を渡せます。'
    relatedSlideId: react-ch02-l04-s02
relatedSlideIds:
  - react-ch02-l04-s01
  - react-ch02-l04-s02
