steps:
  - id: react-ch02-l03-e01-step01
    file: components.tsx
    target: components.tsxのApp。動く一覧とBookCardを土台に、追加する値と計算を自分で選びます。
    starterAnchor: export function App
    change:
      「すべて」「未読」「既読」のbutton（idはそれぞれfilter-all/filter-unread/filter-read）で表示を切り替え、選択中だけaria-pressedをtrueにします。表示件数はidがcountの要素へ「2件」、全体の既読件数はidがsummaryの要素へ「既読1件
      / 全3件」の形で出してください。
    observe: 初期表示は3件、既読1件です。絞り込んでも元の3冊を残し、本を切り替えると一覧と2つの件数が更新されます。0件から別条件へ戻せること、idがresetの「最初に戻す」で本と表示条件が戻り、その後も切り替えられることを確かめます。
    requiresConceptIds:
      - react-reading-filter
    validationRuleIds:
      - react-ch02-l03-e01-r01
      - react-ch02-l03-e01-r02
      - react-ch02-l03-e01-r03
      - react-ch02-l03-e01-r04
