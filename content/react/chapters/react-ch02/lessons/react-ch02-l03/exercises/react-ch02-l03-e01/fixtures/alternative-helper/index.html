<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>読書リスト</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: sans-serif;
        line-height: 1.7;
      }
      ul {
        padding-left: 24px;
      }
      li {
        margin-block: 16px;
