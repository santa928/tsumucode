hints:
  - id: react-ch02-l01-e01-h01
    level: 1
    title: 最初の手掛かり
    text: 見せる値はbookから読み、操作はonToggleへ渡します。
    relatedSlideId: react-ch02-l01-s01
  - id: react-ch02-l01-e01-h02
    level: 2
    title: 値と操作の流れを追う
    text: onClickへ、クリック時に呼ぶ関数を書きます。表示した時点で呼ばないようにします。
    relatedSlideId: react-ch02-l01-s01
  - id: react-ch02-l01-e01-h03
    level: 3
    title: 小さい例で確かめる
    text: 題名は<h2>{book.title}</h2>で表示できます。操作はonClick={() =>
      onToggle(book.id)}の形です。状態とbuttonの文はbook.readから考えましょう。
    relatedSlideId: react-ch02-l01-s01
