hints:
  - id: react-ch02-l01-e01-h01
    level: 1
    title: 修正位置を探す
    text: mapが作るbuttonを探し、表示・Key・Callbackの3箇所を比べます。
    relatedSlideId: react-ch02-l01-s02
  - id: react-ch02-l01-e01-h02
    level: 2
    title: Briefと値をつなぐ
    text: 今回は各問内で選択肢の文字列が一意です。indexでなくその値を目印にし、押した値を親へ渡します。
    relatedSlideId: react-ch02-l01-s02
  - id: react-ch02-l01-e01-h03
    level: 3
    title: 別の対象の局所例
    text: 別の一覧なら、items.map(item => <button key={item.id} onClick={() =>
      select(item.id)}>{item.label}</button>)。3つの値の由来を今回へ応用します。
    relatedSlideId: react-ch02-l01-s02
