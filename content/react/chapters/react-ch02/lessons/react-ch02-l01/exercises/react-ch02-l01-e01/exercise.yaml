            kind: input-value
            selector: '#name'
            equals: Ada
      - id: selected
        afterActionId: selected
        expectations:
          - id: name
            kind: input-value
            selector: '#name'
            equals: Ada
          - id: received
            kind: selector-text
            selector: '#received'
            equals: CSS
