  kind: react
  entryFile: main.tsx
  sourceType: module
  capabilityProfile: dom
  primaryOutput: preview
  profile: effect-sync-v1
  learningGoal: external-sync
steps:
  - id: compose-effect-lifecycle
    file: components.tsx
    target: 'components.tsxのSourcePanel。処理は未実装です。StateとEffectを書いてから型と動作を確認します。開始時の診断は未実装を知らせています。型・起動・切替ボタン・外部入力・subscribeは配布済みで、編集はcomponents.tsxだけです。'
    change: '空文字列で始まるStateを1つ、その次にEffectを1つ書きます。setupでsubscribeへPropsのtargetとStateのsetterを渡します。subscribeは現在値をすぐsetterへ渡し、その後の入力も通知します。返された同じ解除関数をcleanupとして返し、setup中には呼びません。依存配列は[target]にします。'
    observe: '対象変更では前のcleanupから次のsetupへ進み、表示終了でもcleanupします。Stateと解除関数の変数名は別名でも構いません。値はid="observed"へ、文字数はid="length"へStateから直接表示します。文字数を別StateやEffectで保存しません。'
    starterAnchor: 'export function SourcePanel'
    requiresConceptIds:
      - react-effect-external-sync
      - react-effect-cleanup
    validationRuleIds:
      - react-ch01-l11-compose-e01-r01
      - react-ch01-l11-compose-e01-r02
      - react-ch01-l11-compose-e01-r03
  - id: compose-lifecycle-check
    file: components.tsx
    target: 'プレビューの外部入力A/B・対象切替・表示切替と、購読中/入力通知の数。ここで扱うのはDOM入力の購読です。'
    change: 'Bへ異なる値を用意してからBへ切り替えます。旧Aへ入力し、次に非表示にしてBへ入力し、最後に再表示します。先に各操作後の表示値と購読数を予測してください。'
    observe: '切替直後は新しい入力通知を待たずBの現在値が表示され、購読中は1です。旧Aへの入力で表示や入力通知数は変わりません。非表示中は購読中0で、Bへ入力しても入力通知数が増えません。再表示後はBの現在値とその文字数を表示し、購読中は1へ戻ります。通信応答の競合はこの課題の対象外です。'
    starterAnchor: 'export function SourcePanel'
    requiresConceptIds:
      - react-effect-external-sync
      - react-effect-cleanup
    validationRuleIds:
      - react-ch01-l11-compose-e01-r01
      - react-ch01-l11-compose-e01-r02
      - react-ch01-l11-compose-e01-r03
