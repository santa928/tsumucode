id: react-ch01-l11-compose-e01
kind: standard
workspaceId: react-ch01-l11-compose-e01
countsTowardStandardExerciseTotal: true
title: '購読の開始・解除・依存値を自分で組み立てる'
instructionsSource: instructions.md
requiresConcepts:
  - conceptId: 'react-effect-external-sync'
    minimumLevel: 'compose'
  - conceptId: 'react-effect-cleanup'
    minimumLevel: 'compose'
