interactionScenarios:
  - id: effect-subscription-lifecycle-compose
    label: 対象の現在値を同期し、古い購読をcleanupする
    actions:
      - id: initial
        kind: focus
        selector: '#source-a'
      - id: first-a
        kind: fill
        selector: '#source-a'
        value: Aの通知
      - id: prepare-b
        kind: fill
        selector: '#source-b'
        value: Bの現在値
      - id: target-b
        kind: click
        selector: '#target-b'
      - id: late-a
        kind: fill
        selector: '#source-a'
        value: 旧Aの通知
      - id: current-b
        kind: fill
        selector: '#source-b'
        value: Bの通知
      - id: unmount
        kind: click
        selector: '#toggle'
      - id: hidden-b
        kind: fill
        selector: '#source-b'
        value: 非表示中の現在値
      - id: remount
        kind: click
        selector: '#toggle'
    checkpoints:
      - id: after-initial
        afterActionId: initial
        expectations:
          - id: active
            kind: selector-text
            selector: '#active'
            equals: '1'
          - id: notifications
            kind: selector-text
            selector: '#notifications'
            equals: '0'
          - id: value
            kind: selector-text
            selector: '#observed'
            equals: 初期A
          - id: length
            kind: selector-text
            selector: '#length'
            equals: '3'
      - id: after-first-a
        afterActionId: first-a
        expectations:
          - id: active
            kind: selector-text
            selector: '#active'
            equals: '1'
          - id: notifications
            kind: selector-text
            selector: '#notifications'
            equals: '1'
          - id: value
            kind: selector-text
            selector: '#observed'
            equals: Aの通知
          - id: length
            kind: selector-text
            selector: '#length'
            equals: '4'
      - id: after-prepare-b
        afterActionId: prepare-b
        expectations:
          - id: active
            kind: selector-text
            selector: '#active'
            equals: '1'
          - id: notifications
            kind: selector-text
            selector: '#notifications'
            equals: '1'
          - id: value
            kind: selector-text
            selector: '#observed'
            equals: Aの通知
          - id: length
            kind: selector-text
            selector: '#length'
            equals: '4'
      - id: after-target-b
        afterActionId: target-b
        expectations:
          - id: active
            kind: selector-text
            selector: '#active'
            equals: '1'
          - id: notifications
            kind: selector-text
            selector: '#notifications'
            equals: '1'
          - id: value
            kind: selector-text
            selector: '#observed'
            equals: Bの現在値
          - id: length
            kind: selector-text
            selector: '#length'
            equals: '5'
      - id: after-late-a
        afterActionId: late-a
        expectations:
          - id: active
            kind: selector-text
            selector: '#active'
            equals: '1'
          - id: notifications
            kind: selector-text
            selector: '#notifications'
            equals: '1'
          - id: value
            kind: selector-text
            selector: '#observed'
            equals: Bの現在値
          - id: length
            kind: selector-text
            selector: '#length'
            equals: '5'
      - id: after-current-b
        afterActionId: current-b
        expectations:
          - id: active
            kind: selector-text
            selector: '#active'
            equals: '1'
          - id: notifications
            kind: selector-text
            selector: '#notifications'
            equals: '2'
          - id: value
            kind: selector-text
            selector: '#observed'
            equals: Bの通知
          - id: length
            kind: selector-text
            selector: '#length'
            equals: '4'
      - id: after-unmount
        afterActionId: unmount
        expectations:
          - id: active
            kind: selector-text
            selector: '#active'
            equals: '0'
          - id: notifications
            kind: selector-text
            selector: '#notifications'
            equals: '2'
      - id: after-hidden-b
        afterActionId: hidden-b
        expectations:
          - id: active
            kind: selector-text
            selector: '#active'
            equals: '0'
          - id: notifications
            kind: selector-text
            selector: '#notifications'
            equals: '2'
      - id: after-remount
        afterActionId: remount
        expectations:
          - id: active
            kind: selector-text
            selector: '#active'
            equals: '1'
          - id: notifications
            kind: selector-text
            selector: '#notifications'
            equals: '2'
          - id: value
            kind: selector-text
            selector: '#observed'
            equals: 非表示中の現在値
          - id: length
            kind: selector-text
            selector: '#length'
            equals: '8'
hints:
  - id: 'react-ch01-l11-compose-e01-h01'
    level: 1
    title: '値を持つ場所と外部同期を分ける'
    text: 'SourcePanelの先頭に空文字列のStateを置き、次にEffectを置きます。戻り値のJSXは、Stateの値とその文字数を直接表示します。'
    relatedSlideId: 'react-ch01-l11-compose-s01'
  - id: 'react-ch01-l11-compose-e01-h02'
    level: 2
    title: '1回の購読と解除を対にする'
    text: 'setupのsubscribe(target, setter)が返した関数を保持します。その関数をEffectから返すと、対象変更や非表示のときに同じ購読を解除できます。'
    relatedSlideId: 'react-ch01-l11-compose-s01'
  - id: 'react-ch01-l11-compose-e01-h03'
    level: 3
    title: '対象変更の経路を確かめる'
    text: '依存配列はtargetを追います。cleanupは関数を返すので、setup中に解除を呼びません。Bへ切り替えた直後と、非表示でBを変えてから再表示した値を確かめます。'
    relatedSlideId: 'react-ch01-l11-compose-s01'
