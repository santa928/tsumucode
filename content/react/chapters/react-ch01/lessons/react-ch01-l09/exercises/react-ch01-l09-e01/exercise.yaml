interactionScenarios:
  - id: context-sharing-input-reset
    label: 親Stateを兄弟の入力・要約へ共有する
    actions:
      - id: short-name
        kind: fill
        selector: '#name'
        value: Ada
      - id: long-name
        kind: fill
        selector: '#name'
        value: TypeScript
      - id: spaces
        kind: fill
        selector: '#name'
        value: '   '
      - id: clear
        kind: fill
        selector: '#name'
        value: ''
      - id: another-name
        kind: fill
        selector: '#name'
        value: React
      - id: reset
        kind: click
        selector: '#reset'
    checkpoints:
      - id: after-short-name
        afterActionId: short-name
        expectations:
          - id: input
            kind: input-value
            selector: '#name'
            equals: Ada
          - id: length
            kind: selector-text
            selector: '#length'
            equals: '3'
          - id: summary
            kind: selector-text
            selector: '#name-summary'
            equals: Ada
      - id: after-long-name
        afterActionId: long-name
        expectations:
          - id: input
            kind: input-value
            selector: '#name'
            equals: TypeScript
          - id: length
            kind: selector-text
            selector: '#length'
            equals: '10'
          - id: summary
            kind: selector-text
            selector: '#name-summary'
            equals: TypeScript
      - id: after-spaces
        afterActionId: spaces
        expectations:
          - id: input
            kind: input-value
            selector: '#name'
            equals: '   '
          - id: length
            kind: selector-text
            selector: '#length'
            equals: '3'
          - id: summary
            kind: selector-text
            selector: '#name-summary'
            equals: ''
      - id: after-clear
        afterActionId: clear
        expectations:
          - id: input
            kind: input-value
            selector: '#name'
            equals: ''
          - id: length
            kind: selector-text
            selector: '#length'
            equals: '0'
          - id: summary
            kind: selector-text
            selector: '#name-summary'
            equals: ''
      - id: after-another-name
        afterActionId: another-name
        expectations:
          - id: input
            kind: input-value
            selector: '#name'
            equals: React
          - id: length
            kind: selector-text
            selector: '#length'
            equals: '5'
          - id: summary
            kind: selector-text
            selector: '#name-summary'
            equals: React
      - id: after-reset
        afterActionId: reset
        expectations:
          - id: input
            kind: input-value
            selector: '#name'
            equals: ''
          - id: length
            kind: selector-text
            selector: '#length'
            equals: '0'
          - id: summary
            kind: selector-text
            selector: '#name-summary'
            equals: ''
hints:
  - id: react-ch01-l09-e01-h01
    level: 1
    title: 修正位置を探す
    text: components.tsxのNameSummaryが表示する文字列に注目します。
    relatedSlideId: react-ch01-l09-s02
  - id: react-ch01-l09-e01-h02
    level: 2
    title: 値の由来を追う
    text: useContextが返す値は親Providerのvalueです。新しいStateを子に作る必要はありません。
    relatedSlideId: react-ch01-l09-s02
  - id: react-ch01-l09-e01-h03
    level: 3
    title: 責務と操作後の一致を確かめる
    text: 入力欄と要約が同じContextを読んでも、要約が固定文字列なら更新は表示されません。受け取った値から要約と文字数を描画します。
    relatedSlideId: react-ch01-l09-s02
