interactionScenarios:
  - id: effect-subscription-lifecycle
    label: 対象の現在値を同期し、古い購読をcleanupする
    actions:
      - id: initial
        kind: focus
        selector: '#source-a'
      - id: first-a
        kind: fill
        selector: '#source-a'
        value: Aの通知
      - id: prepare-b
        kind: fill
        selector: '#source-b'
        value: Bの現在値
      - id: target-b
        kind: click
        selector: '#target-b'
      - id: late-a
        kind: fill
        selector: '#source-a'
        value: 旧Aの通知
      - id: current-b
        kind: fill
        selector: '#source-b'
        value: Bの通知
      - id: unmount
        kind: click
        selector: '#toggle'
      - id: hidden-b
        kind: fill
        selector: '#source-b'
        value: 非表示中の現在値
      - id: remount
        kind: click
        selector: '#toggle'
    checkpoints:
      - id: after-initial
        afterActionId: initial
        expectations:
          - id: active
            kind: selector-text
            selector: '#active'
            equals: '1'
          - id: notifications
            kind: selector-text
            selector: '#notifications'
            equals: '0'
          - id: value
            kind: selector-text
            selector: '#observed'
            equals: 初期A
          - id: length
            kind: selector-text
            selector: '#length'
            equals: '3'
      - id: after-first-a
        afterActionId: first-a
        expectations:
          - id: active
            kind: selector-text
            selector: '#active'
            equals: '1'
          - id: notifications
            kind: selector-text
            selector: '#notifications'
            equals: '1'
          - id: value
            kind: selector-text
            selector: '#observed'
            equals: Aの通知
          - id: length
            kind: selector-text
            selector: '#length'
            equals: '4'
      - id: after-prepare-b
        afterActionId: prepare-b
        expectations:
          - id: active
            kind: selector-text
            selector: '#active'
            equals: '1'
          - id: notifications
            kind: selector-text
            selector: '#notifications'
            equals: '1'
          - id: value
            kind: selector-text
            selector: '#observed'
            equals: Aの通知
          - id: length
            kind: selector-text
            selector: '#length'
            equals: '4'
      - id: after-target-b
        afterActionId: target-b
        expectations:
          - id: active
            kind: selector-text
            selector: '#active'
            equals: '1'
          - id: notifications
            kind: selector-text
            selector: '#notifications'
            equals: '1'
          - id: value
            kind: selector-text
            selector: '#observed'
            equals: Bの現在値
          - id: length
            kind: selector-text
            selector: '#length'
            equals: '5'
      - id: after-late-a
        afterActionId: late-a
        expectations:
          - id: active
            kind: selector-text
            selector: '#active'
            equals: '1'
          - id: notifications
            kind: selector-text
            selector: '#notifications'
            equals: '1'
          - id: value
            kind: selector-text
            selector: '#observed'
            equals: Bの現在値
          - id: length
            kind: selector-text
            selector: '#length'
            equals: '5'
      - id: after-current-b
        afterActionId: current-b
        expectations:
          - id: active
            kind: selector-text
            selector: '#active'
            equals: '1'
          - id: notifications
            kind: selector-text
            selector: '#notifications'
            equals: '2'
          - id: value
            kind: selector-text
            selector: '#observed'
            equals: Bの通知
          - id: length
            kind: selector-text
            selector: '#length'
            equals: '4'
      - id: after-unmount
        afterActionId: unmount
        expectations:
          - id: active
            kind: selector-text
            selector: '#active'
            equals: '0'
          - id: notifications
            kind: selector-text
            selector: '#notifications'
            equals: '2'
      - id: after-hidden-b
        afterActionId: hidden-b
        expectations:
          - id: active
            kind: selector-text
            selector: '#active'
            equals: '0'
          - id: notifications
            kind: selector-text
            selector: '#notifications'
            equals: '2'
      - id: after-remount
        afterActionId: remount
        expectations:
          - id: active
            kind: selector-text
            selector: '#active'
            equals: '1'
          - id: notifications
            kind: selector-text
            selector: '#notifications'
            equals: '2'
          - id: value
            kind: selector-text
            selector: '#observed'
            equals: 非表示中の現在値
          - id: length
            kind: selector-text
            selector: '#length'
            equals: '8'
hints:
  - id: react-ch01-l11-e01-h01
    level: 1
    title: 修正位置を探す
    text: Bに値を入力してから「Bを選ぶ」を押し、表示値と依存配列を見比べます。
    relatedSlideId: react-ch01-l11-s02
  - id: react-ch01-l11-e01-h02
    level: 2
    title: 値と処理の由来を追う
    text: Effect内で使うtargetが変わった時に、古い購読のcleanupと新しい対象へのsetupが必要です。
    relatedSlideId: react-ch01-l11-s02
  - id: react-ch01-l11-e01-h03
    level: 3
    title: 責務と実操作をつなぐ
    text: 用意済みsubscribeは現在値を渡し、同じlistenerを外す関数を返します。依存値と返すcleanupを対象に結び、文字数は表示時に計算します。
    relatedSlideId: react-ch01-l11-s02
