<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" role="img" aria-labelledby="title description">
  <title id="title">target変更で古い購読を解除</title>
  <desc id="description">描画後にtargetを購読。target変更で古い購読を解除。新しいtargetを購読。</desc>
  <rect width="480" height="280" rx="16" fill="#f8fafc"/>
  <g font-family="sans-serif" font-size="19" text-anchor="middle" fill="#0f172a">
    <rect x="16" y="16" width="448" height="64" rx="10" fill="#e0f2fe" stroke="#0369a1"/>
    <text x="240" y="55">描画後にtargetを購読</text>
    <path d="M240 83 v14 m-5 -5 5 5 5 -5" fill="none" stroke="#0369a1" stroke-width="2"/>
    <rect x="16" y="104" width="448" height="64" rx="10" fill="#e0f2fe" stroke="#0369a1"/>
    <text x="240" y="143">target変更で古い購読を解除</text>
    <path d="M240 171 v14 m-5 -5 5 5 5 -5" fill="none" stroke="#0369a1" stroke-width="2"/>
    <rect x="16" y="192" width="448" height="64" rx="10" fill="#e0f2fe" stroke="#0369a1"/>
    <text x="240" y="231">新しいtargetを購読</text>
  </g>
</svg>
