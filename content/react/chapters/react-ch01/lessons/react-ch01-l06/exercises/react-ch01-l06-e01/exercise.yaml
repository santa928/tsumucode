interactionScenarios:
  - id: form-input-submit-reset
    label: 1つのStateから入力・検証表示を導く
    actions:
      - id: empty-submit
        kind: click
        selector: '#submit'
      - id: spaces
        kind: fill
        selector: '#name'
        value: '   '
      - id: spaces-submit
        kind: click
        selector: '#submit'
      - id: short-name
        kind: fill
        selector: '#name'
        value: Ada
      - id: valid-submit
        kind: click
        selector: '#submit'
      - id: long-name
        kind: fill
        selector: '#name'
        value: TypeScript
      - id: resubmit
        kind: click
        selector: '#submit'
      - id: reset
        kind: click
        selector: '#reset'
    checkpoints:
      - id: after-empty-submit
        afterActionId: empty-submit
        expectations:
          - id: input
            kind: input-value
            selector: '#name'
            equals: ''
          - id: length
            kind: selector-text
            selector: '#length'
            equals: '0'
          - id: message
            kind: selector-text
            selector: '#message'
            equals: 名前を入力してください
          - id: invalid
            kind: attribute
            selector: '#name'
            name: aria-invalid
            equals: 'true'
          - id: canceled
            kind: submit-prevented
      - id: after-spaces
        afterActionId: spaces
        expectations:
          - id: input
            kind: input-value
            selector: '#name'
            equals: '   '
          - id: length
            kind: selector-text
            selector: '#length'
            equals: '3'
          - id: message
            kind: selector-text
            selector: '#message'
            equals: 入力中
          - id: invalid
            kind: attribute
            selector: '#name'
            name: aria-invalid
            equals: 'false'
      - id: after-spaces-submit
        afterActionId: spaces-submit
        expectations:
          - id: input
            kind: input-value
            selector: '#name'
            equals: '   '
          - id: length
            kind: selector-text
            selector: '#length'
            equals: '3'
          - id: message
            kind: selector-text
            selector: '#message'
            equals: 名前を入力してください
          - id: invalid
            kind: attribute
            selector: '#name'
            name: aria-invalid
            equals: 'true'
          - id: canceled
            kind: submit-prevented
      - id: after-short-name
        afterActionId: short-name
        expectations:
          - id: input
            kind: input-value
            selector: '#name'
            equals: Ada
          - id: length
            kind: selector-text
            selector: '#length'
            equals: '3'
          - id: message
            kind: selector-text
            selector: '#message'
            equals: 入力中
          - id: invalid
            kind: attribute
            selector: '#name'
            name: aria-invalid
            equals: 'false'
      - id: after-valid-submit
        afterActionId: valid-submit
        expectations:
          - id: input
            kind: input-value
            selector: '#name'
            equals: Ada
          - id: length
            kind: selector-text
            selector: '#length'
            equals: '3'
          - id: message
            kind: selector-text
            selector: '#message'
            equals: 送信を受け付けました
          - id: invalid
            kind: attribute
            selector: '#name'
            name: aria-invalid
            equals: 'false'
          - id: canceled
            kind: submit-prevented
      - id: after-long-name
        afterActionId: long-name
        expectations:
          - id: input
            kind: input-value
            selector: '#name'
            equals: TypeScript
          - id: length
            kind: selector-text
            selector: '#length'
            equals: '10'
          - id: message
            kind: selector-text
            selector: '#message'
            equals: 入力中
          - id: invalid
            kind: attribute
            selector: '#name'
            name: aria-invalid
            equals: 'false'
      - id: after-resubmit
        afterActionId: resubmit
        expectations:
          - id: input
            kind: input-value
            selector: '#name'
            equals: TypeScript
          - id: length
            kind: selector-text
            selector: '#length'
            equals: '10'
          - id: message
            kind: selector-text
            selector: '#message'
            equals: 送信を受け付けました
          - id: invalid
            kind: attribute
            selector: '#name'
            name: aria-invalid
            equals: 'false'
          - id: canceled
            kind: submit-prevented
      - id: after-reset
        afterActionId: reset
        expectations:
          - id: input
            kind: input-value
            selector: '#name'
            equals: ''
          - id: length
            kind: selector-text
            selector: '#length'
            equals: '0'
          - id: message
            kind: selector-text
            selector: '#message'
            equals: 入力中
          - id: invalid
            kind: attribute
            selector: '#name'
            name: aria-invalid
            equals: 'false'
hints:
  - id: react-ch01-l06-e01-h01
    level: 1
    title: 修正位置を探す
    text: submitの中を見ます。attemptedは更新されていますが、Eventの既定動作に対する処理がありません。
    relatedSlideId: react-ch01-l06-s02
  - id: react-ch01-l06-e01-h02
    level: 2
    title: 値と操作の経路を追う
    text: 送信のEventに既定動作を取り消すメソッドがあります。入力のState更新とは別の責務です。
    relatedSlideId: react-ch01-l06-s02
  - id: react-ch01-l06-e01-h03
    level: 3
    title: 操作後の一致を確かめる
    text: 取消の後に既存のattempted更新を残します。空値/空白と有効な入力で、案内とaria-invalidを操作ごとに確かめましょう。
    relatedSlideId: react-ch01-l06-s02
