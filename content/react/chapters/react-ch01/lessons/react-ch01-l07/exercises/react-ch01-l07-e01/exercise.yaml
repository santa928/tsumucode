      nextAction: 入力欄・要約・文字数が繰り返し入力とやり直しで一致する
    hintId: react-ch01-l07-e01-h02
    relatedSlideId: react-ch01-l07-s02
interactionScenarios:
  - id: shared-state-input-reset
    label: 親Stateを兄弟の入力・要約へ共有する
    actions:
      - id: short-name
        kind: fill
        selector: '#name'
        value: Ada
      - id: long-name
        kind: fill
        selector: '#name'
        value: TypeScript
      - id: spaces
        kind: fill
        selector: '#name'
        value: '   '
      - id: clear
        kind: fill
        selector: '#name'
        value: ''
      - id: another-name
        kind: fill
        selector: '#name'
        value: React
      - id: reset
        kind: click
        selector: '#reset'
    checkpoints:
      - id: after-short-name
        afterActionId: short-name
        expectations:
          - id: input
            kind: input-value
            selector: '#name'
            equals: Ada
          - id: length
            kind: selector-text
            selector: '#length'
            equals: '3'
          - id: summary
            kind: selector-text
            selector: '#name-summary'
            equals: Ada
      - id: after-long-name
        afterActionId: long-name
        expectations:
          - id: input
            kind: input-value
            selector: '#name'
            equals: TypeScript
          - id: length
            kind: selector-text
            selector: '#length'
            equals: '10'
          - id: summary
            kind: selector-text
            selector: '#name-summary'
            equals: TypeScript
      - id: after-spaces
        afterActionId: spaces
        expectations:
          - id: input
            kind: input-value
            selector: '#name'
            equals: '   '
          - id: length
            kind: selector-text
            selector: '#length'
            equals: '3'
          - id: summary
            kind: selector-text
            selector: '#name-summary'
            equals: ''
      - id: after-clear
        afterActionId: clear
        expectations:
          - id: input
            kind: input-value
            selector: '#name'
            equals: ''
          - id: length
            kind: selector-text
            selector: '#length'
            equals: '0'
          - id: summary
            kind: selector-text
            selector: '#name-summary'
            equals: ''
      - id: after-another-name
        afterActionId: another-name
        expectations:
          - id: input
            kind: input-value
            selector: '#name'
            equals: React
          - id: length
            kind: selector-text
            selector: '#length'
            equals: '5'
          - id: summary
            kind: selector-text
            selector: '#name-summary'
            equals: React
      - id: after-reset
        afterActionId: reset
        expectations:
          - id: input
            kind: input-value
            selector: '#name'
            equals: ''
          - id: length
            kind: selector-text
            selector: '#length'
            equals: '0'
          - id: summary
            kind: selector-text
            selector: '#name-summary'
            equals: ''
hints:
  - id: react-ch01-l07-e01-h01
    level: 1
    title: 修正位置を探す
    text: AppのNameSummaryへ渡すvalueを見ます。入力欄へ渡す値と同じでしょうか。
    relatedSlideId: react-ch01-l07-s02
  - id: react-ch01-l07-e01-h02
    level: 2
    title: 値と操作の経路を追う
    text: Stateは共通の親Appにあります。子で新しいStateを作らず、受け取るPropsをたどります。
    relatedSlideId: react-ch01-l07-s02
  - id: react-ch01-l07-e01-h03
    level: 3
    title: 操作後の一致を確かめる
    text: NameFieldの更新callbackが親Stateを変えます。NameSummaryもその同じ値を受け取り、文字数を描画時に導出する経路をつなぎます。
    relatedSlideId: react-ch01-l07-s02
