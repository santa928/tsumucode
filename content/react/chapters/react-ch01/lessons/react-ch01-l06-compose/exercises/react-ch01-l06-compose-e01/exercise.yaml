hints:
  - id: 'react-ch01-l06-compose-e01-h01'
    level: 1
    title: 'まず持つ事実を決める'
    text: 'Appの先頭にStateを置きます。持つ事実はnameとattemptedです。文字数、不足かどうか、案内はそのStateから計算できます。'
    relatedSlideId: 'react-ch01-l06-compose-s01'
  - id: 'react-ch01-l06-compose-e01-h02'
    level: 2
    title: '操作ごとの次の値を考える'
    text: 'changeでは入力文字列をその場で読み、attemptedをfalseに戻します。submitはEventの既定動作を取り消してattemptedをtrueにし、やり直しは初期値へ戻します。'
    relatedSlideId: 'react-ch01-l06-compose-s01'
  - id: 'react-ch01-l06-compose-e01-h03'
    level: 3
    title: '表示と連続操作を照合する'
    text: '入力のvalue・onChange、formのonSubmit、やり直しのonClickへ処理をつなぎます。name.trim().lengthが0かで不足を判定し、attemptedと組み合わせて案内とaria-invalidを導きます。'
    relatedSlideId: 'react-ch01-l06-compose-s01'
