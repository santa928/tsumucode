  learningGoal: controlled-form
steps:
  - id: compose-state-view
    file: components.tsx
    target: 'components.tsxのApp。処理は未実装です。画面の枠だけなので、Stateと操作を書いてから型と動作を確認します。開始時の診断は未実装を知らせています。型と起動処理は配布済みで、編集はcomponents.tsxだけです。'
    change: '1つのFormStateをnameは空文字列、attemptedはfalseで始めます。inputのvalueと文字数を同じStateから表示します。nameの前後の空白を除いて空なら不足と判定し、案内は入力中なら「入力中」、送信後は不足なら「名前を入力してください」、それ以外なら「送信を受け付けました」と計算します。案内と不足かどうかを別Stateへ保存しません。'
    observe: 'inputのaria-invalidは、送信済みで名前が不足するときだけtrue、それ以外はfalseにします。これは入力の誤りを読み上げ機能へ伝える属性です。配布したlabel・各id・案内の文言を保ちます。1つのStateと入力・送信・やり直しの3つのhandlerは、同じApp内に置きます。変数名は別名でも構いません。この課題はこの部品内の経路を組み立てる範囲です。'
    starterAnchor: 'export function App'
    requiresConceptIds:
      - react-controlled-input
      - react-form-submit
      - react-derived-state
    validationRuleIds:
      - react-ch01-l06-compose-e01-r01
      - react-ch01-l06-compose-e01-r02
      - react-ch01-l06-compose-e01-r03
      - react-ch01-l06-compose-e01-r04
  - id: compose-handlers
    file: components.tsx
    target: 'Appのchange・submit・やり直しと、それらをつなぐJSX。InputChangeEventとFormSubmitEventはimport済みです。'
    change: 'changeではその場のcurrentTarget.valueを読み、nameを更新してattemptedをfalseに戻します。文字列だけを次のStateへ渡します。submitでは既定の送信を取り消し、名前を保ってattemptedをtrueにします。やり直しはnameとattemptedを初期値へ戻します。入力・送信・やり直しの操作へ各処理をつなぎます。'
    observe: '空値を送信すると不足の案内とaria-invalid=trueになります。空白3つを入力すると文字数3と「入力中」に戻り、送信すると不足になります。Adaを入力すると文字数3、送信後は受け付けた案内になります。TypeScriptへ変えると文字数10と「入力中」に戻り、再送信できます。最後にやり直すと入力は空、文字数0、「入力中」、aria-invalid=falseに戻ります。'
    starterAnchor: 'export function App'
    requiresConceptIds:
      - react-controlled-input
      - react-form-submit
      - react-derived-state
    validationRuleIds:
      - react-ch01-l06-compose-e01-r01
      - react-ch01-l06-compose-e01-r02
      - react-ch01-l06-compose-e01-r03
      - react-ch01-l06-compose-e01-r04
