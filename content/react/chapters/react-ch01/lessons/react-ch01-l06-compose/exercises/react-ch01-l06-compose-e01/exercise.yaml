id: react-ch01-l06-compose-e01
kind: standard
workspaceId: react-ch01-l06-compose-e01
countsTowardStandardExerciseTotal: true
title: '入力・検証・送信を自分で組み立てる'
instructionsSource: instructions.md
requiresConcepts:
  - conceptId: 'react-controlled-input'
    minimumLevel: 'compose'
  - conceptId: 'react-form-submit'
    minimumLevel: 'compose'
  - conceptId: 'react-derived-state'
    minimumLevel: 'compose'
