interactionScenarios:
  - id: list-operations
    label: 項目IDを保って配列を更新する
    actions:
      - id: add-js
        kind: click
        selector: '#add'
      - id: add-again
        kind: click
        selector: '#add'
      - id: remove-html
        kind: click
        selector: '#remove'
      - id: reverse
        kind: click
        selector: '#reverse'
      - id: remove-js
        kind: click
        selector: '#remove-js'
      - id: re-add-js
        kind: click
        selector: '#add'
    checkpoints:
      - id: after-add-js
        afterActionId: add-js
        expectations:
          - id: display
            kind: selector-text
            selector: '#topics'
            equals: HTMLCSSJS
          - id: item-1
            kind: attribute
            selector: '#topics li:nth-child(1)'
            name: data-id
            equals: html
          - id: item-2
            kind: attribute
            selector: '#topics li:nth-child(2)'
            name: data-id
            equals: css
          - id: item-3
            kind: attribute
            selector: '#topics li:nth-child(3)'
            name: data-id
            equals: js
      - id: after-add-again
        afterActionId: add-again
        expectations:
          - id: display
            kind: selector-text
            selector: '#topics'
            equals: HTMLCSSJS
          - id: item-1
            kind: attribute
            selector: '#topics li:nth-child(1)'
            name: data-id
            equals: html
          - id: item-2
            kind: attribute
            selector: '#topics li:nth-child(2)'
            name: data-id
            equals: css
          - id: item-3
            kind: attribute
            selector: '#topics li:nth-child(3)'
            name: data-id
            equals: js
      - id: after-remove-html
        afterActionId: remove-html
        expectations:
          - id: display
            kind: selector-text
            selector: '#topics'
            equals: CSSJS
          - id: item-1
            kind: attribute
            selector: '#topics li:nth-child(1)'
            name: data-id
            equals: css
          - id: item-2
            kind: attribute
            selector: '#topics li:nth-child(2)'
            name: data-id
            equals: js
      - id: after-reverse
        afterActionId: reverse
        expectations:
          - id: display
            kind: selector-text
            selector: '#topics'
            equals: JSCSS
          - id: item-1
            kind: attribute
            selector: '#topics li:nth-child(1)'
            name: data-id
            equals: js
          - id: item-2
            kind: attribute
            selector: '#topics li:nth-child(2)'
            name: data-id
            equals: css
      - id: after-remove-js
        afterActionId: remove-js
        expectations:
          - id: display
            kind: selector-text
            selector: '#topics'
            equals: CSS
          - id: item-1
            kind: attribute
            selector: '#topics li:nth-child(1)'
            name: data-id
            equals: css
      - id: after-re-add-js
        afterActionId: re-add-js
        expectations:
          - id: display
            kind: selector-text
            selector: '#topics'
            equals: CSSJS
          - id: item-1
            kind: attribute
            selector: '#topics li:nth-child(1)'
            name: data-id
            equals: css
          - id: item-2
            kind: attribute
            selector: '#topics li:nth-child(2)'
            name: data-id
            equals: js
hints:
  - id: react-ch01-l05-e01-h01
    level: 1
    title: 修正位置を探す
    text: addではStateの配列をそのまま返しています。追加後に別の配列が必要です。liのKeyが位置に依存していないかも探しましょう。
    relatedSlideId: react-ch01-l05-s02
  - id: react-ch01-l05-e01-h02
    level: 2
    title: 考え方を確かめる
    text: spreadやfilter、toReversedは元の配列を変えず新しい配列を返します。Keyは並び位置ではなく項目の安定したIDを使います。同じIDの追加は重複させません。
    relatedSlideId: react-ch01-l05-s02
  - id: react-ch01-l05-e01-h03
    level: 3
    title: 書き方を確かめる
    text: addでJS以外をfilterし、その配列のspreadにJSの項目を追加します。liのkeyをitem.idへ変えます。JSを2回追加し、削除・逆順・再追加も確認します。
    relatedSlideId: react-ch01-l05-s02
relatedSlideIds:
