    relatedSlideId: react-ch01-l04-s02
  - id: react-ch01-l04-e01-r02
    label: 最初のStateは0
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: selector
      selector: '#count'
    assertion:
      kind: text
      operator: equals
      expected: '0'
    feedback:
      target: components.tsxとPreview
      expected: 最初のStateは0
      nextAction: Stateの更新関数と表示位置を読み比べ、実際に操作して確かめます。
    hintId: react-ch01-l04-e01-h02
    relatedSlideId: react-ch01-l04-s02
  - id: react-ch01-l04-e01-r03
    label: EventからStateへつなぎ、updater2回で更新する
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: react-learning
      file: components.tsx
    assertion:
      kind: react-learning
      goal: counter
    feedback:
      target: components.tsxとPreview
      expected: EventからStateへつなぎ、updater2回で更新する
      nextAction: Stateの更新関数と表示位置を読み比べ、実際に操作して確かめます。
    hintId: react-ch01-l04-e01-h02
    relatedSlideId: react-ch01-l04-s02
interactionScenarios:
  - id: counter-updates
    label: 操作を繰り返し、更新をまとめる
    actions:
      - id: increment-once
        kind: click
        selector: '#increment'
      - id: increment-again
        kind: click
        selector: '#increment'
      - id: twice
        kind: click
        selector: '#twice'
    checkpoints:
      - id: after-increment-once
        afterActionId: increment-once
        expectations:
          - id: display
            kind: selector-text
            selector: '#count'
            equals: '1'
      - id: after-increment-again
        afterActionId: increment-again
        expectations:
          - id: display
            kind: selector-text
            selector: '#count'
            equals: '2'
      - id: after-twice
        afterActionId: twice
        expectations:
          - id: display
            kind: selector-text
            selector: '#count'
            equals: '4'
hints:
  - id: react-ch01-l04-e01-h01
    level: 1
    title: 修正位置を探す
    text: twiceの中には、同じ描画で覚えたcountを使う更新が2回あります。クリック前に2回の結果を予測しましょう。
    relatedSlideId: react-ch01-l04-s02
  - id: react-ch01-l04-e01-h02
    level: 2
    title: 考え方を確かめる
    text: 数値を渡す更新は次の値への置換です。前の更新結果を受け取りたいときは、次の値を返す更新関数を渡します。
    relatedSlideId: react-ch01-l04-s02
  - id: react-ch01-l04-e01-h03
    level: 3
    title: 書き方を確かめる
    text: twiceの2か所をsetCount(current => current + 1)へ変えます。通常2回の後に「2増やす」で4になるか確認します。
    relatedSlideId: react-ch01-l04-s02
relatedSlideIds:
  - react-ch01-l04-s01
