interactionScenarios:
  - id: custom-hook-instance-lifecycle
    label: 同じHookの処理を使い、各instanceの状態を独立させる
    actions:
      - id: initial
        kind: focus
        selector: '#source-a'
      - id: first-a
        kind: fill
        selector: '#source-a'
        value: Aだけ更新
      - id: unmount-a
        kind: click
        selector: '#toggle'
      - id: hidden-a
        kind: fill
        selector: '#source-a'
        value: Aの非表示中の値
      - id: current-b
        kind: fill
        selector: '#source-b'
        value: Bだけ更新
      - id: remount-a
        kind: click
        selector: '#toggle'
    checkpoints:
      - id: after-initial
        afterActionId: initial
        expectations:
          - id: active
            kind: selector-text
            selector: '#active'
            equals: '2'
          - id: notifications
            kind: selector-text
            selector: '#notifications'
            equals: '0'
          - id: value-b
            kind: selector-text
            selector: '#observed-b'
            equals: 初期B
          - id: length-b
            kind: selector-text
            selector: '#length-b'
            equals: '3'
          - id: value-a
            kind: selector-text
            selector: '#observed-a'
            equals: 初期A
          - id: length-a
            kind: selector-text
            selector: '#length-a'
            equals: '3'
      - id: after-first-a
        afterActionId: first-a
        expectations:
          - id: active
            kind: selector-text
            selector: '#active'
            equals: '2'
          - id: notifications
            kind: selector-text
            selector: '#notifications'
            equals: '1'
          - id: value-b
            kind: selector-text
            selector: '#observed-b'
            equals: 初期B
          - id: length-b
            kind: selector-text
            selector: '#length-b'
            equals: '3'
          - id: value-a
            kind: selector-text
            selector: '#observed-a'
            equals: Aだけ更新
          - id: length-a
            kind: selector-text
            selector: '#length-a'
            equals: '5'
      - id: after-unmount-a
        afterActionId: unmount-a
        expectations:
          - id: active
            kind: selector-text
            selector: '#active'
            equals: '1'
          - id: notifications
            kind: selector-text
            selector: '#notifications'
            equals: '1'
          - id: value-b
            kind: selector-text
            selector: '#observed-b'
            equals: 初期B
          - id: length-b
            kind: selector-text
            selector: '#length-b'
            equals: '3'
      - id: after-hidden-a
        afterActionId: hidden-a
        expectations:
          - id: active
            kind: selector-text
            selector: '#active'
            equals: '1'
          - id: notifications
            kind: selector-text
            selector: '#notifications'
            equals: '1'
          - id: value-b
            kind: selector-text
            selector: '#observed-b'
            equals: 初期B
          - id: length-b
            kind: selector-text
            selector: '#length-b'
            equals: '3'
      - id: after-current-b
        afterActionId: current-b
        expectations:
          - id: active
            kind: selector-text
            selector: '#active'
            equals: '1'
          - id: notifications
            kind: selector-text
            selector: '#notifications'
            equals: '2'
          - id: value-b
            kind: selector-text
            selector: '#observed-b'
            equals: Bだけ更新
          - id: length-b
            kind: selector-text
            selector: '#length-b'
            equals: '5'
      - id: after-remount-a
        afterActionId: remount-a
        expectations:
          - id: active
            kind: selector-text
            selector: '#active'
            equals: '2'
          - id: notifications
            kind: selector-text
            selector: '#notifications'
            equals: '2'
          - id: value-b
            kind: selector-text
            selector: '#observed-b'
            equals: Bだけ更新
          - id: length-b
            kind: selector-text
            selector: '#length-b'
            equals: '5'
          - id: value-a
            kind: selector-text
            selector: '#observed-a'
            equals: Aの非表示中の値
          - id: length-a
            kind: selector-text
            selector: '#length-a'
            equals: '8'
hints:
  - id: react-ch01-l12-e01-h01
    level: 1
    title: 修正位置を探す
    text: sourceHook.tsが最後に返す値と、用意済み2つの表示Componentを見比べます。
    relatedSlideId: react-ch01-l12-s02
  - id: react-ch01-l12-e01-h02
    level: 2
    title: 値と処理の由来を追う
    text: useStateとEffectの同期処理はこのHook内にあります。処理をまとめても、呼出しごとのStateは別です。
    relatedSlideId: react-ch01-l12-s02
  - id: react-ch01-l12-e01-h03
    level: 3
    title: 責務と実操作をつなぐ
    text: 購読で更新されたStateを呼出し元へ返します。共有したい状態は親やContextの責務で、Hookを同じ名前で呼ぶだけでは共有しません。
    relatedSlideId: react-ch01-l12-s02
