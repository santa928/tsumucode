          - id: input
            kind: input-value
            selector: '#name'
            equals: ''
          - id: summary
            kind: selector-text
            selector: '#name-summary'
            equals: ''
          - id: length
            kind: selector-text
            selector: '#length'
            equals: '0'
          - id: focus
            kind: focused
            selector: '#name'
hints:
  - id: react-ch01-l10-e01-h01
    level: 1
    title: 修正位置を探す
    text: components.tsxのfocusInputと、入力へ移るボタンを見比べます。
    relatedSlideId: react-ch01-l10-s02
  - id: react-ch01-l10-e01-h02
    level: 2
    title: 値と処理の由来を追う
    text: inputのrefには同じRefが結ばれています。DOM参照はcurrentから読みますが、最初はnullです。
    relatedSlideId: react-ch01-l10-s02
  - id: react-ch01-l10-e01-h03
    level: 3
    title: 責務と実操作をつなぐ
    text: 入力への移動はEvent内のfocusです。nullなら呼ばないようにし、名前や文字数の表示にはStateを保ちます。
    relatedSlideId: react-ch01-l10-s02
