        afterActionId: short-name
        expectations:
          - id: input
            kind: input-value
            selector: '#name'
            equals: Ada
          - id: summary
            kind: selector-text
            selector: '#name-summary'
            equals: Ada
          - id: length
            kind: selector-text
            selector: '#length'
            equals: '3'
      - id: after-long-name
        afterActionId: long-name
        expectations:
          - id: input
            kind: input-value
            selector: '#name'
            equals: TypeScript
          - id: summary
            kind: selector-text
            selector: '#name-summary'
            equals: TypeScript
          - id: length
            kind: selector-text
            selector: '#length'
            equals: '10'
      - id: after-spaces
        afterActionId: spaces
        expectations:
          - id: input
            kind: input-value
            selector: '#name'
            equals: '   '
          - id: summary
            kind: selector-text
            selector: '#name-summary'
            equals: ''
          - id: length
            kind: selector-text
            selector: '#length'
            equals: '3'
      - id: after-clear
        afterActionId: clear
        expectations:
          - id: input
            kind: input-value
            selector: '#name'
            equals: ''
          - id: summary
            kind: selector-text
            selector: '#name-summary'
            equals: ''
          - id: length
            kind: selector-text
            selector: '#length'
            equals: '0'
      - id: after-refocus
        afterActionId: refocus
