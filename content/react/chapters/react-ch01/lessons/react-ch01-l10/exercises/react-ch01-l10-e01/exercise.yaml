  - id: ref-focus-input
    label: Refで入力へ移り、表示値はStateから導く
    actions:
      - id: focus
        kind: click
        selector: '#focus'
      - id: short-name
        kind: fill
        selector: '#name'
        value: Ada
      - id: long-name
        kind: fill
        selector: '#name'
        value: TypeScript
      - id: spaces
        kind: fill
        selector: '#name'
        value: '   '
      - id: clear
        kind: fill
        selector: '#name'
        value: ''
      - id: refocus
        kind: click
        selector: '#focus'
    checkpoints:
      - id: after-focus
        afterActionId: focus
        expectations:
          - id: input
            kind: input-value
            selector: '#name'
            equals: ''
          - id: summary
            kind: selector-text
            selector: '#name-summary'
            equals: ''
          - id: length
            kind: selector-text
            selector: '#length'
            equals: '0'
          - id: focus
            kind: focused
            selector: '#name'
