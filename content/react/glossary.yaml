schemaVersion: 1
entries:
  - id: component
    term: Component
    definition: ここではデータを受け取り、Reactで表示する内容を返す関数。名前は大文字から始める。
    firstSlideId: react-ch01-l01-s01
    relatedIds:
      - jsx
      - props
  - id: jsx
    term: JSX
    definition: JavaScript内で表示を書く構文。HTML文字列ではなく、型検査と変換を経てReactへ渡す。
    firstSlideId: react-ch01-l01-s02
    relatedIds:
      - component
  - id: props
    term: Props
    definition: 呼び出し元からComponentへ渡す値。ここではquestionという名前で問題オブジェクトを渡す。
    firstSlideId: react-ch01-l01-s03
    relatedIds:
      - component
      - jsx
  - id: composition
    term: Composition
    definition: Componentを組み合わせて表示を作ること。ここでは呼び出し元が枠と中身をJSXで組み合わせる。
    firstSlideId: react-ch01-l03-s01
    relatedIds:
      - component
      - children
  - id: children
    term: children
    definition: Componentの開始タグと終了タグの間に置いた内容を受け取るProps。ここでは用意済みの型で1つのJSXを受け取る。
    firstSlideId: react-ch01-l03-s01
    relatedIds:
      - props
      - composition
  - id: event-handler
    term: Event handler
    definition: クリックなどの操作時に動く関数。onClickには呼出し結果ではなく関数を渡す。
    firstSlideId: react-ch01-l04-s01
    relatedIds:
      - state
  - id: state
    term: State
    definition: Reactが描画をまたいで覚える値。useStateというHookで値とsetter（Stateを更新する関数）を受け取り、更新を次の描画へ反映する。
    firstSlideId: react-ch01-l04-s01
    relatedIds:
      - event-handler
      - updater
  - id: updater
    term: updater（次の値を計算する関数）
    definition: 前の更新結果を受け取り、次の値を返す純粋な関数。1操作内で複数回更新するときも順に反映できる。
    firstSlideId: react-ch01-l04-s02
    relatedIds:
      - state
  - id: immutable-update
    term: immutable update
    definition: 元の値を直接変えず、新しい値へ置き換える更新。配列はspread・filter・toReversedなどで新しく作る。
    firstSlideId: react-ch01-l05-s01
    relatedIds:
      - state
      - key
  - id: key
    term: Key
    definition: 一覧内で項目の同一性をReactへ伝える値。同じ項目では保ち、同じ親の一覧全体で一意にする。ここでは項目IDを使う。
    firstSlideId: react-ch01-l05-s02
    relatedIds:
      - immutable-update
  - id: controlled-input
    term: controlled input
    definition: valueをStateから渡し、onChangeでその値を更新する入力欄。入力欄とStateを同じ値へつなぐ。
    firstSlideId: react-ch01-l06-s01
    relatedIds:
      - state
      - event-handler
  - id: submit-handler
    term: onSubmitとpreventDefault
    definition: onSubmitはForm送信時のhandler。preventDefaultはそのEventの既定動作を取り消すメソッド。
    firstSlideId: react-ch01-l06-s02
    relatedIds:
      - event-handler
  - id: derived-value
    term: 派生値
    definition: 今あるStateやPropsから計算する値。文字数や検証表示を別Stateへ複製せず、描画時に導く。
    firstSlideId: react-ch01-l06-s03
    relatedIds:
      - state
      - props
  - id: lifting-state
    term: lifting state up
    definition: 同じ値を使うComponentの共通の親へStateを置き、値と更新関数を子へ渡すこと。
    firstSlideId: react-ch01-l07-s01
    relatedIds:
      - state
      - props
  - id: props-callback
    term: Propsのcallback
    definition: 子が呼ぶために親から渡す関数。入力の文字列を親の更新関数へ渡して、共有Stateを変える。
    firstSlideId: react-ch01-l07-s02
    relatedIds:
      - props
      - lifting-state
  - id: reducer
    term: reducer
    definition: 現在のStateとactionから、元Stateを変えずに次のStateを返す関数。
    firstSlideId: react-ch01-l08-s01
    relatedIds: []
  - id: dispatch
    term: dispatch
    definition: actionをReactへ渡してReducerによる更新を要求する関数。
    firstSlideId: react-ch01-l08-s01
    relatedIds: []
  - id: context
    term: Context
    definition: 親Providerから提供された値を子Componentが取得する仕組み。State自体ではない。
    firstSlideId: react-ch01-l09-s01
    relatedIds: []
  - id: provider
    term: Provider
    definition: 特定Contextの値を子へ提供する境界。consumerはその値を使うComponent。
    firstSlideId: react-ch01-l09-s01
    relatedIds: []
  - id: ref
    term: Ref
    definition: 再描画を起こさず参照を保つ入れ物。useRefで作り、currentから現在の参照を読む。表示値はStateで持つ。
    firstSlideId: react-ch01-l10-s01
    relatedIds: []
  - id: effect
    term: Effect
    definition: Componentの外の仕組みとの同期処理。useEffectでsetupとcleanupを定義する。導出値を表示するだけなら不要。
    firstSlideId: react-ch01-l11-s01
    relatedIds: []
  - id: effect-dependency
    term: 依存配列
    definition: Effectで読む値を列挙する配列。値の変更に応じて古いcleanupの後に新しいsetupを行う。
    firstSlideId: react-ch01-l11-s01
    relatedIds: []
  - id: cleanup
    term: cleanup
    definition: Effectが返す後片付け関数。開始した同じ購読を、対象変更や表示終了時に解除する。
    firstSlideId: react-ch01-l11-s02
    relatedIds: []
  - id: mount
    term: mount・unmount
    definition: Componentの表示を開始することをmount、取り外すことをunmountという。再表示では新たに現在値を同期する。
    firstSlideId: react-ch01-l11-s02
    relatedIds: []
  - id: custom-hook
    term: Custom Hook
    definition: Hookを使う処理をまとめたuseで始まる関数。処理を再利用しても、内部のStateは呼出しごとに独立する。
    firstSlideId: react-ch01-l12-s01
    relatedIds: []
  - id: quiz-workspace
    term: 共有Workspace
    definition: Guidedの複数工程が同じ編集原文と合格時Snapshotを引き継ぐ作業領域。判定履歴とHintは工程ごと。
    firstSlideId: react-ch02-l01-s01
    relatedIds: []
  - id: quiz-pure-state
    term: 純粋なState関数
    definition: 前のStateと入力だけから次のStateを返し、元の値を書き換えず外部へ副作用を起こさない関数。
    firstSlideId: react-ch02-l02-s01
    relatedIds: []
  - id: brief-transfer
    term: 別Briefへの応用
    definition: 既習の処理を別の制作要件へ合わせて選び直すこと。ここでは誤答後の再回答と累積得点の保持。
    firstSlideId: react-ch03-l01-s01
    relatedIds: []
