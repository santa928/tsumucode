  - id: jsx
    term: JSX
    definition: JavaScript内で表示を書く構文。HTML文字列ではなく、型検査と変換を経てReactへ渡す。
    firstSlideId: react-ch01-l01-s02
    relatedIds: [component]
  - id: props
    term: Props
    definition: 呼び出し元からComponentへ渡す値。ここではquestionという名前で問題オブジェクトを渡す。
    firstSlideId: react-ch01-l01-s03
    relatedIds: [component, jsx]
