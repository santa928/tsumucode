<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img" aria-labelledby="title desc">
  <title id="title">genericで入出力の型をつなぐ</title>
  <desc id="desc">同じ型を保って返す。keep&lt;T&gt;(value: T): T。1つのTが受け取る型と返す型を結ぶ。keep(2) → 数値の2。keep(タイトル) → 元の文字列</desc>
  <rect width="420" height="300" rx="18" fill="#fffaf0" stroke="#b6c8bd"/>
  <text x="24" y="38" font-family="sans-serif" font-size="20" fill="#173b32">同じ型を保って返す</text>
  <rect x="24" y="58" width="372" height="88" rx="12" fill="#e1f3ff" stroke="#087ac4"/>
  <text x="38" y="87" font-family="sans-serif" font-size="19" fill="#162735">keep&lt;T&gt;(value: T): T</text>
  <text x="38" y="119" font-family="sans-serif" font-size="17" fill="#162735">1つのTが受け取る型と返す型を結ぶ</text>
  <rect x="24" y="164" width="372" height="88" rx="12" fill="#fff3cd" stroke="#d97a00"/>
  <text x="38" y="195" font-family="sans-serif" font-size="18" fill="#162735">keep(2) → 数値の2</text>
  <text x="38" y="228" font-family="sans-serif" font-size="18" fill="#162735">keep(タイトル) → 元の文字列</text>
  <text x="24" y="279" font-family="sans-serif" font-size="17" fill="#173b32">型の確認と、実際の結果を両方確かめる</text>
  </svg>
