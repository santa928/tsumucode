    label: 型の契約を保ち、受け取った値から結果を作る
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: typescript-learning
      file: main.ts
    assertion:
      kind: typescript-learning
      profile: generic-identity-v1
    feedback:
      target: genericで入出力の型をつなぐ
      expected: 型パラメータを引数と戻り値へ使い、数値と文字列を同じ関数で型を保って返せる。
      nextAction: 型の宣言と注釈を保ち、受け取った値を使う処理を確認します。
    hintId: typescript-ch04-l02-e01-h01
    relatedSlideId: typescript-ch04-l02-s01
  - id: typescript-ch04-l02-e01-r02
    label: すべての実行例で期待した値を表示する
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: javascript-console
    assertion:
      kind: javascript-console
      operator: equals
      expected:
        - level: log
          text: '2'
        - level: log
          text: 型のクイズ
    feedback:
      target: Consoleのすべての結果
      expected: 2・型のクイズ
      nextAction: 実行例を保ち、元の値と戻った値の両方を確認します。
    hintId: typescript-ch04-l02-e01-h02
    relatedSlideId: typescript-ch04-l02-s04
hints:
  - id: typescript-ch04-l02-e01-h01
    level: 1
    title: 型と値の受渡しを比べる
    text: 数値の2と文字列のタイトルに、同じkeepを使いたい課題です。
    relatedSlideId: typescript-ch04-l02-s01
  - id: typescript-ch04-l02-e01-h02
    level: 2
    title: 型の関係を保つ
    text: 型パラメータを1つ宣言し、受け取る型と返す型の両方へ使います。
    relatedSlideId: typescript-ch04-l02-s02
  - id: typescript-ch04-l02-e01-h03
    level: 3
    title: 処理と確認を残す
    text: 関数名の後ろで型パラメータTを宣言し、引数valueと戻り値に同じTの注釈を書きます。return value;と2つの受取先を保ちます。
    relatedSlideId: typescript-ch04-l02-s03
relatedSlideIds:
