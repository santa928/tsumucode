<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img" aria-labelledby="title desc">
  <title id="title">readonlyの入力から別の配列を作る</title>
  <desc id="desc">型のreadonlyと実際の配列。入力: readonly number[]。addPointは入力を変えず別の配列へ。元の参照でpush(4) → 1,2,4。先に作った結果 → 1,2,3</desc>
  <rect width="420" height="300" rx="18" fill="#fffaf0" stroke="#b6c8bd"/>
  <text x="24" y="38" font-family="sans-serif" font-size="20" fill="#173b32">型のreadonlyと実際の配列</text>
  <rect x="24" y="58" width="372" height="88" rx="12" fill="#e1f3ff" stroke="#087ac4"/>
  <text x="38" y="87" font-family="sans-serif" font-size="19" fill="#162735">入力: readonly number[]</text>
  <text x="38" y="119" font-family="sans-serif" font-size="17" fill="#162735">addPointは入力を変えず別の配列へ</text>
  <rect x="24" y="164" width="372" height="88" rx="12" fill="#fff3cd" stroke="#d97a00"/>
  <text x="38" y="195" font-family="sans-serif" font-size="18" fill="#162735">元の参照でpush(4) → 1,2,4</text>
  <text x="38" y="228" font-family="sans-serif" font-size="18" fill="#162735">先に作った結果 → 1,2,3</text>
  <text x="24" y="279" font-family="sans-serif" font-size="17" fill="#173b32">型の確認と、実際の結果を両方確かめる</text>
  </svg>
