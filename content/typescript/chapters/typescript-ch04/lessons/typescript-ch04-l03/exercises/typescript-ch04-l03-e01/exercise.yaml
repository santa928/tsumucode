  - path: index.html
    language: html
    source: solution/index.html
    editable: false
validationRules:
  - id: typescript-ch04-l03-e01-r01
    label: 型の契約を保ち、受け取った値から結果を作る
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: typescript-learning
      file: main.ts
    assertion:
      kind: typescript-learning
      profile: readonly-copy-v1
    feedback:
      target: readonlyの入力から別の配列を作る
      expected: 読み取り専用の引数を変更せず新しい配列を作り、readonlyは実行時の凍結ではないと区別できる。
      nextAction: 型の宣言と注釈を保ち、受け取った値を使う処理を確認します。
    hintId: typescript-ch04-l03-e01-h01
    relatedSlideId: typescript-ch04-l03-s01
  - id: typescript-ch04-l03-e01-r02
    label: すべての実行例で期待した値を表示する
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: javascript-console
    assertion:
      kind: javascript-console
      operator: equals
      expected:
        - level: log
          text: 1,2,4
        - level: log
          text: 1,2,3
    feedback:
      target: Consoleのすべての結果
      expected: 1,2,4・1,2,3
      nextAction: 実行例を保ち、元の値と戻った値の両方を確認します。
    hintId: typescript-ch04-l03-e01-h02
    relatedSlideId: typescript-ch04-l03-s04
hints:
  - id: typescript-ch04-l03-e01-h01
    level: 1
    title: 型と値の受渡しを比べる
    text: points.push(3)は引数の配列を変更します。readonlyの参照からは変更できません。
    relatedSlideId: typescript-ch04-l03-s01
  - id: typescript-ch04-l03-e01-h02
    level: 2
    title: 型の関係を保つ
    text: 入力のreadonlyを消すのではなく、新しい配列へ元の値と追加する3を入れます。
    relatedSlideId: typescript-ch04-l03-s02
  - id: typescript-ch04-l03-e01-h03
    level: 3
    title: 処理と確認を残す
    text: return [...points, 3];なら元の配列を変えず、新しい配列を返します。
    relatedSlideId: typescript-ch04-l03-s03
relatedSlideIds:
  - typescript-ch04-l03-s01
  - typescript-ch04-l03-s02
  - typescript-ch04-l03-s03
  - typescript-ch04-l03-s04
