  - id: keep-type-contract
    file: main.ts
    target: readonlyの入力から別の配列を作る
    starterAnchor: points.push(3);
    change: 引数へ追加せず、3を追加した新しい配列を返す
    observe: 型の案内が消え、Consoleに1,2,4・1,2,3が表示される
    requiresConceptIds:
      - typescript-readonly-copy
    validationRuleIds:
      - typescript-ch04-l03-e01-r01
      - typescript-ch04-l03-e01-r02
