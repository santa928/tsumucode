validationRules:
  - id: typescript-ch04-l01-e01-r01
    label: 型の契約を保ち、受け取った値から結果を作る
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: typescript-learning
      file: main.ts
    assertion:
      kind: typescript-learning
      profile: number-callback-v1
    feedback:
      target: 関数の入出力とcallbackを型付けする
      expected: 引数と戻り値を数値とする関数型を使い、処理をcallbackとして渡して値を計算できる。
      nextAction: 型の宣言と注釈を保ち、受け取った値を使う処理を確認します。
    hintId: typescript-ch04-l01-e01-h01
    relatedSlideId: typescript-ch04-l01-s01
  - id: typescript-ch04-l01-e01-r02
    label: すべての実行例で期待した値を表示する
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: javascript-console
    assertion:
      kind: javascript-console
      operator: equals
      expected:
        - level: log
          text: '6'
        - level: log
          text: '10'
    feedback:
      target: Consoleのすべての結果
      expected: 6・10
      nextAction: 実行例を保ち、元の値と戻った値の両方を確認します。
    hintId: typescript-ch04-l01-e01-h02
    relatedSlideId: typescript-ch04-l01-s04
hints:
  - id: typescript-ch04-l01-e01-h01
    level: 1
    title: 型と値の受渡しを比べる
    text: applyへ渡している値は3と5です。どちらも数値です。
    relatedSlideId: typescript-ch04-l01-s01
  - id: typescript-ch04-l01-e01-h02
    level: 2
    title: 型の関係を保つ
    text: Operationの引数型と戻り値型を、doubleとapplyで受け渡す値に合わせます。
    relatedSlideId: typescript-ch04-l01-s02
  - id: typescript-ch04-l01-e01-h03
    level: 3
    title: 処理と確認を残す
    text: 'type Operation = (value: number) => number;に直し、operation(value)とvalue *
      2を保ちます。'
    relatedSlideId: typescript-ch04-l01-s03
relatedSlideIds:
  - typescript-ch04-l01-s01
