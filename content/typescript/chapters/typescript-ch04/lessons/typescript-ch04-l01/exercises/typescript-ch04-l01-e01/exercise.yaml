    target: 関数の入出力とcallbackを型付けする
    starterAnchor: 'type Operation = (value: string) => number;'
    change: 関数型の引数を、渡す数値に合わせる
    observe: 型の案内が消え、Consoleに6・10が表示される
    requiresConceptIds:
      - typescript-function-callback
    validationRuleIds:
      - typescript-ch04-l01-e01-r01
