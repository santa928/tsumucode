interactionScenarios:
  - id: model-web
    label: Webの問題データ
    actions:
      - id: a1
        kind: click
        selector: '#start'
    checkpoints:
      - id: c1
        afterActionId: a1
        expectations:
          - id: question
            kind: selector-text
            selector: '#question'
            equals: Webページの骨組みを作るのは？
          - id: choice-0
            kind: selector-text
            selector: '#choice-0'
            equals: HTML
          - id: choice-1
            kind: selector-text
            selector: '#choice-1'
            equals: CSS
          - id: progress
            kind: selector-text
            selector: '#progress'
            equals: 問題1 / 2
          - id: score-value
            kind: selector-text
            selector: '#score-value'
            equals: '0'
          - id: focus
            kind: focused
            selector: '#choice-0'
  - id: model-logic
    label: Logicの問題データ
    actions:
      - id: a1
        kind: select
        selector: '#category'
        value: logic
      - id: a2
        kind: click
        selector: '#start'
    checkpoints:
      - id: c1
        afterActionId: a1
        expectations:
          - id: status
            kind: selector-text
            selector: '#status'
            equals: 開始すると問題が出ます
      - id: c2
        afterActionId: a2
        expectations:
          - id: question
            kind: selector-text
            selector: '#question'
            equals: 1 + 1 は？
          - id: choice-0
            kind: selector-text
            selector: '#choice-0'
            equals: '2'
          - id: choice-1
            kind: selector-text
            selector: '#choice-1'
            equals: '3'
          - id: progress
            kind: selector-text
            selector: '#progress'
            equals: 問題1 / 2
          - id: score-value
            kind: selector-text
            selector: '#score-value'
            equals: '0'
          - id: focus
            kind: focused
            selector: '#choice-0'
