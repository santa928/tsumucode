      expected: Questionの必須項目とreadonlyの選択肢を定め、2カテゴリ各2問の型付きデータを実際の表示へ渡す。
      nextAction: 型の決めつけで代用せず、今回の工程のデータと関数を保ちます。
    hintId: typescript-ch06-l01-e01-h01
    relatedSlideId: typescript-ch06-l01-s01
