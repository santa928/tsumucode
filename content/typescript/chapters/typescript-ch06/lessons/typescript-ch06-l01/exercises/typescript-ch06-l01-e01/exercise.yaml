      operator: equals
      expected:
        - level: log
          text: 準備できました
    feedback:
      target: 準備の案内
      expected: 準備できました
      nextAction: 準備の表示に加え、クイズの実操作を確認します。
    hintId: typescript-ch06-l01-e01-h02
    relatedSlideId: typescript-ch06-l01-s04
  - id: typescript-ch06-l01-e01-r03
    label: 提供HTMLの問題欄がある
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: selector
      selector: '#question'
    assertion:
      kind: exists
    feedback:
      target: 問題表示の欄
      expected: 問題欄の存在
      nextAction: 提供HTMLを保ち、操作後の問題表示を確かめます。
    hintId: typescript-ch06-l01-e01-h02
    relatedSlideId: typescript-ch06-l01-s04
hints:
  - id: typescript-ch06-l01-e01-h01
    level: 1
    title: 確認する場所
    text: Questionの4項目を、与えられたデータと並べて確認します。categoryは2つのliteral、textとcorrectはstringです。
    relatedSlideId: typescript-ch06-l01-s01
  - id: typescript-ch06-l01-e01-h02
    level: 2
    title: 値とのつながり
    text: choicesはひとつの文字列でなく、文字列が並ぶ読み取り専用の配列です。questionsもQuestionを要素として持ちます。
    relatedSlideId: typescript-ch06-l01-s02
  - id: typescript-ch06-l01-e01-h03
    level: 3
    title: 局所の例
    text: '局所の例: interface Label { values: readonly string[]; }。別の対象の配列型を、今回の選択肢へ応用します。'
    relatedSlideId: typescript-ch06-l01-s03
