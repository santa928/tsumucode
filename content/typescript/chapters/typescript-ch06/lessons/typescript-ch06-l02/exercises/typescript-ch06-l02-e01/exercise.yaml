  - id: typescript-ch06-l02-e01-r01
    label: 回答と得点を型付き状態へつなぐ
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: typescript-learning
      file: main.ts
    assertion:
      kind: typescript-learning
      profile: quiz-state-v1
    feedback:
      target: 今回の型と値の接続
      expected: readonlyのQuizStateを関数へ渡し、実際の正誤で得点を作り、回答後の次問とカテゴリを保つ再挑戦へつなぐ。
      nextAction: 型の決めつけで代用せず、今回の工程のデータと関数を保ちます。
    hintId: typescript-ch06-l02-e01-h01
    relatedSlideId: typescript-ch06-l02-s01
  - id: typescript-ch06-l02-e01-r02
    label: クイズの操作を準備した
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: javascript-console
    assertion:
      kind: javascript-console
      operator: equals
      expected:
        - level: log
          text: 準備できました
    feedback:
      target: 準備の案内
      expected: 準備できました
      nextAction: 準備の表示に加え、クイズの実操作を確認します。
    hintId: typescript-ch06-l02-e01-h02
    relatedSlideId: typescript-ch06-l02-s04
  - id: typescript-ch06-l02-e01-r03
    label: 提供HTMLの問題欄がある
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: selector
      selector: '#question'
    assertion:
      kind: exists
    feedback:
      target: 問題表示の欄
      expected: 問題欄の存在
      nextAction: 提供HTMLを保ち、操作後の問題表示を確かめます。
    hintId: typescript-ch06-l02-e01-h02
    relatedSlideId: typescript-ch06-l02-s04
hints:
  - id: typescript-ch06-l02-e01-h01
    level: 1
    title: 確認する場所
    text: answerとadvanceの引数・戻り値の型を保ちます。readonlyの入力を書き換えず、新しいQuizStateを返します。
    relatedSlideId: typescript-ch06-l02-s01
  - id: typescript-ch06-l02-e01-h02
    level: 2
    title: 値とのつながり
    text: answerは回答済みならそのstateを保ち、choiceとquestion.correctの比較を得点へつなぎます。advanceは回答済みのときだけindexを進めます。
    relatedSlideId: typescript-ch06-l02-s02
  - id: typescript-ch06-l02-e01-h03
    level: 3
    title: 局所の例
    text: '局所の例: function next(value: number): number { return value + 1;
      }。今回は数値だけでなく、他の項目も持つ新しい状態を返します。'
    relatedSlideId: typescript-ch06-l02-s03
