      - id: a9
        kind: click
        selector: '#choice-1'
      - id: a10
        kind: click
        selector: '#next'
    checkpoints:
      - id: c1
        afterActionId: a1
        expectations:
          - id: question
            kind: selector-text
            selector: '#question'
            equals: Webページの骨組みを作るのは？
          - id: choice-0
            kind: selector-text
            selector: '#choice-0'
            equals: HTML
          - id: choice-1
            kind: selector-text
            selector: '#choice-1'
            equals: CSS
          - id: progress
            kind: selector-text
            selector: '#progress'
            equals: 問題1 / 2
          - id: score-value
            kind: selector-text
            selector: '#score-value'
            equals: '0'
          - id: focus
            kind: focused
            selector: '#choice-0'
      - id: c2
        afterActionId: a2
        expectations:
          - id: score-value
            kind: selector-text
            selector: '#score-value'
            equals: '1'
          - id: feedback
            kind: selector-text
            selector: '#feedback'
            equals: 正解です
          - id: focus
            kind: focused
            selector: '#next'
      - id: c3
        afterActionId: a3
        expectations:
          - id: question
            kind: selector-text
            selector: '#question'
            equals: 見た目を整えるのは？
          - id: choice-0
            kind: selector-text
            selector: '#choice-0'
            equals: JavaScript
          - id: choice-1
            kind: selector-text
            selector: '#choice-1'
            equals: CSS
          - id: progress
            kind: selector-text
            selector: '#progress'
            equals: 問題2 / 2
          - id: focus
            kind: focused
            selector: '#choice-0'
      - id: c4
        afterActionId: a4
        expectations:
          - id: score-value
            kind: selector-text
            selector: '#score-value'
            equals: '1'
          - id: feedback
            kind: selector-text
            selector: '#feedback'
            equals: 正解は CSS です
          - id: focus
            kind: focused
