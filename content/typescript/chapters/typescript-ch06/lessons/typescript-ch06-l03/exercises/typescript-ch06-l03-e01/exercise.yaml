    level: 1
    title: 確認する場所
    text: readQuestionsでloadQuestions(mode)をawaitし、要素ごとにdecodeQuestionへ渡します。Promiseの成功と問題の形の確認は別です。
    relatedSlideId: typescript-ch06-l03-s01
  - id: typescript-ch06-l03-e01-h02
    level: 2
    title: 値とのつながり
    text: 各unknownのobject・非null・必須項目・項目の型を確認します。2つのchoicesをunknownへ取り出し、stringと長さ2、correctが選択肢の一方であることも確認します。
    relatedSlideId: typescript-ch06-l03-s02
  - id: typescript-ch06-l03-e01-h03
    level: 3
    title: 局所の例
    text:
      '局所の例: const item: unknown = values[0]; if (typeof item === "string") { /* stringとして使う */
      }。失敗もunknownからErrorへ絞り、受け取ったmessageを使います。'
    relatedSlideId: typescript-ch06-l03-s03
