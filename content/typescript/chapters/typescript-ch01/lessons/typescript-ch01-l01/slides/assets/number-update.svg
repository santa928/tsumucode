<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" role="img" aria-labelledby="title desc"><title id="title">数値のまま更新する</title><desc id="desc">scoreは数値1からnumberと推論され、1を足した数値2をConsoleに表示する。</desc><rect width="400" height="210" rx="12" fill="#f8fafc"/><g font-family="sans-serif" font-size="20" text-anchor="middle" fill="#0f172a"><rect x="24" y="12" width="352" height="50" rx="8" fill="#dbeafe"/><text x="200" y="44">最初の値 1 → number</text><path d="M200 66v14m-6-6 6 6 6-6" fill="none" stroke="#475569" stroke-width="2"/><rect x="24" y="84" width="352" height="50" rx="8" fill="#e0e7ff"/><text x="200" y="116">1 + 1 → 数値の2</text><path d="M200 138v14m-6-6 6 6 6-6" fill="none" stroke="#475569" stroke-width="2"/><rect x="24" y="156" width="352" height="42" rx="8" fill="#dcfce7"/><text x="200" y="184">Console → 2</text></g></svg>
