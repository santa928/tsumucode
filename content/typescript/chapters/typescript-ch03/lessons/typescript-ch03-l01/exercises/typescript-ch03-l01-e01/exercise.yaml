id: typescript-ch03-l01-e01
kind: standard
workspaceId: typescript-ch03-l01-e01
countsTowardStandardExerciseTotal: true
title: 状態に合わせて型を絞る
instructionsSource: instructions.md
requiresConcepts:
  - conceptId: typescript-union-narrowing
    minimumLevel: transform
scaffoldLevel: transform
runtime:
  kind: typescript
  entryFile: main.ts
  sourceType: module
  capabilityProfile: core
  primaryOutput: console
steps:
  - id: add-value-guard
    file: main.ts
    target: 値を読む前の確認
    starterAnchor: return result.points;
    change: kindを確認し、それぞれの状態の値をreturnする
    observe: 型の案内が消え、Consoleに2・もう一度が順に表示される
    requiresConceptIds:
      - typescript-union-narrowing
    validationRuleIds:
      - typescript-ch03-l01-e01-r01
      - typescript-ch03-l01-e01-r02
files:
  - path: main.ts
    language: typescript
    source: starter/main.ts
    editable: true
  - path: index.html
    language: html
    source: starter/index.html
    editable: false
solutionFiles:
  - path: main.ts
    language: typescript
    source: solution/main.ts
    editable: false
  - path: index.html
    language: html
    source: solution/index.html
    editable: false
validationRules:
  - id: typescript-ch03-l01-e01-r01
    label: 型の形と引数の注釈を保ち、分岐で値を取り出す
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: typescript-learning
      file: main.ts
    assertion:
      kind: typescript-learning
      profile: union-result-v1
    feedback:
      target: 型の形・引数・分岐
      expected: 引数の値を確認して、それぞれの値を返す
      nextAction: 型の形と引数の注釈を保ち、値を読める分岐で取り出します。
    hintId: typescript-ch03-l01-e01-h01
    relatedSlideId: typescript-ch03-l01-s01
  - id: typescript-ch03-l01-e01-r02
    label: すべての実行例で期待した値を表示する
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: javascript-console
    assertion:
      kind: javascript-console
      operator: equals
      expected:
        - level: log
          text: '2'
        - level: log
          text: もう一度
    feedback:
      target: Consoleのすべての結果
      expected: 2・もう一度
      nextAction: 各実行例がどの分岐を通るかを確認し、固定の値でなく引数の値を使います。
    hintId: typescript-ch03-l01-e01-h02
    relatedSlideId: typescript-ch03-l01-s04
hints:
  - id: typescript-ch03-l01-e01-h01
    level: 1
    title: 確認する値を見つける
    text: どちらの状態にもあるkindと、片方にだけあるpoints/messageを比べます。
    relatedSlideId: typescript-ch03-l01-s01
  - id: typescript-ch03-l01-e01-h02
    level: 2
    title: 読む場所を分ける
    text: kindがcorrectのときにpointsを読み、もう一方ではmessageを読みます。
    relatedSlideId: typescript-ch03-l01-s02
  - id: typescript-ch03-l01-e01-h03
    level: 3
    title: 分岐と戻り値を残す
    text: if (result.kind ===
      'correct')の中でresult.pointsをreturnし、elseでresult.messageをreturnします。
    relatedSlideId: typescript-ch03-l01-s03
relatedSlideIds:
  - typescript-ch03-l01-s01
  - typescript-ch03-l01-s02
  - typescript-ch03-l01-s03
  - typescript-ch03-l01-s04
