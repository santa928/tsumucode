<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" role="img" aria-labelledby="title description">
  <title id="title">Questionの形と値</title>
  <desc id="description">上のinterfaceはpromptをstring、choicesをstring配列、correctIndexをnumberと定義する。下のquestionは問題文、2つの選択肢、位置0の値を用意する。型注釈は形と値を結び付け、型の定義だけでは値を作らない。</desc>
  <rect width="420" height="340" rx="16" fill="#f8fafc" />
  <g font-family="sans-serif" fill="#0f172a">
    <rect x="18" y="18" width="384" height="112" rx="10" fill="#e0f2fe" stroke="#0284c7" />
    <text x="32" y="48" font-size="19" font-weight="700">形：interface Question</text>
    <text x="32" y="80" font-size="18">prompt: string ／ choices: string[]</text>
    <text x="32" y="112" font-size="18">correctIndex: number</text>
    <text x="210" y="163" text-anchor="middle" font-size="17">型注釈：値が形に合うかを確認 ↓</text>
    <rect x="18" y="188" width="384" height="134" rx="10" fill="#fef3c7" stroke="#b45309" />
    <text x="32" y="219" font-size="19" font-weight="700">値：const question: Question</text>
    <text x="32" y="250" font-size="18">問題文 ／ ['内容', '見た目']</text>
    <text x="32" y="280" font-size="18">正答位置：0</text>
    <text x="32" y="308" font-size="17">型の定義だけでは値は作られない</text>
  </g>
</svg>
