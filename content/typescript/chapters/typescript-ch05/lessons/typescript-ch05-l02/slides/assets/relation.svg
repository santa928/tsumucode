<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img" aria-labelledby="title desc"><title id="title">unknownの値を実行時に確かめる</title><desc id="desc">unknown: 形はまだ分からない。値と項目を実際に確認。数値なら実値、違えば不正なデータ</desc><rect width="420" height="300" rx="20" fill="#f1f5f9"/><rect x="16" y="20" width="388" height="70" rx="12" fill="#dbeafe"/><text x="210" y="61" text-anchor="middle" font-size="17" font-family="sans-serif" fill="#0f172a">unknown: 形はまだ分からない</text><rect x="16" y="110" width="388" height="70" rx="12" fill="#dcfce7"/><text x="210" y="151" text-anchor="middle" font-size="17" font-family="sans-serif" fill="#0f172a">値と項目を実際に確認</text><rect x="16" y="200" width="388" height="70" rx="12" fill="#fef3c7"/><text x="210" y="241" text-anchor="middle" font-size="17" font-family="sans-serif" fill="#0f172a">数値なら実値、違えば不正なデータ</text></svg>
