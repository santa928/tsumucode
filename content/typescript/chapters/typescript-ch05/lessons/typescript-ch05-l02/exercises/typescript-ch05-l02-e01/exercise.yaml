    feedback:
      target: unknownの値を実行時に確かめる
      expected: unknownの値をobject・null・項目の存在・項目の型で確認し、実値か不正データの案内を表示できる。
      nextAction: 決めつける型を書かず、実際の値を確認してから表示へ渡します。
    hintId: typescript-ch05-l02-e01-h01
    relatedSlideId: typescript-ch05-l02-s01
  - id: typescript-ch05-l02-e01-r02
    label: 操作の準備ができた
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: javascript-console
    assertion:
      kind: javascript-console
      operator: equals
      expected:
        - level: log
          text: 準備できました
    feedback:
      target: Consoleの準備案内
      expected: 準備できました
      nextAction: 登録コードを保ち、実DOMの操作も確かめます。
    hintId: typescript-ch05-l02-e01-h02
    relatedSlideId: typescript-ch05-l02-s04
  - id: typescript-ch05-l02-e01-r03
    label: 操作前は待機
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: selector
      selector: '#output'
    assertion:
      kind: text
      operator: equals
      expected: 待機
    feedback:
      target: '#output'
      expected: 待機
      nextAction: 操作の前と後の表示を分けます。
    hintId: typescript-ch05-l02-e01-h02
    relatedSlideId: typescript-ch05-l02-s04
hints:
  - id: typescript-ch05-l02-e01-h01
    level: 1
    title: 値を読む前の確認
    text: unknownにはどんな値も入り得ます。項目を読む前に値の実際の種類を確認します。
    relatedSlideId: typescript-ch05-l02-s01
  - id: typescript-ch05-l02-e01-h02
    level: 2
    title: 型と実行を分ける
    text: typeof nullもobjectです。nullではないことと、'points' in valueで項目があることも確認します。
    relatedSlideId: typescript-ch05-l02-s02
  - id: typescript-ch05-l02-e01-h03
    level: 3
    title: 処理の形を確かめる
    text: typeof value.points ===
      'number'まで確認した側でString(value.points)を返し、それ以外は不正なデータと返します。
    relatedSlideId: typescript-ch05-l02-s03
