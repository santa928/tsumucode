<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>unknownの値を実行時に確かめる</title>
  </head>
  <body>
    <main>
      <h1>unknownの値を実行時に確かめる</h1>
      <p>同梱した値を確認する練習です。外部通信はしません。</p>
      <button id="valid" type="button">数値のデータ</button>
      <button id="invalid" type="button">項目が文字列</button>
      <button id="missing" type="button">nullのデータ</button>
      <p id="output" aria-live="polite">待機</p>
    </main>
  </body>
</html>
