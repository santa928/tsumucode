    file: main.ts
    target: 非同期のunknownと失敗を受け止める
    starterAnchor: output.textContent = error.message;
    change: unknownの失敗をErrorか確認してから案内を読む
    observe: 型の案内が消え、ボタンの実DOM表示が各結果に変わる
    requiresConceptIds:
      - typescript-async-unknown
    validationRuleIds:
      - typescript-ch05-l03-e01-r01
      - typescript-ch05-l03-e01-r02
      - typescript-ch05-l03-e01-r03
