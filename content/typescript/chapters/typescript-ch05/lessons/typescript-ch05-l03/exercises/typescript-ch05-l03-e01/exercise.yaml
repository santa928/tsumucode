    editable: false
solutionFiles:
  - path: main.ts
    language: typescript
    source: solution/main.ts
    editable: false
  - path: index.html
    language: html
    source: solution/index.html
    editable: false
validationRules:
  - id: typescript-ch05-l03-e01-r01
    label: 型と実際の値の確認を保つ
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: typescript-learning
      file: main.ts
    assertion:
      kind: typescript-learning
      profile: async-unknown-v1
    feedback:
      target: 非同期のunknownと失敗を受け止める
      expected: 非同期結果をunknownから検証し、unknownの失敗をError確認して表示し、拒否後も再試行できる。
      nextAction: 決めつける型を書かず、実際の値を確認してから表示へ渡します。
    hintId: typescript-ch05-l03-e01-h01
    relatedSlideId: typescript-ch05-l03-s01
  - id: typescript-ch05-l03-e01-r02
    label: 操作の準備ができた
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: javascript-console
    assertion:
      kind: javascript-console
      operator: equals
      expected:
        - level: log
          text: 準備できました
    feedback:
      target: Consoleの準備案内
      expected: 準備できました
      nextAction: 登録コードを保ち、実DOMの操作も確かめます。
    hintId: typescript-ch05-l03-e01-h02
    relatedSlideId: typescript-ch05-l03-s04
  - id: typescript-ch05-l03-e01-r03
    label: 操作前は待機
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: selector
      selector: '#output'
    assertion:
      kind: text
      operator: equals
      expected: 待機
    feedback:
      target: '#output'
      expected: 待機
      nextAction: 操作の前と後の表示を分けます。
    hintId: typescript-ch05-l03-e01-h02
    relatedSlideId: typescript-ch05-l03-s04
hints:
  - id: typescript-ch05-l03-e01-h01
    level: 1
    title: 値を読む前の確認
    text: 非同期の成功はtryへ、awaitしたPromiseの拒否はcatchへ進みます。catchにはError以外も入り得ます。
    relatedSlideId: typescript-ch05-l03-s01
  - id: typescript-ch05-l03-e01-h02
    level: 2
    title: 型と実行を分ける
    text: catchのerrorはunknownです。instanceof Errorで確認した側だけmessageを読みます。
    relatedSlideId: typescript-ch05-l03-s02
  - id: typescript-ch05-l03-e01-h03
    level: 3
    title: 処理の形を確かめる
    text: "error instanceof Error ? error.message : '理由が不明です'で案内を分け、次の正常操作も残します。"
    relatedSlideId: typescript-ch05-l03-s03
relatedSlideIds:
  - typescript-ch05-l03-s01
  - typescript-ch05-l03-s02
  - typescript-ch05-l03-s03
  - typescript-ch05-l03-s04
