<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>非同期のunknownと失敗を受け止める</title>
  </head>
  <body>
    <main>
      <h1>非同期のunknownと失敗を受け止める</h1>
      <p>同梱した値を確認する練習です。外部通信はしません。</p>
      <button id="success" type="button">正常なデータ</button>
      <button id="invalid" type="button">不正なデータ</button>
      <button id="failure" type="button">取得を拒否</button>
      <p id="output" aria-live="polite">待機</p>
    </main>
  </body>
</html>
