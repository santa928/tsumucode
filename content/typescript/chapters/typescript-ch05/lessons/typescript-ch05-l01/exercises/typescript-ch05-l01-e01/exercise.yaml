validationRules:
  - id: typescript-ch05-l01-e01-r01
    label: 型と実際の値の確認を保つ
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: typescript-learning
      file: main.ts
    assertion:
      kind: typescript-learning
      profile: dom-event-v1
    feedback:
      target: DOMとEventの対象を確認して読む
      expected: DOMが見つからない場合とEventの対象が違う場合を分け、確認したbuttonの値を表示できる。
      nextAction: 決めつける型を書かず、実際の値を確認してから表示へ渡します。
    hintId: typescript-ch05-l01-e01-h01
    relatedSlideId: typescript-ch05-l01-s01
  - id: typescript-ch05-l01-e01-r02
    label: 操作の準備ができた
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: javascript-console
    assertion:
      kind: javascript-console
      operator: equals
      expected:
        - level: log
          text: 準備できました
    feedback:
      target: Consoleの準備案内
      expected: 準備できました
      nextAction: 登録コードを保ち、実DOMの操作も確かめます。
    hintId: typescript-ch05-l01-e01-h02
    relatedSlideId: typescript-ch05-l01-s04
  - id: typescript-ch05-l01-e01-r03
    label: 操作前は待機
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: selector
      selector: '#output'
    assertion:
      kind: text
      operator: equals
      expected: 待機
    feedback:
      target: '#output'
      expected: 待機
      nextAction: 操作の前と後の表示を分けます。
    hintId: typescript-ch05-l01-e01-h02
    relatedSlideId: typescript-ch05-l01-s04
hints:
  - id: typescript-ch05-l01-e01-h01
    level: 1
    title: 値を読む前の確認
    text: EventのcurrentTargetは登録先ですが、Elementの特定種類とは限りません。nullや別の対象を含みます。
    relatedSlideId: typescript-ch05-l01-s01
  - id: typescript-ch05-l01-e01-h02
    level: 2
    title: 型と実行を分ける
    text: instanceofでHTMLButtonElementかを確認した側でdatasetを読み、違う側もstringを返します。
    relatedSlideId: typescript-ch05-l01-s02
  - id: typescript-ch05-l01-e01-h03
    level: 3
    title: 処理の形を確かめる
    text: if (target instanceof HTMLButtonElement)の中でtarget.dataset.answer ??
      '未指定'を返し、他の対象には対象が違いますと返します。
    relatedSlideId: typescript-ch05-l01-s03
relatedSlideIds:
