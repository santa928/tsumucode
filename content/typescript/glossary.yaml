schemaVersion: 1
entries:
  - id: interface
    term: interface
    definition: オブジェクトのプロパティの名前と型を書き、形に名前を付ける書き方。値を作るものではない。
    firstSlideId: typescript-ch02-l01-s01
    relatedIds: [property, type-annotation, type-alias]
  - id: string-array
    term: string[]
    definition: 文字列を要素に持つ配列の型。配列の長さや正答位置の範囲を保証するものではない。
    firstSlideId: typescript-ch02-l01-s01
    relatedIds: [string, interface]
  - id: property
    term: プロパティ
    definition: オブジェクトの中の項目。ここでは問題文・選択肢・正答位置の名前と値を持つ。
    firstSlideId: typescript-ch02-l01-s01
    relatedIds: [interface]
  - id: type-alias
    term: type alias
    definition: typeを使って型に名前を付ける書き方。interfaceと同じオブジェクトの形も表せる。
    firstSlideId: typescript-ch02-l01-s01
    relatedIds: [interface]
  - id: array-at
    term: .at()
    definition: 配列の指定した位置の要素を読むメソッド。ここでは0から数える整数の位置を使い、該当する要素がないとundefinedになる。
    firstSlideId: typescript-ch02-l01-s04
    relatedIds: [string-array, number]
  - id: typescript
    term: TypeScript
    definition: JavaScriptに型の確認を加えた言語。
    firstSlideId: typescript-ch01-l01-s01
    relatedIds:
      - type
  - id: type
    term: 型
    definition: 数値や文字列など、値の種類。
    firstSlideId: typescript-ch01-l01-s01
    relatedIds:
      - number
      - string
  - id: type-inference
    term: 型推論
    definition: 初期値などからTypeScriptが型を判断すること。
    firstSlideId: typescript-ch01-l01-s01
    relatedIds:
      - initial-value
      - number
      - type-annotation
  - id: initial-value
    term: 初期値
    definition: 変数へ最初に入れる値。
    firstSlideId: typescript-ch01-l01-s01
    relatedIds:
      - type-inference
  - id: number
    term: number
    definition: 数値を表す型。
    firstSlideId: typescript-ch01-l01-s01
    relatedIds:
      - string
  - id: string
    term: string
    definition: 文字列を表す型。引用符で囲んだ2も文字列。
    firstSlideId: typescript-ch01-l01-s02
    relatedIds:
      - number
  - id: console
    term: Console
    definition: console.logで表示した値を確認する場所。JavaScriptで既習。
    firstSlideId: typescript-ch01-l01-s01
    relatedIds: []
  - id: type-annotation
    term: 型注釈
    definition: 変数名の後ろに受け取る型を書くこと。
    firstSlideId: typescript-ch01-l02-s01
    relatedIds:
      - type-inference
      - number
  - id: type-erasure
    term: 型消去
    definition: 型注釈など、型のための情報が生成されたJavaScriptから取り除かれること。実行する処理を消す意味ではない。
    firstSlideId: typescript-ch01-l03-s01
    relatedIds:
      - type-annotation
      - javascript
  - id: javascript
    term: JavaScript
    definition: ブラウザが実行する言語。この教材ではTypeScriptから生成されたJavaScriptを実行する。
    firstSlideId: typescript-ch01-l03-s01
    relatedIds:
      - type-erasure
  - id: throw
    term: throw
    definition: 例外を投げて、通常の処理を中断するJavaScriptの構文。
    firstSlideId: typescript-ch01-l03-s03
    relatedIds:
      - error
  - id: error
    term: Error
    definition: JavaScriptで失敗を知らせる内容を持つ標準のオブジェクト。new Errorで作り、throwで投げられる。
    firstSlideId: typescript-ch01-l03-s03
    relatedIds:
      - throw
