schemaVersion: 1
entries:
  - id: interface
    term: interface
    definition: オブジェクトのプロパティの名前と型を書き、形に名前を付ける書き方。値を作るものではない。
    firstSlideId: typescript-ch02-l01-s01
    relatedIds:
      - property
      - type-annotation
      - type-alias
  - id: string-array
    term: string[]
    definition: 文字列を要素に持つ配列の型。配列の長さや正答位置の範囲を保証するものではない。
    firstSlideId: typescript-ch02-l01-s01
    relatedIds:
      - string
      - interface
  - id: property
    term: プロパティ
    definition: オブジェクトの中の項目。ここでは問題文・選択肢・正答位置の名前と値を持つ。
    firstSlideId: typescript-ch02-l01-s01
    relatedIds:
      - interface
  - id: type-alias
    term: type alias
    definition: typeを使って型に名前を付ける書き方。interfaceと同じオブジェクトの形も表せる。
    firstSlideId: typescript-ch02-l01-s01
    relatedIds:
      - interface
  - id: array-at
    term: .at()
    definition: 配列の指定した位置の要素を読むメソッド。ここでは0から数える整数の位置を使い、該当する要素がないとundefinedになる。
    firstSlideId: typescript-ch02-l01-s04
    relatedIds:
      - string-array
      - number
  - id: typescript
    term: TypeScript
    definition: JavaScriptに型の確認を加えた言語。
    firstSlideId: typescript-ch01-l01-s01
    relatedIds:
      - type
  - id: type
    term: 型
    definition: 数値や文字列など、値の種類。
    firstSlideId: typescript-ch01-l01-s01
    relatedIds:
      - number
      - string
  - id: type-inference
    term: 型推論
    definition: 初期値などからTypeScriptが型を判断すること。
    firstSlideId: typescript-ch01-l01-s01
    relatedIds:
      - initial-value
      - number
      - type-annotation
  - id: initial-value
    term: 初期値
    definition: 変数へ最初に入れる値。
    firstSlideId: typescript-ch01-l01-s01
    relatedIds:
      - type-inference
  - id: number
    term: number
    definition: 数値を表す型。
    firstSlideId: typescript-ch01-l01-s01
    relatedIds:
      - string
  - id: string
    term: string
    definition: 文字列を表す型。引用符で囲んだ2も文字列。
    firstSlideId: typescript-ch01-l01-s02
    relatedIds:
      - number
  - id: console
    term: Console
    definition: console.logで表示した値を確認する場所。JavaScriptで既習。
    firstSlideId: typescript-ch01-l01-s01
    relatedIds: []
  - id: type-annotation
    term: 型注釈
    definition: 変数名の後ろに受け取る型を書くこと。
    firstSlideId: typescript-ch01-l02-s01
    relatedIds:
      - type-inference
      - number
  - id: type-erasure
    term: 型消去
    definition: 型注釈など、型のための情報が生成されたJavaScriptから取り除かれること。実行する処理を消す意味ではない。
    firstSlideId: typescript-ch01-l03-s01
    relatedIds:
      - type-annotation
      - javascript
  - id: javascript
    term: JavaScript
    definition: ブラウザが実行する言語。この教材ではTypeScriptから生成されたJavaScriptを実行する。
    firstSlideId: typescript-ch01-l03-s01
    relatedIds:
      - type-erasure
  - id: throw
    term: throw
    definition: 例外を投げて、通常の処理を中断するJavaScriptの構文。
    firstSlideId: typescript-ch01-l03-s03
    relatedIds:
      - error
  - id: error
    term: Error
    definition: JavaScriptで失敗を知らせる内容を持つ標準のオブジェクト。new Errorで作り、throwで投げられる。
    firstSlideId: typescript-ch01-l03-s03
    relatedIds:
      - throw
  - id: union
    term: union
    definition: 複数の型のどれかを受け取る型。|でつなぎ、どの形か確認して使う。
    firstSlideId: typescript-ch03-l01-s01
    relatedIds:
      - literal
      - narrowing
  - id: literal
    term: literal
    definition: 文字列などの特定の値を、そのまま型として限定する書き方。
    firstSlideId: typescript-ch03-l01-s01
    relatedIds:
      - union
  - id: narrowing
    term: narrowing
    definition: 条件で値を確認し、その場所で扱える型を狭めること。
    firstSlideId: typescript-ch03-l01-s03
    relatedIds:
      - union
      - optional
  - id: parameter-annotation
    term: 引数の型注釈
    definition: 関数が受け取る引数の名前の後ろに型を書くこと。
    firstSlideId: typescript-ch03-l01-s02
    relatedIds:
      - type-annotation
  - id: optional
    term: optional
    definition: 項目を省略できること。項目名の後ろに?を書く。
    firstSlideId: typescript-ch03-l02-s01
    relatedIds:
      - undefined
      - interface
  - id: undefined
    term: undefined
    definition: ここでは省略された項目を読んだときの値。文字列の空文字とは異なる。
    firstSlideId: typescript-ch03-l02-s01
    relatedIds:
      - optional
  - id: string-length
    term: .length
    definition: 文字列の長さを読むプロパティ。この教材の「見る」は2、空文字は0。
    firstSlideId: typescript-ch03-l02-s02
    relatedIds:
      - string
      - property
  - id: return-annotation
    term: 戻り値の型注釈
    definition: 関数の括弧の後ろへ、returnする値の型を書くこと。
    firstSlideId: typescript-ch04-l01-s01
    relatedIds:
      - parameter-annotation
  - id: function-type
    term: 関数型
    definition: 関数が受け取る引数の型と、返す値の型を表す型。
    firstSlideId: typescript-ch04-l01-s02
    relatedIds:
      - callback
      - type-alias
  - id: callback
    term: callback
    definition: 別の関数へ渡し、その中から呼び出してもらう関数。
    firstSlideId: typescript-ch04-l01-s02
    relatedIds:
      - function-type
  - id: contextual-inference
    term: 文脈による推論
    definition: 関数型など周囲の型から、関数の引数の型を推論すること。
    firstSlideId: typescript-ch04-l01-s03
    relatedIds:
      - type-inference
      - function-type
  - id: arrow-function
    term: arrow関数
    definition: =>で処理を書くJavaScriptの関数式。型の=>とは役割が異なる。
    firstSlideId: typescript-ch04-l01-s03
    relatedIds:
      - function-type
  - id: generic
    term: generic
    definition: 型を受け取り、同じ型の関係を保って再利用する仕組み。
    firstSlideId: typescript-ch04-l02-s02
    relatedIds:
      - type-parameter
  - id: type-parameter
    term: 型パラメータ
    definition: genericの宣言で受け取る型に付ける名前。Tなどを使う。
    firstSlideId: typescript-ch04-l02-s02
    relatedIds:
      - generic
      - type-argument
  - id: type-argument
    term: 型引数
    definition: genericを呼び出すときに渡す型。値からの推論か明記で選ぶ。
    firstSlideId: typescript-ch04-l02-s03
    relatedIds:
      - type-parameter
  - id: readonly
    term: readonly
    definition: その型の参照からの書込みを型検査で制限する指定。実行時の凍結ではない。
    firstSlideId: typescript-ch04-l03-s01
    relatedIds:
      - readonly-array
  - id: readonly-array
    term: 読み取り専用配列
    definition: その型の参照から要素の代入やpushができない配列型。readonly number[]など。
    firstSlideId: typescript-ch04-l03-s01
    relatedIds:
      - readonly
  - id: array-spread
    term: 配列のspread
    definition: ...で元の配列の要素を新しい配列などへ展開する書き方。深い複写や凍結ではない。
    firstSlideId: typescript-ch04-l03-s02
    relatedIds:
      - readonly-array
  - id: array-join
    term: .join
    definition: 配列の要素を指定した区切り文字でつなぎ、文字列にする処理。
    firstSlideId: typescript-ch04-l03-s04
    relatedIds:
      - string
  - id: 'null'
    term: 'null'
    definition: 値がないことを示す値とその型。見つからないDOMや未知のデータで明示的に確認する。
    firstSlideId: typescript-ch05-l01-s01
    relatedIds: []
  - id: nullish-coalescing
    term: ??
    definition: 左がnullまたはundefinedのときだけ右を選ぶ演算子。空文字や0はそのまま使う。
    firstSlideId: typescript-ch05-l01-s02
    relatedIds: []
  - id: any
    term: any
    definition: 値の型を確認せずに項目を読めてしまう型。学習対象の数値注釈の代わりにしない。
    firstSlideId: typescript-ch01-l02-s03
    relatedIds: []
  - id: dom-query-selector
    term: querySelector
    definition: 指定した要素を探し、見つからないとnullを返すDOMの操作。
    firstSlideId: typescript-ch05-l01-s01
    relatedIds: []
  - id: dom-event
    term: Event
    definition: ブラウザの出来事を表す値の型。出来事とその対象を分けて確認する。
    firstSlideId: typescript-ch05-l01-s02
    relatedIds: []
  - id: event-current-target
    term: currentTarget
    definition: handlerを登録した対象。種類は未確認でnullもあり、handler実行中に確認して読む。
    firstSlideId: typescript-ch05-l01-s02
    relatedIds: []
  - id: html-button-element
    term: HTMLButtonElement
    definition: ブラウザのbutton要素の種類。instanceofで実際の種類を確認できる。
    firstSlideId: typescript-ch05-l01-s02
    relatedIds: []
  - id: instanceof
    term: instanceof
    definition: 値が指定した種類のインスタンスかを実際に調べ、型を絞る演算子。
    firstSlideId: typescript-ch05-l01-s02
    relatedIds: []
  - id: dom-dataset
    term: dataset
    definition: HTMLのdata-*属性を文字列で読む要素の項目。data-answerはdataset.answerで読む。
    firstSlideId: typescript-ch05-l01-s02
    relatedIds: []
  - id: unknown
    term: unknown
    definition: 形がまだ分からない値の型。何でも受け取れるが、読む前に実際の確認が必要。
    firstSlideId: typescript-ch05-l02-s01
    relatedIds: []
  - id: typeof-value
    term: typeof
    definition: 実行時の値の種類を文字列で調べる演算子。typeof nullはobjectになる。
    firstSlideId: typescript-ch05-l02-s02
    relatedIds: []
  - id: property-in
    term: in
    definition: その名前の項目が対象にあるかを実際に確認する演算子。項目の型までは保証しない。
    firstSlideId: typescript-ch05-l02-s02
    relatedIds: []
  - id: string-conversion
    term: String
    definition: 値を表示用の文字列へ変換する関数。元の項目の型確認とは別の処理。
    firstSlideId: typescript-ch05-l02-s03
    relatedIds: []
  - id: promise-result
    term: Promise
    definition: 後で成功や拒否が決まる結果。Promiseの型引数は成功時の結果型を表す。
    firstSlideId: typescript-ch05-l03-s01
    relatedIds: []
  - id: async-function
    term: async
    definition: 関数を非同期関数にし、Promiseを返す修飾子。
    firstSlideId: typescript-ch05-l03-s01
    relatedIds: []
  - id: await-result
    term: await
    definition: Promiseの結果を待つ式。拒否はtry内で受け止めるとcatchへ進む。
    firstSlideId: typescript-ch05-l03-s02
    relatedIds: []
  - id: try-catch
    term: try/catch
    definition: tryの処理で失敗した値をcatchで受け止める構文。型確認と失敗処理を分ける。
    firstSlideId: typescript-ch05-l03-s03
    relatedIds: []
  - id: void-expression
    term: void
    definition: 値を呼出し側へ返さない型や、式の戻り値をここでは使わない演算子。処理を停止する意味ではない。
    firstSlideId: typescript-ch05-l03-s02
    relatedIds: []
  - id: type-export
    term: 型を別Moduleへ公開する
    definition: export interfaceやexport typeは別Moduleが読む型名を公開する。import typeは型だけを読む。これらの型は実行JSへ残らず、実データの検証とは別。
    firstSlideId: typescript-ch06-l01-s03
    relatedIds: []
  - id: project-workspace
    term: 工程で共有するWorkspace
    definition: 同じ作品のSourceを複数Lessonへ引き継ぐ保存単位。TS作品とJS作品は別Course/Workspace。Resetは共有するTS作品の全SourceをStarterへ戻す。
    firstSlideId: typescript-ch06-l01-s04
    relatedIds: []
  - id: readonly-field
    term: readonlyの項目
    definition: この型の参照から代入を許さない項目。新しいObjectを返して次の状態へ渡せる。実行時freezeや、状態の値の正しさを自動で保証する処理ではない。
    firstSlideId: typescript-ch06-l02-s01
    relatedIds: []
  - id: quiz-state-function
    term: 状態を受け取り状態を返す関数
    definition: 型付きの現在状態と実入力から次の状態を作る関数。入力を変えず新しい状態を返し、型条件と実得点の両方を確認する。
    firstSlideId: typescript-ch06-l02-s01
    relatedIds: []
  - id: checked-array-elements
    term: 配列と各要素の確認
    definition: Array.isArrayは配列か調べる。各要素の型や必要な長さは別に確認する。要素をunknownとして取り出し、typeof等で絞ってから使う。
    firstSlideId: typescript-ch06-l03-s02
    relatedIds: []
