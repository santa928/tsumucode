schemaVersion: 1
entries:
  - id: python-comprehension
    term: 内包表記
    definition: "各要素を変換し、必要なら条件で残すものを選んで新しいListを作る記法。"
    firstSlideId: python-practice-ch01-l01-s01
    relatedIds: []
  - id: python-iterator
    term: Iterator
    definition: "nextで次の値を取り出す消費位置を持つobject。iterator自身のiterは同じobjectを返し、枯渇後に先頭へ戻らない。"
    firstSlideId: python-practice-ch01-l02-s01
    relatedIds: []
  - id: python-generator
    term: Generatorとyield
    definition: "yieldを含む関数の呼出しで作るiterator。作成では本体を進めず、nextでyieldまで進み、次のnextで続きを再開する。"
    firstSlideId: python-practice-ch01-l03-s01
    relatedIds: []
  - id: python-iterable
    term: Iterable
    definition: iterでiteratorを得られるもの。ListはIterableであり、そのListから新しい消費位置のiteratorを作れる。
    firstSlideId: python-practice-ch01-l02-s01
    relatedIds: [python-iterator]
