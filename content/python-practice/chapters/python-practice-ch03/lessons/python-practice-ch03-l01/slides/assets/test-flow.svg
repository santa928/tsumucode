<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="title description">
  <title id="title">処理と期待値を比較する</title>
  <desc id="description">実際の処理の結果と期待値をassertで比較します。捕捉したAssertionErrorによるTest失敗を、未捕捉の実行エラーや未採点とは区別します。</desc>
  <rect width="640" height="260" rx="16" fill="#ffffff" />
  <g fill="#0f172a" font-family="system-ui, sans-serif">
    <text x="24" y="36" font-size="28" font-weight="700">処理と期待値を比較する</text>
    <rect x="24" y="66" width="176" height="82" rx="12" fill="#f1f5f9" stroke="#475569" />
    <text x="112" y="116" text-anchor="middle" font-size="28" font-weight="600">実際の処理</text>
    <rect x="224" y="66" width="176" height="82" rx="12" fill="#f1f5f9" stroke="#475569" />
    <text x="312" y="116" text-anchor="middle" font-size="28" font-weight="600">assertで比較</text>
    <rect x="424" y="66" width="176" height="82" rx="12" fill="#f1f5f9" stroke="#475569" />
    <text x="512" y="116" text-anchor="middle" font-size="28" font-weight="600">Testの結果</text>
    <text x="24" y="192" font-size="26">未捕捉の実行エラー・未採点とは</text>
    <text x="24" y="230" font-size="26">別の結果として扱う</text>
  </g>
  <g fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 204 106 H 216 L 211 101 M 216 106 L 211 111" />
    <path d="M 404 106 H 416 L 411 101 M 416 106 L 411 111" />
  </g>
</svg>
