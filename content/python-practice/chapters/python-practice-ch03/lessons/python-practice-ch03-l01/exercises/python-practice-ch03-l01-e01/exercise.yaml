validationRules:
  - id: python-practice-ch03-l01-e01-r01
    label: 型・値検証・反復とwithを結び、固定Testを通す
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target:
      kind: python-source
      file: main.py
    assertion:
      kind: python-source-fact
      fact: data-project-tested
    feedback:
      target: main.pyとConsole
      expected: 型注釈と値検証を分け、正常/空/不正文字列/負値のTestを成功させます。
      nextAction: amountの注釈・負値の拒否・totalの集計を確認し、固定Testの期待値は維持してください。
    hintId: python-practice-ch03-l01-e01-h01
    relatedSlideId: python-practice-ch03-l01-s03
hints:
  - id: python-practice-ch03-l01-e01-h01
    level: 1
    title: 最初の手掛かり
    text: 注釈を直すだけでは値を拒否しません。値検証と集計も完成する必要があります。
    relatedSlideId: python-practice-ch03-l01-s01
  - id: python-practice-ch03-l01-e01-h02
    level: 2
    title: コードを組み立てる
    text: 負値はifとraiseで拒否し、read_recordsが返す各record.amountをsumへ渡します。
    relatedSlideId: python-practice-ch03-l01-s02
  - id: python-practice-ch03-l01-e01-h03
    level: 3
    title: 解答と理由
    text: amount:intとValueErrorのraiseを使い、sum(record.amount for record in read_records(text))で正常6・空0を得ます。不正文字列と負値はValueErrorになり固定Testが成功します。
    relatedSlideId: python-practice-ch03-l01-s03
relatedSlideIds:
