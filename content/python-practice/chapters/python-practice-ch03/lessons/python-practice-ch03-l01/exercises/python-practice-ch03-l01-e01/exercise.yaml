steps:
  - id: python-practice-ch03-l01-e01-step01
    file: main.py
    target: Recordのamountの型注釈をintへ直します。
    starterAnchor: 'amount: str'
    change: Recordのamountの型注釈をintへ直します。
    observe: 注釈を直しても、最初の文字列の観察はTrueのままです。
    requiresConceptIds: [python-type-hint, python-dataclass]
    validationRuleIds: [python-practice-ch03-l01-e01-r01]
  - id: python-practice-ch03-l01-e01-step02
    file: main.py
    target: 負値を明示的なValueErrorで拒否します。
    starterAnchor: pass
    change: 負値のpassをValueErrorをraiseする処理へ直します。
    observe: 不正文字列と負値はどちらもValueErrorで拒否します。
    requiresConceptIds: [python-data-validation]
    validationRuleIds: [python-practice-ch03-l01-e01-r01]
  - id: python-practice-ch03-l01-e01-step03
    file: main.py
    target: yieldしたRecordのamountをsumで集計します。
    starterAnchor: return 0
    change: totalの0をGeneratorの各amountをsumで集計する処理へ直します。
    observe: 正常は6、空は0で、固定Testが成功します。
    requiresConceptIds: [python-generator, python-context-manager, python-test]
    validationRuleIds: [python-practice-ch03-l01-e01-r01]
