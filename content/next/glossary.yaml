schemaVersion: 1
entries:
  - id: page
    term: page
    definition: URLの場所に対応する表示を返すファイル。
    firstSlideId: next-ch01-l01-s02
    relatedIds: []
  - id: route-handler
    term: Route Handler
    definition: HTTP requestを受け取りResponseを返す関数。
    firstSlideId: next-ch01-l01-s03
    relatedIds: []
  - id: query
    term: query
    definition: URLの?以降にある値。今回のmodeで応答を分岐する。
    firstSlideId: next-ch01-l01-s03
    relatedIds: []
  - id: layout
    term: layout
    definition: childrenへ内側のpageやlayoutを入れる共通表示。
    firstSlideId: next-ch02-l01-s01
    relatedIds: []
  - id: dynamic-route
    term: dynamic route
    definition: 角括弧のフォルダーがURLの値を受け取り、paramsへ渡す経路。
    firstSlideId: next-ch02-l01-s02
    relatedIds: []
  - id: document-navigation
    term: 文書遷移
    definition: リンク先の文書を取り直す移動。今回のaによる遷移。
    firstSlideId: next-ch02-l01-s03
    relatedIds: []
  - id: client-component
    term: Client Component
    definition: use clientで境界を宣言し、ブラウザの状態やイベントを扱うComponent。
    firstSlideId: next-ch02-l02-s02
    relatedIds: []
  - id: serializable-props
    term: 直列化できるprops
    definition: ServerからClientへ通信できる形で渡せる値。今回のnumberとstring。
    firstSlideId: next-ch02-l02-s03
    relatedIds: []
  - id: server-fetch
    term: Serverでのfetch
    definition: Server Componentからデータを取得して、応答を待つ処理。
    firstSlideId: next-ch03-l01-s01
    relatedIds: []
  - id: data-cache
    term: Data Cache
    definition: fetchの取得結果を保持する仕組み。page全体の描画とは別。
    firstSlideId: next-ch03-l01-s02
    relatedIds: []
  - id: revalidation
    term: 再検証
    definition: 期限後などに保持したデータを再取得して更新する処理。
    firstSlideId: next-ch03-l01-s03
    relatedIds: []
  - id: loading
    term: loading
    definition: pageが待機している間に表示する区間の案内。
    firstSlideId: next-ch03-l02-s01
    relatedIds: []
  - id: retry
    term: retry
    definition: 採用したNext版で、失敗したデータを再取得して再描画するerror境界の操作。
    firstSlideId: next-ch03-l02-s02
    relatedIds: []
  - id: not-found
    term: not-found
    definition: notFoundの呼出しに対応する対象なしの表示。取得失敗の表示とは分ける。
    firstSlideId: next-ch03-l02-s03
    relatedIds: []
  - id: server-validation
    term: Server validation
    definition: 実送信の入力をServer側で検査すること。Clientの入力制約だけに頼らない。
    firstSlideId: next-ch04-l01-s01
    relatedIds: []
  - id: post-response
    term: POSTの応答
    definition: Serverが返したHTTPと本文の状態。入力不正・一時失敗・保存を区別する。
    firstSlideId: next-ch04-l01-s02
    relatedIds: []
  - id: controlled-input
    term: controlled input
    definition: Reactのstateをvalueに渡す入力。失敗後の値の保持と、現在の値に対応した結果表示に使う。
    firstSlideId: next-ch04-l01-s03
    relatedIds: []
  - id: server-action
    term: Server Action
    definition: use serverで宣言するServer側の非同期処理。formDataを検証して状態を返す。
    firstSlideId: next-ch04-l02-s01
    relatedIds: []
  - id: action-state
    term: useActionState
    definition: Actionに対応するstate、formAction、pendingを返すReact hook。Actionの引数とは区別する。
    firstSlideId: next-ch04-l02-s02
    relatedIds: []
  - id: pending
    term: pending
    definition: Actionの送信が完了するまでの待機状態。入力と送信の無効化に使う。
    firstSlideId: next-ch04-l02-s03
    relatedIds: []
  - id: get-selection
    term: GETの選択
    definition: 表示条件をqueryへ載せる操作。保存のPOSTとは区別する。
    firstSlideId: next-ch05-l01-g02
    relatedIds: []
  - id: metadata
    term: metadata
    definition: Server page/layoutから文書のtitleやdescriptionを定義する情報。
    firstSlideId: next-ch05-l01-g03
    relatedIds: []
  - id: image
    term: Image
    definition: Nextの画像Component。本教材では固定SVGのaltと寸法を指定する。
    firstSlideId: next-ch05-l01-g03
    relatedIds: []
  - id: project-transfer
    term: 制作の転移
    definition: 既習の仕組みを別のBriefや条件に合わせて設計すること。
    firstSlideId: next-ch06-l01-g01
    relatedIds: []
  - id: source-export
    term: Source ZIP
    definition: 現在のSourceと起動用の包装を持ち出すZIP。下書き記録のJSONとは別。
    firstSlideId: next-ch06-l01-g03
    relatedIds: []
