    relatedSlideId: next-ch02-l01-s03
  - id: next-ch02-l01-e01-h02
    level: 2
    title: URLとファイルを対応させる
    text: trips/[slug]/page.tsxのparamsをawaitし、slugを表示します。海リンクはseaのURLへ向けます。
    relatedSlideId: next-ch02-l01-s03
  - id: next-ch02-l01-e01-h03
    level: 3
    title: 編集箇所を揃える
    text: layoutの見出しを旅行ノート、海hrefを./trips/sea、trip-slugの中身を{slug}にします。
    relatedSlideId: next-ch02-l01-s03
