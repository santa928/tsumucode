    target: Client境界の修復
    change: Counterのファイル先頭へuse clientを追加します。async/Node処理を持つpageはServerに残します。
    observe: 起動前に診断を予測し、実診断のファイルを確認します。復旧後、ブラウザでclickできることを確かめます。
