    change: Serverで用意する初期値を指定どおりに修正します。
    observe: Serverで用意した初期値2が、Counterの最初の表示へ渡ることを確認します。
  - id: next-ch02-l02-e01-step02
    file: app/Counter.tsx
    starterAnchor: setCount(count)
    requiresConceptIds:
      - next-client
    validationRuleIds:
      - next-ch02-l02-e01-r01
    target: Clientのclickによる増加
    change: Clientのclickによる増加を指定どおりに修正します。
    observe: click前2、1回目3、2回目4、再読込後2を比べます。
