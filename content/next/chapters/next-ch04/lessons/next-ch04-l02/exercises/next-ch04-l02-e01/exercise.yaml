steps:
  - id: next-ch04-l02-e01-step01
    file: app/actions.ts
    starterAnchor: "const input = typeof raw === 'string' ? raw : '';"
    target: Server validation
    change: Serverで前後の空白を除き、3〜40文字かを検証してから保存します。
    observe: 空白3文字の送信では検証エラーになり、保存しません。
    requiresConceptIds:
      - next-server-action
    validationRuleIds:
      - next-ch04-l02-e01-r01
  - id: next-ch04-l02-e01-step02
    file: app/note-form.tsx
    starterAnchor: disabled={false}
    target: 送信中の入力保持
    change: 送信中は入力もpendingで無効にします。
    observe: 送信中は入力と送信の両方が無効になり、失敗後は同じ入力が残ります。
    requiresConceptIds:
      - next-action-pending
    validationRuleIds:
      - next-ch04-l02-e01-r01
  - id: next-ch04-l02-e01-step03
    file: app/note-form.tsx
    starterAnchor: const visible = state;
    target: 現在のメモに対応する結果
    change: state.inputと現在のinputが一致するときだけ結果を表示し、異なるときはinitialStateを使います。
    observe: 保存後に別のメモへ入力を変えると、前の保存回数を新しい結果として表示しません。
    requiresConceptIds:
      - next-action-state
    validationRuleIds:
      - next-ch04-l02-e01-r01
