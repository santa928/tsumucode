validationRules:
  - id: next-ch04-l02-e01-r01
    label: 実POST・状態・保存履歴
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: next-page-http
    assertion:
      kind: next-page-http
      goal: server-action-validation
    feedback:
      target: Server Actionの結果と待機を扱う
      expected: Server Actionの返す状態を読み、入力保持とpendingを使って安全に再試行できる。
      nextAction: 検証・入力保持・pending・結果の対応を直し、保存・反映して再判定します。
    hintId: next-ch04-l02-e01-h01
    relatedSlideId: next-ch04-l02-s03
hints:
  - id: next-ch04-l02-e01-h01
    level: 1
    title: ClientとServerの検証を分ける
    text: requiredやminLengthだけでは、空白だけの入力をServerで拒否できません。Server側のrawとtrim後のinputを比べます。
    relatedSlideId: next-ch04-l02-s03
  - id: next-ch04-l02-e01-h02
    level: 2
    title: 待機中の同じ入力を守る
    text: buttonだけでなくinputもdisabled={pending}にします。失敗後もcontrolled inputの値を消しません。
    relatedSlideId: next-ch04-l02-s03
  - id: next-ch04-l02-e01-h03
    level: 3
    title: 返信と現在の値を対応させる
    text: 'state.input === input ? state :
      initialStateで、別のメモへの変更後は以前の保存結果を表示しません。Serverの文字列にはraw.trim()を使います。'
    relatedSlideId: next-ch04-l02-s03
