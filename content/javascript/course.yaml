phases:
  - id: javascript-p00-core
    title: JavaScript Core
    description: 画面を変える最初の1行から、値・条件分岐・Loop・Function・Scope・Closureへ順番に進みます。
    chapterSources:
      - chapters/javascript-ch00/chapter.yaml
      - chapters/javascript-ch01/chapter.yaml
      - chapters/javascript-ch02/chapter.yaml
      - chapters/javascript-ch03/chapter.yaml
  - id: javascript-p01-data
    title: JavaScript Data
    description: ArrayとObjectを組み替え、Moduleへ分け、Errorと診断からBugを直します。
    chapterSources:
      - chapters/javascript-ch04/chapter.yaml
      - chapters/javascript-ch05/chapter.yaml
      - chapters/javascript-ch06/chapter.yaml
  - id: javascript-p02-browser-app
    title: JavaScript Browser App
    description: DOM・Event・Form・Stateと、Promise/async/awaitの成功・失敗・読み込み状態を試せます。
    chapterSources:
      - chapters/javascript-ch07/chapter.yaml
      - chapters/javascript-ch08/chapter.yaml
      - chapters/javascript-ch09/chapter.yaml
      - chapters/javascript-ch10/chapter.yaml
      - chapters/javascript-ch11/chapter.yaml
  - id: javascript-p03-project
    title: JavaScript Project
    description: 学習クイズを段階制作し、別のクイズを自分で設計します。
    chapterSources:
      - chapters/javascript-ch12/chapter.yaml
      - chapters/javascript-ch13/chapter.yaml
