    level: 2
    title: 状態と表示をつなぐ
    text: 読み込み成功時にquestionIndexとscoreを0、answeredをfalseへ戻します。renderは新しい先頭を表示し、案内と結果を消します。失敗後は問題順が変わります。
    relatedSlideId: javascript-ch12-l05-s02
