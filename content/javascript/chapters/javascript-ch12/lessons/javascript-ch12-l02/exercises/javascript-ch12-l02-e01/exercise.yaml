hints:
  - id: javascript-ch12-l02-e01-h01
    level: 1
    title: 対象を見つける
    text: handleActionで押されたbuttonと今の問題を確認します。読み込み失敗後は問題順が変わるので、取得したArrayのcorrectを読みます。
    relatedSlideId: javascript-ch12-l02-s01
  - id: javascript-ch12-l02-e01-h02
    level: 2
    title: 状態と表示をつなぐ
    text: 回答前後をansweredで分け、buttonの文字と今のcorrectを比較します。再試行でも同じ処理で回答し、途中のnextでindexを進めます。
    relatedSlideId: javascript-ch12-l02-s02
  - id: javascript-ch12-l02-e01-h03
    level: 3
    title: 局所の例から考える
    text: '小例: if (answered) return; は二重回答を止めます。再試行で順が変わっても今のArrayから正解を読み、案内と選択肢を更新します。'
    relatedSlideId: javascript-ch12-l02-s03
