runtime:
  kind: javascript
  entryFile: main.js
  sourceType: module
  capabilityProfile: project
  primaryOutput: preview
interactionScenarios:
  - id: g2-answer
    label: 正誤と次問
    actions:
      - id: start
        kind: click
        selector: '#start'
      - id: one
        kind: click
        selector: '#choice-0'
      - id: repeat-answer
        kind: click
        selector: '#choice-1'
      - id: next
        kind: click
        selector: '#next'
      - id: two
        kind: click
        selector: '#choice-0'
    checkpoints:
      - id: loaded
        afterActionId: start
        expectations:
          - id: question
            kind: selector-text
            selector: '#question'
            equals: Webページの骨組みを作るのは？
          - id: choice-zero
            kind: selector-text
            selector: '#choice-0'
            equals: HTML
          - id: choice-one
            kind: selector-text
            selector: '#choice-1'
            equals: CSS
          - id: visible-question
            kind: selector-visible
            selector: '#question'
          - id: visible-choice-zero
            kind: selector-visible
            selector: '#choice-0'
          - id: visible-choice-one
            kind: selector-visible
            selector: '#choice-1'
      - id: first-answer
        afterActionId: one
        expectations:
          - id: answer
            kind: selector-text
            selector: '#feedback'
            equals: 正解です
          - id: locked
            kind: selector-exists
            selector: '#choice-0:disabled'
          - id: locked-one
            kind: selector-exists
            selector: '#choice-1:disabled'
      - id: repeat-answer
        afterActionId: repeat-answer
        expectations:
          - id: answer
            kind: selector-text
            selector: '#feedback'
            equals: 正解です
          - id: locked
            kind: selector-exists
            selector: '#choice-0:disabled'
          - id: locked-one
            kind: selector-exists
            selector: '#choice-1:disabled'
      - id: second-question
        afterActionId: next
        expectations:
          - id: question
            kind: selector-text
            selector: '#question'
            equals: 見た目を整えるのは？
          - id: visible-question
            kind: selector-visible
            selector: '#question'
          - id: visible-choice-zero
            kind: selector-visible
            selector: '#choice-0'
          - id: visible-choice-one
            kind: selector-visible
            selector: '#choice-1'
      - id: second-answer
        afterActionId: two
        expectations:
          - id: answer
            kind: selector-text
            selector: '#feedback'
            equals: 正解は CSS です
  - id: g2-before-answer
    label: 回答前に進めない
    actions:
      - id: start
        kind: click
        selector: '#start'
      - id: early
        kind: click
        selector: '#next'
    checkpoints:
      - id: loaded
        afterActionId: start
        expectations:
          - id: blocked
            kind: selector-exists
            selector: '#next:disabled'
      - id: stays
        afterActionId: early
        expectations:
          - id: question
            kind: selector-text
            selector: '#question'
            equals: Webページの骨組みを作るのは？
          - id: choice-zero
            kind: selector-text
            selector: '#choice-0'
            equals: HTML
          - id: choice-one
            kind: selector-text
            selector: '#choice-1'
            equals: CSS
          - id: visible-question
            kind: selector-visible
            selector: '#question'
          - id: visible-choice-zero
            kind: selector-visible
            selector: '#choice-0'
          - id: visible-choice-one
            kind: selector-visible
            selector: '#choice-1'
  - id: g2-recovery
    label: 読み込み失敗から再開
    actions:
      - id: failure
        kind: click
        selector: '#fail-load'
      - id: retry
        kind: click
        selector: '#start'
    checkpoints:
      - id: loading
        afterActionId: failure
        expectations:
          - id: message
            kind: selector-text
            selector: '#status'
            equals: 読み込み中...
          - id: blocked
            kind: selector-exists
            selector: '#start:disabled'
      - id: failed
        afterActionId: failure
        expectations:
          - id: message
            kind: selector-text
            selector: '#status'
            equals: 読み込めませんでした。開始でやり直せます
          - id: enabled
            kind: selector-exists
            selector: '#start:enabled'
      - id: recovered
        afterActionId: retry
        expectations:
          - id: question
            kind: selector-text
            selector: '#question'
            equals: 見た目を整えるのは？
          - id: choice-zero
            kind: selector-text
            selector: '#choice-0'
            equals: JavaScript
          - id: choice-one
            kind: selector-text
            selector: '#choice-1'
            equals: CSS
          - id: visible-question
            kind: selector-visible
            selector: '#question'
          - id: visible-choice-zero
            kind: selector-visible
            selector: '#choice-0'
          - id: visible-choice-one
            kind: selector-visible
            selector: '#choice-1'
