    level: 1
    title: 対象を見つける
    text: renderで今の問題がある場合と、全問の後を分けます。失敗後の再試行は順が変わるので取得データを使います。
    relatedSlideId: javascript-ch12-l04-s01
  - id: javascript-ch12-l04-e01-h02
    level: 2
    title: 状態と表示をつなぐ
    text: 最後の問題はlength - 1です。最後のnextでindexがlengthへ進むと今の問題はundefinedです。プロパティを読まず結果へ分岐します。再試行の順もArrayから読みます。
    relatedSlideId: javascript-ch12-l04-s02
