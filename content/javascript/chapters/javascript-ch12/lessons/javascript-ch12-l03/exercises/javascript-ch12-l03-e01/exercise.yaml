runtime:
  kind: javascript
  entryFile: main.js
  sourceType: module
  capabilityProfile: project
  primaryOutput: preview
interactionScenarios:
  - id: g3-mixed
    label: 正解だけ加点
    actions:
      - id: start
        kind: click
        selector: '#start'
      - id: one
        kind: click
        selector: '#choice-0'
      - id: repeat-answer
        kind: click
        selector: '#choice-1'
      - id: next
        kind: click
        selector: '#next'
      - id: two
        kind: click
        selector: '#choice-0'
    checkpoints:
      - id: loaded
        afterActionId: start
        expectations:
          - id: question
            kind: selector-text
            selector: '#question'
            equals: Webページの骨組みを作るのは？
          - id: choice-zero
            kind: selector-text
            selector: '#choice-0'
            equals: HTML
          - id: choice-one
            kind: selector-text
            selector: '#choice-1'
            equals: CSS
          - id: visible-question
            kind: selector-visible
            selector: '#question'
          - id: visible-choice-zero
            kind: selector-visible
            selector: '#choice-0'
          - id: visible-choice-one
            kind: selector-visible
            selector: '#choice-1'
      - id: first-answer
        afterActionId: one
        expectations:
          - id: answer
            kind: selector-text
            selector: '#feedback'
            equals: 正解です
          - id: locked
            kind: selector-exists
            selector: '#choice-0:disabled'
          - id: score
            kind: selector-text
            selector: '#score'
            equals: '得点: 1'
          - id: locked-one
            kind: selector-exists
            selector: '#choice-1:disabled'
      - id: repeat-answer
        afterActionId: repeat-answer
        expectations:
          - id: answer
            kind: selector-text
            selector: '#feedback'
            equals: 正解です
          - id: locked
            kind: selector-exists
            selector: '#choice-0:disabled'
          - id: score
            kind: selector-text
            selector: '#score'
            equals: '得点: 1'
          - id: locked-one
            kind: selector-exists
            selector: '#choice-1:disabled'
      - id: second-question
        afterActionId: next
        expectations:
          - id: question
            kind: selector-text
            selector: '#question'
            equals: 見た目を整えるのは？
          - id: visible-question
            kind: selector-visible
            selector: '#question'
          - id: visible-choice-zero
            kind: selector-visible
            selector: '#choice-0'
          - id: visible-choice-one
            kind: selector-visible
            selector: '#choice-1'
      - id: second-answer
        afterActionId: two
        expectations:
          - id: answer
            kind: selector-text
            selector: '#feedback'
            equals: 正解は CSS です
          - id: score
            kind: selector-text
            selector: '#score'
            equals: '得点: 1'
  - id: g3-wrong
    label: 誤答は0点
    actions:
      - id: start
        kind: click
        selector: '#start'
      - id: one
        kind: click
        selector: '#choice-1'
      - id: repeat-answer
        kind: click
        selector: '#choice-1'
      - id: next
        kind: click
        selector: '#next'
      - id: two
        kind: click
        selector: '#choice-0'
    checkpoints:
      - id: loaded
        afterActionId: start
        expectations:
          - id: question
            kind: selector-text
            selector: '#question'
            equals: Webページの骨組みを作るのは？
          - id: choice-zero
            kind: selector-text
            selector: '#choice-0'
            equals: HTML
          - id: choice-one
