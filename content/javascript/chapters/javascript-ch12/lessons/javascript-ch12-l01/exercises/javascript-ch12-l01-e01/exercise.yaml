runtime:
  kind: javascript
  entryFile: main.js
  sourceType: module
  capabilityProfile: project
  primaryOutput: preview
interactionScenarios:
  - id: g1-show
    label: 最初の問題を読む
    actions:
      - id: start
        kind: click
        selector: '#start'
    checkpoints:
      - id: loaded
        afterActionId: start
        expectations:
          - id: question
            kind: selector-text
            selector: '#question'
            equals: Webページの骨組みを作るのは？
          - id: choice-zero
            kind: selector-text
            selector: '#choice-0'
            equals: HTML
          - id: choice-one
            kind: selector-text
            selector: '#choice-1'
            equals: CSS
          - id: visible-question
            kind: selector-visible
            selector: '#question'
          - id: visible-choice-zero
            kind: selector-visible
            selector: '#choice-0'
          - id: visible-choice-one
            kind: selector-visible
            selector: '#choice-1'
  - id: g1-recovery
    label: 読み込み失敗から再開
    actions:
      - id: failure
        kind: click
        selector: '#fail-load'
      - id: retry
        kind: click
        selector: '#start'
    checkpoints:
      - id: loading
        afterActionId: failure
        expectations:
          - id: message
            kind: selector-text
            selector: '#status'
            equals: 読み込み中...
          - id: blocked
            kind: selector-exists
            selector: '#start:disabled'
      - id: failed
        afterActionId: failure
        expectations:
          - id: message
            kind: selector-text
            selector: '#status'
            equals: 読み込めませんでした。開始でやり直せます
          - id: enabled
            kind: selector-exists
            selector: '#start:enabled'
      - id: recovered
        afterActionId: retry
        expectations:
          - id: question
            kind: selector-text
            selector: '#question'
            equals: 見た目を整えるのは？
          - id: choice-zero
            kind: selector-text
            selector: '#choice-0'
            equals: JavaScript
          - id: choice-one
            kind: selector-text
            selector: '#choice-1'
            equals: CSS
          - id: visible-question
            kind: selector-visible
            selector: '#question'
          - id: visible-choice-zero
            kind: selector-visible
            selector: '#choice-0'
          - id: visible-choice-one
            kind: selector-visible
            selector: '#choice-1'
