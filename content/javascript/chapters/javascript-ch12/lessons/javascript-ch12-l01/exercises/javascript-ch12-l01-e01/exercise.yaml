hints:
  - id: javascript-ch12-l01-e01-h01
    level: 1
    title: 対象を見つける
    text: main.jsのrenderで今の問題を取り出します。再試行で順が変わるため、初回の文章を固定しません。
    relatedSlideId: javascript-ch12-l01-s01
  - id: javascript-ch12-l01-e01-h02
    level: 2
    title: 状態と表示をつなぐ
    text: questions[questionIndex]のtextとchoicesを表示します。失敗後の再試行は見た目の問題が先頭です。取得したArrayを使いましょう。
    relatedSlideId: javascript-ch12-l01-s02
  - id: javascript-ch12-l01-e01-h03
    level: 3
    title: 局所の例から考える
    text: '小例: item.textContent = question.text;。再試行で別の問題が来ても同じ処理で表示できます。選択肢も取得したchoicesの同じ位置を読みます。'
    relatedSlideId: javascript-ch12-l01-s03
