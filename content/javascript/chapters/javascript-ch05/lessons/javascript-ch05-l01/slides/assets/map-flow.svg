<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">mapによる問題ラベルの変換</title>
  <desc id="desc">3つの問題文がmapを通過し、問題という接頭辞を持つ3つのラベルへ変わる</desc>
  <rect width="960" height="260" rx="28" fill="#fffaf0"/>
  <g font-family="system-ui, sans-serif" font-size="25" fill="#173f35" text-anchor="middle">
    <rect x="36" y="42" width="250" height="176" rx="20" fill="#ffffff" stroke="#1d6b55" stroke-width="4"/>
    <text x="161" y="90" font-weight="700">questions</text>
    <text x="161" y="132">HTMLとは？</text><text x="161" y="168">CSSとは？</text><text x="161" y="204">JavaScriptとは？</text>
    <path d="M310 130h150" stroke="#1d6b55" stroke-width="8" stroke-linecap="round"/>
    <path d="m442 110 24 20-24 20" fill="none" stroke="#1d6b55" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="350" y="70" width="82" height="44" rx="22" fill="#f2c94c"/><text x="391" y="100" font-size="22" font-weight="700">map</text>
    <rect x="500" y="42" width="424" height="176" rx="20" fill="#ffffff" stroke="#1d6b55" stroke-width="4"/>
    <text x="712" y="90" font-weight="700">labels</text>
    <text x="712" y="132">問題: HTMLとは？</text><text x="712" y="168">問題: CSSとは？</text><text x="712" y="204">問題: JavaScriptとは？</text>
  </g>
</svg>
