    label: mapで3問を変換する
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: javascript-source, file: script.js }
    assertion:
      kind: javascript-source-fact
      fact: { kind: collection-transform, method: map, callbackParameterCount: 1 }
    feedback:
      target: map callback
      expected: 1つのquestionを受け取るmap
      nextAction: mapとcallbackの形は残し、returnする値を変更します。
    hintId: javascript-ch05-l01-e01-h02
    relatedSlideId: javascript-ch05-l01-s02
  - id: javascript-ch05-l01-e01-r02
    groupId: javascript-ch05-l01-e01-result
    label: 3つの問題ラベルを順番に表示する
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: javascript-console }
    assertion:
      kind: javascript-console
      operator: equals
      expected:
        - { level: log, text: '問題: HTMLとは？' }
        - { level: log, text: '問題: CSSとは？' }
        - { level: log, text: '問題: JavaScriptとは？' }
    feedback:
      target: Console
      expected: 問題という接頭辞を持つ3行
      nextAction: 'returnで問題: とquestionを組み合わせます。'
    hintId: javascript-ch05-l01-e01-h03
    relatedSlideId: javascript-ch05-l01-s04
hints:
