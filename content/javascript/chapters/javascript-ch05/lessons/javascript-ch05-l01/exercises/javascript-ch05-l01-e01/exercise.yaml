    level: 1
    title: 変更するのはreturnの右側だけ
    text: questions、map、for...of、console.logは完成しています。
    relatedSlideId: javascript-ch05-l01-s04
  - id: javascript-ch05-l01-e01-h02
    level: 2
    title: 現在の問題文を埋め込む
    text: Template literalの${question}へ現在の問題文が入ります。
    relatedSlideId: javascript-ch05-l01-s02
  - id: javascript-ch05-l01-e01-h03
    level: 3
    title: returnを完成させる
    text: 'return `問題: ${question}`; と書きます。'
    relatedSlideId: javascript-ch05-l01-s04
