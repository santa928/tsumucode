validationRules:
  - id: javascript-ch05-l04-e01-r01
    groupId: javascript-ch05-l04-e01-result
    label: mapで新しいArrayを作る
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: javascript-source, file: script.js }
    assertion:
      kind: javascript-source-fact
      fact: { kind: collection-transform, method: map, callbackParameterCount: 1 }
    feedback:
      target: map callback
      expected: questionを1つ受け取るmap
      nextAction: mapの形は残し、新しいObjectのansweredだけを変更します。
    hintId: javascript-ch05-l04-e01-h02
    relatedSlideId: javascript-ch05-l04-s02
  - id: javascript-ch05-l04-e01-r02
    groupId: javascript-ch05-l04-e01-result
    label: mapとObject spreadでimmutable updateする
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: javascript-source, file: script.js }
    assertion:
      kind: javascript-source-fact
      fact: { kind: immutable-update, updateKind: array-map }
    feedback:
      target: answeredQuestions
      expected: mapの結果を受け取る新しいArray
      nextAction: questions.mapの代入を残します。
    hintId: javascript-ch05-l04-e01-h02
    relatedSlideId: javascript-ch05-l04-s02
  - id: javascript-ch05-l04-e01-r03
    groupId: javascript-ch05-l04-e01-result
    label: Object spreadでpropertyを引き継ぐ
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: javascript-source, file: script.js }
    assertion:
      kind: javascript-source-fact
      fact: { kind: immutable-update, updateKind: object-spread }
    feedback:
      target: 新しいQuestion Object
      expected: ...questionで元propertyを引き継ぐObject
      nextAction: spreadは残し、後ろのansweredをtrueへ変更します。
    hintId: javascript-ch05-l04-e01-h02
    relatedSlideId: javascript-ch05-l04-s03
  - id: javascript-ch05-l04-e01-r04
    groupId: javascript-ch05-l04-e01-result
    label: 元はfalse、新しいArrayはtrueと表示する
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: javascript-console }
    assertion:
      kind: javascript-console
      operator: equals
      expected:
        - { level: log, text: 'false' }
        - { level: log, text: 'true' }
    feedback:
      target: Console
      expected: false、その次にtrue
      nextAction: 元へ代入せず、新しいObjectのansweredだけをtrueにします。
    hintId: javascript-ch05-l04-e01-h03
    relatedSlideId: javascript-ch05-l04-s04
hints:
  - id: javascript-ch05-l04-e01-h01
    level: 1
    title: 変更するのはboolean 1つだけ
    text: questions、map、spread、2つのconsole.logは完成しています。
    relatedSlideId: javascript-ch05-l04-s04
  - id: javascript-ch05-l04-e01-h02
    level: 2
    title: 新しいObjectだけを回答済みにする
    text: ...questionの後ろにあるansweredへ、回答済みを示すbooleanを書きます。
    relatedSlideId: javascript-ch05-l04-s03
  - id: javascript-ch05-l04-e01-h03
    level: 3
    title: answeredを完成させる
    text: 'answered: true, と書きます。'
    relatedSlideId: javascript-ch05-l04-s04
relatedSlideIds: [javascript-ch05-l04-s03, javascript-ch05-l04-s04]
