    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: selector
      selector: '#note'
    assertion:
      kind: text
      operator: equals
      expected: 本を大切に
    feedback:
      target: script.jsとPreview
      expected: メモの文字を保つ
      nextAction: 変更がcallbackの外で実行されていないか確認します。
    hintId: javascript-ch08-l01-e01-h02
    relatedSlideId: javascript-ch08-l01-s04
  - id: javascript-ch08-l01-e01-r03
    label: 要素を取得して使う
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: javascript-source
      file: script.js
    assertion:
      kind: javascript-source-fact
      fact:
        kind: call
        callee: document.querySelector
    feedback:
      target: script.js
      expected: 操作先と表示先の要素を使う
      nextAction: querySelectorで登録先と書換先を取得します。
    hintId: javascript-ch08-l01-e01-h01
    relatedSlideId: javascript-ch08-l01-s03
hints:
  - id: javascript-ch08-l01-e01-h01
    level: 1
    title: いつ変わるか
    text: Preview更新直後とボタンを押した後を比べます。今の表示変更はクリックを待っているでしょうか。
    relatedSlideId: javascript-ch08-l01-s02
  - id: javascript-ch08-l01-e01-h02
    level: 2
    title: 登録するFunctionを作る
    text: button.addEventListenerの第1引数はclick、第2引数は処理するFunctionです。文字変更をその中へ置きます。
    relatedSlideId: javascript-ch08-l01-s03
  - id: javascript-ch08-l01-e01-h03
    level: 3
    title: 変更をhandlerへ移す
    text: button.addEventListener('click', () => { status.textContent = '本を開きました';
      });と登録します。外にある即時の文字変更は残しません。
    relatedSlideId: javascript-ch08-l01-s04
