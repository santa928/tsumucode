    feedback:
      target: script.jsとPreview
      expected: 操作前は待機している
      nextAction: 変更がcallbackの外で実行されていないか確認します。
    hintId: javascript-ch08-l01-e01-h02
    relatedSlideId: javascript-ch08-l01-s04
  - id: javascript-ch08-l01-e01-r02
