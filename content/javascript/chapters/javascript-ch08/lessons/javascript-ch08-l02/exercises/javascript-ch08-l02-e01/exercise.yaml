    starterAnchor: "  status.textContent = '読みたい本: ' + firstValue;"
    change: handlerが呼ばれるたびに現在の入力文字を読んで表示する
    observe: 入力を変えても消しても、表示が現在の題名に一致する
    requiresConceptIds:
      - input-repeated-update
    validationRuleIds:
      - javascript-ch08-l02-e01-r01
      - javascript-ch08-l02-e01-r02
      - javascript-ch08-l02-e01-r03
