validationRules:
  - id: javascript-ch08-l02-e01-r01
    label: 操作前は待機している
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: selector
      selector: '#status'
    assertion:
      kind: text
      operator: equals
      expected: 入力待ち
    feedback:
      target: script.jsとPreview
      expected: 操作前は待機している
      nextAction: 最初は待機し、入力したときに表示を変えます。
    hintId: javascript-ch08-l02-e01-h02
    relatedSlideId: javascript-ch08-l02-s04
  - id: javascript-ch08-l02-e01-r02
    label: メモの文字を保つ
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: selector
      selector: '#note'
    assertion:
      kind: text
      operator: equals
      expected: メモを残そう
    feedback:
      target: script.jsとPreview
      expected: メモの文字を保つ
      nextAction: 入力内容を表示する要素と、残すメモを分けます。
    hintId: javascript-ch08-l02-e01-h02
    relatedSlideId: javascript-ch08-l02-s04
  - id: javascript-ch08-l02-e01-r03
    label: 要素を取得して使う
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: javascript-source
      file: script.js
    assertion:
      kind: javascript-source-fact
      fact:
        kind: call
        callee: document.querySelector
    feedback:
      target: script.js
      expected: 操作先と表示先の要素を使う
      nextAction: querySelectorで入力欄と表示先を取得します。
    hintId: javascript-ch08-l02-e01-h01
    relatedSlideId: javascript-ch08-l02-s03
hints:
  - id: javascript-ch08-l02-e01-h01
    level: 1
    title: 値を読んだのはいつ
    text: 入力欄を変えた後も、firstValueは読み込み直後の文字列です。今のコードは入力のたびに値を読み直しているでしょうか。
    relatedSlideId: javascript-ch08-l02-s02
  - id: javascript-ch08-l02-e01-h02
    level: 2
    title: 現在の入力欄から読む
    text: inputのhandler内でvalueを読みます。引数でEventを受け取るならcurrentTargetが登録先の入力欄です。
    relatedSlideId: javascript-ch08-l02-s03
  - id: javascript-ch08-l02-e01-h03
    level: 3
    title: handler内で値をつなぐ
    text: "handlerの引数をeventとすると、status.textContent = '読みたい本: ' +
      event.currentTarget.value;で現在の題名をつなげられます。使わなくなったfirstValueは取り除きます。"
    relatedSlideId: javascript-ch08-l02-s04
relatedSlideIds:
  - javascript-ch08-l02-s01
  - javascript-ch08-l02-s02
  - javascript-ch08-l02-s03
  - javascript-ch08-l02-s04
