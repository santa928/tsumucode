<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-labelledby="title"><title id="title">入力のたびに現在の値を読む</title><rect width="640" height="200" rx="16" fill="#f4f8f5"/><g font-family="sans-serif" font-size="18" fill="#19352b"><rect x="16" y="32" width="154" height="108" rx="10" fill="#fff" stroke="#46765f"/><text x="38" y="70">入力が変わる</text><text x="40" y="108">春 → 夏 → 空</text><path d="M178 88h36m194 0h36" stroke="#46765f" stroke-width="3"/><rect x="222" y="32" width="178" height="108" rx="10" fill="#fff" stroke="#46765f"/><text x="248" y="70">inputのhandler</text><text x="248" y="108">今のvalueを読む</text><rect x="452" y="32" width="170" height="108" rx="10" fill="#e3f5eb"/><text x="480" y="70">表示を更新</text><text x="480" y="108">毎回書き換える</text><text x="24" y="178">一度だけでなく、変わるたびに読む</text></g></svg>
