    relatedSlideId: javascript-ch08-l03-s04
  - id: javascript-ch08-l03-e01-r03
    label: 要素を取得して使う
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: javascript-source
      file: script.js
    assertion:
      kind: javascript-source-fact
      fact:
        kind: call
        callee: document.querySelector
    feedback:
      target: script.js
      expected: 操作先と表示先の要素を使う
      nextAction: querySelectorで入力欄と表示先を取得します。
    hintId: javascript-ch08-l03-e01-h01
    relatedSlideId: javascript-ch08-l03-s03
hints:
  - id: javascript-ch08-l03-e01-h01
    level: 1
    title: 画面が残る理由を分ける
    text: Previewには誤送信を止める安全装置があります。自分のhandlerでは、標準動作を止める処理を実行しているでしょうか。
    relatedSlideId: javascript-ch08-l03-s04
  - id: javascript-ch08-l03-e01-h02
    level: 2
    title: 送信のEventを使う
    text: script.jsのsubmitのhandlerへ注目します。引数eventが受け取ったEventには、標準動作を取り消すメソッドがあります。
    relatedSlideId: javascript-ch08-l03-s03
  - id: javascript-ch08-l03-e01-h03
    level: 3
    title: 表示の前に標準動作を止める
    text: handler内でevent.preventDefault();を実行します。その後もstatus.textContentの行は実行され、field.valueを表示できます。
    relatedSlideId: javascript-ch08-l03-s03
