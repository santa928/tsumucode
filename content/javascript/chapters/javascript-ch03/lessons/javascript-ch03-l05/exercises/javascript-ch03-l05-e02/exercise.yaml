    hintId: javascript-ch03-l05-e02-h02
    relatedSlideId: javascript-ch03-l05-s03
  - id: javascript-ch03-l05-e02-r02
    groupId: javascript-ch03-l05-e02-check-2
    label: 内側の関数が外側のscoreを覚える
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: javascript-source
      file: script.js
    assertion:
      kind: javascript-source-fact
      fact:
        kind: closure
        capturedName: score
    feedback:
      target: script.jsの得点係
      expected: 内側の関数が外側のscoreを覚える
      nextAction: 毎回作り直す値ではなく、前回の値を使い続ける場所を確認します。
    hintId: javascript-ch03-l05-e02-h02
    relatedSlideId: javascript-ch03-l05-s03
  - id: javascript-ch03-l05-e02-r03
    groupId: javascript-ch03-l05-e02-update
    label: scoreを加算して更新する
    required: true
    group: any
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: javascript-source
      file: script.js
    assertion:
      kind: javascript-source-fact
      fact:
        kind: assignment
        name: score
        operator: +=
    feedback:
      target: script.jsの得点係
      expected: scoreを加算して更新する
      nextAction: 加える前のscoreと増分を使って更新します。+=でも、=と+でも構いません。
    hintId: javascript-ch03-l05-e02-h02
    relatedSlideId: javascript-ch03-l05-s03
  - id: javascript-ch03-l05-e02-r04
    groupId: javascript-ch03-l05-e02-update
    label: scoreを加算して代入する
    required: true
    group: any
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: javascript-source
      file: script.js
    assertion:
      kind: javascript-source-fact
      fact:
        kind: assignment
        name: score
        operator: =
    feedback:
      target: script.jsの得点係
      expected: scoreを加算して代入する
      nextAction: 加える前のscoreと増分を使って更新します。+=でも、=と+でも構いません。
    hintId: javascript-ch03-l05-e02-h02
    relatedSlideId: javascript-ch03-l05-s03
  - id: javascript-ch03-l05-e02-r05
    groupId: javascript-ch03-l05-e02-check-5
    label: 用意したcreateScoreCounterの呼び出しを残す
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: javascript-source
      file: script.js
    assertion:
      kind: javascript-source-fact
      fact:
        kind: call
        callee: createScoreCounter
      minimumCount: 1
    feedback:
      target: script.jsの得点係
      expected: 用意したcreateScoreCounterの呼び出しを残す
      nextAction: 末尾の得点係を作る行を残して動作を比べます。
    hintId: javascript-ch03-l05-e02-h02
    relatedSlideId: javascript-ch03-l05-s03
  - id: javascript-ch03-l05-e02-r06
    groupId: javascript-ch03-l05-e02-check-6
    label: 同じaddScoreを3回呼んで値を得る
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: javascript-source
      file: script.js
    assertion:
      kind: javascript-source-fact
      fact:
        kind: call
        callee: addScore
      minimumCount: 3
    feedback:
      target: script.jsの得点係
      expected: 同じaddScoreを3回呼んで値を得る
      nextAction: Consoleへ数値を直接書かず、用意した3回のaddScore()を残します。
    hintId: javascript-ch03-l05-e02-h02
    relatedSlideId: javascript-ch03-l05-s03
  - id: javascript-ch03-l05-e02-r07
    groupId: javascript-ch03-l05-e02-check-7
    label: 10、20、30の順に表示する
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: javascript-console
    assertion:
      kind: javascript-console
      operator: equals
      expected:
        - level: log
          text: '10'
        - level: log
          text: '20'
        - level: log
          text: '30'
    feedback:
      target: Console
      expected: 10、20、30の順に表示する
      nextAction: 1回目の10を覚え、次に10を加えられるか確かめます。
    hintId: javascript-ch03-l05-e02-h02
    relatedSlideId: javascript-ch03-l05-s03
