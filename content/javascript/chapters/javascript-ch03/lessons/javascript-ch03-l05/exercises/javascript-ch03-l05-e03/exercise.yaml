validationRules:
  - id: javascript-ch03-l05-e03-r01
    groupId: javascript-ch03-l05-e03-check-1
    label: scoreを得点係を作る関数の中に置く
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: javascript-source
      file: script.js
    assertion:
      kind: javascript-source-fact
      fact:
        kind: binding
        name: score
        declarationKind: let
        scopeDepth: 1
    feedback:
      target: script.jsの得点係
      expected: scoreを得点係を作る関数の中に置く
      nextAction: 変数を用意するタイミングと、得点係を呼ぶタイミングを分けて考えます。
    hintId: javascript-ch03-l05-e03-h02
    relatedSlideId: javascript-ch03-l05-s03
  - id: javascript-ch03-l05-e03-r02
    groupId: javascript-ch03-l05-e03-check-2
    label: 内側の関数が外側のscoreを覚える
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: javascript-source
      file: script.js
    assertion:
      kind: javascript-source-fact
      fact:
        kind: closure
        capturedName: score
    feedback:
      target: script.jsの得点係
      expected: 内側の関数が外側のscoreを覚える
      nextAction: 毎回作り直す値ではなく、前回の値を使い続ける場所を確認します。
    hintId: javascript-ch03-l05-e03-h02
    relatedSlideId: javascript-ch03-l05-s03
  - id: javascript-ch03-l05-e03-r03
    groupId: javascript-ch03-l05-e03-update
    label: scoreを加算して更新する
    required: true
    group: any
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: javascript-source
      file: script.js
    assertion:
      kind: javascript-source-fact
      fact:
        kind: assignment
        name: score
        operator: +=
    feedback:
      target: script.jsの得点係
      expected: scoreを加算して更新する
      nextAction: 加える前のscoreと増分を使って更新します。+=でも、=と+でも構いません。
    hintId: javascript-ch03-l05-e03-h02
    relatedSlideId: javascript-ch03-l05-s03
  - id: javascript-ch03-l05-e03-r04
    groupId: javascript-ch03-l05-e03-update
    label: scoreを加算して代入する
    required: true
    group: any
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: javascript-source
      file: script.js
    assertion:
      kind: javascript-source-fact
      fact:
        kind: assignment
        name: score
        operator: =
    feedback:
      target: script.jsの得点係
      expected: scoreを加算して代入する
      nextAction: 加える前のscoreと増分を使って更新します。+=でも、=と+でも構いません。
    hintId: javascript-ch03-l05-e03-h02
    relatedSlideId: javascript-ch03-l05-s03
  - id: javascript-ch03-l05-e03-r05
    groupId: javascript-ch03-l05-e03-check-5
    label: 得点係が受け取ったstepを覚える
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: javascript-source
      file: script.js
    assertion:
