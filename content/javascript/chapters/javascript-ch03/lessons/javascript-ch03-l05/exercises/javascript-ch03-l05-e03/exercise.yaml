    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: javascript-source
      file: script.js
    assertion:
      kind: javascript-source-fact
      fact:
        kind: call
        callee: createScoreCounter
      minimumCount: 2
    feedback:
      target: script.jsの得点係
      expected: 用意したcreateScoreCounterの呼び出しを残す
      nextAction: 末尾の得点係を作る行を残して動作を比べます。
    hintId: javascript-ch03-l05-e03-h02
    relatedSlideId: javascript-ch03-l05-s03
  - id: javascript-ch03-l05-e03-r07
    groupId: javascript-ch03-l05-e03-check-7
    label: aを3回呼んで値を得る
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: javascript-source
      file: script.js
    assertion:
      kind: javascript-source-fact
      fact:
        kind: call
        callee: a
      minimumCount: 3
    feedback:
      target: script.jsの得点係
      expected: aを3回呼んで値を得る
      nextAction: Consoleへ数値を直接書かず、用意したa()の呼び出しを残します。
    hintId: javascript-ch03-l05-e03-h02
    relatedSlideId: javascript-ch03-l05-s03
  - id: javascript-ch03-l05-e03-r08
    groupId: javascript-ch03-l05-e03-check-8
    label: bを2回呼んで値を得る
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: javascript-source
      file: script.js
    assertion:
      kind: javascript-source-fact
      fact:
        kind: call
        callee: b
      minimumCount: 2
    feedback:
      target: script.jsの得点係
      expected: bを2回呼んで値を得る
      nextAction: Consoleへ数値を直接書かず、用意したb()の呼び出しを残します。
    hintId: javascript-ch03-l05-e03-h02
    relatedSlideId: javascript-ch03-l05-s03
  - id: javascript-ch03-l05-e03-r09
    groupId: javascript-ch03-l05-e03-check-9
    label: 2、5、4、10、6の順に表示する
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: javascript-console
    assertion:
      kind: javascript-console
      operator: equals
      expected:
        - level: log
          text: '2'
        - level: log
          text: '5'
        - level: log
          text: '4'
        - level: log
          text: '10'
        - level: log
          text: '6'
    feedback:
      target: Console
      expected: 2、5、4、10、6の順に表示する
      nextAction: 呼ぶ係ごとに、前の得点とその係の増分を確かめます。
    hintId: javascript-ch03-l05-e03-h02
    relatedSlideId: javascript-ch03-l05-s03
hints:
  - id: javascript-ch03-l05-e03-h01
    level: 1
    title: 係ごとの増分を比べる
    text: aを作るときは2、bを作るときは5を渡しています。いまはどちらも10ずつ増える理由を調べます。
    relatedSlideId: javascript-ch03-l05-s03
  - id: javascript-ch03-l05-e03-h02
    level: 2
    title: 外側で受け取った値を見る
    text: stepはcreateScoreCounterが受け取る値です。内側の関数でも使えます。
    relatedSlideId: javascript-ch03-l05-s02
  - id: javascript-ch03-l05-e03-h03
    level: 3
    title: 更新する量を変える
    text: score += 10;の10をstepへ変えます。score = score + step;でも同じ更新ができます。
    relatedSlideId: javascript-ch03-l05-s02
