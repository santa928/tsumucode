      fact:
        kind: closure
        capturedName: step
    feedback:
      target: script.jsの得点係
      expected: 得点係が受け取ったstepを覚える
      nextAction: 2と5を直接書き分けず、外側の関数へ渡された増分を使います。
    hintId: javascript-ch03-l05-e03-h02
    relatedSlideId: javascript-ch03-l05-s03
  - id: javascript-ch03-l05-e03-r06
    groupId: javascript-ch03-l05-e03-check-6
