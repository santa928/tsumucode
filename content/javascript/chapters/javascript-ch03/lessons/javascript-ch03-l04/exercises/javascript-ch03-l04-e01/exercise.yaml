id: javascript-ch03-l04-e01
kind: standard
workspaceId: javascript-ch03-l04-e01
countsTowardStandardExerciseTotal: true
title: Arrow Functionで回答を整形する
instructionsSource: instructions.md
requiresConcepts:
  - { conceptId: answer-format-function, minimumLevel: transform }
scaffoldLevel: transform
steps:
  - id: return-formatted-answer
    file: script.js
    target: formatAnswer内のreturn answer
    starterAnchor: return answer;
    change: "answerを'回答: ' + answerへ置き換える"
    observe: 'Consoleに「回答: B」が表示される'
    requiresConceptIds: [answer-format-function]
    validationRuleIds:
      [
        javascript-ch03-l04-e01-r01,
        javascript-ch03-l04-e01-r02,
        javascript-ch03-l04-e01-r03,
        javascript-ch03-l04-e01-r04,
        javascript-ch03-l04-e01-r05,
      ]
files:
  - { path: script.js, language: javascript, source: starter/script.js, editable: true }
  - { path: index.html, language: html, source: starter/index.html, editable: false }
  - { path: styles.css, language: css, source: starter/styles.css, editable: false }
solutionFiles:
  - { path: script.js, language: javascript, source: solution/script.js, editable: false }
  - { path: index.html, language: html, source: solution/index.html, editable: false }
  - { path: styles.css, language: css, source: solution/styles.css, editable: false }
validationRules:
  - id: javascript-ch03-l04-e01-r01
    groupId: javascript-ch03-l04-e01-result
    label: parameterを1つ持つArrow Functionを使う
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: javascript-source, file: script.js }
    assertion:
      kind: javascript-source-fact
      fact: { kind: function, functionKind: arrow, parameterCount: 1 }
    feedback:
      target: formatAnswer
      expected: parameterを1つ持つArrow Function
      nextAction: 丸括弧、=>、波括弧を残します。
    hintId: javascript-ch03-l04-e01-h01
    relatedSlideId: javascript-ch03-l04-s01
  - id: javascript-ch03-l04-e01-r02
    groupId: javascript-ch03-l04-e01-result
    label: returnで文字列を返す
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: javascript-source, file: script.js }
    assertion: { kind: javascript-source-fact, fact: { kind: return } }
    feedback:
      target: formatAnswerの内側
      expected: returnが1件
      nextAction: returnキーワードとセミコロンを残します。
    hintId: javascript-ch03-l04-e01-h01
    relatedSlideId: javascript-ch03-l04-s03
  - id: javascript-ch03-l04-e01-r03
    groupId: javascript-ch03-l04-e01-result
    label: 見出しと回答をつなぐ
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: javascript-source, file: script.js }
    assertion:
      kind: javascript-source-fact
      fact: { kind: binary-expression, operator: '+' }
    feedback:
      target: returnの右側
      expected: "'回答: ' + answer"
      nextAction: 文字列とanswerの間へ+を書きます。
    hintId: javascript-ch03-l04-e01-h02
    relatedSlideId: javascript-ch03-l04-s03
  - id: javascript-ch03-l04-e01-r04
    groupId: javascript-ch03-l04-e01-result
    label: formatAnswerを呼び出す
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: javascript-source, file: script.js }
    assertion:
      kind: javascript-source-fact
      fact: { kind: call, callee: formatAnswer }
    feedback:
      target: console.logの内側
      expected: formatAnswer('B')の呼び出し
      nextAction: 最後の行は変更しません。
    hintId: javascript-ch03-l04-e01-h01
    relatedSlideId: javascript-ch03-l04-s04
  - id: javascript-ch03-l04-e01-r05
    groupId: javascript-ch03-l04-e01-result
    label: 整形した回答を表示する
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: javascript-console }
    assertion:
      kind: javascript-console
      operator: equals
      expected: [{ level: log, text: '回答: B' }]
    feedback:
      target: Console
      expected: '回答: Bを1回表示'
      nextAction: returnする文字列の空白とコロンを確認します。
    hintId: javascript-ch03-l04-e01-h03
    relatedSlideId: javascript-ch03-l04-s04
hints:
  - id: javascript-ch03-l04-e01-h01
    level: 1
    title: Arrow Functionの形は残す
    text: const、丸括弧、=>、波括弧、return、呼び出し行は変更しません。
    relatedSlideId: javascript-ch03-l04-s01
  - id: javascript-ch03-l04-e01-h02
    level: 2
    title: 文字列とparameterをつなぐ
    text: '引用符で囲んだ「回答: 」とanswerの間へ+を置きます。'
    relatedSlideId: javascript-ch03-l04-s03
  - id: javascript-ch03-l04-e01-h03
    level: 3
    title: returnの右側だけを変更する
    text: "return answer;をreturn '回答: ' + answer;へ変更します。"
    relatedSlideId: javascript-ch03-l04-s04
relatedSlideIds: [javascript-ch03-l04-s03, javascript-ch03-l04-s04]
previewViewports:
