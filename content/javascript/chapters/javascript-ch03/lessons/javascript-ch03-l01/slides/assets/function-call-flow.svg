<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Functionを宣言してから呼び出す流れ</title>
  <desc id="desc">showQuestionの宣言、呼び出し、問題文のConsole表示を左から順に示す</desc>
  <rect width="960" height="300" rx="32" fill="#fffaf0"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle" fill="#173f35">
    <rect x="48" y="78" width="248" height="144" rx="24" fill="#fff" stroke="#1d6b55" stroke-width="4"/>
    <text x="172" y="136" font-size="25" font-weight="700">宣言</text><text x="172" y="178" font-size="22">function showQuestion</text>
    <rect x="356" y="78" width="248" height="144" rx="24" fill="#dff4ed" stroke="#1d6b55" stroke-width="4"/>
    <text x="480" y="136" font-size="25" font-weight="700">呼び出し</text><text x="480" y="178" font-size="22">showQuestion()</text>
    <rect x="664" y="78" width="248" height="144" rx="24" fill="#f2c94c" stroke="#173f35" stroke-width="4"/>
    <text x="788" y="136" font-size="25" font-weight="700">Console</text><text x="788" y="178" font-size="21">問題1: 2 + 3 は？</text>
  </g>
  <g stroke="#1d6b55" stroke-width="8" stroke-linecap="round"><path d="M296 150h60M604 150h60"/></g>
</svg>
