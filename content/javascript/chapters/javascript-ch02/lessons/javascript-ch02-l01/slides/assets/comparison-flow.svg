<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">比較式からConsoleまでの流れ</title>
  <desc id="desc">AとAを厳密等価で比較するとtrueになりConsoleへ表示される</desc>
  <rect width="960" height="280" rx="32" fill="#fffaf0"/>
  <rect x="54" y="78" width="244" height="124" rx="22" fill="#ffffff" stroke="#1d6b55" stroke-width="4"/>
  <text x="176" y="150" text-anchor="middle" font-family="system-ui,sans-serif" font-size="34" fill="#173f35">'A' === 'A'</text>
  <path d="M318 140h104" stroke="#1d6b55" stroke-width="8" stroke-linecap="round"/>
  <path d="m414 124 22 16-22 16" fill="none" stroke="#1d6b55" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="456" y="78" width="162" height="124" rx="22" fill="#f2c94c" stroke="#173f35" stroke-width="4"/>
  <text x="537" y="151" text-anchor="middle" font-family="system-ui,sans-serif" font-size="38" font-weight="700" fill="#173f35">true</text>
  <path d="M638 140h82" stroke="#1d6b55" stroke-width="8" stroke-linecap="round"/>
  <path d="m712 124 22 16-22 16" fill="none" stroke="#1d6b55" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="754" y="78" width="152" height="124" rx="22" fill="#173f35"/>
  <text x="830" y="151" text-anchor="middle" font-family="system-ui,sans-serif" font-size="30" fill="#ffffff">Console</text>
</svg>
