    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: javascript-source, file: script.js }
    assertion:
      kind: javascript-source-fact
      fact: { kind: call, callee: console.log }
    feedback:
      target: script.jsとConsole
      expected: console.logの呼び出し
      nextAction: 3行目のconsole.log(isCorrect)を残します。
    hintId: javascript-ch02-l01-e01-h02
    relatedSlideId: javascript-ch02-l01-s03
  - id: javascript-ch02-l01-e01-r03
