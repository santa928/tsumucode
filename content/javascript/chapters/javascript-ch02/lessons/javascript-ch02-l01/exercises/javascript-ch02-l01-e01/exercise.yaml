      kind: javascript-console
      operator: equals
      expected:
        - { level: log, text: 'true' }
    feedback:
      target: script.jsとConsole
      expected: trueが1件表示
      nextAction: answerとAが同じかを確かめる式にします。
    hintId: javascript-ch02-l01-e01-h03
    relatedSlideId: javascript-ch02-l01-s04
