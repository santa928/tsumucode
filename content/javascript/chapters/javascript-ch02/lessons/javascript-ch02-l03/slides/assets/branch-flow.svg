<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">else ifで最初にtrueになった1つの道を選ぶ</title>
  <desc id="desc">Aと同じならAですを表示して分岐を終える。Aと違うときだけBを確かめ、同じならBですを表示する。どちらでもないときだけその他ですを表示する。</desc>
  <rect width="960" height="300" rx="32" fill="#fffaf0"/>
  <rect x="20" y="34" width="120" height="82" rx="20" fill="#ffffff" stroke="#1d6b55" stroke-width="4"/>
  <text x="80" y="83" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" fill="#173f35">回答</text>
  <path d="M140 75h90" fill="none" stroke="#1d6b55" stroke-width="6"/>
  <path d="M320 15 410 75 320 135 230 75Z" fill="#ffffff" stroke="#1d6b55" stroke-width="4"/>
  <text x="320" y="83" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" fill="#173f35">Aと同じ?</text>
  <path d="M410 75h90" fill="none" stroke="#1d6b55" stroke-width="6"/>
  <text x="455" y="58" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#173f35">false</text>
  <path d="M590 15 680 75 590 135 500 75Z" fill="#ffffff" stroke="#1d6b55" stroke-width="4"/>
  <text x="590" y="83" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" fill="#173f35">Bと同じ?</text>
  <path d="M320 135v66" fill="none" stroke="#1d6b55" stroke-width="6"/>
  <text x="337" y="174" font-family="system-ui,sans-serif" font-size="20" fill="#173f35">true</text>
  <path d="M590 135v66" fill="none" stroke="#1d6b55" stroke-width="6"/>
  <text x="607" y="174" font-family="system-ui,sans-serif" font-size="20" fill="#173f35">true</text>
  <path d="M680 75h70v160h30" fill="none" stroke="#1d6b55" stroke-width="6"/>
  <text x="715" y="58" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#173f35">false</text>
  <rect x="245" y="201" width="150" height="68" rx="20" fill="#f2c94c"/>
  <rect x="515" y="201" width="150" height="68" rx="20" fill="#dff4ed" stroke="#1d6b55" stroke-width="4"/>
  <rect x="780" y="201" width="160" height="68" rx="20" fill="#ffffff" stroke="#173f35" stroke-width="4"/>
  <text x="320" y="243" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" fill="#173f35">Aです</text>
  <text x="590" y="243" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" fill="#173f35">Bです</text>
  <text x="860" y="243" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" fill="#173f35">その他です</text>
</svg>
