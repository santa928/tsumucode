    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: javascript-source, file: script.js }
    assertion:
      kind: javascript-source-fact
      fact: { kind: loop, loopKind: for }
    feedback:
      target: script.jsとConsole
      expected: for文が1件
      nextAction: forと波括弧を残します。
    hintId: javascript-ch02-l04-e01-h01
    relatedSlideId: javascript-ch02-l04-s02
  - id: javascript-ch02-l04-e01-r02
    groupId: javascript-ch02-l04-e01-result
    label: number++で1ずつ更新する
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: javascript-source, file: script.js }
    assertion:
      kind: javascript-source-fact
      fact: { kind: assignment, name: number, operator: '++' }
    feedback:
      target: script.jsとConsole
      expected: number++の更新
      nextAction: forの最後にあるnumber++を残します。
    hintId: javascript-ch02-l04-e01-h01
    relatedSlideId: javascript-ch02-l04-s03
  - id: javascript-ch02-l04-e01-r03
    groupId: javascript-ch02-l04-e01-result
    label: 3以下の間だけ続ける
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: javascript-source, file: script.js }
    assertion:
      kind: javascript-source-fact
      fact: { kind: binary-expression, operator: '<=' }
    feedback:
      target: script.jsとConsole
      expected: number <= 3の条件
      nextAction: 条件の<へ=を加えて<=にします。
    hintId: javascript-ch02-l04-e01-h02
    relatedSlideId: javascript-ch02-l04-s04
  - id: javascript-ch02-l04-e01-r04
    groupId: javascript-ch02-l04-e01-result
    label: 問題1から問題3まで表示する
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: javascript-console }
    assertion:
      kind: javascript-console
      operator: equals
      expected:
        - { level: log, text: 問題1 }
        - { level: log, text: 問題2 }
        - { level: log, text: 問題3 }
    feedback:
      target: script.jsとConsole
      expected: 問題1、問題2、問題3の順に表示
      nextAction: 開始値を1、条件をnumber <= 3にします。
    hintId: javascript-ch02-l04-e01-h03
    relatedSlideId: javascript-ch02-l04-s04
hints:
  - id: javascript-ch02-l04-e01-h01
    level: 1
    title: forの形を残す
    text: let number = 1とnumber++、波括弧の中は変更しません。
    relatedSlideId: javascript-ch02-l04-s02
  - id: javascript-ch02-l04-e01-h02
    level: 2
    title: 3を含める
    text: numberが3の回も続けるには「3以下」を表す<=を使います。
    relatedSlideId: javascript-ch02-l04-s02
  - id: javascript-ch02-l04-e01-h03
    level: 3
    title: 記号を1つ加える
    text: number < 3をnumber <= 3へ直します。
    relatedSlideId: javascript-ch02-l04-s04
