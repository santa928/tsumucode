hints:
  - id: javascript-ch07-l03-e01-h01
    level: 1
    title: 作っただけか、つないだか
    text: createElementとtextContentだけでは画面のリストは増えません。作ったitemを親へ接続する行があるか見ます。
    relatedSlideId: javascript-ch07-l03-s02
  - id: javascript-ch07-l03-e01-h02
    level: 2
    title: 親と子の参照を使う
    text: 親のlistにあるappendChildへ、子のitemを渡します。list全体のtextContentは変えません。
    relatedSlideId: javascript-ch07-l03-s03
  - id: javascript-ch07-l03-e01-h03
    level: 3
    title: 文字と接続を分けて直す
    text: item.textContent =
      '次に読む本';で新しい項目の文字を合わせ、list.appendChild(item);で本のリストの末尾へ追加します。
    relatedSlideId: javascript-ch07-l03-s04
