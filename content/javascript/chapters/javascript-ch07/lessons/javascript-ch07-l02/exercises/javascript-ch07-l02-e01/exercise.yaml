      - desktop-1280
    target:
      kind: javascript-source
      file: script.js
    assertion:
      kind: javascript-source-fact
      fact:
        kind: call
        callee: document.querySelector
    feedback:
      target: script.js
      expected: querySelectorで対象を取得する
      nextAction: 前の単元のquerySelectorで一冊目の参照を取得します。
    hintId: javascript-ch07-l02-e01-h01
    relatedSlideId: javascript-ch07-l02-s02
hints:
  - id: javascript-ch07-l02-e01-h01
    level: 1
    title: 残すものから比べる
    text: 1冊目と2冊目の余白と左の線を比べます。共通の見た目まで失われたら、外したclassを確認します。
    relatedSlideId: javascript-ch07-l02-s02
  - id: javascript-ch07-l02-e01-h02
    level: 2
    title: 足すだけでは外れない
    text: addは追加、removeは削除です。pendingを残したままdoneを足すだけでは課題は完了しません。
    relatedSlideId: javascript-ch07-l02-s03
  - id: javascript-ch07-l02-e01-h03
    level: 3
    title: 2つの名前を合わせる
    text: book.classList.remove('pending')で未読のclassを外し、book.classList.add('done')で読了のclassを付けます。bookは残します。
    relatedSlideId: javascript-ch07-l02-s04
relatedSlideIds:
