    feedback:
      target: Previewとscript.js
      expected: 二冊目は未読のままにする
      nextAction: 1冊目だけを探し、2冊目へ操作しません。
    hintId: javascript-ch07-l02-e01-h03
    relatedSlideId: javascript-ch07-l02-s04
