hints:
  - id: javascript-ch07-l04-e01-h01
    level: 1
    title: 先頭だけか、全件か
    text: querySelectorは最初の1件です。3冊すべてを扱うには、集合を取得して各要素へ操作します。
    relatedSlideId: javascript-ch07-l04-s02
  - id: javascript-ch07-l04-e01-h02
    level: 2
    title: 集合と1要素を分ける
    text: querySelectorAllの結果へforEachを呼び、callbackで受け取った1冊のclassListを操作します。メモは集合へ入れません。
    relatedSlideId: javascript-ch07-l04-s03
  - id: javascript-ch07-l04-e01-h03
    level: 3
    title: 各要素の状態を直す
    text: const books = document.querySelectorAll('#books
      .book');で取得し、books.forEach((book) => { book.classList.remove('pending');
      book.classList.add('done'); });を実行します。
    relatedSlideId: javascript-ch07-l04-s04
