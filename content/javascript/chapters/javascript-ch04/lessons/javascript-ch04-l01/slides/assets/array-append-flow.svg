<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
  <title id="title">Arrayの末尾へ3問目を追加する流れ</title>
  <desc id="desc">HTMLとCSSの2問があるArrayへJavaScriptの問題を加え、lengthが3になる図</desc>
  <rect width="720" height="220" rx="24" fill="#fff9e8"/>
  <g font-family="system-ui, sans-serif" fill="#173f35">
    <text x="36" y="38" font-size="18" font-weight="700">questions</text>
    <g font-size="16" font-weight="600">
      <rect x="36" y="58" width="190" height="54" rx="14" fill="#ffffff" stroke="#7ab49b" stroke-width="2"/>
      <text x="52" y="91">0  HTMLの役割は？</text>
      <rect x="244" y="58" width="190" height="54" rx="14" fill="#ffffff" stroke="#7ab49b" stroke-width="2"/>
      <text x="260" y="91">1  CSSの役割は？</text>
      <rect x="452" y="58" width="232" height="54" rx="14" fill="#fff1b8" stroke="#d69721" stroke-width="3"/>
      <text x="468" y="91">2  JavaScriptの役割は？</text>
    </g>
    <path d="M568 123v30" stroke="#d69721" stroke-width="4" stroke-linecap="round"/>
    <path d="m558 145 10 10 10-10" fill="none" stroke="#d69721" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="504" y="164" width="128" height="38" rx="19" fill="#176b54"/>
    <text x="568" y="189" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">length = 3</text>
  </g>
</svg>
