validationRules:
  - id: javascript-ch04-l04-e01-r01
    groupId: javascript-ch04-l04-e01-result
    label: 2つのpropertyを持つObjectを作る
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: javascript-source, file: script.js }
    assertion:
      kind: javascript-source-fact
      fact: { kind: collection, collectionKind: object, entryCount: 2 }
    feedback:
      target: quiz Object
      expected: questionとanswerの2つのproperty
      nextAction: 波括弧と2つのproperty名は変更せず残します。
    hintId: javascript-ch04-l04-e01-h01
    relatedSlideId: javascript-ch04-l04-s02
  - id: javascript-ch04-l04-e01-r02
    groupId: javascript-ch04-l04-e01-result
    label: dot accessでpropertyを読む
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: javascript-source, file: script.js }
    assertion:
      kind: javascript-source-fact
      fact: { kind: collection-access, accessKind: property }
      minimumCount: 2
    feedback:
      target: 2つのconsole.log
      expected: quiz.questionとquiz.answer
      nextAction: 完成済みのdot accessを2行とも残します。
    hintId: javascript-ch04-l04-e01-h01
    relatedSlideId: javascript-ch04-l04-s03
  - id: javascript-ch04-l04-e01-r03
    groupId: javascript-ch04-l04-e01-result
    label: 問題文と正解5を表示する
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: javascript-console }
    assertion:
      kind: javascript-console
      operator: equals
      expected:
        - { level: log, text: '2 + 3 は？' }
        - { level: log, text: '5' }
    feedback:
      target: Console
      expected: 問題文、その次に正解5
      nextAction: answerの値だけを計算結果の5へ変えます。
    hintId: javascript-ch04-l04-e01-h03
    relatedSlideId: javascript-ch04-l04-s04
hints:
  - id: javascript-ch04-l04-e01-h01
    level: 1
    title: quiz Objectだけを見る
    text: property名とconsole.logは完成しているため変更しません。
    relatedSlideId: javascript-ch04-l04-s03
  - id: javascript-ch04-l04-e01-h02
    level: 2
    title: 2 + 3の正解を考える
    text: answer propertyには問題文の計算結果を数値で入れます。
    relatedSlideId: javascript-ch04-l04-s04
  - id: javascript-ch04-l04-e01-h03
    level: 3
    title: 数値を1つ置き換える
    text: 'answer: 0,をanswer: 5,へ変更します。'
    relatedSlideId: javascript-ch04-l04-s04
relatedSlideIds: [javascript-ch04-l04-s03, javascript-ch04-l04-s04]
