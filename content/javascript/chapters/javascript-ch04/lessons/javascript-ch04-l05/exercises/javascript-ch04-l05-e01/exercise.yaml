    feedback:
      target: Object Destructuring
      expected: textとchoicesの2つを受け取る波括弧
      nextAction: 左辺は残し、右辺をquizへ変更します。
    hintId: javascript-ch04-l05-e01-h02
    relatedSlideId: javascript-ch04-l05-s02
  - id: javascript-ch04-l05-e01-r02
    groupId: javascript-ch04-l05-e01-result
    label: Arrayから先頭要素をDestructuringする
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: javascript-source, file: script.js }
    assertion:
      kind: javascript-source-fact
      fact: { kind: destructuring, patternKind: array, bindingCount: 1 }
    feedback:
      target: Array Destructuring
      expected: firstChoiceを受け取る角括弧
      nextAction: 左辺は残し、右辺をchoicesへ変更します。
    hintId: javascript-ch04-l05-e01-h02
    relatedSlideId: javascript-ch04-l05-s03
  - id: javascript-ch04-l05-e01-r03
    groupId: javascript-ch04-l05-e01-result
    label: 問題文と先頭の選択肢を表示する
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: javascript-console }
    assertion:
      kind: javascript-console
      operator: equals
      expected:
        - { level: log, text: '2 + 3 は？' }
        - { level: log, text: '3' }
    feedback:
      target: Console
      expected: 問題文、その次に3
      nextAction: 1段目をquiz、2段目をchoicesからDestructuringします。
    hintId: javascript-ch04-l05-e01-h03
    relatedSlideId: javascript-ch04-l05-s04
hints:
  - id: javascript-ch04-l05-e01-h01
    level: 1
    title: 右辺だけを2箇所変更する
    text: 波括弧と角括弧の左辺、変数名、console.logは完成しています。
    relatedSlideId: javascript-ch04-l05-s04
  - id: javascript-ch04-l05-e01-h02
    level: 2
    title: 大きいデータから順に分ける
    text: 先にquizからpromptとchoicesを受け取り、次にchoicesからfirstChoiceを受け取ります。
    relatedSlideId: javascript-ch04-l05-s02
  - id: javascript-ch04-l05-e01-h03
    level: 3
    title: 2つの空の値を置き換える
    text: = {};を= quiz;へ、= [];を= choices;へ変更します。
    relatedSlideId: javascript-ch04-l05-s04
relatedSlideIds: [javascript-ch04-l05-s03, javascript-ch04-l05-s04]
