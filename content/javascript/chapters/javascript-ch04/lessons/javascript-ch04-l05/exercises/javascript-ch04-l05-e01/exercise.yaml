countsTowardStandardExerciseTotal: true
title: ObjectとArrayをDestructuringする
instructionsSource: instructions.md
requiresConcepts:
  - { conceptId: question-destructuring, minimumLevel: transform }
scaffoldLevel: transform
steps:
  - id: destructure-question-object
    file: script.js
    target: Object Destructuringの右辺にある空のObject
    starterAnchor: 'const { text: prompt, choices } = {};'
    change: '{}をquizへ置き換える'
    observe: promptへ問題文、choicesへ選択肢Arrayが入る
    requiresConceptIds: [question-destructuring]
    validationRuleIds: [javascript-ch04-l05-e01-r01, javascript-ch04-l05-e01-r03]
  - id: destructure-first-choice
    file: script.js
    target: Array Destructuringの右辺にある空のArray
    starterAnchor: 'const [firstChoice] = [];'
    change: '[]をchoicesへ置き換える'
    observe: Consoleへ問題文、その次に先頭の選択肢3が表示される
    requiresConceptIds: [question-destructuring]
    validationRuleIds: [javascript-ch04-l05-e01-r02, javascript-ch04-l05-e01-r03]
