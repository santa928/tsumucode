<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
  <title id="title">ObjectとArrayのDestructuring</title>
  <desc id="desc">quizからpromptとchoicesを取り出し、choicesからfirstChoiceを取り出す2段階の図</desc>
  <rect width="720" height="220" rx="24" fill="#fff9e8"/>
  <g font-family="system-ui, sans-serif" fill="#173f35">
    <rect x="34" y="54" width="190" height="112" rx="18" fill="#ffffff" stroke="#7ab49b" stroke-width="3"/>
    <text x="129" y="84" text-anchor="middle" font-size="18" font-weight="800">quiz</text>
    <text x="52" y="116" font-size="15">text: 2 + 3 は？</text>
    <text x="52" y="145" font-size="15">choices: [3, 5, 7]</text>
    <path d="M238 110h54" stroke="#d69721" stroke-width="4"/><path d="m284 100 10 10-10 10" fill="none" stroke="#d69721" stroke-width="4"/>
    <rect x="308" y="36" width="170" height="70" rx="16" fill="#e8f5ef"/>
    <text x="393" y="64" text-anchor="middle" font-size="14">Objectから</text><text x="393" y="88" text-anchor="middle" font-size="16" font-weight="700">prompt / choices</text>
    <path d="M393 118v28" stroke="#d69721" stroke-width="4"/><path d="m383 138 10 10 10-10" fill="none" stroke="#d69721" stroke-width="4"/>
    <rect x="308" y="158" width="170" height="42" rx="16" fill="#fff1b8"/>
    <text x="393" y="185" text-anchor="middle" font-size="15" font-weight="700">Arrayから firstChoice</text>
    <path d="M492 110h48" stroke="#176b54" stroke-width="4"/><path d="m532 100 10 10-10 10" fill="none" stroke="#176b54" stroke-width="4"/>
    <rect x="554" y="54" width="132" height="112" rx="18" fill="#176b54"/>
    <text x="620" y="88" text-anchor="middle" font-size="15" fill="#ffffff">Console</text>
    <text x="620" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">2 + 3 は？</text>
    <text x="620" y="146" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">3</text>
  </g>
</svg>
