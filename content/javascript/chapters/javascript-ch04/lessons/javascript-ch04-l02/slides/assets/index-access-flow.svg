<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
  <title id="title">index 0とat 1で問題を取り出す流れ</title>
  <desc id="desc">Arrayの先頭をindex 0、2番目をat 1で取り出し、HTMLとCSSの順に表示する図</desc>
  <rect width="720" height="220" rx="24" fill="#fff9e8"/>
  <g font-family="system-ui, sans-serif" fill="#173f35">
    <g font-size="16" font-weight="700">
      <rect x="36" y="38" width="190" height="54" rx="14" fill="#ffffff" stroke="#36a57c" stroke-width="3"/>
      <text x="52" y="71">0  HTMLの役割は？</text>
      <rect x="244" y="38" width="190" height="54" rx="14" fill="#ffffff" stroke="#e4b33c" stroke-width="3"/>
      <text x="260" y="71">1  CSSの役割は？</text>
      <rect x="452" y="38" width="232" height="54" rx="14" fill="#ffffff" stroke="#bdd4ca" stroke-width="2"/>
      <text x="468" y="71">2  JavaScriptの役割は？</text>
    </g>
    <path d="M131 102v35h119" fill="none" stroke="#36a57c" stroke-width="4" stroke-linecap="round"/>
    <path d="m242 129 10 8-10 8" fill="none" stroke="#36a57c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M339 102v58h-89" fill="none" stroke="#e4b33c" stroke-width="4" stroke-linecap="round"/>
    <path d="m258 152-10 8 10 8" fill="none" stroke="#e4b33c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="274" y="116" width="172" height="38" rx="19" fill="#e8f5ef"/>
    <text x="360" y="141" text-anchor="middle" font-size="16" font-weight="700">questions[0] → HTML</text>
    <rect x="274" y="164" width="172" height="38" rx="19" fill="#fff1c6"/>
    <text x="360" y="189" text-anchor="middle" font-size="16" font-weight="700">at(1) → CSS</text>
  </g>
</svg>
