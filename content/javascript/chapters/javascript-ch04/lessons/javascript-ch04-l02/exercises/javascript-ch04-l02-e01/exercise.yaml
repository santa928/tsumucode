      nextAction: 角括弧内を0へ変更します。
    hintId: javascript-ch04-l02-e01-h02
    relatedSlideId: javascript-ch04-l02-s02
  - id: javascript-ch04-l02-e01-r02
    groupId: javascript-ch04-l02-e01-result
    label: atへindexを書く
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: javascript-source, file: script.js }
    assertion:
      kind: javascript-source-fact
      fact: { kind: collection-access, accessKind: at }
    feedback:
      target: 2つ目のconsole.log
      expected: questions.at(1)
      nextAction: 完成済みのquestions.at(1)を残します。
    hintId: javascript-ch04-l02-e01-h01
    relatedSlideId: javascript-ch04-l02-s03
  - id: javascript-ch04-l02-e01-r03
    groupId: javascript-ch04-l02-e01-result
    label: 1問目と2問目を順に表示する
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: javascript-console }
    assertion:
      kind: javascript-console
      operator: equals
      expected:
        - { level: log, text: 'HTMLの役割は？' }
        - { level: log, text: 'CSSの役割は？' }
    feedback:
      target: Console
      expected: HTMLの問題文、その次にCSSの問題文
      nextAction: 最初だけindex 0、次はat(1)にします。
    hintId: javascript-ch04-l02-e01-h03
    relatedSlideId: javascript-ch04-l02-s04
  - id: javascript-ch04-l02-e01-r04
    groupId: javascript-ch04-l02-e01-teaching-result
    label: questionsの最初と次の要素を読み出して表示する
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: javascript-source
      file: script.js
    assertion:
      kind: javascript-source-fact
      fact:
        kind: teaching-relation
        goal: questions-access
    feedback:
      target: script.jsと実行結果
      expected: questionsの最初と次の要素を読み出して表示する
      nextAction: 同じ値・Function・処理から得た結果を使います。結果だけを別の固定値で表示していないか確認します。
    hintId: javascript-ch04-l02-e01-h01
    relatedSlideId: javascript-ch04-l02-s04
hints:
  - id: javascript-ch04-l02-e01-h01
    level: 1
    title: 変更するのは最初の表示行
    text: questions.at(1)は2問目を正しく取り出しているため残します。
    relatedSlideId: javascript-ch04-l02-s03
  - id: javascript-ch04-l02-e01-h02
    level: 2
    title: 1問目のindexを思い出す
    text: Arrayのindexは0から始まります。
    relatedSlideId: javascript-ch04-l02-s01
  - id: javascript-ch04-l02-e01-h03
    level: 3
    title: 角括弧の数値を1つ変える
    text: console.log(questions[1]);をconsole.log(questions[0]);へ変更します。
    relatedSlideId: javascript-ch04-l02-s04
relatedSlideIds: [javascript-ch04-l02-s03, javascript-ch04-l02-s04]
