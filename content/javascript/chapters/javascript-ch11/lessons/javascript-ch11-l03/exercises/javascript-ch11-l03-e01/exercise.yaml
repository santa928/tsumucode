  sourceType: script
  capabilityProfile: dom
  primaryOutput: preview
interactionScenarios:
  - id: control-sync
    label: 開閉後の名前と状態と表示
    actions:
      - id: opened
        kind: click
        selector: '#toggle'
      - id: closed
        kind: click
        selector: '#toggle'
      - id: reopened
        kind: click
        selector: '#toggle'
    checkpoints:
      - id: opened
        afterActionId: opened
        expectations:
          - id: name
            kind: selector-text
            selector: '#toggle'
            equals: ヒントを閉じる
          - id: expanded
            kind: attribute
            selector: '#toggle'
            name: aria-expanded
            equals: 'true'
          - id: visibility
            kind: selector-exists
            selector: '#hint:not([hidden])'
      - id: closed
        afterActionId: closed
        expectations:
          - id: name
            kind: selector-text
            selector: '#toggle'
            equals: ヒントを開く
          - id: expanded
            kind: attribute
            selector: '#toggle'
            name: aria-expanded
            equals: 'false'
          - id: visibility
            kind: selector-exists
            selector: '#hint[hidden]'
      - id: reopened
        afterActionId: reopened
        expectations:
          - id: name
            kind: selector-text
            selector: '#toggle'
            equals: ヒントを閉じる
          - id: expanded
            kind: attribute
            selector: '#toggle'
            name: aria-expanded
            equals: 'true'
          - id: visibility
            kind: selector-exists
            selector: '#hint:not([hidden])'
