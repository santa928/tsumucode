hints:
  - id: javascript-ch11-l03-e01-h01
    level: 1
    title: 次に何ができる？
    text: script.jsのrenderで、openedがtrueなら閉じる名前にします。
    relatedSlideId: javascript-ch11-l03-s02
  - id: javascript-ch11-l03-e01-h02
    level: 2
    title: 同じstateを使う
    text: 名前はopenedの条件で分け、aria-expandedへはString(opened)を渡します。
    relatedSlideId: javascript-ch11-l03-s03
  - id: javascript-ch11-l03-e01-h03
    level: 3
    title: 2行を直して往復する
    text: "button.textContent = opened ? 'ヒントを閉じる' : 'ヒントを開く'; と
      button.setAttribute('aria-expanded', String(opened)); を使います。"
    relatedSlideId: javascript-ch11-l03-s04
