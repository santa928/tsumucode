    target:
      kind: javascript-source
      file: script.js
    assertion:
      kind: javascript-source-fact
      fact:
        kind: call
        callee: document.querySelector
    feedback:
      target: script.jsのkeydown handler
      expected: Escapeのときだけ閉じる
      nextAction: event.keyをEscapeと比較し、条件の内側でcloseHintを呼びます。
    hintId: javascript-ch11-l01-e01-h01
    relatedSlideId: javascript-ch11-l01-s03
hints:
  - id: javascript-ch11-l01-e01-h01
    level: 1
    title: 押されたキーを読む
    text: script.jsのkeydown handlerが受け取るevent.keyを使います。
    relatedSlideId: javascript-ch11-l01-s02
  - id: javascript-ch11-l01-e01-h02
    level: 2
    title: Escapeだけ選ぶ
    text: if (event.key === 'Escape') の内側にcloseHintを置きます。
    relatedSlideId: javascript-ch11-l01-s03
  - id: javascript-ch11-l01-e01-h03
    level: 3
    title: 他のキーでは何もしない
    text: if (event.key === 'Escape') { closeHint(); } とし、外側の無条件呼出しは残しません。
    relatedSlideId: javascript-ch11-l01-s04
