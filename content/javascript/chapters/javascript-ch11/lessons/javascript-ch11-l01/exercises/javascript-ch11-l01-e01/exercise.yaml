interactionScenarios:
  - id: keyboard-hint
    label: 開く・別のキー・Escape・再試行
    actions:
      - id: open
        kind: click
        selector: '#open'
      - id: other
        kind: key
        selector: '#open'
        key: ArrowRight
      - id: escape
        kind: key
        selector: '#open'
        key: Escape
      - id: reopen
        kind: click
        selector: '#open'
      - id: escape-again
        kind: key
        selector: '#open'
        key: Escape
    checkpoints:
      - id: opened
        afterActionId: open
        expectations:
          - id: hint
            kind: selector-text
            selector: '#hint'
            equals: 配列のlengthで問題数が分かります
      - id: kept
        afterActionId: other
        expectations:
          - id: hint
            kind: selector-text
            selector: '#hint'
            equals: 配列のlengthで問題数が分かります
      - id: closed
        afterActionId: escape
        expectations:
          - id: hint
            kind: selector-text
            selector: '#hint'
            equals: ヒントは閉じています
      - id: reopened
        afterActionId: reopen
        expectations:
          - id: hint
            kind: selector-text
            selector: '#hint'
            equals: 配列のlengthで問題数が分かります
      - id: closed-again
        afterActionId: escape-again
        expectations:
          - id: hint
            kind: selector-text
            selector: '#hint'
            equals: ヒントは閉じています
