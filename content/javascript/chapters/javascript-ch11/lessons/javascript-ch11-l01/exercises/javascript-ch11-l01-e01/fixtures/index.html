<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>キーでヒントを使う</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>問題のヒント</h1>
      <button id="open" type="button">ヒントを開く</button>

      <p>Tabでボタンへ移動し、Enter・Space・Escapeを試します。</p>
    </main>
    <script src="script.js"></script>
  </body>
</html>
