interactionScenarios:
  - id: focus-flow
    label: 開始・入力・戻る・再開始
    actions:
      - id: begin
        kind: click
        selector: '#start'
      - id: answer
        kind: fill
        selector: '#answer'
        value: '2'
      - id: back
        kind: click
        selector: '#back'
      - id: again
        kind: click
        selector: '#start'
    checkpoints:
      - id: answer-ready
        afterActionId: begin
        expectations:
          - id: question
            kind: selector-text
            selector: '#question'
            equals: 1 + 1 は？
          - id: focus
            kind: focused
            selector: '#answer'
      - id: back-ready
        afterActionId: back
        expectations:
          - id: question
            kind: selector-text
            selector: '#question'
            equals: 始めると問題が出ます
          - id: focus
            kind: focused
            selector: '#start'
      - id: again-ready
        afterActionId: again
        expectations:
          - id: focus
            kind: focused
            selector: '#answer'
          - id: answer-cleared
            kind: input-value
            selector: '#answer'
            equals: ''
