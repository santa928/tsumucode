<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" role="img" aria-labelledby="title desc">
  <title id="title">現在の得点へ加えて入れ直す流れ</title>
  <desc id="desc">scoreの10へ5を加え、同じscoreへ15を入れ直す</desc>
  <rect width="800" height="240" rx="24" fill="#fffaf0" />
  <rect x="42" y="54" width="210" height="132" rx="18" fill="#ffffff" stroke="#1d6b55" stroke-width="4" />
  <text x="70" y="96" fill="#1d6b55" font-family="monospace" font-size="22">score</text>
  <text x="112" y="158" fill="#173f35" font-family="monospace" font-size="44">10</text>
  <text x="284" y="138" fill="#173f35" font-family="monospace" font-size="38">+ 5</text>
  <path d="M374 120h72" stroke="#f2c94c" stroke-width="8" stroke-linecap="round" />
  <path d="m436 102 22 18-22 18" fill="none" stroke="#f2c94c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="482" y="54" width="276" height="132" rx="18" fill="#173f35" />
  <text x="510" y="96" fill="#f2c94c" font-family="monospace" font-size="22">score（更新後）</text>
  <text x="588" y="158" fill="#ffffff" font-family="monospace" font-size="44">15</text>
</svg>
