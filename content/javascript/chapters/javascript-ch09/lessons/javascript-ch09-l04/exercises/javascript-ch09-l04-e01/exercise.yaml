hints:
  - id: javascript-ch09-l04-e01-h01
    level: 1
    title: 表示を切り替えた後の元データを見る
    text: 未読だけを選んだとき、state.itemsも2冊へ減っていませんか。
    relatedSlideId: javascript-ch09-l04-s02
  - id: javascript-ch09-l04-e01-h02
    level: 2
    title: filterの結果は表示用に使う
    text: 元の3冊を残し、render内のvisibleへ絞り込んだArrayを代入します。
    relatedSlideId: javascript-ch09-l04-s03
  - id: javascript-ch09-l04-e01-h03
    level: 3
    title: visibleへの代入にまとめる
    text: if内の2行をvisible = state.items.filter((book) => book.done ===
      false);の1行へ変えます。state.itemsへは代入しません。
    relatedSlideId: javascript-ch09-l04-s04
