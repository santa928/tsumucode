      expected: 操作先と表示先の要素を使う
      nextAction: querySelectorで登録先と書換先を取得します。
    hintId: javascript-ch09-l02-e01-h01
    relatedSlideId: javascript-ch09-l02-s03
  - id: javascript-ch09-l02-e01-r04
