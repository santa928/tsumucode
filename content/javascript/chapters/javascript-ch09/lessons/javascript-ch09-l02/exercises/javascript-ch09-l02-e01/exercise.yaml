hints:
  - id: javascript-ch09-l02-e01-h01
    level: 1
    title: stateと画面を比べる
    text: state.countは増えていますが、その値を表示へ反映するFunctionを呼んでいますか。
    relatedSlideId: javascript-ch09-l02-s02
  - id: javascript-ch09-l02-e01-h02
    level: 2
    title: 更新してからrender
    text: 読了handlerでstate.countを増やした後に、用意されているrenderを呼びます。
    relatedSlideId: javascript-ch09-l02-s03
  - id: javascript-ch09-l02-e01-h03
    level: 3
    title: renderを呼ぶ1行を加える
    text: state.count = state.count +
      1;の次の行へrender();を加えます。0へ戻す処理は同じ表示用Functionを使っています。
    relatedSlideId: javascript-ch09-l02-s04
