validationRules:
  - id: javascript-ch09-l01-e01-r01
    label: 最初の読了数は0
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: selector
      selector: "#status"
    assertion:
      kind: text
      operator: equals
      expected: "読了数: 0"
    feedback:
      target: script.jsとPreview
      expected: 最初の読了数は0
      nextAction: 初期状態と表示が揃っているか確認します。
    hintId: javascript-ch09-l01-e01-h02
    relatedSlideId: javascript-ch09-l01-s04
  - id: javascript-ch09-l01-e01-r02
    label: メモの文字を保つ
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: selector
      selector: "#note"
    assertion:
      kind: text
      operator: equals
      expected: 自分のペースで読もう
    feedback:
      target: script.js
      expected: メモを保つ
      nextAction: 変更する表示先がstatusだけか確認します。
    hintId: javascript-ch09-l01-e01-h02
    relatedSlideId: javascript-ch09-l01-s04
  - id: javascript-ch09-l01-e01-r03
    label: 要素を取得して使う
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: javascript-source
      file: script.js
    assertion:
      kind: javascript-source-fact
      fact:
        kind: call
        callee: document.querySelector
    feedback:
      target: script.js
      expected: 操作先と表示先の要素を使う
      nextAction: querySelectorで登録先と書換先を取得します。
    hintId: javascript-ch09-l01-e01-h01
    relatedSlideId: javascript-ch09-l01-s03
hints:
  - id: javascript-ch09-l01-e01-h01
    level: 1
    title: countは毎回いくつから始まる
    text: 1回目と2回目を比べます。handlerの中で0を用意し直していないか確かめましょう。
    relatedSlideId: javascript-ch09-l01-s02
  - id: javascript-ch09-l01-e01-h02
    level: 2
    title: 宣言を一度だけ実行する
    text: let count = 0はhandlerの外へ移します。countを増やす行と表示する行はhandlerの中に残します。
    relatedSlideId: javascript-ch09-l01-s03
  - id: javascript-ch09-l01-e01-h03
    level: 3
    title: 同じcountを次のclickでも使う
    text: let count = 0;をaddEventListenerより前に置きます。handlerではcount = count +
      1;の後にその値を表示します。
    relatedSlideId: javascript-ch09-l01-s04
relatedSlideIds:
  - javascript-ch09-l01-s01
