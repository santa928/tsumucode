    level: 1
    title: stateと画面の件数を比べる
    text: Arrayの件数が合っていても、前の描画で追加した行が残っていませんか。
    relatedSlideId: javascript-ch09-l03-s02
  - id: javascript-ch09-l03-e01-h02
    level: 2
    title: 描画前に古い子を消す
    text: forEachで追加する前に、listの子だけを取り除きます。list自体やstate.itemsは消しません。
    relatedSlideId: javascript-ch09-l03-s03
  - id: javascript-ch09-l03-e01-h03
    level: 3
    title: 消去を1行加える
    text: renderの先頭にlist.replaceChildren();を加えます。空のArrayでもこの行は実行します。
    relatedSlideId: javascript-ch09-l03-s04
