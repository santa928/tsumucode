hints:
  - id: javascript-ch13-l01-e01-h01
    level: 1
    title: 対象を見つける
    text: まずカテゴリ、問題位置、得点、回答済みの状態と、必要な画面を紙に書きます。Moduleから受け取るArrayを使う場所を決めましょう。
    relatedSlideId: javascript-ch13-l01-s01
  - id: javascript-ch13-l01-e01-h02
    level: 2
    title: 状態と表示をつなぐ
    text: filterは元のArrayを変えず表示用Arrayを返します。正解のときだけ加点し、二重回答を止めます。最後は問題がない場合を結果へ分岐します。
    relatedSlideId: javascript-ch13-l01-s02
  - id: javascript-ch13-l01-e01-h03
    level: 3
    title: 局所の例から考える
    text: '小例: const selected = items.filter((item) => item.category === selectedValue);。native buttonのclickへ処理を登録するとEnter/Spaceでも操作できます。読み込み失敗後も操作を戻しましょう。'
    relatedSlideId: javascript-ch13-l01-s03
