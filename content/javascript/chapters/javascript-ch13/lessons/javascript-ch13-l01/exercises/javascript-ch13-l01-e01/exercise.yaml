runtime:
  kind: javascript
  entryFile: main.js
  sourceType: module
  capabilityProfile: project
  primaryOutput: preview
interactionScenarios:
  - id: cap-web
    label: Webの混合回答と再挑戦
    actions:
      - id: start
        kind: click
        selector: '#start'
      - id: one
        kind: click
        selector: '#choice-0'
      - id: next
        kind: click
        selector: '#next'
      - id: two
        kind: click
        selector: '#choice-0'
      - id: finish
        kind: click
        selector: '#next'
      - id: restart
        kind: click
        selector: '#restart'
      - id: again-one
        kind: click
        selector: '#choice-0'
      - id: again-next
        kind: click
        selector: '#next'
      - id: again-two
        kind: click
        selector: '#choice-1'
      - id: again-finish
        kind: click
        selector: '#next'
    checkpoints:
      - id: loaded
        afterActionId: start
        expectations:
          - id: question
            kind: selector-text
            selector: '#question'
            equals: Webページの骨組みを作るのは？
          - id: choice-zero
            kind: selector-text
            selector: '#choice-0'
            equals: HTML
          - id: choice-one
            kind: selector-text
            selector: '#choice-1'
            equals: CSS
          - id: visible-question
            kind: selector-visible
            selector: '#question'
          - id: visible-choice-zero
            kind: selector-visible
            selector: '#choice-0'
          - id: visible-choice-one
            kind: selector-visible
            selector: '#choice-1'
      - id: first-answer
        afterActionId: one
        expectations:
          - id: answer
            kind: selector-text
            selector: '#feedback'
            equals: 正解です
          - id: locked
            kind: selector-exists
            selector: '#choice-0:disabled'
          - id: score
            kind: selector-text
            selector: '#score'
            equals: '得点: 1'
          - id: locked-one
            kind: selector-exists
            selector: '#choice-1:disabled'
      - id: second-question
        afterActionId: next
        expectations:
          - id: question
            kind: selector-text
            selector: '#question'
            equals: 見た目を整えるのは？
          - id: progress
            kind: selector-text
            selector: '#progress'
            equals: 問題2 / 2
          - id: visible-question
            kind: selector-visible
            selector: '#question'
          - id: visible-choice-zero
            kind: selector-visible
            selector: '#choice-0'
          - id: visible-choice-one
            kind: selector-visible
            selector: '#choice-1'
      - id: second-answer
        afterActionId: two
        expectations:
          - id: answer
            kind: selector-text
            selector: '#feedback'
            equals: 正解は CSS です
          - id: score
            kind: selector-text
            selector: '#score'
            equals: '得点: 1'
      - id: finished
        afterActionId: finish
        expectations:
          - id: result
            kind: selector-text
            selector: '#result'
            equals: 2問中1問正解
          - id: quiz-closed
            kind: selector-exists
            selector: '#quiz[hidden]'
          - id: answer-blocked
            kind: selector-exists
            selector: '#choice-0:disabled'
          - id: locked-one
            kind: selector-exists
            selector: '#choice-1:disabled'
      - id: restarted
        afterActionId: restart
        expectations:
          - id: question
            kind: selector-text
            selector: '#question'
            equals: Webページの骨組みを作るのは？
          - id: choice-zero
            kind: selector-text
            selector: '#choice-0'
            equals: HTML
          - id: choice-one
            kind: selector-text
            selector: '#choice-1'
            equals: CSS
          - id: score
            kind: selector-text
            selector: '#score'
            equals: '得点: 0'
          - id: feedback
            kind: selector-text
            selector: '#feedback'
            equals: ''
          - id: result-closed
            kind: selector-exists
            selector: '#result[hidden]'
          - id: focus
            kind: focused
            selector: '#choice-0'
          - id: visible-question
            kind: selector-visible
            selector: '#question'
          - id: visible-choice-zero
            kind: selector-visible
            selector: '#choice-0'
          - id: visible-choice-one
            kind: selector-visible
            selector: '#choice-1'
      - id: again-result
        afterActionId: again-finish
        expectations:
          - id: result
            kind: selector-text
            selector: '#result'
            equals: 2問中2問正解
  - id: cap-logic
    label: 別カテゴリを最後まで解く
    actions:
      - id: category
        kind: select
        selector: '#category'
        value: logic
      - id: start
        kind: click
        selector: '#start'
      - id: one
        kind: click
        selector: '#choice-1'
      - id: next
        kind: click
        selector: '#next'
      - id: two
        kind: click
        selector: '#choice-0'
      - id: finish
        kind: click
        selector: '#next'
    checkpoints:
      - id: loaded
        afterActionId: start
        expectations:
          - id: question
            kind: selector-text
            selector: '#question'
            equals: 1 + 1 は？
