            kind: selector-visible
            selector: '#question'
          - id: visible-choice-zero
            kind: selector-visible
            selector: '#choice-0'
          - id: visible-choice-one
            kind: selector-visible
            selector: '#choice-1'
      - id: second
        afterActionId: next
        expectations:
          - id: question
            kind: selector-text
            selector: '#question'
            equals: 3 > 5 の結果は？
          - id: progress
            kind: selector-text
            selector: '#progress'
            equals: 問題2 / 2
          - id: visible-question
            kind: selector-visible
            selector: '#question'
          - id: visible-choice-zero
            kind: selector-visible
            selector: '#choice-0'
          - id: visible-choice-one
            kind: selector-visible
            selector: '#choice-1'
      - id: result
        afterActionId: finish
        expectations:
          - id: result
            kind: selector-text
            selector: '#result'
            equals: 2問中0問正解
  - id: cap-recovery
    label: 読み込み失敗から再開
    actions:
      - id: failure
        kind: click
        selector: '#fail-load'
      - id: retry
        kind: click
        selector: '#start'
      - id: one
        kind: click
        selector: '#choice-0'
      - id: repeat-answer
        kind: click
        selector: '#choice-1'
    checkpoints:
      - id: loading
        afterActionId: failure
        expectations:
          - id: message
            kind: selector-text
            selector: '#status'
            equals: 読み込み中...
          - id: blocked
            kind: selector-exists
            selector: '#start:disabled'
      - id: failed
        afterActionId: failure
        expectations:
          - id: message
            kind: selector-text
            selector: '#status'
            equals: 読み込めませんでした。開始でやり直せます
          - id: enabled
            kind: selector-exists
            selector: '#start:enabled'
      - id: recovered
        afterActionId: retry
        expectations:
          - id: question
            kind: selector-text
            selector: '#question'
            equals: Webページの骨組みを作るのは？
          - id: choice-zero
            kind: selector-text
            selector: '#choice-0'
            equals: HTML
          - id: choice-one
            kind: selector-text
            selector: '#choice-1'
            equals: CSS
          - id: visible-question
            kind: selector-visible
            selector: '#question'
          - id: visible-choice-zero
            kind: selector-visible
            selector: '#choice-0'
          - id: visible-choice-one
            kind: selector-visible
            selector: '#choice-1'
      - id: first-answer
        afterActionId: one
        expectations:
          - id: answer
            kind: selector-text
            selector: '#feedback'
            equals: 正解です
          - id: locked
            kind: selector-exists
            selector: '#choice-0:disabled'
          - id: score
            kind: selector-text
            selector: '#score'
            equals: '得点: 1'
          - id: locked-one
            kind: selector-exists
            selector: '#choice-1:disabled'
      - id: repeat-answer
        afterActionId: repeat-answer
        expectations:
          - id: answer
            kind: selector-text
            selector: '#feedback'
            equals: 正解です
          - id: locked
            kind: selector-exists
            selector: '#choice-0:disabled'
          - id: score
            kind: selector-text
            selector: '#score'
            equals: '得点: 1'
          - id: locked-one
            kind: selector-exists
            selector: '#choice-1:disabled'
  - id: cap-keyboard
    label: キーボードで回答と再挑戦
    actions:
      - id: focus
        kind: focus
        selector: '#start'
      - id: start
        kind: key
        selector: '#start'
        key: Enter
      - id: one
        kind: key
        selector: '#choice-0'
        key: Space
      - id: next
        kind: key
        selector: '#next'
        key: Enter
      - id: two
        kind: key
        selector: '#choice-1'
        key: Enter
      - id: finish
        kind: key
        selector: '#next'
        key: Space
      - id: restart
        kind: key
        selector: '#restart'
        key: Enter
    checkpoints:
      - id: loaded
        afterActionId: start
        expectations:
          - id: question
            kind: selector-text
            selector: '#question'
            equals: Webページの骨組みを作るのは？
          - id: choice-zero
            kind: selector-text
            selector: '#choice-0'
            equals: HTML
          - id: choice-one
            kind: selector-text
            selector: '#choice-1'
            equals: CSS
          - id: focus
            kind: focused
            selector: '#choice-0'
          - id: visible-question
            kind: selector-visible
            selector: '#question'
          - id: visible-choice-zero
            kind: selector-visible
            selector: '#choice-0'
          - id: visible-choice-one
            kind: selector-visible
            selector: '#choice-1'
      - id: answered
        afterActionId: one
        expectations:
          - id: focus
            kind: focused
            selector: '#next'
          - id: score
            kind: selector-text
            selector: '#score'
            equals: '得点: 1'
      - id: next
        afterActionId: next
        expectations:
          - id: focus
            kind: focused
            selector: '#choice-0'
      - id: result
        afterActionId: finish
        expectations:
          - id: result
            kind: selector-text
            selector: '#result'
            equals: 2問中2問正解
          - id: focus
            kind: focused
            selector: '#restart'
      - id: again
        afterActionId: restart
        expectations:
          - id: score
            kind: selector-text
            selector: '#score'
            equals: '得点: 0'
          - id: focus
            kind: focused
            selector: '#choice-0'
