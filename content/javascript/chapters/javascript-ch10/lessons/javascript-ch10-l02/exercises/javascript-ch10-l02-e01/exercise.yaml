      expected: 読む前は0件
      nextAction: async関数の中で、loadQuestions()の結果を受け取ってから件数を表示します。
    hintId: javascript-ch10-l02-e01-h02
    relatedSlideId: javascript-ch10-l02-s03
  - id: javascript-ch10-l02-e01-r02
