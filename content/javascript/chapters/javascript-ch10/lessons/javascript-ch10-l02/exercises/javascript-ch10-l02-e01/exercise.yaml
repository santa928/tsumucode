    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: selector
      selector: '#note'
    assertion:
      kind: text
      operator: equals
      expected: 同梱の問題を読む練習です。通信はしません。
    feedback:
      target: script.jsとPreview
      expected: 通信しない同梱データと分かる
      nextAction: async関数の中で、loadQuestions()の結果を受け取ってから件数を表示します。
    hintId: javascript-ch10-l02-e01-h02
    relatedSlideId: javascript-ch10-l02-s03
  - id: javascript-ch10-l02-e01-r03
    label: 同梱データの取得元を呼ぶ
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: javascript-source
      file: script.js
    assertion:
      kind: javascript-source-fact
      fact:
        kind: call
        callee: loadQuestions
    feedback:
      target: script.jsとPreview
      expected: 同梱データの取得元を呼ぶ
      nextAction: async関数の中で、loadQuestions()の結果を受け取ってから件数を表示します。
    hintId: javascript-ch10-l02-e01-h02
    relatedSlideId: javascript-ch10-l02-s03
hints:
  - id: javascript-ch10-l02-e01-h01
    level: 1
    title: questionsに何が入っている？
    text: loadQuestions()の戻り値はPromiseです。まだ結果Arrayではありません。
    relatedSlideId: javascript-ch10-l02-s01
  - id: javascript-ch10-l02-e01-h02
    level: 2
    title: 結果を受け取ってからlengthを見る
    text: showCountはasync関数です。awaitで結果が届くのを待てます。
    relatedSlideId: javascript-ch10-l02-s02
  - id: javascript-ch10-l02-e01-h03
    level: 3
    title: 呼び出しの前にawaitを置く
    text: const questions = await loadQuestions(); と書くと、その後でArrayのlengthを使えます。
    relatedSlideId: javascript-ch10-l02-s04
