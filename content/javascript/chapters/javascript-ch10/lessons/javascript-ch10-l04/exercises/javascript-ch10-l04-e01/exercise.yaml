runtime:
  kind: javascript
  entryFile: script.js
  sourceType: script
  capabilityProfile: async
  primaryOutput: preview
interactionScenarios:
  - id: loading-retry
    label: 待機中の操作制限と成功・失敗後の回復
    actions:
      - id: success
        kind: click
        selector: '#success'
      - id: failure
        kind: click
        selector: '#failure'
      - id: retry
        kind: click
        selector: '#success'
    checkpoints:
      - id: success-loading
        afterActionId: success
        expectations:
          - id: message
            kind: selector-text
            selector: '#result'
            equals: 読み込み中...
          - id: success-disabled
            kind: selector-exists
            selector: '#success:disabled'
          - id: failure-disabled
            kind: selector-exists
            selector: '#failure:disabled'
      - id: success-ready
        afterActionId: success
        expectations:
          - id: result
            kind: selector-text
            selector: '#result'
            equals: '問題: 2'
          - id: success-enabled
            kind: selector-exists
            selector: '#success:enabled'
          - id: failure-enabled
            kind: selector-exists
            selector: '#failure:enabled'
      - id: failure-loading
        afterActionId: failure
        expectations:
          - id: message
            kind: selector-text
            selector: '#result'
            equals: 読み込み中...
          - id: success-disabled
            kind: selector-exists
            selector: '#success:disabled'
          - id: failure-disabled
            kind: selector-exists
            selector: '#failure:disabled'
      - id: failure-ready
        afterActionId: failure
        expectations:
          - id: result
            kind: selector-text
            selector: '#result'
            equals: 読み込めませんでした
          - id: success-enabled
            kind: selector-exists
            selector: '#success:enabled'
          - id: failure-enabled
            kind: selector-exists
            selector: '#failure:enabled'
      - id: retry-loading
        afterActionId: retry
        expectations:
          - id: message
            kind: selector-text
            selector: '#result'
            equals: 読み込み中...
          - id: success-disabled
            kind: selector-exists
            selector: '#success:disabled'
          - id: failure-disabled
            kind: selector-exists
            selector: '#failure:disabled'
      - id: retry-ready
        afterActionId: retry
        expectations:
          - id: result
            kind: selector-text
            selector: '#result'
            equals: '問題: 2'
          - id: success-enabled
            kind: selector-exists
            selector: '#success:enabled'
          - id: failure-enabled
            kind: selector-exists
            selector: '#failure:enabled'
