    level: 1
    title: どこでボタンを止めた？
    text: 開始時にsuccess.disabledとfailure.disabledをtrueにしています。
    relatedSlideId: javascript-ch10-l04-s02
  - id: javascript-ch10-l04-e01-h02
    level: 2
    title: 共通の後片付けへ書く
    text: finallyは成功と失敗のどちらでも通ります。両方のdisabledをfalseに戻します。
    relatedSlideId: javascript-ch10-l04-s03
  - id: javascript-ch10-l04-e01-h03
    level: 3
    title: 2つのボタンを戻す
    text: success.disabled = false; と failure.disabled = false; をfinallyへ加えます。
    relatedSlideId: javascript-ch10-l04-s04
