<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>失敗からやり直す</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>成功と失敗を試そう</h1>
      <button id="success" type="button">成功を試す</button>
      <button id="failure" type="button">失敗を試す</button>
      <p id="result" role="status">まだ読んでいません</p>
      <p id="note">同梱データの成功と失敗を試す練習です。通信はしません。</p>
    </main>
    <script src="script.js"></script>
  </body>
</html>
