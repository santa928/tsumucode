interactionScenarios:
  - id: catch-retry
    label: 成功と失敗を区別し再試行する
    actions:
      - id: success
        kind: click
        selector: '#success'
      - id: failure
        kind: click
        selector: '#failure'
      - id: retry
        kind: click
        selector: '#success'
    checkpoints:
      - id: success
        afterActionId: success
        expectations:
          - id: result
            kind: selector-text
            selector: '#result'
            equals: '問題: 2'
      - id: failure
        afterActionId: failure
        expectations:
          - id: result
            kind: selector-text
            selector: '#result'
            equals: 読み込めませんでした
      - id: retry
        afterActionId: retry
        expectations:
          - id: result
            kind: selector-text
            selector: '#result'
            equals: '問題: 2'
