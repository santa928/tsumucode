validationRules:
  - id: javascript-ch10-l01-e01-r01
    label: 読む前は0件
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: selector
      selector: "#count"
    assertion:
      kind: text
      operator: equals
      expected: "問題: 0"
    feedback:
      target: script.jsとPreview
      expected: 読む前は0件
      nextAction: 初期表示を保ち、click後のthenで受け取ったデータを表示します。
    hintId: javascript-ch10-l01-e01-h02
    relatedSlideId: javascript-ch10-l01-s03
  - id: javascript-ch10-l01-e01-r02
    label: 読む前は問題を表示しない
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: selector
      selector: "#question"
    assertion:
      kind: text
      operator: equals
      expected: まだありません
    feedback:
      target: script.jsとPreview
      expected: 読む前は問題を表示しない
      nextAction: 初期表示を保ち、click後のthenで受け取ったデータを表示します。
    hintId: javascript-ch10-l01-e01-h02
    relatedSlideId: javascript-ch10-l01-s03
  - id: javascript-ch10-l01-e01-r03
    label: 通信しない同梱データと分かる
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: selector
      selector: "#note"
    assertion:
      kind: text
      operator: equals
      expected: 同梱の問題を読む練習です。通信はしません。
    feedback:
      target: script.jsとPreview
      expected: 通信しない同梱データと分かる
      nextAction: 初期表示を保ち、click後のthenで受け取ったデータを表示します。
    hintId: javascript-ch10-l01-e01-h02
    relatedSlideId: javascript-ch10-l01-s03
  - id: javascript-ch10-l01-e01-r04
    label: loadQuestionsの結果を使う
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - desktop-1280
    target:
      kind: javascript-source
      file: script.js
    assertion:
      kind: javascript-source-fact
      fact:
        kind: call
        callee: loadQuestions
    feedback:
      target: script.jsとPreview
      expected: loadQuestionsの結果を使う
      nextAction: 初期表示を保ち、click後のthenで受け取ったデータを表示します。
    hintId: javascript-ch10-l01-e01-h02
    relatedSlideId: javascript-ch10-l01-s03
hints:
  - id: javascript-ch10-l01-e01-h01
    level: 1
    title: 結果はどこへ届く？
    text: thenの引数questionsには、同梱された問題Arrayが届きます。
    relatedSlideId: javascript-ch10-l01-s01
  - id: javascript-ch10-l01-e01-h02
    level: 2
    title: Arrayの件数と先頭のtext
    text: then内でquestions.lengthとquestions[0].textを使います。
    relatedSlideId: javascript-ch10-l01-s03
  - id: javascript-ch10-l01-e01-h03
    level: 3
    title: 2つの表示をデータから作る
    text: "count.textContent = '問題: ' + questions.length; と question.textContent =
      questions[0].text; に直します。"
    relatedSlideId: javascript-ch10-l01-s04
relatedSlideIds:
  - javascript-ch10-l01-s01
  - javascript-ch10-l01-s02
  - javascript-ch10-l01-s03
