    level: 1
    title: 変更するのはquestions.jsだけ
    text: main.jsのimportとconsole.log、問題Arrayの3件は完成しています。
    relatedSlideId: javascript-ch06-l01-s04
  - id: javascript-ch06-l01-e01-h02
    level: 2
    title: constの前へ公開keywordを置く
    text: named exportは、公開したい宣言の前へexportを書きます。
    relatedSlideId: javascript-ch06-l01-s02
  - id: javascript-ch06-l01-e01-h03
