    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: javascript-source, file: main.js }
    assertion:
      kind: javascript-source-fact
      fact: { kind: module-boundary, boundaryKind: import, name: questions }
    feedback:
      target: main.jsのimport
      expected: questionsという名前のnamed import
      nextAction: main.jsの完成済みimportは変更せず、questions.jsを確認します。
    hintId: javascript-ch06-l01-e01-h01
    relatedSlideId: javascript-ch06-l01-s03
  - id: javascript-ch06-l01-e01-r03
    groupId: javascript-ch06-l01-e01-result
    label: 問題数3を表示する
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: javascript-console }
    assertion:
      kind: javascript-console
      operator: equals
      expected: [{ level: log, text: '3' }]
    feedback:
      target: Console
      expected: '3'
      nextAction: questionsをexportし、完成済みのquestions.lengthまで動かします。
    hintId: javascript-ch06-l01-e01-h03
    relatedSlideId: javascript-ch06-l01-s04
