validationRules:
  - id: javascript-ch06-l02-e01-r01
    groupId: javascript-ch06-l02-e01-result
    label: scoreAnswerをnamed exportする
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: javascript-source, file: score.js }
    assertion:
      kind: javascript-source-fact
      fact: { kind: module-boundary, boundaryKind: export, name: scoreAnswer }
    feedback:
      target: score.js
      expected: scoreAnswerという名前のnamed function export
      nextAction: score.jsの完成済みexportは変更せず、main.jsを確認します。
    hintId: javascript-ch06-l02-e01-h01
    relatedSlideId: javascript-ch06-l02-s02
  - id: javascript-ch06-l02-e01-r02
    groupId: javascript-ch06-l02-e01-result
    label: scoreAnswerをnamed importする
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: javascript-source, file: main.js }
    assertion:
      kind: javascript-source-fact
      fact: { kind: module-boundary, boundaryKind: import, name: scoreAnswer }
    feedback:
      target: main.jsのimport
      expected: scoreAnswerという名前のnamed import
      nextAction: importの波括弧内へscoreAnswerを書きます。
    hintId: javascript-ch06-l02-e01-h02
    relatedSlideId: javascript-ch06-l02-s03
  - id: javascript-ch06-l02-e01-r03
    groupId: javascript-ch06-l02-e01-result
    label: scoreAnswerを呼び出す
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: javascript-source, file: main.js }
    assertion:
      kind: javascript-source-fact
      fact: { kind: call, callee: scoreAnswer }
    feedback:
      target: main.jsのFunction呼び出し
      expected: scoreAnswer(true)の呼び出し
      nextAction: 完成済みのconsole.logは変更せず、import名を直します。
    hintId: javascript-ch06-l02-e01-h01
    relatedSlideId: javascript-ch06-l02-s04
  - id: javascript-ch06-l02-e01-r04
    groupId: javascript-ch06-l02-e01-result
    label: 採点結果10を表示する
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: javascript-console }
    assertion:
      kind: javascript-console
      operator: equals
      expected: [{ level: log, text: '10' }]
    feedback:
      target: Console
      expected: '10'
      nextAction: scoreAnswerをimportし、完成済みの呼び出しまで動かします。
    hintId: javascript-ch06-l02-e01-h03
    relatedSlideId: javascript-ch06-l02-s04
hints:
  - id: javascript-ch06-l02-e01-h01
    level: 1
    title: 変更するのはmain.jsの波括弧内だけ
    text: score.jsのFunction exportとmain.jsの呼び出しは完成しています。
    relatedSlideId: javascript-ch06-l02-s04
  - id: javascript-ch06-l02-e01-h02
    level: 2
    title: export名とimport名をそろえる
    text: score.jsが公開しているFunction名を、importの波括弧へ書きます。
    relatedSlideId: javascript-ch06-l02-s03
  - id: javascript-ch06-l02-e01-h03
    level: 3
    title: import文を完成させる
    text: "import { scoreAnswer } from './score.js'; と書きます。"
    relatedSlideId: javascript-ch06-l02-s04
