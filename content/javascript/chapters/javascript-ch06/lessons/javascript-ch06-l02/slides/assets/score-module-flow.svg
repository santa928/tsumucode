<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">採点FunctionのModule共有</title><desc id="desc">score.jsのscoreAnswerをmain.jsへimportし、trueを渡して10を得る</desc>
  <rect width="960" height="260" rx="28" fill="#fffaf0"/>
  <g font-family="system-ui, sans-serif" fill="#173f35" text-anchor="middle">
    <rect x="42" y="48" width="320" height="164" rx="20" fill="#fff" stroke="#1d6b55" stroke-width="4"/><text x="202" y="94" font-size="25" font-weight="700">score.js</text><text x="202" y="140" font-size="21">export scoreAnswer</text><text x="202" y="178" font-size="20">正解 → 10点</text>
    <path d="M386 130h188" stroke="#1d6b55" stroke-width="8" stroke-linecap="round"/><path d="m556 110 24 20-24 20" fill="none" stroke="#1d6b55" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="420" y="72" width="124" height="42" rx="21" fill="#f2c94c"/><text x="482" y="101" font-size="20" font-weight="700">import</text>
    <rect x="604" y="48" width="314" height="164" rx="20" fill="#fff" stroke="#1d6b55" stroke-width="4"/><text x="761" y="94" font-size="25" font-weight="700">main.js</text><text x="761" y="140" font-size="21">scoreAnswer(true)</text><text x="761" y="178" font-size="24" font-weight="700">Console: 10</text>
  </g>
</svg>
