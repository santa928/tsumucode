    firstSlideId: python-basics-ch01-l12-s01
    relatedIds: [python-function]
  - id: python-exception
    term: tryとexcept ValueError
    definition: try内の整数変換失敗をValueErrorとして受け止め、案内後に外の処理へ進む。
