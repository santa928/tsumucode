      expected: '外側と同じ名前の引数を持つ関数で和を返し、最後に外側の値100を表示する。'
      nextAction: '引数のleftは呼び出しごとに受け取る名前です。計算の値をreturnし、最後のprint(left)は関数の外に置きます。'
    hintId: python-basics-ch01-l11-e01-h01
    relatedSlideId: python-basics-ch01-l11-s02
hints:
  - id: python-basics-ch01-l11-e01-h01
    level: 1
    title: 最初の手掛かり
    text: '`def`の括弧の中の`left`と、最初の行の`left`に別の印を付けます。'
    relatedSlideId: python-basics-ch01-l11-s02
  - id: python-basics-ch01-l11-e01-h02
    level: 2
    title: 処理の流れを確かめる
    text: '関数の外へ渡すのは、内側の名前ではなく`return`した値です。'
    relatedSlideId: python-basics-ch01-l11-s02
  - id: python-basics-ch01-l11-e01-h03
    level: 3
    title: 解答と別解の考え方
    text: '外側が`left = 100`でも、引数の`left`へ`1`を渡した呼び出しでは内側は`1`です。`return`した和と、最後に外側で読む`left`を分けて追いましょう。'
    relatedSlideId: python-basics-ch01-l11-s02
