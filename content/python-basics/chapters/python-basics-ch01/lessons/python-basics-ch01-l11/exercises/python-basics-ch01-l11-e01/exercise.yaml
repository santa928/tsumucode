  - id: python-basics-ch01-l11-e01-step01
    file: main.py
    target: '関数名・計算の書き方・呼び出しと表示の組み立て'
    starterAnchor: 'left = 100'
    change: '細かい修正手順はありません。外側のleft = 100を残し、引数の1つにleftという名前を使う加算関数を自作します。3と5、4と6の戻り値を順に表示し、最後に外側のleftを表示してください。8、10、100の3行から、同じ名前の使える範囲を説明しましょう。'
    observe: 'Consoleは8、10、100です。'
    requiresConceptIds: [python-function-scope]
    validationRuleIds: [python-basics-ch01-l11-e01-r01]
