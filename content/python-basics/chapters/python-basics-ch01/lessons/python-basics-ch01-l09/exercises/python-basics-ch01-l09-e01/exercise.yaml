    level: 3
    title: 解答と別解の考え方
    text: 'たとえば`def total(a, b):`の中で`return a + b`と書くと、`value = total(1, 2)`で`3`を受け取れます。課題の2組の値へ当てはめましょう。'
    relatedSlideId: python-basics-ch01-l09-s02
