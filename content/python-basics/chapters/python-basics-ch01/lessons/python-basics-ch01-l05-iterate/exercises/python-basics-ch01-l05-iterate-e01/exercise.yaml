  - conceptId: python-list
    minimumLevel: transform
scaffoldLevel: transform
steps:
  - id: python-basics-ch01-l05-iterate-e01-step01
    file: main.py
    target: 'total = 0を書き、足す前の合計を用意します。'
    starterAnchor: '# 合計を0で初期化します。'
    change: 'total = 0を書き、足す前の合計を用意します。'
    observe: '合計は0から始めます。[4, 5]なら最初に4を足します。'
    requiresConceptIds: [python-list]
    validationRuleIds: [python-basics-ch01-l05-iterate-e01-r01]
  - id: python-basics-ch01-l05-iterate-e01-step02
    file: main.py
    target: 'for item in numbers: と、字下げしたtotal = total + itemを書きます。'
    starterAnchor: '# forでListの各要素を合計へ足します。'
    change: 'for item in numbers: と、字下げしたtotal = total + itemを書きます。'
    observe: '[4, 5]ならtotalは0→4→9へ変わります。[1, 3, 5]など合計が9になる別の整数のListも正解です。'
    requiresConceptIds: [python-list]
    validationRuleIds: [python-basics-ch01-l05-iterate-e01-r01]
  - id: python-basics-ch01-l05-iterate-e01-step03
    file: main.py
    target: 'forの外側へprint(total)を書きます。'
    starterAnchor: '# forの後で合計を表示します。'
    change: 'forの外側へprint(total)を書きます。'
    observe: '判定では合計9を1回表示します。空Listの観察ではforが0回で0を表示します。観察後は合計が9になるListへ戻します。'
    requiresConceptIds: [python-list]
    validationRuleIds: [python-basics-ch01-l05-iterate-e01-r01]
