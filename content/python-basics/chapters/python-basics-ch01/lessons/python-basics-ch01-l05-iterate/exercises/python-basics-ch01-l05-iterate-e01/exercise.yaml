      fact: list-iterated-summed
    feedback:
      target: main.pyとConsole
      expected: Listの各整数をforで1つずつ合計へ足し、forの後に9を1行表示します。合計が9になる別のListも正解です。
      nextAction: totalを0で初期化し、forの内側で各itemを足し、forの後でtotalを表示してください。
    hintId: python-basics-ch01-l05-iterate-e01-h01
    relatedSlideId: python-basics-ch01-l05-iterate-s02
hints:
  - id: python-basics-ch01-l05-iterate-e01-h01
    level: 1
    title: 最初の手掛かり
    text: 'rangeのLessonと同じforを使います。inの後ろをnumbersにすると、Listの要素を順に受け取ります。'
    relatedSlideId: python-basics-ch01-l05-iterate-s02
  - id: python-basics-ch01-l05-iterate-e01-h02
    level: 2
    title: コードを組み立てる
    text: 'total = 0で始め、for item in numbers: の内側へtotal = total + itemを書きます。print(total)は字下げしません。'
    relatedSlideId: python-basics-ch01-l05-iterate-s02
  - id: python-basics-ch01-l05-iterate-e01-h03
    level: 3
    title: 解答と理由
    text: 'numbers = [4, 5]の後にtotal = 0、for item in numbers:、字下げしたtotal = total + item、字下げしないprint(total)を書くと9になります。'
    relatedSlideId: python-basics-ch01-l05-iterate-s02
relatedSlideIds: [python-basics-ch01-l05-iterate-s01, python-basics-ch01-l05-iterate-s02]
