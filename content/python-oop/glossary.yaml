schemaVersion: 1
entries:
  - id: python-class-instance
    term: Classから別々のInstanceを作る
    definition: ClassはInstanceを作る型。Instanceごとに値を持ち、selfは呼出先を受ける慣習名。
    firstSlideId: python-oop-ch01-l01-s01
    relatedIds: []
  - id: python-identity
    term: 同じ値と同じobjectを分ける
    definition: 値の等価性ではなく、2つの名前が同じobjectを参照するかをisで確かめること。
    firstSlideId: python-oop-ch01-l01-s02
    relatedIds: []
  - id: python-attribute-lookup
    term: Instanceの属性がClassの属性を隠す
    definition: この最小例ではInstance上の属性を先に使い、なければClassの属性を使う。
    firstSlideId: python-oop-ch01-l01-s03
    relatedIds: []
  - id: python-instance-method
    term: Instance methodにはInstanceが渡る
    definition: Instanceからの呼出しでは先頭へInstanceが渡り、Classから呼ぶときは明示するmethod。
    firstSlideId: python-oop-ch01-l02-s01
    relatedIds: []
  - id: python-classmethod
    term: Class methodにはClassが渡る
    definition: 先頭へ呼出先Classが渡るmethod。clsはそれを受ける慣習名。
    firstSlideId: python-oop-ch01-l02-s02
    relatedIds: []
  - id: python-staticmethod
    term: Static methodは暗黙の引数を受けない
    definition: InstanceやClassを暗黙に受けず、呼出時の明示引数で計算するmethod。
    firstSlideId: python-oop-ch01-l02-s03
    relatedIds: []
  - id: python-method-comparison
    term: 同じ計算と実引数を比較する
    definition: 同じ計算でも、Instance・Classの状態・明示引数のどれを使うかを比較すること。
    firstSlideId: python-oop-ch01-l02-s04
    relatedIds: []
  - id: python-inheritance
    term: 子Classで必要な振る舞いを上書きする
    definition: 種類としての振る舞いを変える。継承を常に選ぶわけではない。
    firstSlideId: python-oop-ch02-l01-s01
    relatedIds: []
  - id: python-inherited-initialization
    term: 継承した初期化でも値は個別に持つ
    definition: 初期化の共有と、値の共有は別。selfはその新しいInstance。
    firstSlideId: python-oop-ch02-l01-s02
    relatedIds: []
  - id: python-composition
    term: 別objectを持ち、仕事を委譲する
    definition: 仕事を頼む相手を持つ組立て。Counterを継承する必要はない。
    firstSlideId: python-oop-ch02-l01-s03
    relatedIds: []
  - id: python-object-design-choice
    term: 共有する参照と、設計の目的を選ぶ
    definition: 参照を共有する目的を明示する。別のViewまで共有させない。
    firstSlideId: python-oop-ch02-l01-s04
    relatedIds: []
  - id: python-property-read
    term: Propertyは属性の読取りをmethodへつなぐ
    definition: 利用側は属性として読む。内部名は秘密保護ではない。
    firstSlideId: python-oop-ch02-l02-s01
    relatedIds: []
  - id: python-property-write
    term: 代入はsetterで、保存前に検証する
    definition: 読取りと書込みの処理を分ける。検証してから内部値を変える。
    firstSlideId: python-oop-ch02-l02-s02
    relatedIds: []
  - id: python-property-validation
    term: 拒否した代入で、元の値を壊さない
    definition: 拒否後の状態も確認する。例外は自動の巻戻しではない。
    firstSlideId: python-oop-ch02-l02-s03
    relatedIds: []
  - id: python-property-invariants
    term: 初期化にも同じ条件を通す
    definition: 初期化も同じsetterを通す。値はInstanceごとに持つ。
    firstSlideId: python-oop-ch02-l02-s04
    relatedIds: []
  - id: python-dunder-length
    term: lenの呼出しをClassへつなぐ
    definition: 特別な操作の契約を実装する。文字列の「2」と整数2は別。
    firstSlideId: python-oop-ch02-l03-s01
    relatedIds: []
  - id: python-dunder-string
    term: print・strが使う文字列を返す
    definition: 表示は現在の状態から作る。文字列表示用dunderは文字列を返す契約。
    firstSlideId: python-oop-ch02-l03-s02
    relatedIds: []
  - id: python-object-copy
    term: Listの共有と浅いコピーを区別する
    definition: 代入は新しいListを作らない。浅いコピーの範囲を意識する。
    firstSlideId: python-oop-ch02-l03-s03
    relatedIds: []
  - id: python-dunder-contract
    term: dunderにも返却型の契約がある
    definition: 用途に合うdunderだけを作る。型が違えば実際にエラーになる。
    firstSlideId: python-oop-ch02-l03-s04
    relatedIds: []
  - id: python-function-transform
    term: Function objectを渡し、別のFunctionを受け取る
    definition: Functionを渡すことと、呼び出した結果を渡すことは別。
    firstSlideId: python-oop-ch03-l01-s01
    relatedIds: []
  - id: python-closure-state
    term: Closureが覚える状態の持ち主を分ける
    definition: 状態を全体で共有せず、外側の呼出しごとに持つ。
    firstSlideId: python-oop-ch03-l01-s02
    relatedIds: []
  - id: python-argument-forwarding
    term: 引数と戻り値をwrapperの先へ渡す
    definition: 集める記法と、展開して渡す記法を区別する。
    firstSlideId: python-oop-ch03-l01-s03
    relatedIds: []
  - id: python-decorator-syntax
    term: '@記法と明示適用、例外の通り道を比べる'
    definition: 例外の前に行った状態変更は、自動では巻き戻らない。
    firstSlideId: python-oop-ch03-l01-s04
    relatedIds: []
  - id: python-metadata-loss
    term: 動くwrapperでも名前と説明は失われる
    definition: 正しい戻り値だけでは、説明情報の保持を確認できない。
    firstSlideId: python-oop-ch03-l02-s01
    relatedIds: []
  - id: python-wraps-metadata
    term: wrapsで元の名前・説明・参照を引き継ぐ
    definition: 標準の補助関数で引き継ぐ。万能な動作保証ではない。
    firstSlideId: python-oop-ch03-l02-s02
    relatedIds: []
  - id: python-wraps-behavior
    term: metadataの修復と動作の修復を分ける
    definition: 固定値を返すwrapperを、目標達成とは扱わない。
    firstSlideId: python-oop-ch03-l02-s03
    relatedIds: []
  - id: python-wraps-comparison
    term: 状態・metadata・実エラーを一緒に確かめる
    definition: 説明情報と実際の動作を、別々の観測で確かめる。
    firstSlideId: python-oop-ch03-l02-s04
    relatedIds: []
  - id: python-decorator-configuration
    term: 設定を渡してdecoratorを作る
    definition: 引数付きdecoratorは、設定からdecoratorを作るFunctionです。trace_calls("加算")の戻り値configuredは、まだ元の計算を実行しません。configured(add)が装飾済みFunctionを返します。ここではこれから作るtrace_callsと、既習のaddを使います。演習を完成した後の定義を前提にした例です。
    firstSlideId: python-oop-ch03-l03-s01
    relatedIds: []
  - id: python-decoration-timing
    term: 設定時・装飾時・呼出時を追う
    definition: 3つの時点で実行する本体が変わります。次は関係を表示する短い例です。wrapsと回数は省いて時点だけを観察します。@factory("記録")も、factoryの結果へFunctionを渡す装飾です。
    firstSlideId: python-oop-ch03-l03-s02
    relatedIds: []
  - id: python-configured-state
    term: 同じ設定でもwrapperの状態は分ける
    definition: labelは設定時のClosureへ保持します。callsはdecorateの中で0にし、装飾のたびに別の状態を作ります。factory側へcallsを置くと、同じ設定を再利用したwrapper同士で意図せず共有します。
    firstSlideId: python-oop-ch03-l03-s03
    relatedIds: []
  - id: python-configured-contract
    term: 設定を加えても中継の契約を守る
    definition: 設定を受け取る層を増やしても、引数・戻り値・例外・metadataは前単元と同じ契約です。回数は元を呼ぶ前に増えるため、例外でも増加は残ります。wrapsだけでは中継や状態分離は保証されません。
    firstSlideId: python-oop-ch03-l03-s04
    relatedIds: []
  - id: python-project-state-owners
    term: 記録値と呼出回数の持ち主を分ける
    definition: Projectでは記録のtotalをLedgerのInstanceへ置き、回数を各wrapperへ置きます。bookとagainは同じ設定でも別のwrapperです。Ledgerは前章と同じClassとInstance methodで、selfが呼出先を受けます。
    firstSlideId: python-oop-ch04-l01-s01
    relatedIds: []
  - id: python-project-forwarding
    term: 元の記録処理へ引数と結果を渡す
    definition: decoratorは回数の表示を受け持ち、bookは通常記録、bonusは2倍の特典を計算し、Ledger.addが値を検証して記録します。wrapperが固定値を返すだけでは、totalも元の戻り値も保てません。metadataも別に確認します。
    firstSlideId: python-oop-ch04-l01-s02
    relatedIds: []
  - id: python-project-recovery
    term: 失敗後に保存して再開する
    definition: 負値はLedger.addで更新前に拒否します。例外はwrapperから呼出元へ伝わり、回数は増えても記録値は変わりません。Sourceを保存して再読込で再開し、最初に戻すでstarterへ戻せます。移動には既存JSON転送を使います。
    firstSlideId: python-oop-ch04-l01-s03
    relatedIds: []
