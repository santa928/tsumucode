<svg xmlns="http://www.w3.org/2000/svg" width="420" height="258" viewBox="0 0 420 258" role="img" aria-label="失敗時: 回数は2、記録値は2のまま、再開時: 回数3 / 記録値3の関係図。">
  <rect width="420" height="258" rx="16" fill="#f5f1df"/>
  <rect x="16" y="18" width="388" height="64" rx="10" fill="white" stroke="#00594f" stroke-width="2"/>
  <text x="28" y="57" fill="#123d36" font-family="sans-serif" font-size="20">失敗時: 回数は2</text>
  <rect x="16" y="94" width="388" height="64" rx="10" fill="white" stroke="#00594f" stroke-width="2"/>
  <text x="28" y="133" fill="#123d36" font-family="sans-serif" font-size="20">記録値は2のまま</text>
  <rect x="16" y="170" width="388" height="64" rx="10" fill="white" stroke="#00594f" stroke-width="2"/>
  <text x="28" y="209" fill="#123d36" font-family="sans-serif" font-size="20">再開時: 回数3 / 記録値3</text>
</svg>
