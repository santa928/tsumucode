<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 276" role="img" aria-labelledby="title desc">
  <title id="title">instance-binding</title>
  <desc id="desc">Instanceからの呼出しではfirstがselfへ渡り、Classからの呼出しでは同じfirstを明示する説明図。</desc>
  <rect width="420" height="276" fill="#f5f1df"/>
  <g font-family="sans-serif" font-size="20" fill="#153c35">
    <rect x="18" y="16" width="384" height="96" rx="10" fill="#fff" stroke="#17483d" stroke-width="2"/>
    <text x="30" y="48">first.doubled()</text>
    <text x="30" y="78">暗黙にself = first → 6</text>
    <rect x="18" y="120" width="384" height="96" rx="10" fill="#fff" stroke="#17483d" stroke-width="2"/>
    <text x="30" y="152">Counter.doubled(first)</text>
    <text x="30" y="182">明示してself = first → 6</text>
    <text x="18" y="236">同じInstanceで同じ計算。</text>
    <text x="18" y="264">渡し方が暗黙か明示かを比べる。</text>
  </g>
</svg>
