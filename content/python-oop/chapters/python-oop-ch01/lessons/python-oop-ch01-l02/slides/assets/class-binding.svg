<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="title desc">
<title id="title">class-binding</title>
<desc id="desc">classmethodへCounterがclsとして渡り、Classの倍率2では6、倍率4では12になる説明図。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6" fill="#17483d"/></marker></defs>
<rect width="720" height="250" fill="#f5f1df"/>
<rect x="20" y="35" width="315" height="60" rx="10" fill="#fff" stroke="#17483d" stroke-width="2"/>
<text x="32" y="72" font-family="sans-serif" font-size="17" fill="#153c35">Counter.factor = 2</text>
<rect x="385" y="35" width="315" height="60" rx="10" fill="#fff" stroke="#17483d" stroke-width="2"/>
<text x="397" y="72" font-family="sans-serif" font-size="17" fill="#153c35">cls = Counter / value = 3 → 6</text>
<line x1="335" y1="65" x2="385" y2="65" stroke="#17483d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="125" width="315" height="60" rx="10" fill="#fff" stroke="#17483d" stroke-width="2"/>
<text x="32" y="162" font-family="sans-serif" font-size="17" fill="#153c35">Counter.factor = 4</text>
<rect x="385" y="125" width="315" height="60" rx="10" fill="#fff" stroke="#17483d" stroke-width="2"/>
<text x="397" y="162" font-family="sans-serif" font-size="17" fill="#153c35">cls = Counter / value = 3 → 12</text>
<line x1="335" y1="155" x2="385" y2="155" stroke="#17483d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="24" y="228" font-family="sans-serif" font-size="17" fill="#153c35">classmethodは呼出先Classの現在の倍率を読む</text>
</svg>
