<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 276" role="img" aria-labelledby="title desc">
  <title id="title">class-binding</title>
  <desc id="desc">classmethodへCounterがclsとして渡り、Classの倍率2では6、倍率4では12になる説明図。</desc>
  <rect width="420" height="276" fill="#f5f1df"/>
  <g font-family="sans-serif" font-size="20" fill="#153c35">
    <rect x="18" y="16" width="384" height="96" rx="10" fill="#fff" stroke="#17483d" stroke-width="2"/>
    <text x="30" y="48">Counter.factor = 2</text>
    <text x="30" y="78">cls = Counter / value = 3 → 6</text>
    <rect x="18" y="120" width="384" height="96" rx="10" fill="#fff" stroke="#17483d" stroke-width="2"/>
    <text x="30" y="152">Counter.factor = 4</text>
    <text x="30" y="182">cls = Counter / value = 3 → 12</text>
    <text x="18" y="236">classmethodは呼出先Classの</text>
    <text x="18" y="264">現在の倍率を読む。</text>
  </g>
</svg>
