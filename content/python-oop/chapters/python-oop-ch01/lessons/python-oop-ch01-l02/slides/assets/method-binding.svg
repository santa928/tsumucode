<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 285" role="img" aria-labelledby="title desc">
<title id="title">method-binding</title>
<desc id="desc">first.doubledにselfとしてfirst、Counter.doubled_fromにclsとしてCounterが渡り、doubled_valueは明示したvalueとfactorだけを受ける説明図。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6" fill="#17483d"/></marker></defs>
<rect width="720" height="285" fill="#f5f1df"/>
<rect x="20" y="50" width="300" height="48" rx="10" fill="#fff" stroke="#17483d" stroke-width="2"/>
<text x="32" y="80.0" font-family="sans-serif" font-size="17" fill="#153c35">first.doubled()</text>
<rect x="390" y="50" width="310" height="48" rx="10" fill="#fff" stroke="#17483d" stroke-width="2"/>
<text x="402" y="80.0" font-family="sans-serif" font-size="17" fill="#153c35">self=first → 3 × 2 = 6</text>
<rect x="20" y="115" width="300" height="48" rx="10" fill="#fff" stroke="#17483d" stroke-width="2"/>
<text x="32" y="145.0" font-family="sans-serif" font-size="17" fill="#153c35">Counter.doubled_from(3)</text>
<rect x="390" y="115" width="310" height="48" rx="10" fill="#fff" stroke="#17483d" stroke-width="2"/>
<text x="402" y="145.0" font-family="sans-serif" font-size="17" fill="#153c35">cls=Counter / value=3 → 6</text>
<rect x="20" y="180" width="300" height="48" rx="10" fill="#fff" stroke="#17483d" stroke-width="2"/>
<text x="32" y="210.0" font-family="sans-serif" font-size="17" fill="#153c35">doubled_value(3, 2)</text>
<rect x="390" y="180" width="310" height="48" rx="10" fill="#fff" stroke="#17483d" stroke-width="2"/>
<text x="402" y="210.0" font-family="sans-serif" font-size="17" fill="#153c35">value=3 / factor=2 → 6</text>
<line x1="320" y1="75" x2="390" y2="75" stroke="#17483d" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="320" y1="140" x2="390" y2="140" stroke="#17483d" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="320" y1="205" x2="390" y2="205" stroke="#17483d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="24" y="264" font-family="sans-serif" font-size="17" fill="#153c35">呼出形式と実引数の対応（説明図）。methodの優劣ではない</text>
</svg>
