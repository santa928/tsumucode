<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 344" role="img" aria-labelledby="title desc">
  <title id="title">method-binding</title>
  <desc id="desc">first.doubledにselfとしてfirst、Counter.doubled_fromにclsとしてCounterが渡り、doubled_valueは明示したvalueとfactorだけを受ける説明図。</desc>
  <rect width="420" height="344" fill="#f5f1df"/>
  <g font-family="sans-serif" font-size="20" fill="#153c35">
    <rect x="18" y="16" width="384" height="84" rx="10" fill="#fff" stroke="#17483d" stroke-width="2"/>
    <text x="30" y="48">first.doubled()</text>
    <text x="30" y="78">self = first → 3 × 2 = 6</text>
    <rect x="18" y="108" width="384" height="84" rx="10" fill="#fff" stroke="#17483d" stroke-width="2"/>
    <text x="30" y="140">Counter.doubled_from(3)</text>
    <text x="30" y="170">cls = Counter / value = 3 → 6</text>
    <rect x="18" y="200" width="384" height="84" rx="10" fill="#fff" stroke="#17483d" stroke-width="2"/>
    <text x="30" y="232">Counter.doubled_value(3, 2)</text>
    <text x="30" y="262">value = 3 / factor = 2 → 6</text>
    <text x="18" y="304">呼出形式と実引数の対応を比べる。</text>
    <text x="18" y="332">methodの優劣を示す図ではない。</text>
  </g>
</svg>
