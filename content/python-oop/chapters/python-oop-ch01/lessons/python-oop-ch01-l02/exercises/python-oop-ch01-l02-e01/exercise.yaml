hints:
  - id: python-oop-ch01-l02-e01-h01
    level: 1
    title: 最初の手掛かり
    text: 'Classからの通常method呼出ではInstanceを明示します。classmethodでは呼出先Classが先頭へ渡ります。'
    relatedSlideId: python-oop-ch01-l02-s04
  - id: python-oop-ch01-l02-e01-h02
    level: 2
    title: コードを組み立てる
    text: 'staticmethodのvalue/factorはどちらも呼出時の引数です。Classから暗黙の値は渡りません。'
    relatedSlideId: python-oop-ch01-l02-s04
  - id: python-oop-ch01-l02-e01-h03
    level: 3
    title: 解答と理由
    text: 'doubled_fromはvalue * cls.factor、doubled_valueはvalue * factorです。Classの倍率4と、最後に渡す倍率2を区別します。'
    relatedSlideId: python-oop-ch01-l02-s04
