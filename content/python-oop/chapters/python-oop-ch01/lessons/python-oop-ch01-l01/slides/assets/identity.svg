<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 285" role="img" aria-labelledby="title desc">
<title id="title">identity</title>
<desc id="desc">firstとaliasは値3を持つ同じInstanceへ、secondは値3を持つ別Instanceへつながる説明図。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6" fill="#17483d"/></marker></defs>
<rect width="720" height="285" fill="#f5f1df"/>
<rect x="40" y="65" width="170" height="65" rx="10" fill="#fff" stroke="#17483d" stroke-width="2"/>
<text x="52" y="103.5" font-family="sans-serif" font-size="17" fill="#153c35">first / alias</text>
<rect x="360" y="65" width="240" height="65" rx="10" fill="#fff" stroke="#17483d" stroke-width="2"/>
<text x="372" y="103.5" font-family="sans-serif" font-size="17" fill="#153c35">Instance A: value 3</text>
<rect x="40" y="155" width="170" height="55" rx="10" fill="#fff" stroke="#17483d" stroke-width="2"/>
<text x="52" y="188.5" font-family="sans-serif" font-size="17" fill="#153c35">second</text>
<rect x="360" y="155" width="240" height="55" rx="10" fill="#fff" stroke="#17483d" stroke-width="2"/>
<text x="372" y="188.5" font-family="sans-serif" font-size="17" fill="#153c35">Instance B: value 3</text>
<line x1="210" y1="95" x2="360" y2="95" stroke="#17483d" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="210" y1="180" x2="360" y2="180" stroke="#17483d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="24" y="264" font-family="sans-serif" font-size="17" fill="#153c35">同じ値でも別のInstance。isはobjectの同一性を比較</text>
</svg>
