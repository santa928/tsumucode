<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 276" role="img" aria-labelledby="title desc">
  <title id="title">identity</title>
  <desc id="desc">firstとaliasは値3を持つ同じInstanceへ、secondは値3を持つ別Instanceへつながる説明図。</desc>
  <rect width="420" height="276" fill="#f5f1df"/>
  <g font-family="sans-serif" font-size="20" fill="#153c35">
    <rect x="18" y="16" width="384" height="96" rx="10" fill="#fff" stroke="#17483d" stroke-width="2"/>
    <text x="30" y="48">first / alias → Instance A</text>
    <text x="30" y="78">value = 3（同じobject）</text>
    <rect x="18" y="120" width="384" height="96" rx="10" fill="#fff" stroke="#17483d" stroke-width="2"/>
    <text x="30" y="152">second → Instance B</text>
    <text x="30" y="182">value = 3（別のobject）</text>
    <text x="18" y="236">値が同じでも、Instanceは別。</text>
    <text x="18" y="264">isはobjectの同一性を比べる。</text>
  </g>
</svg>
