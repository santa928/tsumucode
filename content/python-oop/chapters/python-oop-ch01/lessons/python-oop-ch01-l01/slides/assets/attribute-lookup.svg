<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 344" role="img" aria-labelledby="title desc">
  <title id="title">attribute-lookup</title>
  <desc id="desc">first独自のfactor7がClassのfactor4を隠し、factorを持たないsecondはClassの4を読む説明図。</desc>
  <rect width="420" height="344" fill="#f5f1df"/>
  <g font-family="sans-serif" font-size="20" fill="#153c35">
    <rect x="18" y="16" width="384" height="84" rx="10" fill="#fff" stroke="#17483d" stroke-width="2"/>
    <text x="30" y="48">Counter</text>
    <text x="30" y="78">Classのfactor = 4</text>
    <rect x="18" y="108" width="384" height="84" rx="10" fill="#fff" stroke="#17483d" stroke-width="2"/>
    <text x="30" y="140">first: value = 3 / factor = 7</text>
    <text x="30" y="170">first.factor → 独自の7</text>
    <rect x="18" y="200" width="384" height="84" rx="10" fill="#fff" stroke="#17483d" stroke-width="2"/>
    <text x="30" y="232">second: value = 5</text>
    <text x="30" y="262">second.factor → Classの4</text>
    <text x="18" y="304">firstの7がClassの4を隠す。</text>
    <text x="18" y="332">secondはClassの4を参照する。</text>
  </g>
</svg>
