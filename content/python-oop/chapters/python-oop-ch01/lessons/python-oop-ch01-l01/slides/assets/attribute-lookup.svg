<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 285" role="img" aria-labelledby="title desc">
<title id="title">attribute-lookup</title>
<desc id="desc">first独自のfactor7がClassのfactor4を隠し、factorを持たないsecondはClassの4を読む説明図。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6" fill="#17483d"/></marker></defs>
<rect width="720" height="285" fill="#f5f1df"/>
<rect x="255" y="25" width="250" height="60" rx="10" fill="#fff" stroke="#17483d" stroke-width="2"/>
<text x="267" y="61.0" font-family="sans-serif" font-size="17" fill="#153c35">Counter: factor 4</text>
<rect x="30" y="145" width="300" height="75" rx="10" fill="#fff" stroke="#17483d" stroke-width="2"/>
<text x="42" y="188.5" font-family="sans-serif" font-size="17" fill="#153c35">first: value 3 / factor 7</text>
<rect x="390" y="145" width="300" height="75" rx="10" fill="#fff" stroke="#17483d" stroke-width="2"/>
<text x="402" y="188.5" font-family="sans-serif" font-size="17" fill="#153c35">second: value 5</text>
<line x1="540" y1="145" x2="420" y2="85" stroke="#17483d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="24" y="264" font-family="sans-serif" font-size="17" fill="#153c35">firstは独自の7。secondはClassへ参照し4</text>
</svg>
