<svg xmlns="http://www.w3.org/2000/svg" width="420" height="276" viewBox="0 0 420 276" role="img" aria-label="名前は一致しても元のFunctionを呼ばず固定値0を返す誤りの関係図。">
  <rect width="420" height="276" rx="16" fill="#f5f1df"/>
  <rect x="18" y="18" width="384" height="96" rx="10" fill="white" stroke="#00594f" stroke-width="2"/>
  <rect x="18" y="122" width="384" height="96" rx="10" fill="white" stroke="#00594f" stroke-width="2"/>
  <g fill="#123d36" font-family="sans-serif" font-size="20">
    <text x="30" y="50">名前の一致 → True</text>
    <text x="30" y="80">metadataだけは引き継ぐ</text>
    <text x="30" y="154">wrong(3) → 0</text>
    <text x="30" y="184">元の計算を実行していない</text>
    <text x="18" y="244">Functionと状態の通り道を確認</text>
    <text x="18" y="268">比較してから、目的に合う形へ直す</text>
  </g>
</svg>
