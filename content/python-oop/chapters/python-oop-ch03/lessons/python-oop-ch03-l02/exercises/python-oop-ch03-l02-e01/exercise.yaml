    level: 2
    title: コードを組み立てる
    text: wrapsへ渡すのは元のFunction objectです。元のFunctionをこの時点で実行しません。
    relatedSlideId: python-oop-ch03-l02-s04
  - id: python-oop-ch03-l02-e01-h03
    level: 3
    title: 解答と理由
    text: wrapperの直前へ@wraps(function)を付け、return function(*args, **kwargs)で元の動作を中継します。
    relatedSlideId: python-oop-ch03-l02-s04
