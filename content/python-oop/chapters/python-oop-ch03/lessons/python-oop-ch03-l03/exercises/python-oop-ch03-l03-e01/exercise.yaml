hints:
  - id: python-oop-ch03-l03-e01-h01
    level: 1
    title: 考え方の手掛かり
    text: 設定値は同じでも、装飾するたびに新しいwrapperと回数が必要です。
    relatedSlideId: python-oop-ch03-l03-s04
  - id: python-oop-ch03-l03-e01-h02
    level: 2
    title: 処理を組み立てる
    text: 回数をdecorate内で0にし、wrapperではnonlocalで増やしてから元のFunctionを呼びます。
    relatedSlideId: python-oop-ch03-l03-s04
  - id: python-oop-ch03-l03-e01-h03
    level: 3
    title: 解答と理由
    text: wraps(function)をwrapperへ適用し、return function(*args, **kwargs)で中継します。
    relatedSlideId: python-oop-ch03-l03-s04
