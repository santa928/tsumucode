    title: 考え方の手掛かり
    text: 利用者が使う操作に対し、長さと表示のどちらを提供するかを分けます。
    relatedSlideId: python-oop-ch02-l03-s04
  - id: python-oop-ch02-l03-e01-h02
    level: 2
    title: コードを組み立てる
    text: 受け取るtitlesはListへの参照です。外側をコピーし、文字列表示には現在の個数を使います。
    relatedSlideId: python-oop-ch02-l03-s04
  - id: python-oop-ch02-l03-e01-h03
    level: 3
    title: 解答と理由
    text: self.titles = list(titles)、長さ用dunderはlen(self.titles)、文字列表示用dunderは「本:」とstr(len(self))を連結します。
    relatedSlideId: python-oop-ch02-l03-s04
