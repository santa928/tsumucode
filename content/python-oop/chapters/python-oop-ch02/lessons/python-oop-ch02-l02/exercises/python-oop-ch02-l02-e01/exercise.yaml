hints:
  - id: python-oop-ch02-l02-e01-h01
    level: 1
    title: 考え方の手掛かり
    text: 読取りはgetter、代入はsetterです。値の範囲は保存前に調べます。
    relatedSlideId: python-oop-ch02-l02-s04
  - id: python-oop-ch02-l02-e01-h02
    level: 2
    title: コードを組み立てる
    text: 0と100は有効です。負の値と101を拒否しても、直前の値を保ちます。
    relatedSlideId: python-oop-ch02-l02-s04
  - id: python-oop-ch02-l02-e01-h03
    level: 3
    title: 解答と理由
    text: value < 0 or value > 100ならValueErrorを送出し、その後にself._value =
      valueを書きます。初期化もself.valueへ代入します。
    relatedSlideId: python-oop-ch02-l02-s04
