    assertion:
      kind: count
      operator: equals
      expected: 2
    feedback:
      target: 2枚が共通のnote-cardを使う
      expected: '2'
      nextAction: section#read-cardとsection#make-cardのclassを確認します。2枚ともnote-cardを使い、同じCSSの部品から見た目を共有します。
