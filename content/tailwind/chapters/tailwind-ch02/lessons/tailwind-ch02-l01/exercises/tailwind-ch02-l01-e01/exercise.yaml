hints:
  - id: tailwind-ch02-l01-e01-h01
    level: 1
    title: 値のつながりを見る
    text: '@themeのcolor-brandは文字・枠・ボタンへ、spacing-cardはカード内とカード間へ届きます。値を1か所ずつ変え、2枚を見比べます。'
    relatedSlideId: tailwind-ch02-l01-s01
  - id: tailwind-ch02-l01-e01-h02
    level: 2
    title: 共通の見た目を置く
    text: .note-cardの@applyにp-cardを使い、2枚目の個別Utility列をnote-cardへ置き換えます。内容と並びのclassはHTMLに残します。
    relatedSlideId: tailwind-ch02-l01-s02
  - id: tailwind-ch02-l01-e01-h03
    level: 3
    title: 解答とbuildへのつなぎ方
    text: brandは#0f3c4c、paperは#fffaf0、cardは24pxです。共通classはp-cardを使い、2枚でnote-cardを共有します。親のflex flex-col md:flex-rowとボタンのfocus-visible:outline-solid/2/brand/offset-2を保ちます。合格後はZIPのREADMEに沿い、外部でbuildと表示を確認します。
    relatedSlideId: tailwind-ch02-l01-s03
