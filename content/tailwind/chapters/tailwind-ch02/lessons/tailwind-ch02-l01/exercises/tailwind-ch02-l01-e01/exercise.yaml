id: tailwind-ch02-l01-e01
kind: guided-project
workspaceId: tailwind-ch02-l01-e01
countsTowardStandardExerciseTotal: false
title: 読書カードの見た目を共通化する
projectId: tailwind-reading-cards
instructionsSource: instructions.md
requiresConcepts:
  - conceptId: tailwind-theme
    minimumLevel: transform
  - conceptId: tailwind-reuse
    minimumLevel: transform
  - conceptId: tailwind-production
    minimumLevel: read
  - conceptId: tailwind-responsive
    minimumLevel: transform
  - conceptId: tailwind-focus
    minimumLevel: transform
  - conceptId: tailwind-hover
    minimumLevel: transform
scaffoldLevel: transform
steps:
  - id: theme
    file: styles.css
    target: '@themeの3つの値'
    starterAnchor: '--color-brand: #000000;'
    change: brandを#0f3c4c、paperを#fffaf0、cardを24pxへ直す
    observe: 2枚の配色、カード間隔、ボタンの色が一緒に変わる
    requiresConceptIds:
      - tailwind-theme
    validationRuleIds:
      - tailwind-ch02-l01-e01-r03
      - tailwind-ch02-l01-e01-r04
      - tailwind-ch02-l01-e01-r05
      - tailwind-ch02-l01-e01-r08
      - tailwind-ch02-l01-e01-r09
      - tailwind-ch02-l01-e01-r16
  - id: component
    file: styles.css
    target: .note-cardの@apply
    starterAnchor: '@apply p-2 border border-brand bg-paper text-brand;'
    change: p-2をp-cardへ直し、共有tokenの余白を使う
    observe: 共通classを使うカードの内側の余白が24pxになる
    requiresConceptIds:
      - tailwind-reuse
    validationRuleIds:
      - tailwind-ch02-l01-e01-r02
  - id: reuse
    file: index.html
    target: section#make-cardのclass
    starterAnchor: class="p-card border border-brand bg-paper text-brand"
    change: 個別のUtility列をnote-cardへ置き換える
    observe: 2枚が同じCSSの部品を使い、共通の変更が両方へ届く
    requiresConceptIds:
      - tailwind-reuse
    validationRuleIds:
      - tailwind-ch02-l01-e01-r01
  - id: verify
    file: index.html
    target: 親の幅条件とbuttonの操作状態
    starterAnchor: focus-visible:outline-brand
    change: 親とbuttonのclassを保ち、代表幅とTabで見た目を確かめる
    observe: 767pxまで縦、768pxから横。Tabの輪郭とhoverの色が見える。ボタンの名前を残し、Tabで移動できる
    requiresConceptIds:
      - tailwind-responsive
      - tailwind-focus
      - tailwind-hover
    validationRuleIds:
      - tailwind-ch02-l01-e01-r06
      - tailwind-ch02-l01-e01-r07
      - tailwind-ch02-l01-e01-r10
      - tailwind-ch02-l01-e01-r11
      - tailwind-ch02-l01-e01-r13
      - tailwind-ch02-l01-e01-r12
      - tailwind-ch02-l01-e01-r14
