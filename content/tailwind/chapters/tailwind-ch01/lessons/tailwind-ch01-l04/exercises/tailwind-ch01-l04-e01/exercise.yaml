hints:
  - id: tailwind-ch01-l04-e01-h01
    level: 1
    title: mainのclassを確認する
    text: prefix（前置名）なしの指定はすべての幅へ効きます。狭い幅で縦にする指定を先に決めます。
    relatedSlideId: tailwind-ch01-l04-s01
  - id: tailwind-ch01-l04-e01-h02
    level: 2
    title: mainのclassを確認する
    text: mdは48rem以上、smは40rem以上です。root 16pxの環境で、767pxと768pxのどちらに適用されるかを比べます。
    relatedSlideId: tailwind-ch01-l04-s02
  - id: tailwind-ch01-l04-e01-h03
    level: 3
    title: 基本と条件付きの指定を組み合わせる
    text: mainをflex flex-col md:flex-row gap-4 p-4にします。flex-colが基本、md:flex-rowが768px以上の上書きです。
    relatedSlideId: tailwind-ch01-l04-s02
relatedSlideIds:
  - tailwind-ch01-l04-s01
  - tailwind-ch01-l04-s02
