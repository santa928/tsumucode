    <text x="30" y="50">gap：1rem → 2rem</text><text x="30" y="275">paddingは1remのまま</text><g fill="#ffffff" stroke="#334155" stroke-width="2"><rect x="30" y="75" width="270" height="155" rx="8"/><rect x="340" y="75" width="270" height="155" rx="8"/></g><g fill="#dbeafe" stroke="#1e40af" stroke-width="2"><rect x="50" y="115" width="105" height="70"/><rect x="175" y="115" width="105" height="70"/><rect x="360" y="115" width="95" height="70"/><rect x="495" y="115" width="95" height="70"/></g><text x="165" y="205" text-anchor="middle">項目間だけ広がる</text><text x="475" y="205" text-anchor="middle">枠の内側は同じ</text>
