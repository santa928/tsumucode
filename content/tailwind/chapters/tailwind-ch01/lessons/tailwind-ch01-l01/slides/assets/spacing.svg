<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-labelledby="title desc">
  <title id="title">項目間と枠の内側</title>
  <desc id="desc">外枠の内側の余白がpadding、2つの項目の間がgap。</desc>
  <rect x="2" y="2" width="636" height="246" rx="16" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
  <rect x="50" y="80" width="220" height="105" rx="10" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <rect x="320" y="80" width="220" height="105" rx="10" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <g font-family="sans-serif" font-size="24" fill="#0f172a">
    <text x="110" y="140">調べる</text><text x="390" y="140">作る</text>
    <text x="290" y="55" text-anchor="middle">gap：項目間</text>
    <text x="320" y="225" text-anchor="middle">padding：枠の内側</text>
  </g>
  <path d="M275 65 H315 M280 60 L275 65 L280 70 M310 60 L315 65 L310 70" stroke="#1e40af" stroke-width="3" fill="none"/>
  <path d="M10 160 H45 M15 155 L10 160 L15 165 M40 155 L45 160 L40 165" stroke="#334155" stroke-width="3" fill="none"/>
</svg>
