    group: all
    viewportMode: all
    viewportIds:
      - card-280
      - card-640
    target:
      kind: selector
      selector: '#card h1, #card p'
    assertion:
      kind: contrast
      minimum: 4.5
    feedback:
      target: '#cardのcontrastを確認する'
      expected: '4.5'
      nextAction: text-blackへ直す。白背景で黒文字を読めるかを確かめます。
    hintId: tailwind-ch01-l02-e01-h03
    relatedSlideId: tailwind-ch01-l02-s03
hints:
  - id: tailwind-ch01-l02-e01-h01
    level: 1
    title: 幅と上限の役割を分ける
    text: mainの幅が親より広くならないか、幅の上限が必要かを分けて考えます。内側の余白はpaddingです。
    relatedSlideId: tailwind-ch01-l02-s01
  - id: tailwind-ch01-l02-e01-h02
    level: 2
    title: 文字と行の高さを分ける
    text: textはfont-size、leadingはline-heightです。このthemeのrootは16pxなので、1.25remと1.75remをpxへ換算します。
    relatedSlideId: tailwind-ch01-l02-s02
  - id: tailwind-ch01-l02-e01-h03
    level: 3
    title: 必要なUtilityを確認する
    text: mainはw-full max-w-80 p-4 bg-white text-black、h1はtext-xl leading-7 font-boldです。幅と文字を別々に確認します。
    relatedSlideId: tailwind-ch01-l02-s03
relatedSlideIds:
  - tailwind-ch01-l02-s01
  - tailwind-ch01-l02-s02
  - tailwind-ch01-l02-s03
