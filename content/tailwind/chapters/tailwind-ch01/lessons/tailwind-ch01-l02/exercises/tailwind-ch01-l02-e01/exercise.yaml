id: tailwind-ch01-l02-e01
kind: standard
workspaceId: tailwind-ch01-l02-e01
countsTowardStandardExerciseTotal: true
title: 幅・余白・文字・色を組み合わせる
instructionsSource: instructions.md
requiresConcepts:
  - conceptId: tailwind-sizing
    minimumLevel: transform
  - conceptId: tailwind-padding
    minimumLevel: transform
  - conceptId: tailwind-typography
    minimumLevel: transform
  - conceptId: tailwind-color
    minimumLevel: transform
scaffoldLevel: transform
steps:
  - id: size
    file: index.html
    target: mainのclass
    starterAnchor: w-80
    change: w-fullとmax-w-80へ直す
    observe: 幅280pxで248px、幅640pxで320pxになる
    requiresConceptIds:
      - tailwind-sizing
    validationRuleIds:
      - tailwind-ch01-l02-e01-r01
      - tailwind-ch01-l02-e01-r02
      - tailwind-ch01-l02-e01-r03
  - id: spacing
    file: index.html
    target: mainのclass
    starterAnchor: p-2
    change: p-4へ直す
    observe: 内側の余白が16pxになる
    requiresConceptIds:
      - tailwind-padding
    validationRuleIds:
      - tailwind-ch01-l02-e01-r04
  - id: type
    file: index.html
    target: h1のclass
    starterAnchor: text-base leading-6
    change: text-xl leading-7へ直す
    observe: 文字が20px、行が28pxになる
    requiresConceptIds:
      - tailwind-typography
    validationRuleIds:
      - tailwind-ch01-l02-e01-r05
      - tailwind-ch01-l02-e01-r06
  - id: color
    file: index.html
    target: mainのclass
    starterAnchor: text-white
    change: text-blackへ直す
    observe: 白背景で黒文字を読める
    requiresConceptIds:
      - tailwind-color
    validationRuleIds:
      - tailwind-ch01-l02-e01-r07
      - tailwind-ch01-l02-e01-r08
files:
  - path: index.html
    language: html
    source: starter/index.html
    editable: true
solutionFiles:
  - path: index.html
    language: html
    source: solution/index.html
    editable: false
validationRules:
  - id: tailwind-ch01-l02-e01-r01
    label: '#cardのwidthを確認する'
    required: true
    group: all
    viewportMode: all
    viewportIds:
      - card-280
    target:
      kind: selector
      selector: '#card'
    assertion:
      kind: rect
      operator: equals
      expected: 248
      metric: width
      tolerance: 0.5
    feedback:
      target: '#cardのwidthを確認する'
      expected: '248'
      nextAction: w-fullとmax-w-80へ直す。幅280pxで248px、幅640pxで320pxになるかを確かめます。
    hintId: tailwind-ch01-l02-e01-h01
    relatedSlideId: tailwind-ch01-l02-s01
  - id: tailwind-ch01-l02-e01-r02
    label: '#cardのwidthを確認する'
