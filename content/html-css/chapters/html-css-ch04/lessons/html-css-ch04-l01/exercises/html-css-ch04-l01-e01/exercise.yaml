id: html-css-ch04-l01-e01
kind: standard
workspaceId: html-css-ch04-l01-e01
countsTowardStandardExerciseTotal: true
title: TypeとClass Selectorで色を分ける
instructionsSource: instructions.md
requiresConcepts:
  - { conceptId: type-selector, minimumLevel: transform }
  - { conceptId: class-selector, minimumLevel: transform }
scaffoldLevel: transform
steps:
  - id: set-common-paragraph-color
    file: styles.css
    target: 2つのParagraphへ届くp Rule
    starterAnchor: |-
      p {
        color: #24323d;
      }
    change: colorを#2d5d62へ変更する
    observe: introとaccentの両方が青緑になり、Type Selectorの共通範囲を確認できる
    requiresConceptIds: [type-selector]
    validationRuleIds: [html-css-ch04-l01-e01-r01, html-css-ch04-l01-e01-r03]
  - id: override-accent-color
    file: styles.css
    target: accent Classだけへ届く.accent Rule
    starterAnchor: |-
      .accent {
        color: #24323d;
      }
    change: colorを#9a3f25へ変更する
    observe: 2つ目だけが橙になり、Class Selectorの狭い範囲を確認できる
    requiresConceptIds: [class-selector]
    validationRuleIds: [html-css-ch04-l01-e01-r02, html-css-ch04-l01-e01-r04]
files:
  - { path: index.html, language: html, source: starter/index.html, editable: true }
  - { path: styles.css, language: css, source: starter/styles.css, editable: true }
solutionFiles:
  - { path: index.html, language: html, source: solution/index.html, editable: false }
  - { path: styles.css, language: css, source: solution/styles.css, editable: false }
validationRules:
  - id: html-css-ch04-l01-e01-r01
    label: Type Selectorで通常文を青緑にする
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: p.intro }
    assertion:
      kind: computed-style
      property: color
      operator: equals
      expected: rgb(45, 93, 98)
    feedback:
      target: intro ParagraphのComputed Color
      expected: rgb(45, 93, 98)
      nextAction: p Ruleのcolorを#2d5d62へ変更します。
    hintId: html-css-ch04-l01-e01-h01
    relatedSlideId: html-css-ch04-l01-s02
  - id: html-css-ch04-l01-e01-r02
    label: Class SelectorでAccentを橙にする
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: p.accent }
    assertion:
      kind: computed-style
      property: color
      operator: equals
      expected: rgb(154, 63, 37)
    feedback:
      target: accent ParagraphのComputed Color
      expected: rgb(154, 63, 37)
      nextAction: .accent Ruleのcolorを#9a3f25へ変更します。
    hintId: html-css-ch04-l01-e01-h03
    relatedSlideId: html-css-ch04-l01-s03
  - id: html-css-ch04-l01-e01-r03
    label: p Type Selectorで共通色を指定する
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: source, file: styles.css }
    assertion:
      kind: text
      operator: contains-normalized
      expected: |-
        p {
          color: #2d5d62;
    feedback:
      target: styles.cssのp Rule
      expected: p Type Selectorへcolor #2d5d62を指定
      nextAction: bodyやinline Styleではなく、用意されたp RuleのValueを#2d5d62へ直します。
    hintId: html-css-ch04-l01-e01-h01
    relatedSlideId: html-css-ch04-l01-s02
  - id: html-css-ch04-l01-e01-r04
    label: accent Class Selectorで橙を指定する
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: source, file: styles.css }
    assertion:
      kind: text
      operator: contains-normalized
      expected: |-
        .accent {
          color: #9a3f25;
    feedback:
      target: styles.cssの.accent Rule
      expected: .accent Class Selectorへcolor #9a3f25を指定
      nextAction: inline Styleではなく、用意された.accent RuleのValueを#9a3f25へ直します。
    hintId: html-css-ch04-l01-e01-h03
    relatedSlideId: html-css-ch04-l01-s03
hints:
  - id: html-css-ch04-l01-e01-h01
    level: 1
    title: 2つのParagraphの共通点を見る
    text: どちらもpですが、2つ目だけaccent Classを持つことを確認します。
    relatedSlideId: html-css-ch04-l01-s02
  - id: html-css-ch04-l01-e01-h02
    level: 2
    title: 広いRuleから設定する
    text: p Ruleで共通色を設定した後、.accent Ruleで一部だけを上書きします。
    relatedSlideId: html-css-ch04-l01-s03
  - id: html-css-ch04-l01-e01-h03
    level: 3
    title: 2つのColor Valueを直す
    text: pを#2d5d62、.accentを#9a3f25にし、Semicolonまで書きます。
    relatedSlideId: html-css-ch04-l01-s03
relatedSlideIds:
  - html-css-ch04-l01-s01
  - html-css-ch04-l01-s02
  - html-css-ch04-l01-s03
previewViewports:
  - { id: desktop-1280, width: 1280, height: 720 }
assets: []
fixtures:
  - id: html-css-ch04-l01-e01-valid-alternative
    expectedStatus: pass
    files:
      - {
          path: index.html,
          language: html,
          source: fixtures/valid-alternative/index.html,
          editable: false,
        }
      - {
          path: styles.css,
          language: css,
          source: fixtures/valid-alternative/styles.css,
          editable: false,
        }
    expectedFeedbackRuleIds: []
  - id: html-css-ch04-l01-e01-incomplete
    expectedStatus: incomplete
    files:
      - {
          path: index.html,
          language: html,
          source: fixtures/incomplete/index.html,
          editable: false,
        }
      - { path: styles.css, language: css, source: fixtures/incomplete/styles.css, editable: false }
    expectedFeedbackRuleIds: [html-css-ch04-l01-e01-r02, html-css-ch04-l01-e01-r04]
