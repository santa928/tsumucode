id: html-css-ch04-l04-e01
kind: standard
workspaceId: html-css-ch04-l04-e01
countsTowardStandardExerciseTotal: true
title: remで余白と文字を調整する
instructionsSource: instructions.md
files:
  - { path: index.html, language: html, source: starter/index.html, editable: true }
  - { path: styles.css, language: css, source: starter/styles.css, editable: true }
solutionFiles:
  - { path: index.html, language: html, source: solution/index.html, editable: false }
  - { path: styles.css, language: css, source: solution/styles.css, editable: false }
validationRules:
  - id: html-css-ch04-l04-e01-r01
    label: PaddingをComputed 32pxにする
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: .measure }
    assertion:
      kind: computed-style
      property: padding-top
      operator: equals
      expected: 32
      tolerance: 0.5
    feedback:
      target: measureのComputed Padding Top
      expected: 32px前後
      nextAction: .measureのpaddingを2remへ変更します。
    hintId: html-css-ch04-l04-e01-h02
    relatedSlideId: html-css-ch04-l04-s02
  - id: html-css-ch04-l04-e01-r02
    label: Font SizeをComputed 20pxにする
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: .measure }
    assertion:
      kind: computed-style
      property: font-size
      operator: equals
      expected: 20
      tolerance: 0.5
    feedback:
      target: measureのComputed Font Size
      expected: 20px前後
      nextAction: Root 16pxを基準に、font-sizeを1.25remへ設定します。
    hintId: html-css-ch04-l04-e01-h01
    relatedSlideId: html-css-ch04-l04-s01
  - id: html-css-ch04-l04-e01-r03
    label: Borderを1pxにする
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: .measure }
    assertion:
      kind: computed-style
      property: border-top-width
      operator: equals
      expected: 1
      tolerance: 0.1
    feedback:
      target: measureのComputed Border Width
      expected: 1px
      nextAction: 固定したいBorderの細さを1pxへ設定します。
    hintId: html-css-ch04-l04-e01-h03
    relatedSlideId: html-css-ch04-l04-s01
hints:
  - id: html-css-ch04-l04-e01-h01
    level: 1
    title: Rootの基準値を見る
    text: Root Font Sizeが16pxなので、remへ掛ける基準は16です。
    relatedSlideId: html-css-ch04-l04-s01
  - id: html-css-ch04-l04-e01-h02
    level: 2
    title: 目標pxからremを逆算する
    text: 32pxを16pxで割ると2になるため、Paddingには2remを使えます。
    relatedSlideId: html-css-ch04-l04-s02
  - id: html-css-ch04-l04-e01-h03
    level: 3
    title: 3つのDeclarationを確認する
    text: paddingは2rem、font-sizeは1.25rem、borderの幅は1pxになっているか見直します。
    relatedSlideId: html-css-ch04-l04-s02
