id: html-css-ch04-l02-e01
kind: standard
workspaceId: html-css-ch04-l02-e01
countsTowardStandardExerciseTotal: true
title: Stylesheet接続とDeclarationを直す
instructionsSource: instructions.md
files:
  - { path: index.html, language: html, source: starter/index.html, editable: true }
  - { path: styles.css, language: css, source: starter/styles.css, editable: true }
solutionFiles:
  - { path: index.html, language: html, source: solution/index.html, editable: false }
  - { path: styles.css, language: css, source: solution/styles.css, editable: false }
validationRules:
  - id: html-css-ch04-l02-e01-r01
    label: styles.cssをStylesheetとして接続する
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: 'link[rel="stylesheet"][href="styles.css"]' }
    assertion: { kind: count, operator: equals, expected: 1 }
    feedback:
      target: head内のStylesheet Link
      expected: relがstylesheet、hrefがstyles.cssのlinkが1つ
      nextAction: headのlinkでhrefをstyles.cssへ変更します。
    hintId: html-css-ch04-l02-e01-h01
    relatedSlideId: html-css-ch04-l02-s01
  - id: html-css-ch04-l02-e01-r02
    label: Cardの背景を白にする
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: .card }
    assertion:
      kind: computed-style
      property: background-color
      operator: equals
      expected: rgb(255, 255, 255)
    feedback:
      target: CardのComputed Background Color
      expected: rgb(255, 255, 255)
      nextAction: .cardのbackground-colorを#ffffffへ変更します。
    hintId: html-css-ch04-l02-e01-h02
    relatedSlideId: html-css-ch04-l02-s02
  - id: html-css-ch04-l02-e01-r03
    label: Cardの文字を濃紺にする
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: .card }
    assertion:
      kind: computed-style
      property: color
      operator: equals
      expected: rgb(36, 50, 61)
    feedback:
      target: CardのComputed Text Color
      expected: rgb(36, 50, 61)
      nextAction: '.cardへcolor: #24323d;を正しいDeclaration構文で書きます。'
    hintId: html-css-ch04-l02-e01-h03
    relatedSlideId: html-css-ch04-l02-s02
hints:
  - id: html-css-ch04-l02-e01-h01
    level: 1
    title: HTMLとCSSの接点を見る
    text: WorkspaceのFile名はstyles.cssですが、linkが別の名前を指していないか確認します。
    relatedSlideId: html-css-ch04-l02-s01
  - id: html-css-ch04-l02-e01-h02
    level: 2
    title: Diagnosticと結果を分ける
    text: Parser Diagnosticがあれば構文を先に直し、なければComputed ColorのValueを比べます。
    relatedSlideId: html-css-ch04-l02-s02
  - id: html-css-ch04-l02-e01-h03
    level: 3
    title: Linkと2つのValueをそろえる
    text: hrefをstyles.css、background-colorを#ffffff、colorを#24323dにします。
    relatedSlideId: html-css-ch04-l02-s02
relatedSlideIds:
  - html-css-ch04-l02-s01
  - html-css-ch04-l02-s02
previewViewports:
