id: html-css-ch04-l02-e01
kind: standard
workspaceId: html-css-ch04-l02-e01
countsTowardStandardExerciseTotal: true
title: Stylesheet接続とDeclarationを直す
instructionsSource: instructions.md
requiresConcepts:
  - { conceptId: stylesheet-link, minimumLevel: transform }
  - { conceptId: css-property-value, minimumLevel: transform }
scaffoldLevel: transform
steps:
  - id: connect-stylesheet-file
    file: index.html
    target: head内でtheme.cssを指しているlink
    starterAnchor: <link rel="stylesheet" href="theme.css" />
    change: hrefをstyles.cssへ変更する
    observe: Previewへstyles.cssのCard Styleが届く
    requiresConceptIds: [stylesheet-link]
    validationRuleIds: [html-css-ch04-l02-e01-r01]
  - id: set-card-background-value
    file: styles.css
    target: .card Ruleのbackground-color Declaration
    starterAnchor: 'background-color: #fffaf0;'
    change: Valueを#ffffffへ変更し、完成済みのcolorは残す
    observe: Cardが白背景と濃紺文字になり、構文とComputed Colorの両方が合う
    requiresConceptIds: [css-property-value]
    validationRuleIds:
      - html-css-ch04-l02-e01-r02
      - html-css-ch04-l02-e01-r03
      - html-css-ch04-l02-e01-r04
files:
  - { path: index.html, language: html, source: starter/index.html, editable: true }
  - { path: styles.css, language: css, source: starter/styles.css, editable: true }
solutionFiles:
  - { path: index.html, language: html, source: solution/index.html, editable: false }
  - { path: styles.css, language: css, source: solution/styles.css, editable: false }
validationRules:
  - id: html-css-ch04-l02-e01-r01
    label: styles.cssをStylesheetとして接続する
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: 'link[rel="stylesheet"][href="styles.css"]' }
    assertion: { kind: count, operator: equals, expected: 1 }
    feedback:
      target: head内のStylesheet Link
      expected: relがstylesheet、hrefがstyles.cssのlinkが1つ
      nextAction: headのlinkでhrefをstyles.cssへ変更します。
    hintId: html-css-ch04-l02-e01-h01
    relatedSlideId: html-css-ch04-l02-s01
  - id: html-css-ch04-l02-e01-r02
    label: Cardの背景を白にする
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: .card }
    assertion:
      kind: computed-style
      property: background-color
      operator: equals
      expected: rgb(255, 255, 255)
    feedback:
      target: CardのComputed Background Color
      expected: rgb(255, 255, 255)
      nextAction: .cardのbackground-colorを#ffffffへ変更します。
    hintId: html-css-ch04-l02-e01-h02
    relatedSlideId: html-css-ch04-l02-s02
  - id: html-css-ch04-l02-e01-r03
    label: Cardの文字を濃紺にする
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: .card }
    assertion:
      kind: computed-style
      property: color
      operator: equals
      expected: rgb(36, 50, 61)
    feedback:
      target: CardのComputed Text Color
      expected: rgb(36, 50, 61)
      nextAction: '.cardへcolor: #24323d;を正しいDeclaration構文で書きます。'
    hintId: html-css-ch04-l02-e01-h03
    relatedSlideId: html-css-ch04-l02-s02
  - id: html-css-ch04-l02-e01-r04
    label: background-colorのValueを正しいDeclarationへ書く
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: source, file: styles.css }
    assertion:
      kind: text
      operator: contains-normalized
      expected: '.card { background-color: #ffffff;'
    feedback:
      target: styles.cssのbackground-color Declaration
      expected: 'background-color: #ffffff;'
      nextAction: .card内のbackground-colorでColon後のValueを#ffffffにし、Semicolonを残します。
    hintId: html-css-ch04-l02-e01-h02
    relatedSlideId: html-css-ch04-l02-s02
hints:
  - id: html-css-ch04-l02-e01-h01
    level: 1
    title: HTMLとCSSの接点を見る
    text: WorkspaceのFile名はstyles.cssですが、linkが別の名前を指していないか確認します。
    relatedSlideId: html-css-ch04-l02-s01
  - id: html-css-ch04-l02-e01-h02
    level: 2
    title: Diagnosticと結果を分ける
    text: Parser Diagnosticがあれば構文を先に直し、なければComputed ColorのValueを比べます。
    relatedSlideId: html-css-ch04-l02-s02
  - id: html-css-ch04-l02-e01-h03
    level: 3
    title: Linkと2つのValueをそろえる
    text: hrefをstyles.css、background-colorを#ffffff、colorを#24323dにします。
    relatedSlideId: html-css-ch04-l02-s02
relatedSlideIds:
  - html-css-ch04-l02-s01
  - html-css-ch04-l02-s02
previewViewports:
  - { id: desktop-1280, width: 1280, height: 720 }
assets: []
fixtures:
  - id: html-css-ch04-l02-e01-valid-alternative
    expectedStatus: pass
    files:
      - {
          path: index.html,
          language: html,
          source: fixtures/valid-alternative/index.html,
          editable: false,
        }
      - {
          path: styles.css,
          language: css,
          source: fixtures/valid-alternative/styles.css,
          editable: false,
        }
    expectedFeedbackRuleIds: []
  - id: html-css-ch04-l02-e01-incomplete
    expectedStatus: incomplete
    files:
      - {
          path: index.html,
          language: html,
          source: fixtures/incomplete/index.html,
          editable: false,
        }
      - { path: styles.css, language: css, source: fixtures/incomplete/styles.css, editable: false }
    expectedFeedbackRuleIds: [html-css-ch04-l02-e01-r02, html-css-ch04-l02-e01-r04]
  - id: html-css-ch04-l02-e01-code-error
    expectedStatus: code-error
    files:
      - {
          path: index.html,
          language: html,
          source: fixtures/code-error/index.html,
          editable: false,
        }
      - { path: styles.css, language: css, source: fixtures/code-error/styles.css, editable: false }
    expectedFeedbackRuleIds: []
