<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>STACK DAY — 個人制作展</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-capstone-page>
    <header class="site-header">
      <a class="brand" href="#top">STACK DAY</a>
      <nav aria-label="STACK DAY会場案内">
        <a href="#themes">展示</a>
        <a href="#visit">来場案内</a>
      </nav>
    </header>
    <main id="top">
      <section class="hero" aria-labelledby="event-title">
        <div>
          <p class="eyebrow">PERSONAL MAKERS EXHIBITION</p>
          <h1 id="event-title">個人制作が交差する、STACK DAY。</h1>
          <p>Web、紙、写真、音の個人制作を持ち寄る展示です。</p>
          <a data-capstone-action class="primary-action" href="#visit">無料来場を予約する</a>
        </div>
        <img
          data-event-poster
          src="asset:stack-day-poster"
          alt="7月26日開催の個人制作展STACK DAY Poster"
        />
      </section>
      <section id="themes" aria-labelledby="themes-title">
        <h2 id="themes-title">制作Theme</h2>
        <div data-event-grid class="piece-row">
          <article data-event-card class="event-card">
            <p class="card-number">01</p>
            <h3>Screen Pieces</h3>
            <p>学びながら作った小さなWeb作品と改善記録。</p>
          </article>
        </div>
      </section>
      <section id="visit" class="visit" aria-labelledby="visit-title">
        <div>
          <h2 id="visit-title">7月26日、North Hallで開催</h2>
          <p>11:00–18:00・入場無料・予約優先</p>
        </div>
        <a data-capstone-action class="secondary-action" href="https://example.com/contact">
          主催者の来場案内Contact Pageを見る
        </a>
      </section>
    </main>
    <footer>
      <p>STACK DAY / Tsumugi Studio</p>
    </footer>
  </body>
</html>
