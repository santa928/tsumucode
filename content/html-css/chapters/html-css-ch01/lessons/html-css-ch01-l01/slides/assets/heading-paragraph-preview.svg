<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">h1とpのBrowser Preview</title>
  <desc id="desc">白いページに、わたしのプロフィールという題名とWeb制作を学んでいますという文章が表示されている</desc>
  <rect width="640" height="360" rx="24" fill="#e8dfcf" />
  <rect x="30" y="30" width="580" height="300" rx="18" fill="#ffffff" stroke="#8a7657" stroke-width="3" />
  <rect x="30" y="30" width="580" height="52" rx="18" fill="#19352d" />
  <rect x="30" y="64" width="580" height="18" fill="#19352d" />
  <text x="320" y="63" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#fffaf0">Preview</text>
  <text x="74" y="158" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#19352d">わたしのプロフィール</text>
  <text x="74" y="222" font-family="system-ui, sans-serif" font-size="23" fill="#3f514b">Web制作を学んでいます。</text>
  <rect x="74" y="264" width="128" height="34" rx="8" fill="#fff3c7" stroke="#b98c18" stroke-width="2" />
  <text x="138" y="287" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#5c4610">h1 → p</text>
</svg>
