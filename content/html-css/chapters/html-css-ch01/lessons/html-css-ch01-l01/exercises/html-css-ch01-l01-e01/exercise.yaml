id: html-css-ch01-l01-e01
kind: standard
workspaceId: html-css-ch01-l01-e01
countsTowardStandardExerciseTotal: true
title: ページの題名と自己紹介を書く
instructionsSource: instructions.md
requiresConcepts:
  - { conceptId: heading-h1, minimumLevel: fill }
  - { conceptId: paragraph-p, minimumLevel: fill }
scaffoldLevel: fill
steps:
  - id: fill-heading
    file: index.html
    target: 用意されたh1の開始Tagと終了Tagの間
    starterAnchor: <!-- heading-text-task -->
    change: 「わたしのプロフィール」と書く
    observe: Previewへページの題名が表示される
    requiresConceptIds: [heading-h1]
    validationRuleIds: [html-css-ch01-l01-e01-r01]
  - id: fill-paragraph
    file: index.html
    target: 用意されたpの開始Tagと終了Tagの間
    starterAnchor: <!-- paragraph-text-task -->
    change: 空ではない短い自己紹介を書く
    observe: Previewで題名の次に自己紹介が表示される
    requiresConceptIds: [paragraph-p]
    validationRuleIds: [html-css-ch01-l01-e01-r02]
files:
  - { path: index.html, language: html, source: starter/index.html, editable: true }
  - { path: styles.css, language: css, source: starter/styles.css, editable: true }
solutionFiles:
  - { path: index.html, language: html, source: solution/index.html, editable: false }
  - { path: styles.css, language: css, source: solution/styles.css, editable: false }
validationRules:
  - id: html-css-ch01-l01-e01-r01
    label: h1へページの題名を書く
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: h1 }
    assertion: { kind: text, operator: equals, expected: わたしのプロフィール }
    feedback:
      target: ページ全体の題名
      expected: h1の内容が「わたしのプロフィール」と一致する
      nextAction: 用意されたh1の開始Tagと終了Tagの間へ「わたしのプロフィール」と書きます。
    hintId: html-css-ch01-l01-e01-h01
    relatedSlideId: html-css-ch01-l01-s02
  - id: html-css-ch01-l01-e01-r02
    label: pに自己紹介を書く
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: p }
    assertion: { kind: accessible-name, operator: present }
    feedback:
      target: p要素の文章
      expected: 空ではない自己紹介
      nextAction: pの開始Tagと終了Tagの間に自己紹介を書きます。
    hintId: html-css-ch01-l01-e01-h02
    relatedSlideId: html-css-ch01-l01-s02
hints:
  - id: html-css-ch01-l01-e01-h01
    level: 1
    title: Previewの題名を探す
    text: index.htmlに用意されたh1を探し、2つのTagの間だけを編集します。
    relatedSlideId: html-css-ch01-l01-s02
  - id: html-css-ch01-l01-e01-h02
    level: 2
    title: h1の下へ段落を置く
    text: h1の次に用意されたpを探し、開始Tagと終了Tagの間へ自己紹介を書きます。
    relatedSlideId: html-css-ch01-l01-s02
  - id: html-css-ch01-l01-e01-h03
    level: 3
    title: 2つのElementを順に組む
    text: 山かっこの記号は消さず、h1へ「わたしのプロフィール」、pへ自己紹介を入れます。
    relatedSlideId: html-css-ch01-l01-s03
relatedSlideIds:
  - html-css-ch01-l01-s01
  - html-css-ch01-l01-s02
  - html-css-ch01-l01-s03
previewViewports:
  - { id: desktop-1280, width: 1280, height: 720 }
assets: []
fixtures:
  - id: html-css-ch01-l01-e01-valid-alternative
    expectedStatus: pass
    files:
      - {
          path: index.html,
          language: html,
          source: fixtures/valid-alternative/index.html,
          editable: false,
        }
      - {
          path: styles.css,
          language: css,
          source: fixtures/valid-alternative/styles.css,
          editable: false,
        }
    expectedFeedbackRuleIds: []
  - id: html-css-ch01-l01-e01-incomplete
    expectedStatus: incomplete
    files:
      - {
          path: index.html,
          language: html,
          source: fixtures/incomplete/index.html,
          editable: false,
        }
      - { path: styles.css, language: css, source: fixtures/incomplete/styles.css, editable: false }
    expectedFeedbackRuleIds: [html-css-ch01-l01-e01-r02]
  - id: html-css-ch01-l01-e01-wrong-heading
    expectedStatus: incomplete
    files:
      - {
          path: index.html,
          language: html,
          source: fixtures/wrong-heading/index.html,
          editable: false,
        }
      - {
          path: styles.css,
          language: css,
          source: fixtures/valid-alternative/styles.css,
          editable: false,
        }
    expectedFeedbackRuleIds: [html-css-ch01-l01-e01-r01]
