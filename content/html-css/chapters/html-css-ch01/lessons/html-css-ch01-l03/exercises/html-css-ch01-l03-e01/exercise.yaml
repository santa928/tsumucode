id: html-css-ch01-l03-e01
kind: standard
workspaceId: html-css-ch01-l03-e01
countsTowardStandardExerciseTotal: true
title: 日本語ページの言語とTab名を整える
instructionsSource: instructions.md
requiresConcepts:
  - { conceptId: lang-attribute, minimumLevel: transform }
  - { conceptId: title-element, minimumLevel: transform }
scaffoldLevel: transform
steps:
  - id: change-document-language
    file: index.html
    target: htmlの開始Tagにあるlang属性
    starterAnchor: <html lang="en">
    change: langの値enだけをjaへ置き換える
    observe: 文書の基本言語が日本語として設定される
    requiresConceptIds: [lang-attribute]
    validationRuleIds: [html-css-ch01-l03-e01-r01]
  - id: change-browser-title
    file: index.html
    target: head内に用意されたtitleの内容
    starterAnchor: <title>未設定</title>
    change: 内容を「HTML学習プロフィール」へ置き換える
    observe: Browser Tabの題名が同じ言葉へ変わる
    requiresConceptIds: [title-element]
    validationRuleIds: [html-css-ch01-l03-e01-r02]
files:
  - { path: index.html, language: html, source: starter/index.html, editable: true }
  - { path: styles.css, language: css, source: starter/styles.css, editable: true }
solutionFiles:
  - { path: index.html, language: html, source: solution/index.html, editable: false }
  - { path: styles.css, language: css, source: solution/styles.css, editable: false }
validationRules:
  - id: html-css-ch01-l03-e01-r01
    label: ページの言語を日本語にする
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: html }
    assertion: { kind: attribute, name: lang, operator: equals, expected: ja }
    feedback:
      target: html要素のlang属性
      expected: lang属性の値がja
      nextAction: htmlの開始Tagにあるenだけをjaへ置き換えます。
    hintId: html-css-ch01-l03-e01-h01
    relatedSlideId: html-css-ch01-l03-s02
  - id: html-css-ch01-l03-e01-r02
    label: Browser Tabの題名を具体的にする
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: title }
    assertion: { kind: text, operator: equals, expected: HTML学習プロフィール }
    feedback:
      target: title要素の内容
      expected: titleの内容が「HTML学習プロフィール」と一致する
      nextAction: titleの開始Tagと終了Tagの間を「HTML学習プロフィール」へ書き換えます。
    hintId: html-css-ch01-l03-e01-h02
    relatedSlideId: html-css-ch01-l03-s02
hints:
  - id: html-css-ch01-l03-e01-h01
    level: 1
    title: htmlの開始Tagを見る
    text: index.htmlの上部にあるlang="en"を探し、quoteの中の値だけを直します。
    relatedSlideId: html-css-ch01-l03-s01
  - id: html-css-ch01-l03-e01-h02
    level: 2
    title: head内のtitleを見る
    text: metaの行は触らず、titleの開始Tagと終了Tagに挟まれた「未設定」を探します。
    relatedSlideId: html-css-ch01-l03-s02
  - id: html-css-ch01-l03-e01-h03
    level: 3
    title: 完成例と1文字ずつ比べる
    text: lang="ja"と<title>HTML学習プロフィール</title>の2箇所だけを完成例と比べます。
    relatedSlideId: html-css-ch01-l03-s02
relatedSlideIds:
  - html-css-ch01-l03-s01
  - html-css-ch01-l03-s02
previewViewports:
  - { id: desktop-1280, width: 1280, height: 720 }
assets: []
fixtures:
  - id: html-css-ch01-l03-e01-valid-alternative
    expectedStatus: pass
    files:
      - {
          path: index.html,
          language: html,
          source: fixtures/valid-alternative/index.html,
          editable: false,
        }
      - {
          path: styles.css,
          language: css,
          source: fixtures/valid-alternative/styles.css,
          editable: false,
        }
    expectedFeedbackRuleIds: []
  - id: html-css-ch01-l03-e01-incomplete
    expectedStatus: incomplete
    files:
      - {
          path: index.html,
          language: html,
          source: fixtures/incomplete/index.html,
          editable: false,
        }
      - { path: styles.css, language: css, source: fixtures/incomplete/styles.css, editable: false }
    expectedFeedbackRuleIds:
      - html-css-ch01-l03-e01-r01
      - html-css-ch01-l03-e01-r02
  - id: html-css-ch01-l03-e01-short-title
    expectedStatus: incomplete
    files:
      - {
          path: index.html,
          language: html,
          source: fixtures/short-title/index.html,
          editable: false,
        }
      - {
          path: styles.css,
          language: css,
          source: fixtures/valid-alternative/styles.css,
          editable: false,
        }
    expectedFeedbackRuleIds: [html-css-ch01-l03-e01-r02]
