<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Responsive Image</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <section data-frame>
        <h1>比率のまま縮める</h1>
        <img
          data-responsive-image
          src="asset:responsive-avatar"
          alt="Code Cardを持つ学習者がいる横長イラスト"
        />
      </section>
      <section data-crop-frame>
        <h2>固定Boxを埋める</h2>
        <img
          data-crop-image
          src="asset:responsive-avatar"
          alt="Code Cardを持つ学習者がいる横長イラスト"
        />
      </section>
    </main>
  </body>
</html>
