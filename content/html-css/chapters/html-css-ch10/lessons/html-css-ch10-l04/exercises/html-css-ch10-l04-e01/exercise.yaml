    expectedStatus: pass
    files:
      - {
          path: index.html,
          language: html,
          source: fixtures/valid-alternative/index.html,
          editable: false,
        }
      - {
          path: styles.css,
          language: css,
          source: fixtures/valid-alternative/styles.css,
          editable: false,
        }
    expectedFeedbackRuleIds: []
  - id: html-css-ch10-l04-e01-incomplete
    expectedStatus: incomplete
    files:
      - {
