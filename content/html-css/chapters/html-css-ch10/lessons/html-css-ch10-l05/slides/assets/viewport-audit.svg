<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <title>4 ViewportのResponsive監査</title>
  <desc>390、768、1280、1440pxの4幅でOverflow、Focus、CTA高さを確認する図</desc>
  <rect width="960" height="540" rx="36" fill="#f5efe3" />
  <text x="60" y="68" fill="#172a3a" font-family="system-ui, sans-serif" font-size="30" font-weight="700">1つ直し、4つの幅で同じ条件を測る</text>
  <g transform="translate(60 112)" font-family="system-ui, sans-serif">
    <g>
      <rect width="180" height="230" rx="22" fill="#ffffff" stroke="#172a3a" stroke-width="6" />
      <text x="90" y="38" fill="#172a3a" font-size="22" font-weight="700" text-anchor="middle">390px</text>
      <rect x="20" y="58" width="140" height="80" rx="12" fill="#dcefed" stroke="#2d7c82" stroke-width="4" />
      <rect x="38" y="158" width="104" height="48" rx="12" fill="#2d7c82" />
    </g>
    <g transform="translate(220)">
      <rect width="180" height="230" rx="22" fill="#ffffff" stroke="#172a3a" stroke-width="6" />
      <text x="90" y="38" fill="#172a3a" font-size="22" font-weight="700" text-anchor="middle">768px</text>
      <rect x="20" y="58" width="140" height="80" rx="12" fill="#dcefed" stroke="#2d7c82" stroke-width="4" />
      <rect x="38" y="158" width="104" height="48" rx="12" fill="#2d7c82" />
    </g>
    <g transform="translate(440)">
      <rect width="180" height="230" rx="22" fill="#ffffff" stroke="#172a3a" stroke-width="6" />
      <text x="90" y="38" fill="#172a3a" font-size="22" font-weight="700" text-anchor="middle">1280px</text>
      <rect x="20" y="58" width="140" height="80" rx="12" fill="#dcefed" stroke="#2d7c82" stroke-width="4" />
      <rect x="38" y="158" width="104" height="48" rx="12" fill="#2d7c82" />
    </g>
    <g transform="translate(660)">
      <rect width="180" height="230" rx="22" fill="#ffffff" stroke="#172a3a" stroke-width="6" />
      <text x="90" y="38" fill="#172a3a" font-size="22" font-weight="700" text-anchor="middle">1440px</text>
      <rect x="20" y="58" width="140" height="80" rx="12" fill="#dcefed" stroke="#2d7c82" stroke-width="4" />
      <rect x="38" y="158" width="104" height="48" rx="12" fill="#2d7c82" />
    </g>
  </g>
  <g transform="translate(60 384)" font-family="system-ui, sans-serif" font-size="21" font-weight="700">
    <rect width="840" height="112" rx="20" fill="#172a3a" />
    <g fill="#ffffff">
      <text x="48" y="44">✓ Document Overflow: false</text>
      <text x="350" y="44">✓ CTA: Focus可能</text>
      <text x="610" y="44">✓ CTA高さ: 44px以上</text>
    </g>
    <text x="420" y="82" fill="#7bd6d0" text-anchor="middle">4幅すべてで合格して完成</text>
  </g>
</svg>
