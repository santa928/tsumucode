id: html-css-ch09-l02-e01
kind: standard
workspaceId: html-css-ch09-l02-e01
countsTowardStandardExerciseTotal: true
title: repeatとfrで3つの等幅Trackを作る
instructionsSource: instructions.md
requiresConcepts:
  - { conceptId: repeat-function, minimumLevel: transform }
  - { conceptId: fr-unit, minimumLevel: transform }
scaffoldLevel: transform
steps:
  - id: replace-fixed-tracks-with-repeat-fr
    file: styles.css
    target: '[data-grid] Ruleのgrid-template-columns Declaration'
    starterAnchor: 'grid-template-columns: 200px 200px 200px;'
    change: Valueをrepeat(3, 1fr)へ変更する
    observe: 3列が等幅になり、2枚目のxが約237.33pxになる
    requiresConceptIds: [repeat-function, fr-unit]
    validationRuleIds:
      - html-css-ch09-l02-e01-r01
      - html-css-ch09-l02-e01-r02
      - html-css-ch09-l02-e01-r03
      - html-css-ch09-l02-e01-r04
files:
  - { path: index.html, language: html, source: starter/index.html, editable: true }
  - { path: styles.css, language: css, source: starter/styles.css, editable: true }
solutionFiles:
  - { path: index.html, language: html, source: solution/index.html, editable: false }
  - { path: styles.css, language: css, source: solution/styles.css, editable: false }
validationRules:
  - id: html-css-ch09-l02-e01-r01
    label: 3列ContainerをGridにする
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: '[data-grid]' }
    assertion: { kind: computed-style, property: display, operator: equals, expected: grid }
    feedback:
      target: Grid ContainerのComputed Display
      expected: grid
      nextAction: data-gridへdisplay gridを指定します。
    hintId: html-css-ch09-l02-e01-h01
    relatedSlideId: html-css-ch09-l02-s01
  - id: html-css-ch09-l02-e01-r02
    label: 2枚目をx 237.33pxへ置く
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: '[data-second]' }
    assertion:
      kind: rect
      metric: x
      operator: equals
      expected: 237.33
      tolerance: 1
    feedback:
      target: 2枚目のGrid Itemの実測x
      expected: 237.33px前後
      nextAction: 幅600pxを3つの1frへ分け、Gap 16pxを指定します。
    hintId: html-css-ch09-l02-e01-h02
    relatedSlideId: html-css-ch09-l02-s02
  - id: html-css-ch09-l02-e01-r03
    label: 等幅Gridの横Overflowを防ぐ
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: '[data-grid]' }
    assertion: { kind: overflow-x, operator: equals, expected: false }
    feedback:
      target: Grid ContainerのHorizontal Overflow
      expected: 'false'
      nextAction: frで利用可能幅を分配し、固定幅の合計で越えないようにします。
    hintId: html-css-ch09-l02-e01-h03
    relatedSlideId: html-css-ch09-l02-s02
  - id: html-css-ch09-l02-e01-r04
    label: repeatとfrをSourceへ書く
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: source, file: styles.css }
    assertion:
      kind: text
      operator: contains-normalized
      expected: 'grid-template-columns: repeat(3, 1fr);'
    feedback:
      target: data-gridのColumn Source
      expected: repeat(3, 1fr)
      nextAction: 200px 200px 200pxをrepeat(3, 1fr)へ置き換えます。
    hintId: html-css-ch09-l02-e01-h01
    relatedSlideId: html-css-ch09-l02-s02
hints:
  - id: html-css-ch09-l02-e01-h01
    level: 1
    title: 3列のGridを作る
    text: display gridとrepeat(3, 1fr)をContainerへ指定します。
    relatedSlideId: html-css-ch09-l02-s01
  - id: html-css-ch09-l02-e01-h02
    level: 2
    title: Gapを引いて分ける
    text: 600pxからGap 32pxを引いた568pxを3つへ分けます。
    relatedSlideId: html-css-ch09-l02-s01
  - id: html-css-ch09-l02-e01-h03
    level: 3
    title: 2枚目のStartを計算する
    text: Body x 32px、1 Track約189.33px、Gap 16pxを足します。
    relatedSlideId: html-css-ch09-l02-s02
relatedSlideIds:
  - html-css-ch09-l02-s01
  - html-css-ch09-l02-s02
previewViewports:
