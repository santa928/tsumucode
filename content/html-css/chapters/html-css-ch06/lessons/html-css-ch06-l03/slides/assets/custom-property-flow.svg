<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">Custom Propertyの共有Flow</title>
  <desc id="desc">rootのcolor-primaryをvar関数でActionの背景とTagの文字へ届ける</desc>
  <rect width="720" height="400" rx="28" fill="#f5efe4" />
  <g font-family="system-ui, sans-serif">
    <rect x="192" y="40" width="336" height="106" rx="18" fill="#ead9bc" stroke="#b7893d" stroke-width="3" />
    <text x="360" y="76" text-anchor="middle" fill="#6f4b1f" font-size="21" font-weight="750">:root</text>
    <text x="360" y="111" text-anchor="middle" fill="#24323d" font-family="ui-monospace, monospace" font-size="17">--color-primary: #2d5d62;</text>
    <path d="M360 147v46M360 176H180v32M360 176h180v32" fill="none" stroke="#bf5b42" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="m180 212-8-12h16zM540 212l-8-12h16z" fill="#bf5b42" />
    <rect x="62" y="220" width="236" height="108" rx="18" fill="#2d5d62" />
    <text x="180" y="257" text-anchor="middle" fill="#fffdf8" font-size="19" font-weight="750">Actionの背景</text>
    <text x="180" y="291" text-anchor="middle" fill="#fffdf8" font-family="ui-monospace, monospace" font-size="14">var(--color-primary)</text>
    <rect x="422" y="220" width="236" height="108" rx="18" fill="#fffdf8" stroke="#2d5d62" stroke-width="3" />
    <text x="540" y="257" text-anchor="middle" fill="#2d5d62" font-size="19" font-weight="750">Tagの文字</text>
    <text x="540" y="291" text-anchor="middle" fill="#23484c" font-family="ui-monospace, monospace" font-size="14">var(--color-primary)</text>
    <text x="360" y="376" text-anchor="middle" fill="#24323d" font-size="17" font-weight="700">1箇所の値を変えると、2つの部品へ届く</text>
  </g>
</svg>
