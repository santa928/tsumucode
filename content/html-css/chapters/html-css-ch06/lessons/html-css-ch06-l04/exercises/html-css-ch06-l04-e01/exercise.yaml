id: html-css-ch06-l04-e01
kind: standard
workspaceId: html-css-ch06-l04-e01
countsTowardStandardExerciseTotal: true
title: 2枚のCardへBase Styleを再利用する
instructionsSource: instructions.md
requiresConcepts:
  - { conceptId: reusable-base-class, minimumLevel: compose }
  - { conceptId: modifier-class, minimumLevel: compose }
scaffoldLevel: compose
steps:
  - id: apply-base-class-to-first-card
    file: index.html
    target: 1枚目のarticleにあるclass Attribute
    starterAnchor: 'class="html-card"'
    change: Valueをcardへ変更する
    observe: 1枚目へ完成済みの白い背景、24px Padding、Borderが適用される
    requiresConceptIds: [reusable-base-class]
    validationRuleIds:
      - html-css-ch06-l04-e01-r01
      - html-css-ch06-l04-e01-r02
      - html-css-ch06-l04-e01-r03
      - html-css-ch06-l04-e01-r05
  - id: compose-base-and-modifier-on-second-card
    file: index.html
    target: 2枚目のarticleにあるclass Attribute
    starterAnchor: 'class="css-card"'
    change: Valueをcard card--featuredへ変更する
    observe: 2枚目もBase Styleを共有し、Modifierの左Border 4pxだけが追加される
    requiresConceptIds: [reusable-base-class, modifier-class]
    validationRuleIds:
      - html-css-ch06-l04-e01-r01
      - html-css-ch06-l04-e01-r02
      - html-css-ch06-l04-e01-r03
      - html-css-ch06-l04-e01-r04
      - html-css-ch06-l04-e01-r06
files:
  - { path: index.html, language: html, source: starter/index.html, editable: true }
  - { path: styles.css, language: css, source: starter/styles.css, editable: true }
solutionFiles:
  - { path: index.html, language: html, source: solution/index.html, editable: false }
  - { path: styles.css, language: css, source: solution/styles.css, editable: false }
validationRules:
  - id: html-css-ch06-l04-e01-r01
    label: 2枚のCardを用意する
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: '[data-card]' }
    assertion:
      kind: count
      operator: equals
      expected: 2
    feedback:
      target: data-cardを持つElement
      expected: 2件
      nextAction: 内容の異なるCardを2枚用意します。
    hintId: html-css-ch06-l04-e01-h01
    relatedSlideId: html-css-ch06-l04-s01
  - id: html-css-ch06-l04-e01-r02
    label: 両方のCardを白い背景にする
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: '[data-card]' }
    assertion:
      kind: computed-style
      property: background-color
      operator: equals
      expected: 'rgb(255, 255, 255)'
    feedback:
      target: 2枚のCardのComputed Background Color
      expected: すべてrgb(255, 255, 255)
      nextAction: 共通のBase Classへ白いbackground-colorを指定し、両方へ適用します。
    hintId: html-css-ch06-l04-e01-h02
    relatedSlideId: html-css-ch06-l04-s01
  - id: html-css-ch06-l04-e01-r03
    label: 両方のCardへ24pxの内部余白を付ける
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: '[data-card]' }
    assertion:
      kind: computed-style
      property: padding-top
      operator: equals
      expected: 24
      tolerance: 0.5
    feedback:
      target: 2枚のCardのComputed Padding Top
      expected: すべて24px前後
      nextAction: 共通のBase Classへpadding 24pxを置き、個別Ruleで打ち消していないか確認します。
    hintId: html-css-ch06-l04-e01-h03
    relatedSlideId: html-css-ch06-l04-s02
  - id: html-css-ch06-l04-e01-r04
    label: 2枚目へFeatured Modifierを適用する
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: '[data-card]:nth-of-type(2)' }
    assertion:
      kind: computed-style
      property: border-left-width
      operator: equals
      expected: 4
      tolerance: 0.1
    feedback:
      target: 2枚目CardのComputed Border Left Width
      expected: 4px
      nextAction: 2枚目のclassへcard--featuredを追加し、Base Classも残します。
    hintId: html-css-ch06-l04-e01-h03
    relatedSlideId: html-css-ch06-l04-s02
  - id: html-css-ch06-l04-e01-r05
    label: 1枚目へBase Classを記述する
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: source, file: index.html }
    assertion:
      kind: text
      operator: contains-normalized
      expected: '<article data-card class="card">'
    feedback:
      target: 1枚目CardのClass Source
      expected: 'class="card"'
      nextAction: html-cardをcardへ変更します。
    hintId: html-css-ch06-l04-e01-h02
    relatedSlideId: html-css-ch06-l04-s01
  - id: html-css-ch06-l04-e01-r06
    label: 2枚目へBaseとModifier Classを記述する
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: source, file: index.html }
    assertion:
      kind: text
      operator: contains-normalized
      expected: '<article data-card class="card card--featured">'
    feedback:
      target: 2枚目CardのClass Source
      expected: 'class="card card--featured"'
      nextAction: css-cardをcard card--featuredへ変更します。
    hintId: html-css-ch06-l04-e01-h03
    relatedSlideId: html-css-ch06-l04-s02
hints:
  - id: html-css-ch06-l04-e01-h01
    level: 1
    title: 共通するElementを見つける
    text: data-cardを持つ2枚を同じ再利用単位として扱います。
    relatedSlideId: html-css-ch06-l04-s01
  - id: html-css-ch06-l04-e01-h02
    level: 2
    title: Base Styleへ共通色を置く
    text: 同じClassへbackground-color whiteを1度だけ宣言します。
    relatedSlideId: html-css-ch06-l04-s01
  - id: html-css-ch06-l04-e01-h03
    level: 3
    title: 両方の実値を確認する
    text: 2枚目にはcardを残したままcard--featuredを空白で続けます。
    relatedSlideId: html-css-ch06-l04-s02
relatedSlideIds:
  - html-css-ch06-l04-s01
  - html-css-ch06-l04-s02
previewViewports:
  - { id: desktop-1280, width: 1280, height: 720 }
