<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">Base ClassとModifier Class</title>
  <desc id="desc">card Base Classを2枚へ適用し、2枚目だけcard--featuredを重ねる</desc>
  <rect width="720" height="400" rx="28" fill="#f5efe4" />
  <g font-family="system-ui, sans-serif">
    <rect x="224" y="34" width="272" height="78" rx="16" fill="#2d5d62" />
    <text x="360" y="65" text-anchor="middle" fill="#fffdf8" font-size="20" font-weight="750">.card</text>
    <text x="360" y="91" text-anchor="middle" fill="#c9ded9" font-size="14">Padding・背景・Border</text>
    <path d="M360 114v42M360 144H184v28M360 144h176v28" fill="none" stroke="#b7893d" stroke-width="4" stroke-linecap="round" />
    <path d="m184 178-8-12h16zM536 178l-8-12h16z" fill="#b7893d" />
    <rect x="68" y="186" width="236" height="132" rx="18" fill="#fffdf8" stroke="#2d5d62" stroke-width="3" />
    <text x="186" y="229" text-anchor="middle" fill="#24323d" font-size="22" font-weight="750">HTML Card</text>
    <text x="186" y="264" text-anchor="middle" fill="#23484c" font-family="ui-monospace, monospace" font-size="15">class="card"</text>
    <rect x="416" y="186" width="236" height="132" rx="18" fill="#fffdf8" stroke="#2d5d62" stroke-width="3" />
    <rect x="416" y="186" width="8" height="132" rx="4" fill="#bf5b42" />
    <text x="534" y="229" text-anchor="middle" fill="#24323d" font-size="22" font-weight="750">CSS Card</text>
    <text x="534" y="262" text-anchor="middle" fill="#8f3f2d" font-family="ui-monospace, monospace" font-size="14">card card--featured</text>
    <rect x="416" y="338" width="236" height="38" rx="10" fill="#ead9bc" />
    <text x="534" y="363" text-anchor="middle" fill="#6f4b1f" font-size="15" font-weight="700">Modifierで左Borderだけ追加</text>
    <text x="186" y="363" text-anchor="middle" fill="#23484c" font-size="15" font-weight="700">共通Styleを再利用</text>
  </g>
</svg>
