id: html-css-ch05-l02-e01
kind: standard
workspaceId: html-css-ch05-l02-e01
countsTowardStandardExerciseTotal: true
title: Cardを320pxへ収める
instructionsSource: instructions.md
requiresConcepts:
  - { conceptId: width-height, minimumLevel: transform }
  - { conceptId: box-sizing-border-box, minimumLevel: transform }
scaffoldLevel: transform
steps:
  - id: include-inner-layers-in-width
    file: styles.css
    target: .sized-card Ruleの先頭
    starterAnchor: '.sized-card {'
    change: box-sizing border-boxのDeclarationを先頭へ追加する
    observe: WidthがContentだけでなくPaddingとBorderを含むSizing方式になる
    requiresConceptIds: [box-sizing-border-box]
    validationRuleIds:
      - html-css-ch05-l02-e01-r01
      - html-css-ch05-l02-e01-r03
  - id: expand-card-to-frame-width
    file: styles.css
    target: .sized-card Ruleのwidth Declaration
    starterAnchor: 'width: 280px;'
    change: Valueを320pxへ変更する
    observe: Sourceはborder-boxとwidth 320pxになり、CardのBorder外幅も320pxになる
    requiresConceptIds: [width-height, box-sizing-border-box]
    validationRuleIds:
      - html-css-ch05-l02-e01-r02
      - html-css-ch05-l02-e01-r03
files:
  - { path: index.html, language: html, source: starter/index.html, editable: true }
  - { path: styles.css, language: css, source: starter/styles.css, editable: true }
solutionFiles:
  - { path: index.html, language: html, source: solution/index.html, editable: false }
  - { path: styles.css, language: css, source: solution/styles.css, editable: false }
validationRules:
  - id: html-css-ch05-l02-e01-r01
    label: Border Boxを使う
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: '.sized-card' }
    assertion:
      kind: computed-style
      property: box-sizing
      operator: equals
      expected: 'border-box'
    feedback:
      target: CardのSizing方式
      expected: border-box
      nextAction: 'box-sizingをborder-boxにします。'
    hintId: html-css-ch05-l02-e01-h02
    relatedSlideId: html-css-ch05-l02-s02
  - id: html-css-ch05-l02-e01-r02
    label: Card外幅を320pxにする
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: '.sized-card' }
    assertion:
      kind: rect
      metric: width
      operator: equals
      expected: 320
      tolerance: 0.5
    feedback:
      target: Cardの実測Width
      expected: 320px前後
      nextAction: 'widthを320pxにしPaddingとBorderを内側へ含めます。'
    hintId: html-css-ch05-l02-e01-h03
    relatedSlideId: html-css-ch05-l02-s02
  - id: html-css-ch05-l02-e01-r03
    label: .sized-cardへborder-boxと320pxを記述する
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: source, file: styles.css }
    assertion:
      kind: text
      operator: contains-normalized
      expected: '.sized-card { box-sizing: border-box; width: 320px;'
    feedback:
      target: .sized-cardのSizing Source
      expected: 'box-sizing: border-box; と width: 320px;'
      nextAction: Ruleの先頭へbox-sizingを加え、続くwidthを320pxへ変更します。
    hintId: html-css-ch05-l02-e01-h03
    relatedSlideId: html-css-ch05-l02-s02
hints:
  - id: html-css-ch05-l02-e01-h01
    level: 1
    title: 状態を観察する
    text: 指定幅の外へ加わる層を観察します。
    relatedSlideId: html-css-ch05-l02-s01
  - id: html-css-ch05-l02-e01-h02
    level: 2
    title: 目的を考える
    text: border-boxならPaddingとBorderをwidthへ含められます。
    relatedSlideId: html-css-ch05-l02-s02
  - id: html-css-ch05-l02-e01-h03
    level: 3
    title: 具体的に直す
    text: 'box-sizing: border-boxとwidth: 320pxを設定します。'
    relatedSlideId: html-css-ch05-l02-s02
relatedSlideIds:
  - html-css-ch05-l02-s01
  - html-css-ch05-l02-s02
previewViewports:
  - { id: desktop-1280, width: 1280, height: 720 }
assets: []
fixtures:
