id: html-css-ch05-l03-e01
kind: standard
workspaceId: html-css-ch05-l03-e01
countsTowardStandardExerciseTotal: true
title: 内側と外側のSpacingを分ける
instructionsSource: instructions.md
requiresConcepts:
  - { conceptId: padding-property, minimumLevel: transform }
  - { conceptId: margin-property, minimumLevel: transform }
scaffoldLevel: transform
steps:
  - id: expand-card-inner-spacing
    file: styles.css
    target: .card Ruleのpadding Declaration
    starterAnchor: 'padding: 16px;'
    change: Valueを24pxへ変更する
    observe: Cardの背景内でContentとBorderの間が24pxになり、Sourceもpadding 24pxになる
    requiresConceptIds: [padding-property]
    validationRuleIds:
      - html-css-ch05-l03-e01-r01
      - html-css-ch05-l03-e01-r03
  - id: expand-card-outer-spacing
    file: styles.css
    target: .card + .card Ruleのmargin-top Declaration
    starterAnchor: 'margin-top: 16px;'
    change: Valueを32pxへ変更する
    observe: 2枚目のCardの外側だけが32px離れ、Sourceもmargin-top 32pxになる
    requiresConceptIds: [margin-property]
    validationRuleIds:
      - html-css-ch05-l03-e01-r02
      - html-css-ch05-l03-e01-r04
files:
  - { path: index.html, language: html, source: starter/index.html, editable: true }
  - { path: styles.css, language: css, source: starter/styles.css, editable: true }
solutionFiles:
  - { path: index.html, language: html, source: solution/index.html, editable: false }
  - { path: styles.css, language: css, source: solution/styles.css, editable: false }
validationRules:
  - id: html-css-ch05-l03-e01-r01
    label: Card内Paddingを24pxにする
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: '.card' }
    assertion:
      kind: computed-style
      property: padding-top
      operator: equals
      expected: 24
      tolerance: 0.1
    feedback:
      target: Card内部のSpacing
      expected: 24px
      nextAction: 'paddingを24pxにします。'
    hintId: html-css-ch05-l03-e01-h02
    relatedSlideId: html-css-ch05-l03-s01
  - id: html-css-ch05-l03-e01-r02
    label: Card間Marginを32pxにする
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: '.card + .card' }
    assertion:
      kind: computed-style
      property: margin-top
      operator: equals
      expected: 32
      tolerance: 0.1
    feedback:
      target: 2枚目Cardの外側Spacing
      expected: 32px
      nextAction: '2枚目のmargin-topを32pxにします。'
    hintId: html-css-ch05-l03-e01-h03
    relatedSlideId: html-css-ch05-l03-s02
  - id: html-css-ch05-l03-e01-r03
    label: .cardへPaddingを24pxで記述する
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: source, file: styles.css }
    assertion:
      kind: text
      operator: contains-normalized
      expected: '.card { padding: 24px;'
    feedback:
      target: .cardのPadding Source
      expected: 'padding: 24px;'
      nextAction: .cardにあるpaddingのValueを24pxへ変更します。
    hintId: html-css-ch05-l03-e01-h02
    relatedSlideId: html-css-ch05-l03-s01
  - id: html-css-ch05-l03-e01-r04
    label: 2枚目のCardへMargin Topを32pxで記述する
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: source, file: styles.css }
    assertion:
      kind: text
      operator: contains-normalized
      expected: '.card + .card { margin-top: 32px;'
    feedback:
      target: .card + .cardのMargin Source
      expected: 'margin-top: 32px;'
      nextAction: 2枚目以降を選ぶRuleのmargin-topを32pxへ変更します。
    hintId: html-css-ch05-l03-e01-h03
    relatedSlideId: html-css-ch05-l03-s02
hints:
  - id: html-css-ch05-l03-e01-h01
    level: 1
    title: 状態を観察する
    text: '空白が背景の内側か外側か観察します。'
    relatedSlideId: html-css-ch05-l03-s01
  - id: html-css-ch05-l03-e01-h02
    level: 2
    title: 目的を考える
    text: '内側はPadding、Card間はMarginへ分けます。'
    relatedSlideId: html-css-ch05-l03-s02
  - id: html-css-ch05-l03-e01-h03
    level: 3
    title: 具体的に直す
    text: 'padding: 24pxとmargin-top: 32pxを設定します。'
    relatedSlideId: html-css-ch05-l03-s02
relatedSlideIds:
  - html-css-ch05-l03-s01
  - html-css-ch05-l03-s02
previewViewports:
  - { id: desktop-1280, width: 1280, height: 720 }
assets: []
