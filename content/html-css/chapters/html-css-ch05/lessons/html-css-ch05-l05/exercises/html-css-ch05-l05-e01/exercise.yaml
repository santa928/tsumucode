validationRules:
  - id: html-css-ch05-l05-e01-r01
    label: Frameの横Overflowをなくす
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: '.frame' }
    assertion:
      kind: overflow-x
      operator: equals
      expected: false
    feedback:
      target: FrameのHorizontal Overflow
      expected: 'false'
      nextAction: 'Childの外幅をFrameの320px以内へ収めます。'
    hintId: html-css-ch05-l05-e01-h01
    relatedSlideId: html-css-ch05-l05-s01
  - id: html-css-ch05-l05-e01-r02
    label: Card幅を320px以内にする
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: '.safe-card' }
    assertion:
      kind: rect
      metric: width
      operator: lte
      expected: 320
      tolerance: 0.5
    feedback:
      target: Cardの実測Width
      expected: 320px以下
      nextAction: 'border-boxと100%以内のwidthを使います。'
    hintId: html-css-ch05-l05-e01-h02
    relatedSlideId: html-css-ch05-l05-s02
  - id: html-css-ch05-l05-e01-r03
    label: Card高さを220px以内にする
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: '.safe-card' }
    assertion:
      kind: rect
      metric: height
      operator: lte
      expected: 220
      tolerance: 0.5
    feedback:
      target: Cardの実測Height
      expected: 220px以下
      nextAction: '固定Heightを外しContentに必要な高さへ戻します。'
    hintId: html-css-ch05-l05-e01-h03
    relatedSlideId: html-css-ch05-l05-s02
