id: html-css-ch05-l05-e01
kind: standard
workspaceId: html-css-ch05-l05-e01
countsTowardStandardExerciseTotal: true
title: CardをContainer境界へ収める
instructionsSource: instructions.md
requiresConcepts:
  - { conceptId: overflow-x, minimumLevel: transform }
  - { conceptId: safe-sizing, minimumLevel: transform }
scaffoldLevel: transform
steps:
  - id: include-card-layers-in-parent-width
    file: styles.css
    target: .safe-card Ruleの先頭
    starterAnchor: '.safe-card {'
    change: box-sizing border-boxのDeclarationを先頭へ追加する
    observe: PaddingとBorderが指定幅の内側に含まれるSizing方式になる
    requiresConceptIds: [safe-sizing]
    validationRuleIds:
      - html-css-ch05-l05-e01-r02
      - html-css-ch05-l05-e01-r04
  - id: match-card-to-parent-width
    file: styles.css
    target: .safe-card Ruleのwidth Declaration
    starterAnchor: 'width: 360px;'
    change: Valueを100%へ変更する
    observe: CardのBorder外幅は320px以下になり、Frameの横Overflowはfalseになる
    requiresConceptIds: [overflow-x, safe-sizing]
    validationRuleIds:
      - html-css-ch05-l05-e01-r01
      - html-css-ch05-l05-e01-r02
      - html-css-ch05-l05-e01-r04
  - id: release-card-fixed-height
    file: styles.css
    target: .safe-card Ruleのheight Declaration
    starterAnchor: 'height: 240px;'
    change: 固定されたheight Declarationを削除する
    observe: CardのbottomがFrameのbottom以内へ戻り、Contentに沿う高さになる
    requiresConceptIds: [safe-sizing]
    validationRuleIds:
      - html-css-ch05-l05-e01-r03
files:
  - { path: index.html, language: html, source: starter/index.html, editable: true }
  - { path: styles.css, language: css, source: starter/styles.css, editable: true }
solutionFiles:
  - { path: index.html, language: html, source: solution/index.html, editable: false }
  - { path: styles.css, language: css, source: solution/styles.css, editable: false }
validationRules:
  - id: html-css-ch05-l05-e01-r01
    label: Frameの横Overflowをなくす
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: '.frame' }
    assertion:
      kind: overflow-x
      operator: equals
      expected: false
    feedback:
      target: FrameのHorizontal Overflow
      expected: 'false'
      nextAction: 'Childの外幅をFrameの320px以内へ収めます。'
    hintId: html-css-ch05-l05-e01-h01
    relatedSlideId: html-css-ch05-l05-s01
  - id: html-css-ch05-l05-e01-r02
    label: Card幅を320px以内にする
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: '.safe-card' }
    assertion:
      kind: rect
      metric: width
      operator: lte
      expected: 320
      tolerance: 0.5
    feedback:
      target: Cardの実測Width
      expected: 320px以下
      nextAction: 'border-boxと100%以内のwidthを使います。'
    hintId: html-css-ch05-l05-e01-h02
    relatedSlideId: html-css-ch05-l05-s02
  - id: html-css-ch05-l05-e01-r03
    label: Cardの実測矩形をFrame内へ収める
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: '.safe-card' }
    assertion:
      kind: relation
      relation: contained-by
      otherSelector: '.frame'
    feedback:
      target: Cardの実測right／bottom
      expected: Frameの4辺以内
      nextAction: '固定Heightを外し、CardのrightとbottomをFrame内へ戻します。'
    hintId: html-css-ch05-l05-e01-h03
    relatedSlideId: html-css-ch05-l05-s02
  - id: html-css-ch05-l05-e01-r04
    label: .safe-cardへborder-boxと100%を記述する
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: source, file: styles.css }
    assertion:
      kind: text
      operator: contains-normalized
      expected: '.safe-card { box-sizing: border-box; width: 100%;'
    feedback:
      target: .safe-cardのSafe Sizing Source
      expected: 'box-sizing: border-box; と width: 100%;'
      nextAction: Ruleの先頭へbox-sizingを加え、続くwidthを100%へ変更します。
    hintId: html-css-ch05-l05-e01-h02
    relatedSlideId: html-css-ch05-l05-s02
hints:
  - id: html-css-ch05-l05-e01-h01
    level: 1
    title: 状態を観察する
    text: 'FrameとCardのright、bottomを比べ、どちらの辺を越えたか観察します。'
    relatedSlideId: html-css-ch05-l05-s01
  - id: html-css-ch05-l05-e01-h02
    level: 2
    title: 目的を考える
    text: 'border-boxでPaddingとBorderを幅へ含めます。'
    relatedSlideId: html-css-ch05-l05-s02
  - id: html-css-ch05-l05-e01-h03
    level: 3
    title: 具体的に直す
    text: 'widthを100%へ変え、Starterにあるheight: 240px;を削除します。'
    relatedSlideId: html-css-ch05-l05-s02
relatedSlideIds:
  - html-css-ch05-l05-s01
  - html-css-ch05-l05-s02
previewViewports:
  - { id: desktop-1280, width: 1280, height: 720 }
assets: []
