id: html-css-ch05-l01-e01
kind: standard
workspaceId: html-css-ch05-l01-e01
countsTowardStandardExerciseTotal: true
title: Boxの4層を実寸へそろえる
instructionsSource: instructions.md
requiresConcepts:
  - { conceptId: box-model-content-padding-border-margin, minimumLevel: transform }
scaffoldLevel: transform
steps:
  - id: expand-box-padding
    file: styles.css
    target: .box Ruleのpadding Declaration
    starterAnchor: 'padding: 16px;'
    change: Valueだけを24pxへ変更し、width、border、marginは残す
    observe: SourceとComputed Paddingは24pxになり、完成済みのContent幅240px、Border 2px、Margin 32pxも保たれる
    requiresConceptIds: [box-model-content-padding-border-margin]
    validationRuleIds:
      - html-css-ch05-l01-e01-r01
      - html-css-ch05-l01-e01-r02
      - html-css-ch05-l01-e01-r03
      - html-css-ch05-l01-e01-r04
      - html-css-ch05-l01-e01-r05
files:
  - { path: index.html, language: html, source: starter/index.html, editable: true }
  - { path: styles.css, language: css, source: starter/styles.css, editable: true }
solutionFiles:
  - { path: index.html, language: html, source: solution/index.html, editable: false }
  - { path: styles.css, language: css, source: solution/styles.css, editable: false }
validationRules:
  - id: html-css-ch05-l01-e01-r01
    label: Paddingを24pxにする
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: '.box' }
    assertion:
      kind: computed-style
      property: padding-top
      operator: equals
      expected: 24
      tolerance: 0.1
    feedback:
      target: Box内側のPadding
      expected: 24px
      nextAction: 'paddingを24pxにします。'
    hintId: html-css-ch05-l01-e01-h02
    relatedSlideId: html-css-ch05-l01-s02
  - id: html-css-ch05-l01-e01-r02
    label: Borderを2pxにする
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: '.box' }
    assertion:
      kind: computed-style
      property: border-top-width
      operator: equals
      expected: 2
      tolerance: 0.1
    feedback:
      target: BoxのBorder
      expected: 2px
      nextAction: 'border幅を2pxにします。'
    hintId: html-css-ch05-l01-e01-h02
    relatedSlideId: html-css-ch05-l01-s01
  - id: html-css-ch05-l01-e01-r03
    label: Marginを32pxにする
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: '.box' }
    assertion:
      kind: computed-style
      property: margin-top
      operator: equals
      expected: 32
      tolerance: 0.1
    feedback:
      target: Box外側のMargin
      expected: 32px
      nextAction: 'marginを32pxにします。'
    hintId: html-css-ch05-l01-e01-h03
    relatedSlideId: html-css-ch05-l01-s01
  - id: html-css-ch05-l01-e01-r04
    label: Content幅を240pxにする
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: '.box' }
    assertion:
      kind: computed-style
      property: width
      operator: equals
      expected: 240
      tolerance: 0.5
    feedback:
      target: BoxのContent Width
      expected: 240px
      nextAction: 'widthを240pxにします。'
    hintId: html-css-ch05-l01-e01-h03
    relatedSlideId: html-css-ch05-l01-s02
  - id: html-css-ch05-l01-e01-r05
    label: .boxへPaddingを24pxで記述する
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: source, file: styles.css }
    assertion:
      kind: text
      operator: contains-normalized
      expected: '.box { width: 240px; padding: 24px;'
    feedback:
      target: .boxのPadding Source
      expected: 'padding: 24px;'
      nextAction: .boxにあるpaddingのValueだけを24pxへ変更します。
    hintId: html-css-ch05-l01-e01-h02
    relatedSlideId: html-css-ch05-l01-s02
hints:
  - id: html-css-ch05-l01-e01-h01
    level: 1
    title: 状態を観察する
    text: 4層を内側から順に観察します。
    relatedSlideId: html-css-ch05-l01-s01
  - id: html-css-ch05-l01-e01-h02
    level: 2
    title: 目的を考える
    text: ContentとBorderの間を広げるのはPaddingです。
    relatedSlideId: html-css-ch05-l01-s02
  - id: html-css-ch05-l01-e01-h03
    level: 3
    title: 具体的に直す
    text: .boxのpaddingにある16pxだけを24pxへ書き換えます。
    relatedSlideId: html-css-ch05-l01-s02
relatedSlideIds:
  - html-css-ch05-l01-s01
  - html-css-ch05-l01-s02
previewViewports:
