id: html-css-ch05-l04-e01
kind: standard
workspaceId: html-css-ch05-l04-e01
countsTowardStandardExerciseTotal: true
title: 横並びLinkへ44pxの操作領域を作る
instructionsSource: instructions.md
requiresConcepts:
  - { conceptId: display-inline-block, minimumLevel: transform }
  - { conceptId: minimum-target-size, minimumLevel: transform }
scaffoldLevel: transform
steps:
  - id: turn-links-into-sized-boxes
    file: styles.css
    target: nav a Ruleのdisplay Declaration
    starterAnchor: 'display: inline;'
    change: Valueをinline-blockへ変更し、a要素とhrefは残す
    observe: Linkは横並びを保ったままBox寸法を持ち、Keyboard Focusも保たれる
    requiresConceptIds: [display-inline-block]
    validationRuleIds:
      - html-css-ch05-l04-e01-r01
      - html-css-ch05-l04-e01-r03
      - html-css-ch05-l04-e01-r04
  - id: expand-link-target-height
    file: styles.css
    target: nav a Ruleのpadding Declaration
    starterAnchor: 'padding: 4px 16px;'
    change: 上下のValueだけを12pxへ変更してpadding 12px 16pxにする
    observe: 完成済みのLine Height 20pxへ上下12pxずつが加わり、実測Heightが44pxになる
    requiresConceptIds: [minimum-target-size]
    validationRuleIds:
      - html-css-ch05-l04-e01-r02
      - html-css-ch05-l04-e01-r04
files:
  - { path: index.html, language: html, source: starter/index.html, editable: true }
  - { path: styles.css, language: css, source: starter/styles.css, editable: true }
solutionFiles:
  - { path: index.html, language: html, source: solution/index.html, editable: false }
  - { path: styles.css, language: css, source: solution/styles.css, editable: false }
validationRules:
  - id: html-css-ch05-l04-e01-r01
    label: Linkをinline-blockにする
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: 'nav a' }
    assertion:
      kind: computed-style
      property: display
      operator: equals
      expected: 'inline-block'
    feedback:
      target: Navigation LinkのDisplay
      expected: inline-block
      nextAction: 'displayをinline-blockにします。'
    hintId: html-css-ch05-l04-e01-h02
    relatedSlideId: html-css-ch05-l04-s02
  - id: html-css-ch05-l04-e01-r02
    label: 操作領域の高さを44px以上にする
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: 'nav a' }
    assertion:
      kind: rect
      metric: height
      operator: gte
      expected: 44
      tolerance: 0.5
    feedback:
      target: Navigation Linkの実測Height
      expected: 44px以上
      nextAction: '上下Paddingまたはmin-heightで44px以上にします。'
    hintId: html-css-ch05-l04-e01-h03
    relatedSlideId: html-css-ch05-l04-s02
  - id: html-css-ch05-l04-e01-r03
    label: LinkをKeyboard Focus可能に保つ
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: 'nav a' }
    assertion:
      kind: focusable
      operator: equals
      expected: true
    feedback:
      target: Navigation LinkのFocusability
      expected: 'true'
      nextAction: 'a要素と安全なhrefを残します。'
    hintId: html-css-ch05-l04-e01-h01
    relatedSlideId: html-css-ch05-l04-s01
  - id: html-css-ch05-l04-e01-r04
    label: nav aへinline-blockとPaddingを記述する
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: source, file: styles.css }
    assertion:
      kind: text
      operator: contains-normalized
      expected: 'nav a { display: inline-block; box-sizing: border-box; padding: 12px 16px;'
    feedback:
      target: nav aのDisplayとPadding Source
      expected: 'display: inline-block; と padding: 12px 16px;'
      nextAction: StarterのdisplayとpaddingにあるValueだけを変更します。
    hintId: html-css-ch05-l04-e01-h03
    relatedSlideId: html-css-ch05-l04-s02
hints:
  - id: html-css-ch05-l04-e01-h01
    level: 1
    title: 状態を観察する
    text: '横並び、高さ、Focusの3条件を観察します。'
    relatedSlideId: html-css-ch05-l04-s01
  - id: html-css-ch05-l04-e01-h02
    level: 2
    title: 目的を考える
    text: 'inline-blockなら横並びのままBox寸法を持てます。'
    relatedSlideId: html-css-ch05-l04-s02
  - id: html-css-ch05-l04-e01-h03
    level: 3
    title: 具体的に直す
    text: 'displayと上下Paddingを設定しaのhrefを残します。'
    relatedSlideId: html-css-ch05-l04-s02
relatedSlideIds:
  - html-css-ch05-l04-s01
  - html-css-ch05-l04-s02
previewViewports:
  - { id: desktop-1280, width: 1280, height: 720 }
assets: []
