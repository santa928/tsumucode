<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Landmarkのページ地図</title>
  <desc id="desc">header、main、footerが縦に並び、mainの内側にsectionが入っている</desc>
  <rect width="640" height="360" rx="24" fill="#e8dfcf" />
  <rect x="70" y="30" width="500" height="300" rx="22" fill="#fffaf0" stroke="#8a7657" stroke-width="3" />
  <rect x="96" y="54" width="448" height="58" rx="16" fill="#19352d" />
  <text x="320" y="91" text-anchor="middle" font-family="system-ui, sans-serif" font-size="23" font-weight="800" fill="#fffaf0">header ─ 導入</text>
  <rect x="96" y="130" width="448" height="118" rx="16" fill="#dcebe6" stroke="#3d7665" stroke-width="3" />
  <text x="128" y="164" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#19352d">main ─ 中心内容</text>
  <rect x="128" y="180" width="384" height="46" rx="14" fill="#ffffff" />
  <text x="320" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#3d7665">section ─ 今日の発見</text>
  <rect x="96" y="266" width="448" height="42" rx="16" fill="#f4c95d" />
  <text x="320" y="294" text-anchor="middle" font-family="system-ui, sans-serif" font-size="21" font-weight="800" fill="#19352d">footer ─ 末尾の補足</text>
</svg>
