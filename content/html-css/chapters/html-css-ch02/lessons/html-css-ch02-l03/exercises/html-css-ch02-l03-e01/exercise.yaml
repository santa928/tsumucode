id: html-css-ch02-l03-e01
kind: standard
workspaceId: html-css-ch02-l03-e01
countsTowardStandardExerciseTotal: true
title: ページの領域をLandmarkで表す
instructionsSource: instructions.md
requiresConcepts:
  - { conceptId: header-main-footer, minimumLevel: transform }
  - { conceptId: section-article, minimumLevel: transform }
scaffoldLevel: transform
steps:
  - id: replace-page-landmarks
    file: index.html
    target: body直下のpage-header、page-main、page-footerの3つのdiv
    starterAnchor: <div class="page-header">
    change: 開始Tagと終了Tagを順にheader、main、footerへ置き換える
    observe: Previewを保ちながらページの導入・中心・末尾がLandmarkになる
    requiresConceptIds: [header-main-footer]
    validationRuleIds:
      - html-css-ch02-l03-e01-r01
      - html-css-ch02-l03-e01-r02
      - html-css-ch02-l03-e01-r03
  - id: replace-topic-section
    file: index.html
    target: mainへ変更した領域内のtopicクラスを持つdiv
    starterAnchor: <div class="topic">
    change: 開始Tagと終了Tagをsectionへ置き換える
    observe: 今日の発見がmain内の1つの話題として伝わる
    requiresConceptIds: [section-article]
    validationRuleIds: [html-css-ch02-l03-e01-r04]
files:
  - { path: index.html, language: html, source: starter/index.html, editable: true }
  - { path: styles.css, language: css, source: starter/styles.css, editable: true }
solutionFiles:
  - { path: index.html, language: html, source: solution/index.html, editable: false }
  - { path: styles.css, language: css, source: solution/styles.css, editable: false }
validationRules:
  - id: html-css-ch02-l03-e01-r01
    label: 導入をheaderで表す
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: 'body > header.page-header' }
    assertion: { kind: count, operator: equals, expected: 1 }
    feedback:
      target: ページの導入領域
      expected: page-headerクラスを持つbody直下のheaderが1つ
      nextAction: page-headerのclassは残し、h1を含む最初のdivをheaderへ変更します。
    hintId: html-css-ch02-l03-e01-h01
    relatedSlideId: html-css-ch02-l03-s02
  - id: html-css-ch02-l03-e01-r02
    label: 中心内容をmainで表す
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: 'body > main.page-main' }
    assertion: { kind: count, operator: equals, expected: 1 }
    feedback:
      target: ページ固有の中心内容
      expected: page-mainクラスを持つbody直下のmainが1つ
      nextAction: page-mainのclassは残し、今日の発見を含む中央のdivをmainへ変更します。
    hintId: html-css-ch02-l03-e01-h01
    relatedSlideId: html-css-ch02-l03-s02
  - id: html-css-ch02-l03-e01-r03
    label: 末尾をfooterで表す
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: 'body > footer.page-footer' }
    assertion: { kind: count, operator: equals, expected: 1 }
    feedback:
      target: ページ末尾の補足領域
      expected: page-footerクラスを持つbody直下のfooterが1つ
      nextAction: page-footerのclassは残し、最後の補足文を含むdivをfooterへ変更します。
    hintId: html-css-ch02-l03-e01-h02
    relatedSlideId: html-css-ch02-l03-s02
  - id: html-css-ch02-l03-e01-r04
    label: main内の話題をsectionで表す
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: 'main.page-main > section.topic' }
    assertion: { kind: count, operator: equals, expected: 1 }
    feedback:
      target: main内の今日の発見
      expected: page-main直下にtopicクラスのsectionが1つ
      nextAction: topicのclassは残し、h2とpを含むdivをsectionへ変更します。
    hintId: html-css-ch02-l03-e01-h03
    relatedSlideId: html-css-ch02-l03-s03
hints:
  - id: html-css-ch02-l03-e01-h01
    level: 1
    title: ページの地図を3領域で見る
    text: 導入、中心内容、末尾の補足が、上からどの箱に入っているか観察します。
    relatedSlideId: html-css-ch02-l03-s01
  - id: html-css-ch02-l03-e01-h02
    level: 2
    title: 外側のdivを役割名へ変える
    text: body直下の3つのdivを順にheader、main、footerへ対応させます。
    relatedSlideId: html-css-ch02-l03-s02
  - id: html-css-ch02-l03-e01-h03
    level: 3
    title: mainの話題をsectionにする
    text: mainの内側でh2とpをまとめるdivの開始Tagと終了Tagをsectionへ変更します。
    relatedSlideId: html-css-ch02-l03-s03
relatedSlideIds:
  - html-css-ch02-l03-s01
  - html-css-ch02-l03-s02
  - html-css-ch02-l03-s03
previewViewports:
  - { id: desktop-1280, width: 1280, height: 720 }
assets: []
fixtures:
  - id: html-css-ch02-l03-e01-valid-alternative
    expectedStatus: pass
    files:
      - {
          path: index.html,
          language: html,
          source: fixtures/valid-alternative/index.html,
          editable: false,
        }
      - {
          path: styles.css,
          language: css,
          source: fixtures/valid-alternative/styles.css,
          editable: false,
        }
    expectedFeedbackRuleIds: []
  - id: html-css-ch02-l03-e01-incomplete
    expectedStatus: incomplete
    files:
      - {
          path: index.html,
          language: html,
          source: fixtures/incomplete/index.html,
          editable: false,
        }
      - { path: styles.css, language: css, source: fixtures/incomplete/styles.css, editable: false }
    expectedFeedbackRuleIds:
      - html-css-ch02-l03-e01-r01
      - html-css-ch02-l03-e01-r03
