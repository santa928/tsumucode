<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">strongとemの意味</title>
  <desc id="desc">保存してからは重要事項として、HTMLはCSSとの対比として強調されている</desc>
  <rect width="640" height="360" rx="24" fill="#e8dfcf" />
  <rect x="34" y="42" width="572" height="276" rx="22" fill="#fffaf0" stroke="#8a7657" stroke-width="3" />
  <rect x="66" y="78" width="136" height="38" rx="19" fill="#19352d" />
  <text x="134" y="104" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="800" fill="#fffaf0">strong</text>
  <text x="66" y="158" font-family="system-ui, sans-serif" font-size="23" fill="#3f514b"><tspan font-weight="900" fill="#19352d">保存してから</tspan><tspan> Previewを更新</tspan></text>
  <line x1="66" y1="190" x2="574" y2="190" stroke="#d6c7ae" stroke-width="3" />
  <rect x="66" y="216" width="92" height="38" rx="19" fill="#3d7665" />
  <text x="112" y="242" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="800" fill="#fffaf0">em</text>
  <text x="66" y="294" font-family="system-ui, sans-serif" font-size="23" fill="#3f514b">CSSではなく <tspan font-style="italic" font-weight="800" fill="#19352d">HTML</tspan> を学ぶ</text>
</svg>
