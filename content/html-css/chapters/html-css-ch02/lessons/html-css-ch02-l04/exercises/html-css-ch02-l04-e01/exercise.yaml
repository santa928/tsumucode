    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: 'p strong' }
    assertion: { kind: count, operator: equals, expected: 1 }
    feedback:
      target: 保存に関する重要な注意
      expected: Paragraph内のstrongが1つ
      nextAction: 保存してからという重要部分のspanをstrongへ変更します。
    hintId: html-css-ch02-l04-e01-h01
    relatedSlideId: html-css-ch02-l04-s01
  - id: html-css-ch02-l04-e01-r02
    label: strongへ言葉を入れる
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: 'p strong' }
    assertion: { kind: accessible-name, operator: present }
    feedback:
      target: strongの内容
      expected: 空ではない重要事項
      nextAction: strongの開始Tagと終了Tagの間へ、見逃せない注意を書きます。
    hintId: html-css-ch02-l04-e01-h02
    relatedSlideId: html-css-ch02-l04-s01
  - id: html-css-ch02-l04-e01-r03
    label: 発声上の強調をemで表す
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: 'p em' }
    assertion: { kind: count, operator: equals, expected: 1 }
    feedback:
      target: CSSと対比して強く読む言葉
      expected: Paragraph内のemが1つ
      nextAction: CSSと対比するHTMLのspanをemへ変更します。
    hintId: html-css-ch02-l04-e01-h02
    relatedSlideId: html-css-ch02-l04-s02
  - id: html-css-ch02-l04-e01-r04
    label: emへ言葉を入れる
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: 'p em' }
    assertion: { kind: accessible-name, operator: present }
    feedback:
      target: emの内容
      expected: 空ではない強調語
      nextAction: emの開始Tagと終了Tagの間へ、対比して強く読む言葉を書きます。
    hintId: html-css-ch02-l04-e01-h03
    relatedSlideId: html-css-ch02-l04-s02
hints:
