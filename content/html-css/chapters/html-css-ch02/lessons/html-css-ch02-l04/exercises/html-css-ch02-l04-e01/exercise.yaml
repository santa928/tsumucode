    title: 読み飛ばすと困る言葉を探す
    text: 2つの文を読み、操作を失敗しないために重要な部分を見つけます。
    relatedSlideId: html-css-ch02-l04-s01
  - id: html-css-ch02-l04-e01-h02
    level: 2
    title: 重要性と発声を分ける
    text: 保存の注意はstrong、CSSと対比して強く読むHTMLはemへ対応させます。
    relatedSlideId: html-css-ch02-l04-s02
  - id: html-css-ch02-l04-e01-h03
    level: 3
    title: spanのTag名だけを変える
    text: class属性と中の言葉は残し、1つ目をstrong、2つ目をemの開始Tagと終了Tagへ変更します。
    relatedSlideId: html-css-ch02-l04-s02
