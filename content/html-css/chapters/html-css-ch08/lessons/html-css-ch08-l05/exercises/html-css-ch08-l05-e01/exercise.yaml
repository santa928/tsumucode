id: html-css-ch08-l05-e01
kind: standard
workspaceId: html-css-ch08-l05-e01
countsTowardStandardExerciseTotal: true
title: NavigationとCard Rowを組む
instructionsSource: instructions.md
requiresConcepts:
  - { conceptId: flex-navigation, minimumLevel: compose }
  - { conceptId: flex-card-row, minimumLevel: compose }
scaffoldLevel: compose
steps:
  - id: compose-flex-navigation
    file: styles.css
    target: '[data-profile-nav] Rule'
    starterAnchor: '[data-profile-nav]'
    change: display flexを追加し、gapを12pxへ変更する
    observe: 3つのLinkが12px間隔で横に並ぶ
    requiresConceptIds: [flex-navigation]
    validationRuleIds:
      - html-css-ch08-l05-e01-r01
      - html-css-ch08-l05-e01-r02
      - html-css-ch08-l05-e01-r06
  - id: compose-flex-card-row
    file: styles.css
    target: '[data-card-row] Rule'
    starterAnchor: '[data-card-row]'
    change: display flexを追加し、gapを16pxへ変更する
    observe: 2枚目のCardがx 208pxへ並ぶ
    requiresConceptIds: [flex-card-row]
    validationRuleIds:
      - html-css-ch08-l05-e01-r03
      - html-css-ch08-l05-e01-r04
      - html-css-ch08-l05-e01-r05
      - html-css-ch08-l05-e01-r07
files:
  - { path: index.html, language: html, source: starter/index.html, editable: true }
  - { path: styles.css, language: css, source: starter/styles.css, editable: true }
solutionFiles:
  - { path: index.html, language: html, source: solution/index.html, editable: false }
  - { path: styles.css, language: css, source: solution/styles.css, editable: false }
validationRules:
  - id: html-css-ch08-l05-e01-r01
    label: Profile NavigationをFlexにする
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: '[data-profile-nav]' }
    assertion: { kind: computed-style, property: display, operator: equals, expected: flex }
    feedback:
      target: Profile NavigationのComputed Display
      expected: flex
      nextAction: data-profile-navへdisplay flexを指定します。
    hintId: html-css-ch08-l05-e01-h01
    relatedSlideId: html-css-ch08-l05-s01
  - id: html-css-ch08-l05-e01-r02
    label: NavigationのLink間を12pxにする
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: '[data-profile-nav]' }
    assertion: { kind: computed-style, property: gap, operator: equals, expected: 12 }
    feedback:
      target: Profile NavigationのComputed Gap
      expected: 12px
      nextAction: data-profile-navのgapを8pxから12pxへ変更します。
    hintId: html-css-ch08-l05-e01-h02
    relatedSlideId: html-css-ch08-l05-s01
  - id: html-css-ch08-l05-e01-r03
    label: Card RowをFlexにする
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: '[data-card-row]' }
    assertion: { kind: computed-style, property: display, operator: equals, expected: flex }
    feedback:
      target: Card RowのComputed Display
      expected: flex
      nextAction: data-card-rowへdisplay flexを指定します。
    hintId: html-css-ch08-l05-e01-h01
    relatedSlideId: html-css-ch08-l05-s02
  - id: html-css-ch08-l05-e01-r04
    label: 2枚目のCardをx 208pxへ置く
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: '[data-second-card]' }
    assertion:
      kind: rect
      metric: x
      operator: equals
      expected: 208
      tolerance: 1
    feedback:
      target: 2枚目のCardの実測x
      expected: 208px前後
      nextAction: 幅160pxのCard間へgap 16pxを指定し、32 + 160 + 16を確認します。
    hintId: html-css-ch08-l05-e01-h03
    relatedSlideId: html-css-ch08-l05-s02
  - id: html-css-ch08-l05-e01-r05
    label: Card Rowの横Overflowを防ぐ
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: '[data-card-row]' }
    assertion: { kind: overflow-x, operator: equals, expected: false }
    feedback:
      target: Card RowのHorizontal Overflow
      expected: 'false'
      nextAction: Card幅とGapをRow幅以内へ収めます。
    hintId: html-css-ch08-l05-e01-h03
    relatedSlideId: html-css-ch08-l05-s02
  - id: html-css-ch08-l05-e01-r06
    label: NavigationのFlex Sourceを統合する
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: source, file: styles.css }
    assertion:
      kind: text
      operator: contains-normalized
      expected: '[data-profile-nav] { display: flex; gap: 12px; }'
    feedback:
      target: Profile NavigationのSource
      expected: display flexとgap 12px
      nextAction: 既存Ruleへdisplay flexを追加し、gapを12pxへ変更します。
    hintId: html-css-ch08-l05-e01-h02
    relatedSlideId: html-css-ch08-l05-s01
  - id: html-css-ch08-l05-e01-r07
    label: Card RowのFlex Sourceを統合する
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: source, file: styles.css }
    assertion:
      kind: text
      operator: contains-normalized
      expected: '[data-card-row] { display: flex; width: 400px; margin-top: 24px; gap: 16px; }'
    feedback:
      target: Card RowのSource
      expected: display flexとgap 16px
      nextAction: widthとmarginは残し、display flexとgap 16pxをそろえます。
    hintId: html-css-ch08-l05-e01-h03
    relatedSlideId: html-css-ch08-l05-s02
hints:
  - id: html-css-ch08-l05-e01-h01
    level: 1
    title: 2つのContainerをFlexにする
    text: NavigationとCard Rowの親へそれぞれdisplay flexを指定します。
    relatedSlideId: html-css-ch08-l05-s01
  - id: html-css-ch08-l05-e01-h02
    level: 2
    title: Navigationの2つのDeclarationを揃える
    text: display flexを追加し、gapのValueを12pxへ変更します。
    relatedSlideId: html-css-ch08-l05-s01
  - id: html-css-ch08-l05-e01-h03
    level: 3
    title: CardのGeometryを計算する
    text: Body x 32px、Card幅160px、gap 16pxから2枚目のxを208pxにします。
    relatedSlideId: html-css-ch08-l05-s02
relatedSlideIds:
  - html-css-ch08-l05-s01
  - html-css-ch08-l05-s02
