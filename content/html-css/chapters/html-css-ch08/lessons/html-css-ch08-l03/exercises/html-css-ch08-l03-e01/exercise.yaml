id: html-css-ch08-l03-e01
kind: standard
workspaceId: html-css-ch08-l03-e01
countsTowardStandardExerciseTotal: true
title: 高さの違うItemをCross Axisへ揃える
instructionsSource: instructions.md
requiresConcepts:
  - { conceptId: align-items, minimumLevel: transform }
  - { conceptId: align-self, minimumLevel: transform }
scaffoldLevel: transform
steps:
  - id: center-all-items
    file: styles.css
    target: '[data-align] Ruleのalign-items Declaration'
    starterAnchor: 'align-items: flex-start;'
    change: Valueをcenterへ変更する
    observe: 高さ60pxのItemがContainer上端から70px下へ移動する
    requiresConceptIds: [align-items]
    validationRuleIds:
      - html-css-ch08-l03-e01-r01
      - html-css-ch08-l03-e01-r02
      - html-css-ch08-l03-e01-r03
      - html-css-ch08-l03-e01-r05
  - id: move-one-item-to-cross-end
    file: styles.css
    target: '[data-end] Ruleのalign-self Declaration'
    starterAnchor: 'align-self: center;'
    change: Valueをflex-endへ変更する
    observe: 高さ40pxの例外Itemのyが192pxになる
    requiresConceptIds: [align-self]
    validationRuleIds:
      - html-css-ch08-l03-e01-r04
      - html-css-ch08-l03-e01-r06
files:
  - { path: index.html, language: html, source: starter/index.html, editable: true }
  - { path: styles.css, language: css, source: starter/styles.css, editable: true }
solutionFiles:
  - { path: index.html, language: html, source: solution/index.html, editable: false }
  - { path: styles.css, language: css, source: solution/styles.css, editable: false }
validationRules:
  - id: html-css-ch08-l03-e01-r01
    label: Alignment ContainerをFlexにする
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: '[data-align]' }
    assertion: { kind: computed-style, property: display, operator: equals, expected: flex }
    feedback:
      target: Alignment ContainerのComputed Display
      expected: flex
      nextAction: data-alignを持つ親へdisplay flexを指定します。
    hintId: html-css-ch08-l03-e01-h01
    relatedSlideId: html-css-ch08-l03-s01
  - id: html-css-ch08-l03-e01-r02
    label: 全ItemをCross Axis中央へ揃える
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: '[data-align]' }
    assertion: { kind: computed-style, property: align-items, operator: equals, expected: center }
    feedback:
      target: ContainerのComputed Align Items
      expected: center
      nextAction: align-itemsをcenterへ設定します。
    hintId: html-css-ch08-l03-e01-h02
    relatedSlideId: html-css-ch08-l03-s01
  - id: html-css-ch08-l03-e01-r03
    label: 中央Itemをy 102pxへ置く
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: '[data-center]' }
    assertion:
      kind: rect
      metric: y
      operator: equals
      expected: 102
      tolerance: 1
    feedback:
      target: 中央Itemの実測y
      expected: 102px前後
      nextAction: 高さ200pxのContainerで高さ60pxのItemをCross Axis中央へ揃えます。
    hintId: html-css-ch08-l03-e01-h02
    relatedSlideId: html-css-ch08-l03-s01
  - id: html-css-ch08-l03-e01-r04
    label: 例外ItemをCross Endのy 192pxへ置く
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: '[data-end]' }
    assertion:
      kind: rect
      metric: y
      operator: equals
      expected: 192
      tolerance: 1
    feedback:
      target: 例外Itemの実測y
      expected: 192px前後
      nextAction: 高さ40pxのdata-endへalign-self flex-endを指定します。
    hintId: html-css-ch08-l03-e01-h03
    relatedSlideId: html-css-ch08-l03-s02
  - id: html-css-ch08-l03-e01-r05
    label: Containerへalign-items centerを書く
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: source, file: styles.css }
    assertion:
      kind: text
      operator: contains-normalized
      expected: '[data-align] { display: flex; align-items: center; width: 500px; height: 200px;'
    feedback:
      target: Alignment ContainerのSource
      expected: display flexとalign-items center
      nextAction: 完成済みのdisplay flexを残し、align-itemsのValueだけをcenterへ変更します。
    hintId: html-css-ch08-l03-e01-h02
    relatedSlideId: html-css-ch08-l03-s01
  - id: html-css-ch08-l03-e01-r06
    label: 例外Itemへalign-self flex-endを書く
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: source, file: styles.css }
    assertion:
      kind: text
      operator: contains-normalized
      expected: '[data-end] { align-self: flex-end; height: 40px; }'
    feedback:
      target: 例外ItemのSource
      expected: align-self flex-end
      nextAction: '[data-end]のalign-selfをcenterからflex-endへ変更します。'
    hintId: html-css-ch08-l03-e01-h03
    relatedSlideId: html-css-ch08-l03-s02
hints:
  - id: html-css-ch08-l03-e01-h01
    level: 1
    title: Cross Axisを持つContainerを作る
    text: data-alignへdisplay flexを指定します。
    relatedSlideId: html-css-ch08-l03-s01
  - id: html-css-ch08-l03-e01-h02
    level: 2
    title: 全体を中央へ揃える
    text: align-items centerで高さ60pxのItemはy 32 + 70になります。
    relatedSlideId: html-css-ch08-l03-s01
  - id: html-css-ch08-l03-e01-h03
    level: 3
    title: 1 ItemだけEndへ送る
    text: data-endへalign-self flex-endを指定し、y 32 + 200 - 40を確認します。
    relatedSlideId: html-css-ch08-l03-s02
relatedSlideIds:
  - html-css-ch08-l03-s01
  - html-css-ch08-l03-s02
previewViewports:
  - { id: desktop-1280, width: 1280, height: 720 }
