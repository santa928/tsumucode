<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">Cross AxisのAlignment</title>
  <desc id="desc">align-items centerで中央へ揃えたItemとalign-self flex-endの例外を示す</desc>
  <rect width="720" height="400" rx="28" fill="#f5efe4"/>
  <text x="48" y="54" fill="#24323d" font-family="system-ui, sans-serif" font-size="24" font-weight="700">全体の原則 + 1つの例外</text>
  <rect x="82" y="88" width="556" height="250" rx="18" fill="#fff" stroke="#b58b42" stroke-width="3"/>
  <path d="M104 213H616" stroke="#d45d3f" stroke-width="2" stroke-dasharray="8 8"/>
  <path d="M126 112V314" stroke="#2d5d62" stroke-width="3"/>
  <path d="M118 122L126 108L134 122M118 304L126 318L134 304" fill="none" stroke="#2d5d62" stroke-width="3"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="182" y="153" width="100" height="120" rx="12" fill="#dcebea" stroke="#2d5d62" stroke-width="2"/>
    <text x="232" y="218" fill="#24323d" font-size="16" font-weight="700">120px</text>
    <rect x="306" y="168" width="100" height="90" rx="12" fill="#dcebea" stroke="#2d5d62" stroke-width="2"/>
    <text x="356" y="218" fill="#24323d" font-size="16" font-weight="700">90px</text>
    <rect x="454" y="258" width="112" height="56" rx="12" fill="#f7d7ca" stroke="#d45d3f" stroke-width="2"/>
    <text x="510" y="291" fill="#8f3f2d" font-size="15" font-weight="700">align-self</text>
  </g>
  <g fill="#24323d" font-family="system-ui, sans-serif" font-size="15">
    <text x="144" y="108" fill="#2d5d62" font-weight="700">Cross Axis</text>
    <text x="182" y="367">align-items: center</text>
    <text x="456" y="367" fill="#d45d3f" font-weight="700">flex-end</text>
  </g>
</svg>
