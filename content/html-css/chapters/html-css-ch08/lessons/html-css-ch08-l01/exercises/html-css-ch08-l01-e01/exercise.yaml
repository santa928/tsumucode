id: html-css-ch08-l01-e01
kind: standard
workspaceId: html-css-ch08-l01-e01
countsTowardStandardExerciseTotal: true
title: RowとColumnのAxisを作る
instructionsSource: instructions.md
requiresConcepts:
  - { conceptId: flex-container, minimumLevel: transform }
  - { conceptId: flex-direction, minimumLevel: transform }
scaffoldLevel: transform
steps:
  - id: activate-two-flex-containers
    file: styles.css
    target: '[data-row], [data-column]の共通Rule'
    starterAnchor: 'gap: 12px;'
    change: gapの直前へdisplay flexを追加する
    observe: 2つの親のComputed Displayがflexになる
    requiresConceptIds: [flex-container]
    validationRuleIds:
      - html-css-ch08-l01-e01-r01
      - html-css-ch08-l01-e01-r03
      - html-css-ch08-l01-e01-r05
  - id: turn-column-main-axis
    file: styles.css
    target: '[data-column] Ruleのflex-direction Declaration'
    starterAnchor: 'flex-direction: row;'
    change: Valueをcolumnへ変更する
    observe: Column側のItemが上から下へ並ぶ
    requiresConceptIds: [flex-direction]
    validationRuleIds:
      - html-css-ch08-l01-e01-r02
      - html-css-ch08-l01-e01-r04
      - html-css-ch08-l01-e01-r06
files:
  - { path: index.html, language: html, source: starter/index.html, editable: true }
  - { path: styles.css, language: css, source: starter/styles.css, editable: true }
solutionFiles:
  - { path: index.html, language: html, source: solution/index.html, editable: false }
  - { path: styles.css, language: css, source: solution/styles.css, editable: false }
validationRules:
  - id: html-css-ch08-l01-e01-r01
    label: Row側をFlex Containerにする
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: '[data-row]' }
    assertion: { kind: computed-style, property: display, operator: equals, expected: flex }
    feedback:
      target: Row ContainerのComputed Display
      expected: flex
      nextAction: data-rowを持つ親へdisplay flexを指定します。
    hintId: html-css-ch08-l01-e01-h01
    relatedSlideId: html-css-ch08-l01-s01
  - id: html-css-ch08-l01-e01-r02
    label: Row側のMain Axisを横にする
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: '[data-row]' }
    assertion: { kind: computed-style, property: flex-direction, operator: equals, expected: row }
    feedback:
      target: Row ContainerのComputed Flex Direction
      expected: row
      nextAction: flex-directionをrowへ設定します。
    hintId: html-css-ch08-l01-e01-h02
    relatedSlideId: html-css-ch08-l01-s02
  - id: html-css-ch08-l01-e01-r03
    label: Column側をFlex Containerにする
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: '[data-column]' }
    assertion: { kind: computed-style, property: display, operator: equals, expected: flex }
    feedback:
      target: Column ContainerのComputed Display
      expected: flex
      nextAction: data-columnを持つ親へdisplay flexを指定します。
    hintId: html-css-ch08-l01-e01-h01
    relatedSlideId: html-css-ch08-l01-s01
  - id: html-css-ch08-l01-e01-r04
    label: Column側のMain Axisを縦にする
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: '[data-column]' }
    assertion:
      { kind: computed-style, property: flex-direction, operator: equals, expected: column }
    feedback:
      target: Column ContainerのComputed Flex Direction
      expected: column
      nextAction: flex-directionをcolumnへ設定します。
    hintId: html-css-ch08-l01-e01-h03
    relatedSlideId: html-css-ch08-l01-s02
  - id: html-css-ch08-l01-e01-r05
    label: 共通Ruleへdisplay flexを書く
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: source, file: styles.css }
    assertion:
      kind: text
      operator: contains-normalized
      expected: '[data-row], [data-column] { display: flex; gap: 12px;'
    feedback:
      target: 2つのContainerの共通Source
      expected: 共通Rule先頭のdisplay flex
      nextAction: '[data-row], [data-column]のgap直前へdisplay: flex;を追加します。'
    hintId: html-css-ch08-l01-e01-h01
    relatedSlideId: html-css-ch08-l01-s01
  - id: html-css-ch08-l01-e01-r06
    label: Column Ruleへflex-direction columnを書く
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: source, file: styles.css }
    assertion:
      kind: text
      operator: contains-normalized
      expected: '[data-column] { flex-direction: column; }'
    feedback:
      target: Column ContainerのDirection Source
      expected: flex-direction column
      nextAction: '[data-column]のflex-directionをrowからcolumnへ変更します。'
    hintId: html-css-ch08-l01-e01-h03
    relatedSlideId: html-css-ch08-l01-s02
hints:
  - id: html-css-ch08-l01-e01-h01
    level: 1
    title: 親をContainerにする
    text: Itemを包むdata-rowとdata-columnへdisplay flexを指定します。
    relatedSlideId: html-css-ch08-l01-s01
  - id: html-css-ch08-l01-e01-h02
    level: 2
    title: RowのAxisを読む
    text: rowではMain Axisが左から右へ進みます。
    relatedSlideId: html-css-ch08-l01-s02
  - id: html-css-ch08-l01-e01-h03
    level: 3
    title: ColumnのAxisを入れ替える
    text: data-columnへflex-direction columnを指定します。
    relatedSlideId: html-css-ch08-l01-s02
relatedSlideIds:
  - html-css-ch08-l01-s01
  - html-css-ch08-l01-s02
previewViewports:
  - { id: desktop-1280, width: 1280, height: 720 }
