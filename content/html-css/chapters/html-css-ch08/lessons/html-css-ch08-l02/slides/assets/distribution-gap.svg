<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">Main Axisの余白分配とGap</title>
  <desc id="desc">flex-startとcenterの位置、Item間の20pxのGapを3段で比較する</desc>
  <rect width="720" height="400" rx="28" fill="#f5efe4"/>
  <text x="48" y="54" fill="#24323d" font-family="system-ui, sans-serif" font-size="24" font-weight="700">Main Axis の余白を読む</text>
  <g font-family="system-ui, sans-serif" font-size="15" fill="#24323d">
    <text x="48" y="112" font-weight="700">flex-start</text>
    <rect x="170" y="82" width="500" height="58" rx="12" fill="#fff" stroke="#b58b42" stroke-width="2"/>
    <rect x="190" y="96" width="72" height="30" rx="8" fill="#2d5d62"/><rect x="274" y="96" width="72" height="30" rx="8" fill="#2d5d62"/>
    <path d="M358 111H646" stroke="#b8ada0" stroke-width="2" stroke-dasharray="6 7"/>
    <text x="48" y="206" font-weight="700">center</text>
    <rect x="170" y="176" width="500" height="58" rx="12" fill="#fff" stroke="#b58b42" stroke-width="2"/>
    <path d="M190 205H344M496 205H650" stroke="#b8ada0" stroke-width="2" stroke-dasharray="6 7"/>
    <rect x="344" y="190" width="72" height="30" rx="8" fill="#2d5d62"/><rect x="424" y="190" width="72" height="30" rx="8" fill="#2d5d62"/>
    <text x="48" y="306" font-weight="700">gap: 20px</text>
    <rect x="170" y="270" width="500" height="74" rx="12" fill="#fff" stroke="#b58b42" stroke-width="2"/>
    <rect x="190" y="286" width="80" height="34" rx="8" fill="#2d5d62"/><rect x="290" y="286" width="80" height="34" rx="8" fill="#2d5d62"/>
    <path d="M270 330V342M290 330V342M270 337H290" stroke="#d45d3f" stroke-width="3"/>
    <text x="274" y="366" fill="#d45d3f" font-weight="700">20px</text>
  </g>
</svg>
