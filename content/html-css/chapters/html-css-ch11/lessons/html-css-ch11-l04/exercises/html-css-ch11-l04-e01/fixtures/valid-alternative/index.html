<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reduced Motion Portfolio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section data-page>
      <h1>作品の最終確認</h1>
      <section class="profile-check">
        <img data-avatar src="asset:audit-avatar" alt="Code Cardを持つ学習者" />
        <div>
          <h2>Profile Card</h2>
          <label for="audit-name">表示名</label>
          <input data-name-input id="audit-name" value="Tsumu" />
          <a
            class="is-focus-visible"
            data-action
            data-focus-demo
            data-profile-link
            href="#publish-status"
          >
            Portfolioの公開状態を見る
          </a>
        </div>
      </section>
      <p id="publish-status" data-status>
        <span class="status-dot" aria-hidden="true"></span>
        <strong data-status-text>公開中</strong>
      </p>
      <div class="motion-card">Motionを減らした案内</div>
    </section>
  </body>
</html>
