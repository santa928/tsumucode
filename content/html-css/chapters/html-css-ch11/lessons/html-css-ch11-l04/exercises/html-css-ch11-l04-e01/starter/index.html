<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Motionを調整した作品紹介</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main data-page>
      <p class="eyebrow">FINAL ACCESSIBILITY AUDIT</p>
      <h1>ゆっくり確認できるPortfolio</h1>
      <section class="profile-check">
        <img data-avatar src="asset:audit-avatar" alt="オレンジのCode Cardを持つTsumuCode学習者" />
        <div>
          <h2>Profile Card</h2>
          <label for="audit-name">表示名</label>
          <input data-name-input id="audit-name" value="つむ" />
          <a
            class="is-focus-visible"
            data-action
            data-focus-demo
            data-profile-link
            href="#publish-status"
          >
            作品の公開状態を見る
          </a>
        </div>
      </section>
      <p id="publish-status" data-status>
        <span class="status-dot" aria-hidden="true"></span>
        <strong data-status-text>公開中</strong>
      </p>
      <article class="motion-card">
        <h2>Motion Preview</h2>
        <p>利用者設定に合わせて装飾Motionを短くします。</p>
      </article>
    </main>
  </body>
</html>
