<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Keyboard Action</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>作品への入口</h1>
      <div class="actions">
        <button data-action data-focus-demo class="key-target show-focus" type="button">
          作品一覧を表示
        </button>
        <a data-action class="key-target" href="#about">作者について</a>
      </div>
      <section id="about">
        <h2>作者について</h2>
        <p>毎日少しずつHTMLとCSSを学んでいます。</p>
      </section>
    </main>
  </body>
</html>
