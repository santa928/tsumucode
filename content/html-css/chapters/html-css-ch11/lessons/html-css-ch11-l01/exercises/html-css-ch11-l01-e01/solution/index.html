<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Keyboardでたどれる作品案内</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>つむの作品案内</h1>
      <p>Keyboardでも作品と次の行動へ迷わず進めます。</p>
      <nav aria-label="作品案内">
        <a data-action data-focus-demo class="action is-focus-visible" href="#works">作品を見る</a>
        <button data-action class="action" type="button">学習記録を開く</button>
      </nav>
      <section id="works" aria-labelledby="works-title">
        <h2 id="works-title">最近の作品</h2>
        <p>温かな配色のプロフィールカードです。</p>
      </section>
    </main>
  </body>
</html>
