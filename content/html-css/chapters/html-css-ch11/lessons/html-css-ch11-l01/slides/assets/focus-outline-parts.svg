<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220">
  <title>Focus Indicatorの太さと間隔</title>
  <desc>Focus対象の外側へ3pxの間隔を空け、さらに外へ3pxの橙色Outlineを描く図</desc>
  <rect width="960" height="220" rx="28" fill="#f5efe3" />
  <g transform="translate(72 42)" font-family="system-ui, sans-serif">
    <rect x="300" y="26" width="260" height="88" rx="18" fill="#172a3a" />
    <rect x="288" y="14" width="284" height="112" rx="24" fill="none" stroke="#ef7d4f" stroke-width="6" />
    <text x="430" y="80" fill="#ffffff" font-size="24" font-weight="700" text-anchor="middle">作品を見る</text>
    <path d="M180 42h96" stroke="#2d7c82" stroke-width="5" />
    <text x="0" y="36" fill="#172a3a" font-size="20" font-weight="700">outline: 3px</text>
    <text x="0" y="68" fill="#52616d" font-size="17">橙色の現在地</text>
    <path d="M584 96h86" stroke="#2d7c82" stroke-width="5" />
    <text x="688" y="88" fill="#172a3a" font-size="20" font-weight="700">offset: 3px</text>
    <text x="688" y="120" fill="#52616d" font-size="17">要素との間隔</text>
  </g>
</svg>
