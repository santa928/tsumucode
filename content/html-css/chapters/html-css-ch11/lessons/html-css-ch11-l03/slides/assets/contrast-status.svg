<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <title>低Contrastと4.5対1以上のText比較</title>
  <desc>同じ明るい背景で薄い文字は読みにくく、濃い文字と公開中Textを組み合わせると読みやすく意味も伝わる図</desc>
  <rect width="960" height="540" rx="36" fill="#f5efe3" />
  <text x="60" y="70" fill="#172a3a" font-family="system-ui, sans-serif" font-size="30" font-weight="700">色は「組み合わせ」と「言葉」で監査する</text>
  <g transform="translate(60 126)" font-family="system-ui, sans-serif">
    <g>
      <rect width="390" height="290" rx="26" fill="#fffdf8" stroke="#ef7d4f" stroke-width="5" />
      <rect width="390" height="58" rx="22" fill="#ef7d4f" />
      <text x="195" y="38" fill="#ffffff" font-size="21" font-weight="700" text-anchor="middle">改善前</text>
      <text x="36" y="116" fill="#aaa097" font-size="28" font-weight="700">Profile Card</text>
      <circle cx="54" cy="166" r="13" fill="#46a46d" />
      <text x="82" y="174" fill="#aaa097" font-size="19">色の丸だけ</text>
      <rect x="34" y="218" width="322" height="44" rx="12" fill="#f2ece3" />
      <text x="195" y="247" fill="#8f3f2d" font-size="17" font-weight="700" text-anchor="middle">Contrast不足・状態名なし</text>
    </g>
    <g transform="translate(450)">
      <rect width="390" height="290" rx="26" fill="#fffdf8" stroke="#2d7c82" stroke-width="5" />
      <rect width="390" height="58" rx="22" fill="#2d7c82" />
      <text x="195" y="38" fill="#ffffff" font-size="21" font-weight="700" text-anchor="middle">改善後</text>
      <text x="36" y="116" fill="#172a3a" font-size="28" font-weight="700">Profile Card</text>
      <circle cx="54" cy="166" r="13" fill="#2d7c82" />
      <text x="82" y="174" fill="#172a3a" font-size="19" font-weight="700">公開中</text>
      <rect x="34" y="218" width="322" height="44" rx="12" fill="#dcefed" />
      <text x="195" y="247" fill="#155e63" font-size="17" font-weight="700" text-anchor="middle">4.5:1以上・状態Textあり</text>
    </g>
  </g>
  <g transform="translate(60 450)" font-family="system-ui, sans-serif" font-size="18" font-weight="700">
    <text x="0" y="0" fill="#52616d">測る：</text>
    <text x="68" y="0" fill="#172a3a">Computed color × background-color</text>
    <text x="500" y="0" fill="#52616d">読む：</text>
    <text x="568" y="0" fill="#172a3a">色を隠しても残る状態Text</text>
  </g>
</svg>
