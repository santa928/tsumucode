<!doctype html>
<html lang="ja">

    <title>Linkの行き先を入れ替えた誤答</title>
  </head>
  <body>
    <main>
      <h1>Linkの練習</h1>
      <nav aria-label="練習用Navigation">

        <a class="external-link" href="#practice">外部の練習用Siteを見る</a>

      <section id="practice">
