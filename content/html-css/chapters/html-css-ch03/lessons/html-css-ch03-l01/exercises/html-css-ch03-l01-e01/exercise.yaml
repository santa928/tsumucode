id: html-css-ch03-l01-e01
kind: standard
workspaceId: html-css-ch03-l01-e01
countsTowardStandardExerciseTotal: true
title: ページ内と外部の行き先をLinkにする
instructionsSource: instructions.md
requiresConcepts:
  - { conceptId: fragment-link, minimumLevel: transform }
  - { conceptId: external-link, minimumLevel: transform }
scaffoldLevel: transform
steps:
  - id: connect-practice-fragment
    file: index.html
    target: Navigation内の「練習内容を見る」Link
    starterAnchor: <a class="practice-link" href="#overview">練習内容を見る</a>
    change: hrefを#practiceへ変更する
    observe: PreviewでLinkを選ぶと練習内容Sectionへ移動する
    requiresConceptIds: [fragment-link]
    validationRuleIds:
      - html-css-ch03-l01-e01-r01
      - html-css-ch03-l01-e01-r03
      - html-css-ch03-l01-e01-r05
  - id: connect-external-site
    file: index.html
    target: Navigation内の「外部の練習用Siteを見る」Link
    starterAnchor: <a class="external-link" href="#external">外部の練習用Siteを見る</a>
    change: hrefをhttps://example.com/へ変更する
    observe: 判定で安全な外部Linkとして認識される
    requiresConceptIds: [external-link]
    validationRuleIds: [html-css-ch03-l01-e01-r02, html-css-ch03-l01-e01-r04]
files:
  - { path: index.html, language: html, source: starter/index.html, editable: true }
  - { path: styles.css, language: css, source: starter/styles.css, editable: true }
solutionFiles:
  - { path: index.html, language: html, source: solution/index.html, editable: false }
  - { path: styles.css, language: css, source: solution/styles.css, editable: false }
validationRules:
  - id: html-css-ch03-l01-e01-r01
    label: 練習Sectionへページ内Linkを作る
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: 'a.practice-link[href="#practice"]' }
    assertion: { kind: count, operator: equals, expected: 1 }
    feedback:
      target: ページ内の練習SectionへのLink
      expected: practice-linkクラスでhrefが#practiceのa要素が1つ
      nextAction: practice-linkのclassは残し、練習内容を見るLinkのhrefを#practiceにします。
    hintId: html-css-ch03-l01-e01-h01
    relatedSlideId: html-css-ch03-l01-s01
  - id: html-css-ch03-l01-e01-r02
    label: httpsの外部Linkを作る
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: 'a.external-link[href^="https://"]' }
    assertion: { kind: count, operator: equals, expected: 1 }
    feedback:
      target: 外部の練習用SiteへのLink
      expected: external-linkクラスでhttpsから始まるhrefのa要素が1つ
      nextAction: external-linkのclassは残し、hrefへhttps://example.com/のような安全なURLを設定します。
    hintId: html-css-ch03-l01-e01-h02
    relatedSlideId: html-css-ch03-l01-s02
  - id: html-css-ch03-l01-e01-r03
    label: ページ内Linkの目的を言葉で伝える
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: 'a.practice-link' }
    assertion: { kind: accessible-name, operator: present }
    feedback:
      target: ページ内LinkのText
      expected: 空ではない行き先の説明
      nextAction: aの中へ、移動先で何が分かるかを書きます。
    hintId: html-css-ch03-l01-e01-h01
    relatedSlideId: html-css-ch03-l01-s01
  - id: html-css-ch03-l01-e01-r04
    label: 外部Linkの目的を言葉で伝える
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: 'a.external-link' }
    assertion: { kind: accessible-name, operator: present }
    feedback:
      target: 外部LinkのText
      expected: 空ではない行き先の説明
      nextAction: 外部Linkのa要素へ、行き先を予測できるTextを書きます。
    hintId: html-css-ch03-l01-e01-h03
    relatedSlideId: html-css-ch03-l01-s02
  - id: html-css-ch03-l01-e01-r05
    label: ページ内Linkの到着点を置く
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: 'section#practice' }
    assertion: { kind: count, operator: equals, expected: 1 }
    feedback:
      target: Fragment Linkの到着点
      expected: idがpracticeのsectionが1つ
      nextAction: 練習内容のsectionにid="practice"を設定します。
    hintId: html-css-ch03-l01-e01-h03
    relatedSlideId: html-css-ch03-l01-s01
hints:
  - id: html-css-ch03-l01-e01-h01
    level: 1
    title: 2つの行き先を観察する
    text: 同じページ内のSectionと、別のWeb Siteという行き先の違いを確認します。
    relatedSlideId: html-css-ch03-l01-s01
  - id: html-css-ch03-l01-e01-h02
    level: 2
    title: hrefの先頭を選ぶ
    text: ページ内は#とID、外部はhttps://で始まるURLを使います。
    relatedSlideId: html-css-ch03-l01-s02
  - id: html-css-ch03-l01-e01-h03
    level: 3
    title: 外部Linkを安全なURLへ直す
    text: 2つ目のaのhrefをhttps://example.com/へし、aの中に行き先が分かる言葉を残します。
    relatedSlideId: html-css-ch03-l01-s02
relatedSlideIds:
  - html-css-ch03-l01-s01
  - html-css-ch03-l01-s02
previewViewports:
  - { id: desktop-1280, width: 1280, height: 720 }
assets: []
fixtures:
  - id: html-css-ch03-l01-e01-valid-alternative
    expectedStatus: pass
    files:
      - {
          path: index.html,
          language: html,
          source: fixtures/valid-alternative/index.html,
          editable: false,
        }
      - {
          path: styles.css,
          language: css,
          source: fixtures/valid-alternative/styles.css,
          editable: false,
        }
    expectedFeedbackRuleIds: []
  - id: html-css-ch03-l01-e01-code-error
    expectedStatus: code-error
    files:
      - {
          path: index.html,
          language: html,
          source: fixtures/code-error/index.html,
          editable: false,
        }
      - { path: styles.css, language: css, source: fixtures/code-error/styles.css, editable: false }
    expectedFeedbackRuleIds: []
  - id: html-css-ch03-l01-e01-swapped-destinations
    expectedStatus: incomplete
    files:
      - {
          path: index.html,
          language: html,
          source: fixtures/swapped-destinations/index.html,
          editable: false,
        }
      - {
          path: styles.css,
          language: css,
          source: fixtures/swapped-destinations/styles.css,
          editable: false,
        }
    expectedFeedbackRuleIds:
      - html-css-ch03-l01-e01-r01
      - html-css-ch03-l01-e01-r02
