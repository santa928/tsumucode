<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>練習用入力欄</title>
  </head>
  <body>
    <main>
      <h1>練習用入力欄</h1>
      <form aria-describedby="privacy-note">
        <label class="field-label" for="display-name">学習中の表示名</label>
        <input type="text" name="learnerName" id="display-name" />
        <button class="check" type="button">画面で確認</button>
        <p id="privacy-note">入力は送信されません。</p>
      </form>
    </main>
  </body>
</html>
