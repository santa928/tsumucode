id: html-css-ch03-l04-e01
kind: standard
workspaceId: html-css-ch03-l04-e01
countsTowardStandardExerciseTotal: true
title: 安全な学習用Contact Cardを完成する
instructionsSource: instructions.md
requiresConcepts:
  - { conceptId: address-element, minimumLevel: transform }
  - { conceptId: contact-card-composition, minimumLevel: compose }
scaffoldLevel: compose
steps:
  - id: describe-contact-avatar
    file: index.html
    target: profile-card先頭のimgにある空のalt
    starterAnchor: <img src="asset:avatar-contact-card" alt="" />
    change: Tsumu LearnerのProfile Avatarだと分かる説明を書く
    observe: 判定でCard画像のAccessible Nameが認識される
    requiresConceptIds: [contact-card-composition]
    validationRuleIds: [html-css-ch03-l04-e01-r02]
  - id: mark-up-contact-address
    file: index.html
    target: Contact Linkを包むcontactクラスのdiv
    starterAnchor: <div class="contact">
    change: 開始Tagと終了Tagをaddressへ変更し、classは残す
    observe: Previewを保ちながら連絡情報の役割が構造へ加わる
    requiresConceptIds: [address-element]
    validationRuleIds: [html-css-ch03-l04-e01-r01]
  - id: connect-safe-contact-page
    file: index.html
    target: addressへ変更する領域内のContact Link
    starterAnchor: <a href="#contact">学習用Contact Pageを見る</a>
    change: hrefをhttps://example.com/contactへ変更する
    observe: 判定で個人情報を含まない外部Contact Linkとして認識される
    requiresConceptIds: [contact-card-composition]
    validationRuleIds: [html-css-ch03-l04-e01-r03, html-css-ch03-l04-e01-r04]
files:
  - { path: index.html, language: html, source: starter/index.html, editable: true }
  - { path: styles.css, language: css, source: starter/styles.css, editable: true }
solutionFiles:
  - { path: index.html, language: html, source: solution/index.html, editable: false }
  - { path: styles.css, language: css, source: solution/styles.css, editable: false }
validationRules:
  - id: html-css-ch03-l04-e01-r01
    label: 連絡情報をaddressで表す
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: '.profile-card address.contact' }
    assertion: { kind: count, operator: equals, expected: 1 }
    feedback:
      target: Profile Cardの連絡情報
      expected: profile-card内にcontactクラスのaddressが1つ
      nextAction: contactのclassは残し、Contact Linkを包むdivをaddressへ変更します。
    hintId: html-css-ch03-l04-e01-h01
    relatedSlideId: html-css-ch03-l04-s01
  - id: html-css-ch03-l04-e01-r02
    label: Avatarへ目的が分かるaltを書く
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: 'img[data-tsumucode-asset-id="avatar-contact-card"]' }
    assertion: { kind: attribute, name: alt, operator: contains, expected: Avatar }
    feedback:
      target: Profile Avatarのalt
      expected: Avatarという目的を含むalt属性
      nextAction: aria-labelではなくaltへ、学習者を表すProfile Avatarだと分かる言葉を書きます。
    hintId: html-css-ch03-l04-e01-h02
    relatedSlideId: html-css-ch03-l04-s01
  - id: html-css-ch03-l04-e01-r03
    label: Contactをhttps Linkにする
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target:
      {
        kind: selector,
        selector: '.profile-card address.contact > a[href="https://example.com/contact"]',
      }
    assertion: { kind: count, operator: equals, expected: 1 }
    feedback:
      target: 学習用Contactの行き先
      expected: contactのaddress内に指定されたexample.comの練習用Linkが1つ
      nextAction: 個人URLではなく、スライド例のhttps://example.com/contactをhrefへ設定します。
    hintId: html-css-ch03-l04-e01-h03
    relatedSlideId: html-css-ch03-l04-s02
  - id: html-css-ch03-l04-e01-r04
    label: Contact Linkの目的を言葉で伝える
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: '.profile-card address.contact > a' }
    assertion: { kind: accessible-name, operator: present }
    feedback:
      target: Contact LinkのText
      expected: 空ではない行き先の説明
      nextAction: a要素の中へ、学習用Contact Pageへ移動すると分かる言葉を書きます。
    hintId: html-css-ch03-l04-e01-h03
    relatedSlideId: html-css-ch03-l04-s02
hints:
  - id: html-css-ch03-l04-e01-h01
    level: 1
    title: Card内の役割を観察する
    text: 画像、名前、説明、作者への連絡情報の4つがどのElementに入っているか確認します。
    relatedSlideId: html-css-ch03-l04-s01
  - id: html-css-ch03-l04-e01-h02
    level: 2
    title: 画像と連絡先を言葉でも伝える
    text: AvatarのaltとLink Textは、見えなくても目的が分かる説明にします。
    relatedSlideId: html-css-ch03-l04-s02
  - id: html-css-ch03-l04-e01-h03
    level: 3
    title: addressとhttpsを具体的に使う
    text: contactのdivをaddressへ変え、hrefをhttps://example.com/contactへ変更します。
    relatedSlideId: html-css-ch03-l04-s02
relatedSlideIds:
  - html-css-ch03-l04-s01
  - html-css-ch03-l04-s02
previewViewports:
  - { id: desktop-1280, width: 1280, height: 720 }
assets:
  - id: avatar-contact-card
    source: assets/profile-avatar.svg
    mediaType: image
    alt: Code Cardを持つTsumuCode学習プロフィールのAvatar
    provenanceId: ch03-profile-avatar-contact-original
