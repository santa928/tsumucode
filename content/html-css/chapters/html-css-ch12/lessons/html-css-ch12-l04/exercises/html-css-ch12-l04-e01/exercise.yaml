id: html-css-ch12-l04-e01
kind: guided-project
projectId: html-css-profile-project
workspaceId: html-css-profile-project
countsTowardStandardExerciseTotal: false
title: WorksとContactを2 Viewportへ収める
instructionsSource: instructions.md
requiresConcepts:
  - { conceptId: contact, minimumLevel: compose }
  - { conceptId: responsive, minimumLevel: compose }
scaffoldLevel: compose
steps:
  - id: compose-contact
    file: index.html
    target: main末尾のContact Section
    starterAnchor: '</main>'
    change: bodyへdata-profile-pageを付け、h2、説明、相手と目的が分かるLinkを持つContactを追加する
    observe: Contact Linkを単独で読んでも目的が伝わり、Page境界を2幅で測れる
    requiresConceptIds: [contact]
    validationRuleIds:
      - html-css-ch12-l04-e01-r03
  - id: make-project-responsive
    file: styles.css
    target: Works Grid、Work画像、Mobile Media Query
    starterAnchor: '.skill-list li {'
    change: Worksの列を可変にし、画像をCardへ収め、700px以下ではHeroを1列にする
    observe: GridまたはFlexのLayoutを保ち、390pxと1280pxでDocumentと画像がはみ出さない
    requiresConceptIds: [responsive]
    validationRuleIds:
      - html-css-ch12-l04-e01-r01
      - html-css-ch12-l04-e01-r02
      - html-css-ch12-l04-e01-r04
      - html-css-ch12-l04-e01-r05
      - html-css-ch12-l04-e01-r06
files:
  - { path: index.html, language: html, source: starter/index.html, editable: true }
  - { path: styles.css, language: css, source: starter/styles.css, editable: true }
solutionFiles:
  - { path: index.html, language: html, source: solution/index.html, editable: false }
  - { path: styles.css, language: css, source: solution/styles.css, editable: false }
validationRules:
  - id: html-css-ch12-l04-e01-r01
    groupId: profile-works-layout-method
    label: WorksをGridで並べる
    required: true
    group: any
    viewportMode: all
    viewportIds: [mobile-390, desktop-1280]
    target: { kind: selector, selector: '[data-works-layout]' }
    assertion: { kind: computed-style, property: display, operator: equals, expected: grid }
    feedback:
      target: Works LayoutのComputed Display
      expected: Gridまたは同じGroupのFlex
      nextAction: Works ContainerをGridまたはFlexのどちらかで並べます。
    hintId: html-css-ch12-l04-e01-h01
    relatedSlideId: html-css-ch12-l04-g01
  - id: html-css-ch12-l04-e01-r02
    groupId: profile-works-layout-method
    label: WorksをFlexで並べる
    required: true
    group: any
    viewportMode: all
    viewportIds: [mobile-390, desktop-1280]
    target: { kind: selector, selector: '[data-works-layout]' }
    assertion: { kind: computed-style, property: display, operator: equals, expected: flex }
    feedback:
      target: Works LayoutのComputed Display
      expected: Flexまたは同じGroupのGrid
      nextAction: Works ContainerをFlexまたはGridのどちらかで並べます。
    hintId: html-css-ch12-l04-e01-h01
    relatedSlideId: html-css-ch12-l04-g01
  - id: html-css-ch12-l04-e01-r03
    label: Contact Linkへ目的が分かる名前を付ける
    required: true
    group: all
    viewportMode: all
    viewportIds: [mobile-390, desktop-1280]
    target: { kind: selector, selector: '[data-contact-link]' }
    assertion: { kind: accessible-name, operator: present }
    feedback:
      target: Contact LinkのAccessible Name
      expected: 連絡方法と相手が分かる空でない名前
      nextAction: Contact Linkへ誰に何を送るかが分かるTextを書きます。
    hintId: html-css-ch12-l04-e01-h02
    relatedSlideId: html-css-ch12-l04-g01
  - id: html-css-ch12-l04-e01-r04
    label: 390pxと1280pxでDocument Overflowを防ぐ
    required: true
    group: all
    viewportMode: all
    viewportIds: [mobile-390, desktop-1280]
    target: { kind: selector, selector: '[data-profile-page]' }
    assertion: { kind: overflow-x, operator: equals, expected: false }
    feedback:
      target: Profile DocumentのHorizontal Overflow
      expected: 390pxと1280pxの両方でfalse
      nextAction: 固定幅をResponsiveなwidthとmax-widthへ置き換えます。
    hintId: html-css-ch12-l04-e01-h03
    relatedSlideId: html-css-ch12-l04-g01
  - id: html-css-ch12-l04-e01-r05
    label: Work Cardへ画像を収める
    required: true
    group: all
    viewportMode: all
    viewportIds: [mobile-390, desktop-1280]
    target: { kind: selector, selector: '[data-work-card]' }
    assertion: { kind: overflow-x, operator: equals, expected: false }
    feedback:
      target: 各Work CardのHorizontal Overflow
      expected: 画像を含む全Cardでfalse
      nextAction: Work画像へwidthとmax-width 100%を指定しCard境界へ収めます。
    hintId: html-css-ch12-l04-e01-h03
    relatedSlideId: html-css-ch12-l04-g01
  - id: html-css-ch12-l04-e01-r06
    label: Work画像の幅境界をSourceへ書く
    required: true
    group: all
    viewportMode: all
    viewportIds: [mobile-390, desktop-1280]
    target: { kind: source, file: styles.css }
    assertion:
      kind: text
      operator: contains-normalized
      expected: '.work-image { display: block; width: 100%; max-width: 100%; height: auto; }'
    feedback:
      target: Work ImageのResponsive Source
      expected: widthとmax-width 100%、height auto
      nextAction: .work-imageへ3つの境界を指定します。
    hintId: html-css-ch12-l04-e01-h03
    relatedSlideId: html-css-ch12-l04-g01
hints:
  - id: html-css-ch12-l04-e01-h01
    level: 1
    title: Layout手法を1つ選ぶ
    text: Works ContainerをGridまたはFlexにし、Cardを複数列へ並べます。
    relatedSlideId: html-css-ch12-l04-g01
  - id: html-css-ch12-l04-e01-h02
    level: 2
    title: Contactを単独で読む
    text: Linkだけを読んでも連絡先と行動が分かる文言にします。
    relatedSlideId: html-css-ch12-l04-g01
  - id: html-css-ch12-l04-e01-h03
    level: 3
    title: DocumentとCardを別々に測る
    text: 390pxと1280pxでPageと各Work CardのscrollWidthを確認します。
    relatedSlideId: html-css-ch12-l04-g01
relatedSlideIds: [html-css-ch12-l04-g01]
previewViewports:
  - { id: mobile-390, width: 390, height: 844 }
  - { id: desktop-1280, width: 1280, height: 720 }
assets:
  - id: profile-avatar-l04-source
    source: assets/profile-avatar.svg
    mediaType: image
    alt: オレンジのCode Cardを持つつむぎ
    provenanceId: ch12-profile-avatar-l04-original
