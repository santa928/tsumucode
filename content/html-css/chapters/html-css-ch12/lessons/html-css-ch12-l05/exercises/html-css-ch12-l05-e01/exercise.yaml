id: html-css-ch12-l05-e01
kind: guided-project
projectId: html-css-profile-project
workspaceId: html-css-profile-project
countsTowardStandardExerciseTotal: false
title: Profile Siteの最終Auditを完了する
instructionsSource: instructions.md
requiresConcepts:
  - { conceptId: polish, minimumLevel: compose }
scaffoldLevel: compose
steps:
  - id: polish-profile
    file: styles.css
    target: 完成したProfile全体
    starterAnchor: '@media (max-width: 700px) {'
    change: Heading、Keyboard Focus、Contrast、alt、4 Viewportを観点別に測り、主要Linkへfocus-visibleを追加する
    observe: Focus時のOutlineを含む9つの判定がすべて合格し、利用条件を変えても内容と操作が保たれる
    requiresConceptIds: [polish]
    validationRuleIds:
      - html-css-ch12-l05-e01-r01
      - html-css-ch12-l05-e01-r02
      - html-css-ch12-l05-e01-r03
      - html-css-ch12-l05-e01-r04
      - html-css-ch12-l05-e01-r05
      - html-css-ch12-l05-e01-r06
      - html-css-ch12-l05-e01-r06-style
      - html-css-ch12-l05-e01-r06-offset
      - html-css-ch12-l05-e01-r07
files:
  - { path: index.html, language: html, source: starter/index.html, editable: true }
  - { path: styles.css, language: css, source: starter/styles.css, editable: true }
solutionFiles:
  - { path: index.html, language: html, source: solution/index.html, editable: false }
  - { path: styles.css, language: css, source: solution/styles.css, editable: false }
validationRules:
  - id: html-css-ch12-l05-e01-r01
    label: h1を1つにする
    required: true
    group: all
    viewportMode: all
    viewportIds: [mobile-390, tablet-768, desktop-1280, wide-1440]
    target: { kind: selector, selector: h1 }
    assertion: { kind: count, operator: equals, expected: 1 }
    feedback:
      target: Profile SiteのMain Heading
      expected: h1が1つ
      nextAction: Page全体の題名だけをh1にします。
    hintId: html-css-ch12-l05-e01-h01
    relatedSlideId: html-css-ch12-l05-g01
  - id: html-css-ch12-l05-e01-r02
    label: 各主要Sectionをh2で始める
    required: true
    group: all
    viewportMode: all
    viewportIds: [mobile-390, tablet-768, desktop-1280, wide-1440]
    target: { kind: selector, selector: 'main section h2' }
    assertion: { kind: count, operator: gte, expected: 4 }
    feedback:
      target: About、Skills、Works、ContactのHeading
      expected: main内のh2が4つ以上
      nextAction: h1の次に各主要Sectionをh2で始めます。
    hintId: html-css-ch12-l05-e01-h01
    relatedSlideId: html-css-ch12-l05-g01
  - id: html-css-ch12-l05-e01-r03
    label: 主要ActionをKeyboard Focus可能にする
    required: true
    group: all
    viewportMode: all
    viewportIds: [mobile-390, tablet-768, desktop-1280, wide-1440]
    target: { kind: selector, selector: '[data-primary-link], [data-contact-link]' }
    assertion: { kind: focusable, operator: equals, expected: true }
    feedback:
      target: PrimaryとContact ActionのFocusability
      expected: Primary LinkとContact LinkがFocus可能
      nextAction: Actionをhref付きaまたはbuttonとして表します。
    hintId: html-css-ch12-l05-e01-h02
    relatedSlideId: html-css-ch12-l05-g01
  - id: html-css-ch12-l05-e01-r04
    label: Profile全体のText Contrastを4.5対1以上にする
    required: true
    group: all
    viewportMode: all
    viewportIds: [mobile-390, tablet-768, desktop-1280, wide-1440]
    target: { kind: selector, selector: '[data-profile-page]' }
    assertion: { kind: contrast, minimum: 4.5 }
    feedback:
      target: Profile PageのTextとBackground
      expected: Contrast Ratio 4.5対1以上
      nextAction: BodyのText ColorとBackground Colorの明るさの差を広げます。
    hintId: html-css-ch12-l05-e01-h02
    relatedSlideId: html-css-ch12-l05-g01
  - id: html-css-ch12-l05-e01-r05
    label: Avatar altを保つ
    required: true
    group: all
    viewportMode: all
    viewportIds: [mobile-390, tablet-768, desktop-1280, wide-1440]
    target: { kind: selector, selector: '[data-profile-avatar]' }
    assertion: { kind: accessible-name, operator: present }
    feedback:
      target: Profile AvatarのAccessible Name
      expected: 空でない画像の説明
      nextAction: 意味のあるAvatarのaltを空にしないでください。
    hintId: html-css-ch12-l05-e01-h02
    relatedSlideId: html-css-ch12-l05-g01
  - id: html-css-ch12-l05-e01-r06
    groupId: profile-focus-indicator
    label: Focus時のOutlineを3px以上にする
    required: true
    group: all
    viewportMode: all
    viewportIds: [mobile-390, tablet-768, desktop-1280, wide-1440]
    target: { kind: selector, selector: '[data-primary-link], [data-contact-link]' }
    assertion:
      kind: focus-visible-style
      property: outline-width
      operator: gte
      expected: 3
      tolerance: 0.01
    feedback:
      target: Focus時の主要LinkのComputed Outline Width
      expected: PrimaryとContact Linkの両方で3px以上
      nextAction: focus-visibleへ3px以上のoutlineを指定します。
    hintId: html-css-ch12-l05-e01-h03
    relatedSlideId: html-css-ch12-l05-g01
  - id: html-css-ch12-l05-e01-r06-style
    groupId: profile-focus-indicator
    label: Focus時のOutlineを実線で表示する
    required: true
    group: all
    viewportMode: all
    viewportIds: [mobile-390, tablet-768, desktop-1280, wide-1440]
    target: { kind: selector, selector: '[data-primary-link], [data-contact-link]' }
    assertion:
      kind: focus-visible-style
      property: outline-style
      operator: equals
      expected: solid
    feedback:
      target: Focus時の主要LinkのComputed Outline Style
      expected: PrimaryとContact Linkの両方でsolid
      nextAction: focus-visibleのoutline styleをsolidにします。
    hintId: html-css-ch12-l05-e01-h03
    relatedSlideId: html-css-ch12-l05-g01
  - id: html-css-ch12-l05-e01-r06-offset
    groupId: profile-focus-indicator
    label: Focus Outlineを要素から4px離す
    required: true
    group: all
    viewportMode: all
    viewportIds: [mobile-390, tablet-768, desktop-1280, wide-1440]
    target: { kind: selector, selector: '[data-primary-link], [data-contact-link]' }
    assertion:
      kind: focus-visible-style
      property: outline-offset
      operator: gte
      expected: 4
      tolerance: 0.01
    feedback:
      target: Focus時の主要LinkのComputed Outline Offset
      expected: PrimaryとContact Linkの両方で4px以上
      nextAction: focus-visibleへ4px以上のoutline-offsetを指定します。
    hintId: html-css-ch12-l05-e01-h03
    relatedSlideId: html-css-ch12-l05-g01
  - id: html-css-ch12-l05-e01-r07
    label: 4 Viewportで横Overflowを防ぐ
    required: true
    group: all
    viewportMode: all
    viewportIds: [mobile-390, tablet-768, desktop-1280, wide-1440]
    target: { kind: selector, selector: '[data-profile-page]' }
    assertion: { kind: overflow-x, operator: equals, expected: false }
    feedback:
      target: Profile DocumentのHorizontal Overflow
      expected: 390、768、1280、1440pxですべてfalse
      nextAction: 各幅で固定幅、長いText、画像境界を見直します。
    hintId: html-css-ch12-l05-e01-h03
    relatedSlideId: html-css-ch12-l05-g01
hints:
  - id: html-css-ch12-l05-e01-h01
    level: 1
    title: Heading Outlineを読む
    text: h1を1つ、About、Skills、Works、Contactをh2で始めます。
    relatedSlideId: html-css-ch12-l05-g01
  - id: html-css-ch12-l05-e01-h02
    level: 2
    title: 操作と理解を分けて確認する
    text: ActionのFocusability、Text Contrast、Avatar altを順に確認します。
    relatedSlideId: html-css-ch12-l05-g01
  - id: html-css-ch12-l05-e01-h03
    level: 3
    title: Focus表示と4幅を測る
    text: 検証用Focus状態のOutline幅・線種・Offsetと、4 ViewportのOverflowを実測します。
    relatedSlideId: html-css-ch12-l05-g01
relatedSlideIds: [html-css-ch12-l05-g01]
previewViewports:
  - { id: mobile-390, width: 390, height: 844 }
  - { id: tablet-768, width: 768, height: 1024 }
  - { id: desktop-1280, width: 1280, height: 720 }
  - { id: wide-1440, width: 1440, height: 900 }
assets:
  - id: profile-avatar-l05-source
    source: assets/profile-avatar.svg
    mediaType: image
    alt: オレンジのCode Cardを持つつむぎ
    provenanceId: ch12-profile-avatar-l05-original
