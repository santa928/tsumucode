<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">AudienceからSemantic Outlineを決める流れ</title>
  <desc id="desc">読み手の目的を起点に、header、main、footerへ情報を分ける設計図</desc>
  <rect width="960" height="360" rx="28" fill="#fffaf0"/>
  <rect x="36" y="74" width="250" height="212" rx="22" fill="#172a3a"/>
  <text x="64" y="112" fill="#ef7d4f" font-family="system-ui, sans-serif" font-size="18" font-weight="800">AUDIENCE</text>
  <text x="64" y="154" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="800">Web制作を学ぶ</text>
  <text x="64" y="187" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="800">友人へ伝える</text>
  <path d="M306 180h72" stroke="#ef7d4f" stroke-width="8" stroke-linecap="round"/>
  <path d="m367 164 18 16-18 16" fill="none" stroke="#ef7d4f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="410" y="38" width="514" height="72" rx="18" fill="#dcebe8" stroke="#2d7c82" stroke-width="3"/>
  <rect x="410" y="130" width="514" height="100" rx="18" fill="#ffffff" stroke="#2d7c82" stroke-width="3"/>
  <rect x="410" y="250" width="514" height="72" rx="18" fill="#dcebe8" stroke="#2d7c82" stroke-width="3"/>
  <text x="438" y="82" fill="#155e63" font-family="ui-monospace, monospace" font-size="24" font-weight="800">&lt;header&gt;</text>
  <text x="616" y="82" fill="#172a3a" font-family="system-ui, sans-serif" font-size="20">導入と読み手</text>
  <text x="438" y="172" fill="#155e63" font-family="ui-monospace, monospace" font-size="24" font-weight="800">&lt;main&gt;</text>
  <text x="438" y="205" fill="#172a3a" font-family="system-ui, sans-serif" font-size="20">Profile・Skills・Works</text>
  <text x="438" y="294" fill="#155e63" font-family="ui-monospace, monospace" font-size="24" font-weight="800">&lt;footer&gt;</text>
  <text x="616" y="294" fill="#172a3a" font-family="system-ui, sans-serif" font-size="20">補足と記録</text>
</svg>
