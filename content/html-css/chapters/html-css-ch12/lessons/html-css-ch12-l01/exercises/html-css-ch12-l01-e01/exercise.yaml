id: html-css-ch12-l01-e01
kind: guided-project
projectId: html-css-profile-project
workspaceId: html-css-profile-project
countsTowardStandardExerciseTotal: false
title: AudienceとSemantic Outlineを作る
instructionsSource: instructions.md
requiresConcepts:
  - { conceptId: audience, minimumLevel: compose }
  - { conceptId: outline, minimumLevel: compose }
scaffoldLevel: compose
steps:
  - id: define-audience
    file: index.html
    target: .page内の仮Text
    starterAnchor: '<p>ここへAudienceとSemantic Outlineを作ります。</p>'
    change: data-audienceを持つpへ読み手と目的を1文で書く
    observe: Audienceの判定が合格し、誰向けのページかPreviewで読める
    requiresConceptIds: [audience]
    validationRuleIds:
      - html-css-ch12-l01-e01-r01
  - id: compose-semantic-outline
    file: index.html
    target: body内の仮div
    starterAnchor: '<div class="page">'
    change: header、main、footerとmain内のsectionへ内容を分ける
    observe: HTMLだけでも導入、中心内容、補足の順序が伝わる
    requiresConceptIds: [outline]
    validationRuleIds:
      - html-css-ch12-l01-e01-r02
      - html-css-ch12-l01-e01-r03
      - html-css-ch12-l01-e01-r04
      - html-css-ch12-l01-e01-r05
files:
  - { path: index.html, language: html, source: starter/index.html, editable: true }
  - { path: styles.css, language: css, source: starter/styles.css, editable: true }
solutionFiles:
  - { path: index.html, language: html, source: solution/index.html, editable: false }
  - { path: styles.css, language: css, source: solution/styles.css, editable: false }
validationRules:
  - id: html-css-ch12-l01-e01-r01
    label: Audienceを1文で記録する
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: '[data-audience]' }
    assertion: { kind: text, operator: contains, expected: Web制作 }
    feedback:
      target: Profile SiteのAudience文
      expected: Web制作を含む読み手の説明
      nextAction: data-audienceを持つ文へ、誰に向けたページかを書きます。
    hintId: html-css-ch12-l01-e01-h01
    relatedSlideId: html-css-ch12-l01-g01
  - id: html-css-ch12-l01-e01-r02
    label: Headerを1つ置く
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: header }
    assertion: { kind: count, operator: equals, expected: 1 }
    feedback:
      target: Pageの導入領域
      expected: headerが1つ
      nextAction: Site名とAudienceをheaderへまとめます。
    hintId: html-css-ch12-l01-e01-h02
    relatedSlideId: html-css-ch12-l01-g01
  - id: html-css-ch12-l01-e01-r03
    label: Mainを1つ置く
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: main }
    assertion: { kind: count, operator: equals, expected: 1 }
    feedback:
      target: Pageの中心内容
      expected: mainが1つ
      nextAction: Profileの中心内容を1つのmainへまとめます。
    hintId: html-css-ch12-l01-e01-h02
    relatedSlideId: html-css-ch12-l01-g01
  - id: html-css-ch12-l01-e01-r04
    label: Footerを1つ置く
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: footer }
    assertion: { kind: count, operator: equals, expected: 1 }
    feedback:
      target: Pageの補足領域
      expected: footerが1つ
      nextAction: 補足情報をfooterへ置きます。
    hintId: html-css-ch12-l01-e01-h03
    relatedSlideId: html-css-ch12-l01-g01
  - id: html-css-ch12-l01-e01-r05
    label: Main内をSectionへ分ける
    required: true
    group: all
    viewportMode: all
    viewportIds: [desktop-1280]
    target: { kind: selector, selector: 'main section' }
    assertion: { kind: count, operator: gte, expected: 1 }
    feedback:
      target: Main内の話題Section
      expected: main内にsectionが1つ以上
      nextAction: Profileの話題をmain内のsectionへ分けます。
    hintId: html-css-ch12-l01-e01-h03
    relatedSlideId: html-css-ch12-l01-g01
hints:
  - id: html-css-ch12-l01-e01-h01
    level: 1
    title: 読み手を具体化する
    text: Web制作を学び始めた誰に向けるかを1文へします。
    relatedSlideId: html-css-ch12-l01-g01
  - id: html-css-ch12-l01-e01-h02
    level: 2
    title: 3つの大きな領域に分ける
    text: 導入はheader、中心内容はmain、補足はfooterへ置きます。
    relatedSlideId: html-css-ch12-l01-g01
  - id: html-css-ch12-l01-e01-h03
    level: 3
    title: Main内へ話題を作る
    text: mainの中にsectionを置き、Profileの導入をまとめます。
    relatedSlideId: html-css-ch12-l01-g01
relatedSlideIds: [html-css-ch12-l01-g01]
previewViewports:
  - { id: desktop-1280, width: 1280, height: 720 }
assets: []
fixtures:
  - id: html-css-ch12-l01-e01-valid-alternative
    expectedStatus: pass
    files:
      - {
          path: index.html,
          language: html,
          source: fixtures/valid-alternative/index.html,
          editable: false,
        }
      - {
          path: styles.css,
          language: css,
          source: fixtures/valid-alternative/styles.css,
          editable: false,
        }
    expectedFeedbackRuleIds: []
  - id: html-css-ch12-l01-e01-incomplete
    expectedStatus: incomplete
    files:
      - {
          path: index.html,
          language: html,
          source: fixtures/incomplete/index.html,
          editable: false,
        }
      - { path: styles.css, language: css, source: fixtures/incomplete/styles.css, editable: false }
    expectedFeedbackRuleIds: [html-css-ch12-l01-e01-r04]
