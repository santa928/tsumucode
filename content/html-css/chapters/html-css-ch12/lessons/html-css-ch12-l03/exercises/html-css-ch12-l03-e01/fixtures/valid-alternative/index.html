<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Learning Profile</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <p data-audience>Web制作の学び方を探す友人へ、練習内容を共有します。</p>
      <nav aria-label="学習プロフィール内"><a href="#works">Works</a></nav>
    </header>
    <main>
      <section class="hero">
        <h1>つむぎの制作ノート</h1>
        <img data-profile-avatar src="asset:avatar-project-about" alt="制作を学ぶつむぎ" />
        <a data-primary-link href="#works">作品へ進む</a>
      </section>
      <section data-about class="content-surface">
        <h2>現在地</h2>
        <p data-about-copy>構造から順に学び、読みやすい作品へ改善しています。</p>
      </section>
      <section class="content-surface">
        <h2>学習項目</h2>
        <ul data-skill-list>
          <li>HTML</li>
          <li>CSS</li>
          <li>Grid</li>
          <li>Keyboard</li>
        </ul>
      </section>
      <section id="works"><h2>Works</h2></section>
    </main>
    <footer>Learning Note</footer>
  </body>
</html>
