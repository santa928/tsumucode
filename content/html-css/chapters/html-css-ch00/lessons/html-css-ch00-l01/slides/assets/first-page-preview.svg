<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">学習ノートのBrowser Preview</title>
  <desc id="desc">生成り色のページに、わたしの学習ノートという題名と説明文が表示されている</desc>
  <rect width="640" height="360" rx="24" fill="#e8dfcf" />
  <rect x="28" y="28" width="584" height="304" rx="18" fill="#fffaf0" stroke="#8a7657" stroke-width="3" />
  <rect x="28" y="28" width="584" height="54" rx="18" fill="#19352d" />
  <rect x="28" y="64" width="584" height="18" fill="#19352d" />
  <circle cx="58" cy="55" r="8" fill="#f4c95d" />
  <circle cx="84" cy="55" r="8" fill="#f08f6a" />
  <circle cx="110" cy="55" r="8" fill="#79bda6" />
  <text x="320" y="61" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#fffaf0">Preview</text>
  <text x="72" y="158" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#19352d">わたしの学習ノート</text>
  <rect x="72" y="181" width="420" height="4" rx="2" fill="#e6b94a" />
  <text x="72" y="232" font-family="system-ui, sans-serif" font-size="23" fill="#3f514b">今日からWeb制作を学びます。</text>
  <rect x="72" y="270" width="190" height="28" rx="14" fill="#dcebe6" />
  <text x="167" y="291" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#19352d">HTML + CSS</text>
</svg>
