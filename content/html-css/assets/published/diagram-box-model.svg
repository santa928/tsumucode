<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420">
  <title>Box Modelの4層</title>
  <desc>Margin、Border、Padding、Contentを外側から内側へ重ねた独自図解</desc>
  <rect width="720" height="420" rx="28" fill="#f5efe3" />
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="70" y="44" width="580" height="332" rx="24" fill="#f3c892" />
    <text x="360" y="76" fill="#172a3a" font-size="20" font-weight="700">Margin</text>
    <rect x="120" y="94" width="480" height="242" rx="20" fill="#2d5d62" />
    <text x="360" y="124" fill="#fff" font-size="19" font-weight="700">Border</text>
    <rect x="158" y="138" width="404" height="162" rx="16" fill="#f6a46e" />
    <text x="360" y="168" fill="#172a3a" font-size="18" font-weight="700">Padding</text>
    <rect x="212" y="182" width="296" height="84" rx="12" fill="#fff" />
    <text x="360" y="232" fill="#172a3a" font-size="22" font-weight="700">Content</text>
  </g>
</svg>
