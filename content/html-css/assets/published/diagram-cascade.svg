<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400">
  <title>CSS Cascadeが値を選ぶ積層図</title>
  <desc>Inheritance、Specificity、Source Orderを順に比べてComputed Valueへ至る図</desc>
  <rect width="720" height="400" rx="28" fill="#f5efe3" />
  <g font-family="system-ui, sans-serif">
    <rect x="70" y="54" width="300" height="76" rx="16" fill="#fff" stroke="#172a3a" stroke-width="4" />
    <text x="96" y="86" fill="#172a3a" font-size="20" font-weight="700">1. Inheritance</text>
    <text x="96" y="112" fill="#536271" font-size="16">Parentから候補値を受け取る</text>
    <rect x="150" y="156" width="300" height="76" rx="16" fill="#fff7ed" stroke="#ef7d4f" stroke-width="4" />
    <text x="176" y="188" fill="#172a3a" font-size="20" font-weight="700">2. Specificity</text>
    <text x="176" y="214" fill="#536271" font-size="16">より具体的なSelectorを比べる</text>
    <rect x="230" y="258" width="300" height="76" rx="16" fill="#e4f1ee" stroke="#2d5d62" stroke-width="4" />
    <text x="256" y="290" fill="#172a3a" font-size="20" font-weight="700">3. Source order</text>
    <text x="256" y="316" fill="#536271" font-size="16">同点なら後のDeclarationを選ぶ</text>
    <path d="M560 82v214" fill="none" stroke="#172a3a" stroke-linecap="round" stroke-width="6" />
    <path d="m544 278 16 22 16-22" fill="none" stroke="#172a3a" stroke-linecap="round" stroke-linejoin="round" stroke-width="6" />
    <rect x="550" y="318" width="120" height="48" rx="24" fill="#172a3a" />
    <text x="610" y="349" fill="#f5efe3" font-size="17" font-weight="700" text-anchor="middle">Computed</text>
  </g>
</svg>
