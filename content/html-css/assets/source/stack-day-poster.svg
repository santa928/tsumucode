  <rect x="54" y="54" width="892" height="492" rx="28" fill="#fffdf8" stroke="#172a3a" stroke-width="8" />
  <g transform="translate(92 104)">
    <rect x="0" y="288" width="244" height="92" rx="18" fill="#172a3a" />
    <rect x="38" y="190" width="206" height="82" rx="18" fill="#2d7c82" />
