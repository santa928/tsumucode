name: Home Python Path DOM observation

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  observe:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/home-path-role-observation'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      BASE_PATH: /tsumucode/
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind diagnostic scope to the fixed Source
        shell: bash
        run: |
          set -euo pipefail
          source_sha=5eb356fc5ca21c6b2c7cb7b7c1cd4080d3f5f1f3
          read -r -a parents <<< "$(git show -s --format=%P HEAD)"
          test "${#parents[@]}" -eq 1
          test "${parents[0]}" = "$source_sha"
          expected=$'A\t.github/workflows/home-path-dom-observation.yml\nA\ttests/e2e/home-path-dom-observation.spec.ts'
          test "$(git diff --no-renames --name-status "$source_sha" HEAD)" = "$expected"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 5eb356fc5ca21c6b2c7cb7b7c1cd4080d3f5f1f3
          path: observed-source
          persist-credentials: false
      - name: Verify fixed Source
        run: test "$(git -C observed-source rev-parse HEAD)" = 5eb356fc5ca21c6b2c7cb7b7c1cd4080d3f5f1f3
      - name: Build the fixed browser image
        run: docker build --target app --tag tsumucode-home-dom-observation observed-source
      - name: Rebuild the fixed Source for diagnosis
        run: >-
          docker run --rm --cpus 2 --memory 4g --memory-swap 4g
          --pids-limit 512 --shm-size 512m
          --env BASE_PATH --env CI=true --env NODE_OPTIONS=--max-old-space-size=3072
          --mount "type=bind,source=$GITHUB_WORKSPACE/observed-source,target=/workspace"
          --mount type=volume,target=/workspace/node_modules
          tsumucode-home-dom-observation npm run build
      - name: Add the scoped test after the build
        run: |
          cp tests/e2e/home-path-dom-observation.spec.ts observed-source/tests/e2e/home-path-dom-observation.spec.ts
          cmp tests/e2e/home-path-dom-observation.spec.ts observed-source/tests/e2e/home-path-dom-observation.spec.ts
      - name: Verify one Path DOM test is selected
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --cpus 2 --memory 4g --memory-swap 4g \
            --pids-limit 512 --shm-size 512m \
            --env BASE_PATH --env CI=true --env NODE_OPTIONS=--max-old-space-size=3072 \
            --mount "type=bind,source=$GITHUB_WORKSPACE/observed-source,target=/workspace" \
            --mount type=volume,target=/workspace/node_modules \
            tsumucode-home-dom-observation node node_modules/@playwright/test/cli.js test \
            --config=playwright.qualification.config.ts tests/e2e/home-path-dom-observation.spec.ts \
            --project=chromium --workers=1 --retries=0 --reporter=list --list > "$RUNNER_TEMP/home-dom-selection.txt"
          test "$(tail -n 1 "$RUNNER_TEMP/home-dom-selection.txt")" = 'Total: 1 test in 1 file'
      - name: Verify Path roles, DOM colors, and observed rectangle
        run: >-
          docker run --rm --cpus 2 --memory 4g --memory-swap 4g
          --pids-limit 512 --shm-size 512m
          --env BASE_PATH --env CI=true --env NODE_OPTIONS=--max-old-space-size=3072
          --mount "type=bind,source=$GITHUB_WORKSPACE/observed-source,target=/workspace"
          --mount type=volume,target=/workspace/node_modules
          tsumucode-home-dom-observation node node_modules/@playwright/test/cli.js test
          --config=playwright.qualification.config.ts tests/e2e/home-path-dom-observation.spec.ts
          --project=chromium --workers=1 --retries=0 --reporter=list
