name: Isolated Python fixture observations
on:
  workflow_call:
    inputs:
      candidate_artifact_id:
        type: string
        required: false
        default: ''
      metadata_artifact_id:
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  # This exact name is both GITHUB_JOB and the caller's direct needs key.
  python_fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TSUMUCODE_NEXT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TSUMUCODE_LOCAL_OWNER: tsumucode-python-fixtures-ci
      TSUMUCODE_LOCAL_SOCKET: /var/run/docker.sock
      COMPOSE_PARALLEL_LIMIT: 1
      TSUMUCODE_RELEASE_CANDIDATE: ${{ inputs.candidate_artifact_id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Reject partial candidate input
        if: (inputs.candidate_artifact_id == '') != (inputs.metadata_artifact_id == '')
        run: exit 1
      - name: Download same-run public candidate
        if: inputs.candidate_artifact_id != ''
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          artifact-ids: ${{ inputs.candidate_artifact_id }}
          path: dist
      - name: Download same-run frozen obligations
        if: inputs.metadata_artifact_id != ''
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          artifact-ids: ${{ inputs.metadata_artifact_id }}
          path: .release-v2
      - name: Build and check baked Native imports
        run: |
          set -euo pipefail
          docker build --file Dockerfile.learning --target learning-native-checks --tag "$TSUMUCODE_LOCAL_OWNER-learning-native-checks" .
          docker run --rm --init --user 1000:1000 --network none --read-only --cpus 1 --memory 512m --pids-limit 128 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m,uid=1000,gid=1000 \
            "$TSUMUCODE_LOCAL_OWNER-learning-native-checks" node scripts/local/native-import-preflight.mjs
      - name: Prepare fixed one-shot Node and CPython images
        run: |
          set -euo pipefail
          for image in node:24.18.0-bookworm-slim@sha256:cb4e8f7c443347358b7875e717c29e27bf9befc8f5a26cf18af3c3dec80e58c5 python:3.14.2-slim-bookworm@sha256:e87711ef5c86aaeaa7031718a69db79d334d94c545c709583f651b8185870941; do
            for pull_attempt in 1 2 3; do
              if docker pull "$image"; then break; fi
              if [ "$pull_attempt" -eq 3 ]; then exit 1; fi
              sleep 5
            done
          done
      - name: Build same-source learning services
        run: ./scripts/docker-compose.sh -p "$TSUMUCODE_LOCAL_OWNER" -f compose.learning.yaml --profile build-project build
      - name: Verify baked contracts against frozen compiler inventory
        if: inputs.candidate_artifact_id != ''
        run: |
          set -euo pipefail
          mkdir -p .release-v2/native-catalogs
          ./scripts/docker-compose.sh build app
          for service in project next-project controller preview grader; do
            catalog_path=compiled-native-workspaces.json
            if [ "$service" = grader ]; then catalog_path=scripts/local/compiled-native-workspaces.json; fi
            ./scripts/docker-compose.sh -p "$TSUMUCODE_LOCAL_OWNER" -f compose.learning.yaml run --rm --no-deps --entrypoint node "$service" --input-type=module -e 'import fs from "node:fs"; process.stdout.write(fs.readFileSync(process.argv[1], "utf8"))' "$catalog_path" > ".release-v2/native-catalogs/$service.json"
            ./scripts/docker-compose.sh run --rm app npm run release:flow -- verify-native-catalog --file ".release-v2/native-catalogs/$service.json" --output ".release-v2/native-catalogs/$service-verified.json"
          done
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges:true "$TSUMUCODE_LOCAL_OWNER-learning-native-checks" node --input-type=module -e 'import fs from "node:fs"; process.stdout.write(fs.readFileSync("scripts/local/compiled-native-workspaces.json", "utf8"))' > .release-v2/native-catalogs/learning-native.json
          ./scripts/docker-compose.sh run --rm app npm run release:flow -- verify-native-catalog --file .release-v2/native-catalogs/learning-native.json --output .release-v2/native-catalogs/learning-native-verified.json
      - name: Start isolated learning stack
        run: ./scripts/docker-compose.sh -p "$TSUMUCODE_LOCAL_OWNER" -f compose.learning.yaml up --no-build -d web controller preview
      - name: Execute fixed Python fixture suite
        run: |
          set -euo pipefail
          docker build --file Dockerfile.learning --target python-browser-checks --tag "$TSUMUCODE_LOCAL_OWNER-python-browser-checks" .
          mkdir -p test-results
          fixture_args=(python-published-fixtures.spec.ts)
          if [ -n "$TSUMUCODE_RELEASE_CANDIDATE" ]; then fixture_args+=(--grep-invert '@visual-extended'); fi
          docker run --rm --init --user "$(id -u):$(id -g)" --network "${TSUMUCODE_LOCAL_OWNER}_web" --cpus 2 --memory 1g --pids-limit 256 --cap-drop ALL --security-opt no-new-privileges:true --mount "type=bind,source=$PWD/test-results,target=/workspace/test-results" "$TSUMUCODE_LOCAL_OWNER-python-browser-checks" node scripts/local/python-browser-acceptance.mjs "${fixture_args[@]}"
      - name: Preserve Python fixture evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-fixture-evidence-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: |
            test-results/local-python/results.json
            test-results/local-python/runtime-resource.json
            test-results/local-python/**/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Bind Python fixture observations to same-run candidate
        if: inputs.candidate_artifact_id != ''
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          ./scripts/docker-compose.sh run --rm -e BASE_PATH -e GITHUB_REPOSITORY -e GITHUB_RUN_ID -e GITHUB_JOB -e GITHUB_RUN_ATTEMPT -e GITHUB_SHA -e GITHUB_EVENT_NAME -e GITHUB_REF app npm run release:flow -- observe-native --suite native-python-fixtures --output .release-v2/receipts/native-python-fixtures-$GITHUB_RUN_ATTEMPT.json
      - name: Preserve same-run Python fixture receipt
        if: inputs.candidate_artifact_id != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: receipts-python_fixtures-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .release-v2/receipts/native-python-fixtures-*.json
            .release-v2/reports/native-python-fixtures-*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Stop only fixture verifier
        if: always() && inputs.candidate_artifact_id != ''
        run: ./scripts/docker-compose.sh down --remove-orphans
      - name: Stop only fixture learning stack
        if: always()
        run: ./scripts/docker-compose.sh -p "$TSUMUCODE_LOCAL_OWNER" -f compose.learning.yaml down
