name: Local Runtime boundary

on:
  workflow_dispatch:
    inputs:
      target:
        description: 全体検証か、正式受入に使わない限定診断を選ぶ
        type: choice
        required: true
        default: full
        options: [full, cookie, native]
  push:
    branches: [main]
    paths:
      - content/next/**
      - content/python-basics/**
      - content/python-practice/**
      - content/python-oop/**
      - src/adapters/runtime/local/Local*ExecutionService*
      - src/adapters/runtime/python/**
      - src/adapters/validation/python/**
      - src/core/runtime/pythonLesson*
      - src/core/runtime/pythonModule*
      - src/core/runtime/pythonIteration*
      - src/core/runtime/pythonContext*
      - src/core/runtime/pythonDataProject*
      - src/core/runtime/pythonOop*
      - src/core/runtime/pythonObjectProtocol*
      - src/core/runtime/pythonDecorator*
      - src/core/runtime/pythonFixedFixtures*
      - src/adapters/runtime/local/LocalPythonPracticeClient*
      - src/core/runtime/contracts.ts
      - src/core/learning/sessionReducer.ts
      - tsconfig.node.json
      - src/features/learning/localNodeRuntime.ts
      - src/features/learning/pages/EditableExercisePage.tsx
      - src/features/learning/session/LearningSessionController.ts
      - tests/local/python-learning.spec.ts
      - tests/local/python-practice.spec.ts
      - tests/e2e/python-input.spec.ts
      - tests/e2e/python-module.spec.ts
      - tests/e2e/python-iteration.spec.ts
      - tests/e2e/python-context.spec.ts
      - tests/e2e/python-data-project.spec.ts
      - tests/e2e/python-oop.spec.ts
      - playwright.python-local.config.ts
      - scripts/content/fixtures/next-author-pilot*
      - scripts/content/sourceSchema.ts
      - src/core/content/schema.ts
      - src/features/learning/pages/ExercisePage.tsx
      - scripts/local/**
      - src/features/learning/local/**
      - src/features/learning/portable/**
      - src/adapters/runtime/local/LocalWorkspaceClient*
      - src/core/persistence/localProjectDescriptor.ts
      - src/core/persistence/contentProgressMigration.ts
      - src/features/progress/WorkspaceLeaseGate.tsx
      - src/features/progress/ProgressTransferPanel.tsx
      - src/features/learning/runtimeServices.ts
      - src/app/AppShell.tsx
      - src/app/router.tsx
      - src/features/home/HomePage.tsx
      - scripts/learn.sh
      - Dockerfile.learning
      - compose.learning.yaml
      - package.json
      - package-lock.json
      - .dockerignore
      - scripts/release/**
      - tests/unit/release/**
      - tests/e2e/next-static-study.spec.ts
      - .github/workflows/local-runtime.yml
      - .github/workflows/pages.yml
  pull_request:
    branches: [main]
    paths:
      - content/next/**
      - content/python-basics/**
      - content/python-practice/**
      - content/python-oop/**
      - src/adapters/runtime/local/Local*ExecutionService*
      - src/adapters/runtime/python/**
      - src/adapters/validation/python/**
      - src/core/runtime/pythonLesson*
      - src/core/runtime/pythonModule*
      - src/core/runtime/pythonIteration*
      - src/core/runtime/pythonContext*
      - src/core/runtime/pythonDataProject*
      - src/core/runtime/pythonOop*
      - src/core/runtime/pythonObjectProtocol*
      - src/core/runtime/pythonDecorator*
      - src/core/runtime/pythonFixedFixtures*
      - src/adapters/runtime/local/LocalPythonPracticeClient*
      - src/core/runtime/contracts.ts
      - src/core/learning/sessionReducer.ts
      - tsconfig.node.json
      - src/features/learning/localNodeRuntime.ts
      - src/features/learning/pages/EditableExercisePage.tsx
      - src/features/learning/session/LearningSessionController.ts
      - tests/local/python-learning.spec.ts
      - tests/local/python-practice.spec.ts
      - tests/e2e/python-input.spec.ts
      - tests/e2e/python-module.spec.ts
      - tests/e2e/python-iteration.spec.ts
      - tests/e2e/python-context.spec.ts
      - tests/e2e/python-data-project.spec.ts
      - tests/e2e/python-oop.spec.ts
      - playwright.python-local.config.ts
      - scripts/content/fixtures/next-author-pilot*
      - scripts/content/sourceSchema.ts
      - src/core/content/schema.ts
      - src/features/learning/pages/ExercisePage.tsx
      - scripts/local/**
      - src/features/learning/local/**
      - src/features/learning/portable/**
      - src/adapters/runtime/local/LocalWorkspaceClient*
      - src/core/persistence/localProjectDescriptor.ts
      - src/core/persistence/contentProgressMigration.ts
      - src/features/progress/WorkspaceLeaseGate.tsx
      - src/features/progress/ProgressTransferPanel.tsx
      - src/features/learning/runtimeServices.ts
      - src/app/AppShell.tsx
      - src/app/router.tsx
      - src/features/home/HomePage.tsx
      - scripts/learn.sh
      - Dockerfile.learning
      - compose.learning.yaml
      - package.json
      - package-lock.json
      - .dockerignore
      - scripts/release/**
      - tests/unit/release/**
      - tests/e2e/next-static-study.spec.ts
      - .github/workflows/local-runtime.yml
      - .github/workflows/pages.yml

permissions:
  contents: read

concurrency:
  group: local-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundary:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'full'
    runs-on: ubuntu-24.04
    # 教材追加後も全検査を完走できる余裕を持つ。learnerの実行上限は各検査で維持する。
    timeout-minutes: 60
    env:
      TSUMUCODE_NEXT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TSUMUCODE_LOCAL_OWNER: tsumucode-learning-ci
      TSUMUCODE_LOCAL_SOCKET: /var/run/docker.sock
      TSUMUCODE_COOKIE_DIAGNOSTICS: '1'
      COMPOSE_PARALLEL_LIMIT: 1
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prepare fixed one-shot Node image
        run: |
          # 同じ固定digestの取得だけを有限回試し、一時的なRegistry障害から復旧する。
          for pull_attempt in 1 2 3; do
            if docker pull node:24.18.0-bookworm-slim@sha256:cb4e8f7c443347358b7875e717c29e27bf9befc8f5a26cf18af3c3dec80e58c5; then
              exit 0
            fi
            if [ "$pull_attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 5
          done
      - name: Prepare fixed one-shot CPython image
        run: |
          # 同じ固定digestの取得だけを有限回試し、一時的なRegistry障害から復旧する。
          for pull_attempt in 1 2 3; do
            if docker pull python:3.14.2-slim-bookworm@sha256:e87711ef5c86aaeaa7031718a69db79d334d94c545c709583f651b8185870941; then
              exit 0
            fi
            if [ "$pull_attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 5
          done
      - name: Build fixed learner and trusted services
        run: ./scripts/docker-compose.sh -p "$TSUMUCODE_LOCAL_OWNER" -f compose.learning.yaml --profile build-project build
      - name: Start isolated learning stack
        run: ./scripts/docker-compose.sh -p "$TSUMUCODE_LOCAL_OWNER" -f compose.learning.yaml up --no-build -d web controller preview
      - name: Verify real Browser HTTP, HMR and Preview boundary
        run: |
          docker build --file Dockerfile.learning --target browser-checks --tag "$TSUMUCODE_LOCAL_OWNER-browser-checks" .
          docker run --rm --init --network "${TSUMUCODE_LOCAL_OWNER}_web" --cpus 2 --memory 1g --pids-limit 256 --cap-drop ALL --security-opt no-new-privileges:true "$TSUMUCODE_LOCAL_OWNER-browser-checks"
      - name: Verify resident workspace and existing Node execution
        run: |
          controller=$(./scripts/docker-compose.sh -p "$TSUMUCODE_LOCAL_OWNER" -f compose.learning.yaml ps -q controller)
          docker exec -i "$controller" node --input-type=module < scripts/local/project-grade-acceptance.mjs
          docker exec -i "$controller" node --input-type=module < scripts/local/resident-acceptance.mjs
          docker exec -i "$controller" node --input-type=module < scripts/local/acceptance.mjs
      - name: Verify fixed CPython execution, constraints and recovery
        run: |
          controller=$(./scripts/docker-compose.sh -p "$TSUMUCODE_LOCAL_OWNER" -f compose.learning.yaml ps -q controller)
          docker exec -i "$controller" node --input-type=module < scripts/local/python-acceptance.mjs
          docker exec -i "$controller" node --input-type=module < scripts/local/python-practice-acceptance.mjs
          docker exec -i -e TSUMUCODE_PYTHON_RESTART_PHASE=prepare "$controller" node --input-type=module < scripts/local/python-acceptance.mjs
          docker kill --signal KILL "$controller"
          ./scripts/docker-compose.sh -p "$TSUMUCODE_LOCAL_OWNER" -f compose.learning.yaml start controller
          docker exec -i -e TSUMUCODE_PYTHON_RESTART_PHASE=verify "$controller" node --input-type=module < scripts/local/python-acceptance.mjs
          docker build --file Dockerfile.learning --target python-browser-checks --tag "$TSUMUCODE_LOCAL_OWNER-python-browser-checks" .
          mkdir -p test-results
          # capabilityを戻さず同じUID/GIDを使い、親のbind内でPlaywrightが出力先を再作成できるようにする。
          docker run --rm --init --user "$(id -u):$(id -g)" --network "${TSUMUCODE_LOCAL_OWNER}_web" --cpus 2 --memory 1g --pids-limit 256 --cap-drop ALL --security-opt no-new-privileges:true --mount "type=bind,source=$PWD/test-results,target=/workspace/test-results" "$TSUMUCODE_LOCAL_OWNER-python-browser-checks"
      - name: Preserve Python Browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-browser-evidence-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          # 認証ヘッダー等を含み得るtraceは対象にせず、画面と判定結果だけを保持する。
          path: |
            test-results/local-python/results.json
            test-results/local-python/**/*.png
            test-results/local-python/**/error-context.md
          if-no-files-found: warn
          retention-days: 7
      - name: Verify real Python iteration fixtures and object lifecycle
        run: |
          docker build --file Dockerfile.learning --target python-iteration-checks --tag "$TSUMUCODE_LOCAL_OWNER-python-iteration-checks" .
          docker run --rm --init --network none --cpus 1 --memory 512m --pids-limit 128 --cap-drop ALL --security-opt no-new-privileges:true --mount type=bind,src=/var/run/docker.sock,dst=/var/run/docker.sock --entrypoint node "$TSUMUCODE_LOCAL_OWNER-python-iteration-checks" scripts/local/python-iteration-acceptance.mjs
          docker run --rm --init --network none --cpus 1 --memory 512m --pids-limit 128 --cap-drop ALL --security-opt no-new-privileges:true "$TSUMUCODE_LOCAL_OWNER-python-iteration-checks"
      - name: Verify real Python OOP binding and attribute lookup
        run: |
          docker run --rm --init --network none --cpus 1 --memory 512m --pids-limit 128 --cap-drop ALL --security-opt no-new-privileges:true --mount type=bind,src=/var/run/docker.sock,dst=/var/run/docker.sock --entrypoint node "$TSUMUCODE_LOCAL_OWNER-python-iteration-checks" scripts/local/python-oop-acceptance.mjs
          docker run --rm --init --network none --cpus 1 --memory 512m --pids-limit 128 --cap-drop ALL --security-opt no-new-privileges:true --entrypoint node "$TSUMUCODE_LOCAL_OWNER-python-iteration-checks" scripts/local/python-oop-acceptance.mjs --pyodide
      - name: Verify real Python Context manager close and recovery
        run: |
          docker run --rm --init --network none --cpus 1 --memory 512m --pids-limit 128 --cap-drop ALL --security-opt no-new-privileges:true --mount type=bind,src=/var/run/docker.sock,dst=/var/run/docker.sock --entrypoint node "$TSUMUCODE_LOCAL_OWNER-python-iteration-checks" scripts/local/python-context-acceptance.mjs
          docker run --rm --init --network none --cpus 1 --memory 512m --pids-limit 128 --cap-drop ALL --security-opt no-new-privileges:true --entrypoint node "$TSUMUCODE_LOCAL_OWNER-python-iteration-checks" scripts/local/python-context-acceptance.mjs --pyodide
      - name: Verify real Python dataclass and data Project Tests
        run: |
          docker run --rm --init --network none --cpus 1 --memory 512m --pids-limit 128 --cap-drop ALL --security-opt no-new-privileges:true --mount type=bind,src=/var/run/docker.sock,dst=/var/run/docker.sock --entrypoint node "$TSUMUCODE_LOCAL_OWNER-python-iteration-checks" scripts/local/python-data-project-acceptance.mjs
          docker run --rm --init --network none --cpus 1 --memory 512m --pids-limit 128 --cap-drop ALL --security-opt no-new-privileges:true --entrypoint node "$TSUMUCODE_LOCAL_OWNER-python-iteration-checks" scripts/local/python-data-project-acceptance.mjs --pyodide
      - name: Verify representative production learning UI and storage
        run: >-
          docker run --rm --init --network "${TSUMUCODE_LOCAL_OWNER}_web" --cpus 2 --memory 1g --pids-limit 256
          --cap-drop ALL --security-opt no-new-privileges:true "$TSUMUCODE_LOCAL_OWNER-browser-checks"
          node scripts/local/project-browser-acceptance.mjs
      - name: Prepare bounded Next resource evidence
        run: mkdir -p .release-next-native-ci
      - name: Verify Next Action response completion, resources and recovery
        run: |
          set -euo pipefail
          docker build --file Dockerfile.learning --target next-browser-checks --tag "$TSUMUCODE_LOCAL_OWNER-next-browser-checks" .
          controller=$(./scripts/docker-compose.sh -p "$TSUMUCODE_LOCAL_OWNER" -f compose.learning.yaml ps -q controller)
          docker run --rm --network none "$TSUMUCODE_LOCAL_OWNER-next-browser-checks" node scripts/local/next-fixture-packet.mjs next-ch04-l02-e01 |
            docker exec -i -e TSUMUCODE_NEXT_WORKSPACE=next-ch04-l02-e01 "$controller" node next-project-acceptance.mjs | tee -a .release-next-native-ci/fixtures.log
      - name: Verify Next production Project stages and resources
        run: |
          set -euo pipefail
          controller=$(./scripts/docker-compose.sh -p "$TSUMUCODE_LOCAL_OWNER" -f compose.learning.yaml ps -q controller)
          for workspace in next-ch05-l01-e01 next-ch06-l01-e01; do
            docker run --rm --network none "$TSUMUCODE_LOCAL_OWNER-next-browser-checks" node scripts/local/next-fixture-packet.mjs "$workspace" |
              docker exec -i -e TSUMUCODE_NEXT_WORKSPACE="$workspace" "$controller" node next-project-acceptance.mjs | tee -a .release-next-native-ci/fixtures.log
          done
      - name: Verify Next real page, query HTTP, resources and recovery
        run: |
          set -euo pipefail
          controller=$(./scripts/docker-compose.sh -p "$TSUMUCODE_LOCAL_OWNER" -f compose.learning.yaml ps -q controller)
          docker run --rm --network none "$TSUMUCODE_LOCAL_OWNER-next-browser-checks" node scripts/local/next-fixture-packet.mjs |
            docker exec -i "$controller" node next-project-acceptance.mjs | tee -a .release-next-native-ci/fixtures.log
      - name: Verify Next normal Lesson learning UI
        run: >-
          docker run --rm --init --network "${TSUMUCODE_LOCAL_OWNER}_web" --cpus 2 --memory 1g --pids-limit 256
          --cap-drop ALL --security-opt no-new-privileges:true "$TSUMUCODE_LOCAL_OWNER-next-browser-checks"
      - name: Verify Next production build and Server Client diagnostics
        run: |
          docker build --file Dockerfile.learning --target next-content-checks --tag "$TSUMUCODE_LOCAL_OWNER-next-content-checks" .
          docker run --rm --init --network none --read-only --cpus 2 --memory 2g --memory-swap 2g --pids-limit 256 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /opt/workspace:rw,noexec,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=0700 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0700 \
            "$TSUMUCODE_LOCAL_OWNER-next-content-checks"
      - name: Verify trusted Next observations reject fake navigation
        run: >-
          docker run --rm --init --user 1000:1000 --network none --read-only --cpus 2 --memory 768m --pids-limit 128
          --cap-drop ALL --security-opt no-new-privileges:true
          --tmpfs /tmp:rw,noexec,nosuid,nodev,size=256m,uid=1000,gid=1000,mode=0700
          "$TSUMUCODE_LOCAL_OWNER-next-browser-checks"
          node scripts/local/next-observations-acceptance.mjs
      - name: Verify trusted Action body completion rejects partial and canceled responses
        run: >-
          docker run --rm --init --user 1000:1000 --network none --read-only --cpus 2 --memory 768m --memory-swap 768m --pids-limit 128
          --cap-drop ALL --security-opt no-new-privileges:true
          --tmpfs /tmp:rw,noexec,nosuid,nodev,size=256m,uid=1000,gid=1000,mode=0700
          "$TSUMUCODE_LOCAL_OWNER-next-browser-checks"
          node scripts/local/next-form-drain-acceptance.mjs
      - name: Verify Next nested routing and Client interaction fixtures
        run: |
          set -euo pipefail
          controller=$(./scripts/docker-compose.sh -p "$TSUMUCODE_LOCAL_OWNER" -f compose.learning.yaml ps -q controller)
          for workspace in next-ch02-l01-e01 next-ch02-l02-e01 next-ch03-l01-e01 next-ch03-l02-e01 next-ch04-l01-e01; do
            docker run --rm --network none "$TSUMUCODE_LOCAL_OWNER-next-browser-checks" node scripts/local/next-fixture-packet.mjs "$workspace" |
              docker exec -i -e TSUMUCODE_NEXT_WORKSPACE="$workspace" "$controller" node next-project-acceptance.mjs | tee -a .release-next-native-ci/fixtures.log
          done
      - name: Verify Next routing and boundary normal Lessons and JSON transfer
        run: >-
          docker run --rm --init --network "${TSUMUCODE_LOCAL_OWNER}_web" --cpus 2 --memory 1g --pids-limit 256
          --cap-drop ALL --security-opt no-new-privileges:true "$TSUMUCODE_LOCAL_OWNER-next-browser-checks"
          node scripts/local/next-routing-browser-acceptance.mjs
      - name: Verify Next data and Weather normal Lessons and JSON transfer
        run: >-
          docker run --rm --init --network "${TSUMUCODE_LOCAL_OWNER}_web" --cpus 2 --memory 1g --pids-limit 256
          --cap-drop ALL --security-opt no-new-privileges:true "$TSUMUCODE_LOCAL_OWNER-next-browser-checks"
          node scripts/local/next-routing-browser-acceptance.mjs next-ch03
      - name: Verify Next Form and Action normal Lessons and JSON transfer
        run: >-
          docker run --rm --init --network "${TSUMUCODE_LOCAL_OWNER}_web" --cpus 2 --memory 1g --pids-limit 256
          --cap-drop ALL --security-opt no-new-privileges:true "$TSUMUCODE_LOCAL_OWNER-next-browser-checks"
          node scripts/local/next-routing-browser-acceptance.mjs next-ch04
      - name: Verify Next production Project normal Lessons and ZIP JSON transfer
        run: >-
          docker run --rm --init --network "${TSUMUCODE_LOCAL_OWNER}_web" --cpus 2 --memory 1g --pids-limit 256
          --cap-drop ALL --security-opt no-new-privileges:true "$TSUMUCODE_LOCAL_OWNER-next-browser-checks"
          node scripts/local/next-production-browser-acceptance.mjs
      - name: Verify Next Form POST boundaries and grading contention
        run: |
          set -euo pipefail
          preview=$(./scripts/docker-compose.sh -p "$TSUMUCODE_LOCAL_OWNER" -f compose.learning.yaml ps -q preview)
          docker run --rm --network none "$TSUMUCODE_LOCAL_OWNER-next-browser-checks" node scripts/local/next-fixture-packet.mjs next-ch04-l01-e01 |
            docker exec -i "$preview" node --input-type=module -e "$(cat scripts/local/next-form-http-acceptance.mjs)"
      - name: Verify bounded lesson Cookie with real Next and Browser
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p .release-cookie-transport
          docker run --rm --init --network "${TSUMUCODE_LOCAL_OWNER}_web" --cpus 2 --memory 1g --pids-limit 256 \
            -e TSUMUCODE_COOKIE_CDP=1 \
            --cap-drop ALL --security-opt no-new-privileges:true "$TSUMUCODE_LOCAL_OWNER-next-browser-checks" \
            sh -c 'node --test scripts/local/next-form-cookie-lifecycle.test.mjs && node scripts/local/next-form-cookie-browser-acceptance.mjs' \
            2>&1 | tee .release-cookie-transport/browser.log
      - name: Compare complete Cookie operations without Chromium observer
        timeout-minutes: 5
        run: |
          set -euo pipefail
          docker run --rm --init --network "${TSUMUCODE_LOCAL_OWNER}_web" --cpus 2 --memory 1g --pids-limit 256 \
            -e TSUMUCODE_COOKIE_CDP=0 \
            --cap-drop ALL --security-opt no-new-privileges:true "$TSUMUCODE_LOCAL_OWNER-next-browser-checks" \
            node scripts/local/next-form-cookie-browser-acceptance.mjs \
            2>&1 | tee .release-cookie-transport/browser-off.log
      - name: Collect bounded Cookie transport diagnostics
        if: always()
        run: |
          set -euo pipefail
          if [ -f .release-cookie-transport/browser.log ]; then
            preview=$(./scripts/docker-compose.sh -p "$TSUMUCODE_LOCAL_OWNER" -f compose.learning.yaml ps -q preview)
            if [ -n "$preview" ]; then
              docker logs "$preview" 2>&1 | python3 -c '
          import json, sys
          for line in sys.stdin:
              try:
                  value = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if isinstance(value, dict) and value.get("event") == "main-cookie-transport":
                  print(json.dumps(value, separators=(",", ":")))
          ' > .release-cookie-transport/preview.jsonl
            fi
          fi
      - name: Preserve bounded Cookie transport diagnostics
        if: always() && hashFiles('.release-cookie-transport/browser.log') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cookie-transport-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: .release-cookie-transport/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Verify Weather RSC cancellation on Source apply and stop
        run: |
          set -euo pipefail
          preview=$(./scripts/docker-compose.sh -p "$TSUMUCODE_LOCAL_OWNER" -f compose.learning.yaml ps -q preview)
          docker run --rm --network none "$TSUMUCODE_LOCAL_OWNER-next-browser-checks" node scripts/local/next-fixture-packet.mjs next-ch03-l02-e01 |
            docker exec -i "$preview" node --input-type=module -e "$(cat scripts/local/next-weather-stream-acceptance.mjs)"
      - name: Verify normal controller restart
        run: |
          controller=$(./scripts/docker-compose.sh -p "$TSUMUCODE_LOCAL_OWNER" -f compose.learning.yaml ps -q controller)
          docker exec -i -e TSUMUCODE_RESTART_PHASE=prepare -e TSUMUCODE_RESTART_MODE=normal "$controller" node --input-type=module < scripts/local/resident-restart-acceptance.mjs
          ./scripts/docker-compose.sh -p "$TSUMUCODE_LOCAL_OWNER" -f compose.learning.yaml restart controller
          docker exec -i -e TSUMUCODE_RESTART_PHASE=verify -e TSUMUCODE_RESTART_MODE=normal "$controller" node --input-type=module < scripts/local/resident-restart-acceptance.mjs
      - name: Verify abnormal controller restart
        run: |
          controller=$(./scripts/docker-compose.sh -p "$TSUMUCODE_LOCAL_OWNER" -f compose.learning.yaml ps -q controller)
          docker exec -i -e TSUMUCODE_RESTART_PHASE=prepare -e TSUMUCODE_RESTART_MODE=abnormal "$controller" node --input-type=module < scripts/local/resident-restart-acceptance.mjs
          docker kill --signal KILL "$controller"
          ./scripts/docker-compose.sh -p "$TSUMUCODE_LOCAL_OWNER" -f compose.learning.yaml start controller
          docker exec -i -e TSUMUCODE_RESTART_PHASE=verify -e TSUMUCODE_RESTART_MODE=abnormal "$controller" node --input-type=module < scripts/local/resident-restart-acceptance.mjs
      - name: Verify output failure and preparation shutdown at HTTP boundary
        run: >-
          docker run --rm -i --init --network none --cpus 1 --memory 256m --pids-limit 64
          --cap-drop ALL --security-opt no-new-privileges:true
          --add-host controller:127.0.0.1
          --mount type=bind,src="$PWD/scripts/local",dst=/checks,readonly
          --mount type=bind,src="$PWD/src/core/runtime/pythonLessonProfiles.mjs",dst=/src/core/runtime/pythonLessonProfiles.mjs,readonly
          --entrypoint node "$TSUMUCODE_LOCAL_OWNER-controller"
          --input-type=module < scripts/local/output-fault-acceptance.mjs
      - name: Verify Python practice HTTP disconnect suppresses late input
        run: >-
          docker run --rm -i --init --network none --cpus 1 --memory 256m --pids-limit 64
          --cap-drop ALL --security-opt no-new-privileges:true
          --entrypoint node "$TSUMUCODE_LOCAL_OWNER-controller"
          --input-type=module < scripts/local/python-practice-http-fault-acceptance.mjs
      - name: Show bounded Source apply failure diagnostics
        if: failure()
        run: |
          controller=$(./scripts/docker-compose.sh -p "$TSUMUCODE_LOCAL_OWNER" -f compose.learning.yaml ps -q controller)
          if [ -n "$controller" ]; then
            docker logs "$controller" 2>&1 | grep -E '^Next (Source apply failure|grade (deadline|slow|timing|failure)) ' || true
          fi
      - name: Collect exact Next native resource evidence
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true
          -e TSUMUCODE_NEXT_SOURCE_SHA -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT
          --mount type=bind,src="$PWD",dst=/workspace
          --workdir /workspace
          node:24.18.0-bookworm-slim@sha256:cb4e8f7c443347358b7875e717c29e27bf9befc8f5a26cf18af3c3dec80e58c5
          node scripts/release/nextNativeEvidence.mjs .release-next-native-ci/fixtures.log .release-next-native-ci/evidence.json
      - name: Upload exact Next native resource evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: next-native-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: .release-next-native-ci/evidence.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Stop only this learning stack and preserve Source volume
        if: always()
        run: ./scripts/docker-compose.sh -p "$TSUMUCODE_LOCAL_OWNER" -f compose.learning.yaml down

  native_reproduction:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'native'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Build fixed Browser for native fetch isolation
        run: docker build --file Dockerfile.learning --target browser-checks --tag tsumucode-native-fetch-ci .
      - name: Compare native reader and buffered fetch without Next or Cookie
        timeout-minutes: 2
        run: |
          set -euo pipefail
          mkdir -p .release-native-fetch
          docker run --rm --init --network none --read-only --tmpfs /tmp:rw,size=128m \
            --cpus 2 --memory 1g --memory-swap 1g --pids-limit 256 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --mount "type=bind,source=$PWD/.release-native-fetch,target=/evidence" \
            tsumucode-native-fetch-ci node scripts/local/native-fetch-observations.mjs \
            2>&1 | tee .release-native-fetch/browser.log
      - name: Preserve native fetch observations separately from release proof
        if: always() && hashFiles('.release-native-fetch/browser.log') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-fetch-observations-${{ github.sha }}-${{ github.run_attempt }}
          path: .release-native-fetch/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  cookie_reproduction:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'cookie'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TSUMUCODE_NEXT_SOURCE_SHA: ${{ github.sha }}
      TSUMUCODE_LOCAL_OWNER: tsumucode-learning-cookie-reproduction-ci
      TSUMUCODE_LOCAL_SOCKET: /var/run/docker.sock
      TSUMUCODE_COOKIE_DIAGNOSTICS: '1'
      COMPOSE_PARALLEL_LIMIT: 1
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prepare fixed one-shot Node image
        run: |
          # 同じ固定digestの取得だけを有限回試し、一時的なRegistry障害から復旧する。
          for pull_attempt in 1 2 3; do
            if docker pull node:24.18.0-bookworm-slim@sha256:cb4e8f7c443347358b7875e717c29e27bf9befc8f5a26cf18af3c3dec80e58c5; then
              exit 0
            fi
            if [ "$pull_attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 5
          done
      - name: Prepare fixed one-shot CPython image
        run: |
          # 同じ固定digestの取得だけを有限回試し、一時的なRegistry障害から復旧する。
          for pull_attempt in 1 2 3; do
            if docker pull python:3.14.2-slim-bookworm@sha256:e87711ef5c86aaeaa7031718a69db79d334d94c545c709583f651b8185870941; then
              exit 0
            fi
            if [ "$pull_attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 5
          done
      - name: Build fixed learner and trusted services
        run: ./scripts/docker-compose.sh -p "$TSUMUCODE_LOCAL_OWNER" -f compose.learning.yaml --profile build-project build
      - name: Start isolated learning stack
        run: ./scripts/docker-compose.sh -p "$TSUMUCODE_LOCAL_OWNER" -f compose.learning.yaml up --no-build -d web controller preview
      - name: Build fixed Next Browser for limited reproduction
        run: docker build --file Dockerfile.learning --target next-browser-checks --tag "$TSUMUCODE_LOCAL_OWNER-next-browser-checks" .
      - name: Reproduce only bounded Action operations
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p .release-cookie-transport
          docker run --rm --init --network "${TSUMUCODE_LOCAL_OWNER}_web" --cpus 2 --memory 1g --pids-limit 256 \
            -e TSUMUCODE_COOKIE_CDP=0 -e TSUMUCODE_COOKIE_REPRODUCTION=action-47 \
            --cap-drop ALL --security-opt no-new-privileges:true "$TSUMUCODE_LOCAL_OWNER-next-browser-checks" \
            node scripts/local/next-form-cookie-browser-acceptance.mjs \
            2>&1 | tee .release-cookie-transport/browser.log
      - name: Collect bounded Cookie transport diagnostics
        if: always()
        run: |
          set -euo pipefail
          if [ -f .release-cookie-transport/browser.log ]; then
            preview=$(./scripts/docker-compose.sh -p "$TSUMUCODE_LOCAL_OWNER" -f compose.learning.yaml ps -q preview)
            if [ -n "$preview" ]; then
              docker logs "$preview" 2>&1 | python3 -c '
          import json, sys
          for line in sys.stdin:
              try:
                  value = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if isinstance(value, dict) and value.get("event") == "main-cookie-transport":
                  print(json.dumps(value, separators=(",", ":")))
          ' > .release-cookie-transport/preview.jsonl
            fi
          fi
      - name: Preserve bounded Cookie transport diagnostics
        if: always() && hashFiles('.release-cookie-transport/browser.log') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cookie-reproduction-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: .release-cookie-transport/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Stop only this diagnostic stack and preserve Source volume
        if: always()
        run: ./scripts/docker-compose.sh -p "$TSUMUCODE_LOCAL_OWNER" -f compose.learning.yaml down
