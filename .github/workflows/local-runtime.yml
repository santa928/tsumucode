name: Local Runtime boundary

on:
  push:
    branches: [main]
    paths:
      - content/next/**
      - scripts/content/fixtures/next-author-pilot*
      - scripts/content/sourceSchema.ts
      - src/core/content/schema.ts
      - src/features/learning/pages/ExercisePage.tsx
      - scripts/local/**
      - src/features/learning/local/**
      - src/adapters/runtime/local/LocalWorkspaceClient*
      - src/core/persistence/localProjectDescriptor.ts
      - src/core/persistence/contentProgressMigration.ts
      - src/features/progress/WorkspaceLeaseGate.tsx
      - src/features/progress/ProgressTransferPanel.tsx
      - src/features/learning/runtimeServices.ts
      - src/app/AppShell.tsx
      - src/app/router.tsx
      - src/features/home/HomePage.tsx
      - scripts/learn.sh
      - Dockerfile.learning
      - compose.learning.yaml
      - package.json
      - package-lock.json
      - .dockerignore
      - .github/workflows/local-runtime.yml
  pull_request:
    branches: [main]
    paths:
      - content/next/**
      - scripts/content/fixtures/next-author-pilot*
      - scripts/content/sourceSchema.ts
      - src/core/content/schema.ts
      - src/features/learning/pages/ExercisePage.tsx
      - scripts/local/**
      - src/features/learning/local/**
      - src/adapters/runtime/local/LocalWorkspaceClient*
      - src/core/persistence/localProjectDescriptor.ts
      - src/core/persistence/contentProgressMigration.ts
      - src/features/progress/WorkspaceLeaseGate.tsx
      - src/features/progress/ProgressTransferPanel.tsx
      - src/features/learning/runtimeServices.ts
      - src/app/AppShell.tsx
      - src/app/router.tsx
      - src/features/home/HomePage.tsx
      - scripts/learn.sh
      - Dockerfile.learning
      - compose.learning.yaml
      - package.json
      - package-lock.json
      - .dockerignore
      - .github/workflows/local-runtime.yml

permissions:
  contents: read

concurrency:
  group: local-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TSUMUCODE_LOCAL_OWNER: tsumucode-learning-ci
      TSUMUCODE_LOCAL_SOCKET: /var/run/docker.sock
      COMPOSE_PARALLEL_LIMIT: 1
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Prepare fixed one-shot Node image
        run: docker pull node:24.18.0-bookworm-slim@sha256:cb4e8f7c443347358b7875e717c29e27bf9befc8f5a26cf18af3c3dec80e58c5
      - name: Build fixed learner and trusted services
        run: ./scripts/docker-compose.sh -p "$TSUMUCODE_LOCAL_OWNER" -f compose.learning.yaml --profile build-project build
      - name: Start isolated learning stack
        run: ./scripts/docker-compose.sh -p "$TSUMUCODE_LOCAL_OWNER" -f compose.learning.yaml up --no-build -d web controller preview
      - name: Verify real Browser HTTP, HMR and Preview boundary
        run: |
          docker build --file Dockerfile.learning --target browser-checks --tag "$TSUMUCODE_LOCAL_OWNER-browser-checks" .
          docker run --rm --init --network "${TSUMUCODE_LOCAL_OWNER}_web" --cpus 2 --memory 1g --pids-limit 256 --cap-drop ALL --security-opt no-new-privileges:true "$TSUMUCODE_LOCAL_OWNER-browser-checks"
      - name: Verify resident workspace and existing Node execution
        run: |
          controller=$(./scripts/docker-compose.sh -p "$TSUMUCODE_LOCAL_OWNER" -f compose.learning.yaml ps -q controller)
          docker exec -i "$controller" node --input-type=module < scripts/local/project-grade-acceptance.mjs
          docker exec -i "$controller" node --input-type=module < scripts/local/resident-acceptance.mjs
          docker exec -i "$controller" node --input-type=module < scripts/local/acceptance.mjs
      - name: Verify representative production learning UI and storage
        run: >-
          docker run --rm --init --network "${TSUMUCODE_LOCAL_OWNER}_web" --cpus 2 --memory 1g --pids-limit 256
          --cap-drop ALL --security-opt no-new-privileges:true "$TSUMUCODE_LOCAL_OWNER-browser-checks"
          node scripts/local/project-browser-acceptance.mjs
      - name: Verify Next real page, query HTTP, resources and recovery
        run: |
          docker build --file Dockerfile.learning --target next-browser-checks --tag "$TSUMUCODE_LOCAL_OWNER-next-browser-checks" .
          controller=$(./scripts/docker-compose.sh -p "$TSUMUCODE_LOCAL_OWNER" -f compose.learning.yaml ps -q controller)
          docker run --rm --network none "$TSUMUCODE_LOCAL_OWNER-next-browser-checks" node scripts/local/next-fixture-packet.mjs |
            docker exec -i "$controller" node next-project-acceptance.mjs
      - name: Verify Next normal Lesson learning UI
        run: >-
          docker run --rm --init --network "${TSUMUCODE_LOCAL_OWNER}_web" --cpus 2 --memory 1g --pids-limit 256
          --cap-drop ALL --security-opt no-new-privileges:true "$TSUMUCODE_LOCAL_OWNER-next-browser-checks"
      - name: Verify Next production build and Server Client diagnostics
        run: |
          docker build --file Dockerfile.learning --target next-content-checks --tag "$TSUMUCODE_LOCAL_OWNER-next-content-checks" .
          docker run --rm --init --network none --read-only --cpus 2 --memory 2g --memory-swap 2g --pids-limit 256 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /opt/workspace:rw,noexec,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=0700 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0700 \
            "$TSUMUCODE_LOCAL_OWNER-next-content-checks"
      - name: Verify trusted Next observations reject fake navigation
        run: >-
          docker run --rm --init --user 1000:1000 --network none --read-only --cpus 2 --memory 768m --pids-limit 128
          --cap-drop ALL --security-opt no-new-privileges:true
          --tmpfs /tmp:rw,noexec,nosuid,nodev,size=256m,uid=1000,gid=1000,mode=0700
          "$TSUMUCODE_LOCAL_OWNER-next-browser-checks"
          node scripts/local/next-observations-acceptance.mjs
      - name: Verify Next nested routing and Client interaction fixtures
        run: |
          set -euo pipefail
          controller=$(./scripts/docker-compose.sh -p "$TSUMUCODE_LOCAL_OWNER" -f compose.learning.yaml ps -q controller)
          for workspace in next-ch02-l01-e01 next-ch02-l02-e01 next-ch03-l01-e01 next-ch03-l02-e01 next-ch04-l01-e01 next-ch04-l02-e01; do
            docker run --rm --network none "$TSUMUCODE_LOCAL_OWNER-next-browser-checks" node scripts/local/next-fixture-packet.mjs "$workspace" |
              docker exec -i -e TSUMUCODE_NEXT_WORKSPACE="$workspace" "$controller" node next-project-acceptance.mjs
          done
      - name: Verify Next routing and boundary normal Lessons and JSON transfer
        run: >-
          docker run --rm --init --network "${TSUMUCODE_LOCAL_OWNER}_web" --cpus 2 --memory 1g --pids-limit 256
          --cap-drop ALL --security-opt no-new-privileges:true "$TSUMUCODE_LOCAL_OWNER-next-browser-checks"
          node scripts/local/next-routing-browser-acceptance.mjs
      - name: Verify Next data and Weather normal Lessons and JSON transfer
        run: >-
          docker run --rm --init --network "${TSUMUCODE_LOCAL_OWNER}_web" --cpus 2 --memory 1g --pids-limit 256
          --cap-drop ALL --security-opt no-new-privileges:true "$TSUMUCODE_LOCAL_OWNER-next-browser-checks"
          node scripts/local/next-routing-browser-acceptance.mjs next-ch03
      - name: Verify Next Form and Action normal Lessons and JSON transfer
        run: >-
          docker run --rm --init --network "${TSUMUCODE_LOCAL_OWNER}_web" --cpus 2 --memory 1g --pids-limit 256
          --cap-drop ALL --security-opt no-new-privileges:true "$TSUMUCODE_LOCAL_OWNER-next-browser-checks"
          node scripts/local/next-routing-browser-acceptance.mjs next-ch04
      - name: Verify Next Form POST boundaries and grading contention
        run: |
          set -euo pipefail
          preview=$(./scripts/docker-compose.sh -p "$TSUMUCODE_LOCAL_OWNER" -f compose.learning.yaml ps -q preview)
          docker run --rm --network none "$TSUMUCODE_LOCAL_OWNER-next-browser-checks" node scripts/local/next-fixture-packet.mjs next-ch04-l01-e01 |
            docker exec -i "$preview" node --input-type=module -e "$(cat scripts/local/next-form-http-acceptance.mjs)"
      - name: Verify Weather RSC cancellation on Source apply and stop
        run: |
          set -euo pipefail
          preview=$(./scripts/docker-compose.sh -p "$TSUMUCODE_LOCAL_OWNER" -f compose.learning.yaml ps -q preview)
          docker run --rm --network none "$TSUMUCODE_LOCAL_OWNER-next-browser-checks" node scripts/local/next-fixture-packet.mjs next-ch03-l02-e01 |
            docker exec -i "$preview" node --input-type=module -e "$(cat scripts/local/next-weather-stream-acceptance.mjs)"
      - name: Verify normal controller restart
        run: |
          controller=$(./scripts/docker-compose.sh -p "$TSUMUCODE_LOCAL_OWNER" -f compose.learning.yaml ps -q controller)
          docker exec -i -e TSUMUCODE_RESTART_PHASE=prepare -e TSUMUCODE_RESTART_MODE=normal "$controller" node --input-type=module < scripts/local/resident-restart-acceptance.mjs
          ./scripts/docker-compose.sh -p "$TSUMUCODE_LOCAL_OWNER" -f compose.learning.yaml restart controller
          docker exec -i -e TSUMUCODE_RESTART_PHASE=verify -e TSUMUCODE_RESTART_MODE=normal "$controller" node --input-type=module < scripts/local/resident-restart-acceptance.mjs
      - name: Verify abnormal controller restart
        run: |
          controller=$(./scripts/docker-compose.sh -p "$TSUMUCODE_LOCAL_OWNER" -f compose.learning.yaml ps -q controller)
          docker exec -i -e TSUMUCODE_RESTART_PHASE=prepare -e TSUMUCODE_RESTART_MODE=abnormal "$controller" node --input-type=module < scripts/local/resident-restart-acceptance.mjs
          docker kill --signal KILL "$controller"
          ./scripts/docker-compose.sh -p "$TSUMUCODE_LOCAL_OWNER" -f compose.learning.yaml start controller
          docker exec -i -e TSUMUCODE_RESTART_PHASE=verify -e TSUMUCODE_RESTART_MODE=abnormal "$controller" node --input-type=module < scripts/local/resident-restart-acceptance.mjs
      - name: Verify output failure and preparation shutdown at HTTP boundary
        run: >-
          docker run --rm -i --init --network none --cpus 1 --memory 256m --pids-limit 64
          --cap-drop ALL --security-opt no-new-privileges:true
          --add-host controller:127.0.0.1
          --mount type=bind,src="$PWD/scripts/local",dst=/checks,readonly
          --entrypoint node "$TSUMUCODE_LOCAL_OWNER-controller"
          --input-type=module < scripts/local/output-fault-acceptance.mjs
      - name: Show bounded Source apply failure diagnostics
        if: failure()
        run: |
          controller=$(./scripts/docker-compose.sh -p "$TSUMUCODE_LOCAL_OWNER" -f compose.learning.yaml ps -q controller)
          if [ -n "$controller" ]; then
            docker logs "$controller" 2>&1 | rg '^Next Source apply failure ' || true
          fi
      - name: Stop only this learning stack and preserve Source volume
        if: always()
        run: ./scripts/docker-compose.sh -p "$TSUMUCODE_LOCAL_OWNER" -f compose.learning.yaml down
