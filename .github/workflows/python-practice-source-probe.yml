name: Python practice public historical source probe

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

permissions: {}

jobs:
  historical_source:
    if: >-
      ${{ github.event.pull_request.draft == true &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'codex/validate-python-practice-main2a' &&
          github.event.pull_request.base.sha == '2a0dfa3a196cca736c6c7b6129e0cacb1d263d20' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the fixed candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind candidate and retrieve public source without credentials
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$EXPECTED_HEAD" in *[!0-9a-f]*|'') exit 1;; esac
          test "${#EXPECTED_HEAD}" = 40
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-list --parents -n 1 HEAD | wc -w | tr -d ' ')" = 2
          test "$(git rev-parse HEAD^)" = 821be836b1b46f2ef3862bd4ed691c12cabd5ff4
          test "$(git rev-parse HEAD^^)" = 854c308a9a9e99c7b6a8bbfc78a51cd1cf29bb78
          test "$(git rev-parse HEAD^^^)" = d44904d5043ef9fde8c37bf486e42f58f4fad364
          test "$(git rev-parse HEAD^^^^)" = 2a0dfa3a196cca736c6c7b6129e0cacb1d263d20
          test -z "$(git status --porcelain --untracked-files=normal)"
          expected_paths=$(printf '%s\n' \
            '.github/workflows/python-practice-source-probe.yml' \
            'content/learning-paths/python-basics.yaml' \
            'content/python-practice/course.yaml' \
            'tests/acceptance/helpers/pythonDraftReading.ts' \
            'tests/e2e/python-release-smoke.spec.ts' \
            'tests/local/python-learning.spec.ts' \
            'tests/local/python-practice-source-probe/check.ts' \
            'tests/local/python-practice-source-probe/diagnostic.node-test.mjs' \
            'tests/local/python-practice-source-probe/diagnostic.ts' \
            'tests/unit/release/v2/cli.test.ts')
          actual_paths=$(git diff --no-renames --name-only HEAD^^^^ HEAD)
          if [ "$actual_paths" != "$expected_paths" ]; then echo 'candidate-paths=failed'; exit 1; fi
          git diff --quiet HEAD^^^^ HEAD -- Dockerfile .dockerignore package.json package-lock.json scripts/release/v2 scripts/content
          if git config --local --get-regexp '^http\..*\.extraheader$' >/dev/null; then exit 1; fi
          if env -i PATH=/usr/bin:/bin HOME=/tmp GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 \
            git -c credential.helper= -c core.hooksPath=/dev/null -c http.followRedirects=false \
            fetch --quiet --no-tags https://github.com/santa928/tsumucode.git 6b06d58530a57a5bda7c6c1a8b0eb3d95fce7931 >/dev/null 2>&1; then
            echo 'public-source-fetch=passed'
          else
            echo 'public-source-fetch=failed'
            exit 1
          fi
          test "$(git rev-parse '6b06d58530a57a5bda7c6c1a8b0eb3d95fce7931^{tree}')" = 85b143b26b35aaeb68ce11df1b8b16729a6ab966
          test "$(git rev-parse '6b06d58530a57a5bda7c6c1a8b0eb3d95fce7931:content/python-practice')" = 36829dae17cb50ddaedf4fdeb0d3b0697c7531a8
          git merge-base --is-ancestor 9821a4eb16b7395ccf94bfbb59f467507bca97b3 HEAD
          git merge-base --is-ancestor 87296dd27654455c16212e41a68c106021c72ef9 HEAD
      - name: Build the existing locked Node image
        run: docker build --target dependencies --tag python-practice-source-probe .
      - name: Verify the public historical reader in isolation
        run: >-
          docker run --rm --network none --read-only --user "$(id -u):$(id -g)"
          --cap-drop ALL --security-opt no-new-privileges --cpus 1
          --memory 512m --memory-swap 512m --pids-limit 128
          --env HOME=/tmp --env GIT_CONFIG_NOSYSTEM=1 --env GIT_CONFIG_GLOBAL=/dev/null
          --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env GIT_CONFIG_VALUE_0=/workspace
          --tmpfs /tmp:rw,nosuid,nodev,noexec,size=128m,mode=1777
          --mount "type=bind,source=${GITHUB_WORKSPACE}/.git,target=/workspace/.git,readonly"
          --mount "type=bind,source=${GITHUB_WORKSPACE}/scripts,target=/workspace/scripts,readonly"
          --mount "type=bind,source=${GITHUB_WORKSPACE}/src,target=/workspace/src,readonly"
          --mount "type=bind,source=${GITHUB_WORKSPACE}/content,target=/workspace/content,readonly"
          --mount "type=bind,source=${GITHUB_WORKSPACE}/docs,target=/workspace/docs,readonly"
          --mount "type=bind,source=${GITHUB_WORKSPACE}/tests/local/python-practice-source-probe,target=/workspace/tests/local/python-practice-source-probe,readonly"
          python-practice-source-probe sh -ec 'test "$(node --version)" = v24.18.0;
          test "$(stat -c %u /workspace)" = 0;
          test "$(stat -c %u /workspace/.git)" = "$(id -u)";
          test "$(git config --get-all safe.directory)" = /workspace;
          node --test tests/local/python-practice-source-probe/diagnostic.node-test.mjs;
          node --import tsx tests/local/python-practice-source-probe/check.ts'
