name: Signer fixture policy draft validation

on:
  pull_request:
    branches: [codex/python-oop-stacked]
    types: [opened, synchronize, reopened, converted_to_draft]

permissions: {}

jobs:
  signer_fixture_policy:
    # Test-only: this job cannot sign, deploy or authorize publication.
    if: >-
      ${{ github.event.pull_request.draft == true &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'codex/validate-signer-six-fixture' &&
          github.event.pull_request.base.sha == '6d1f24a220d64d9781b3b3cd3c88289ef2f1f777' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out exact draft HEAD without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify candidate and fixed inputs
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=normal)"
          git rev-parse HEAD 'HEAD^{tree}'
          sha256sum --check <<'SHA256'
          2d26afccb2fc4d21791c1e176264e9a25a7d1b11308fae5262ac1cbd115b4677  Dockerfile
          15c380765bbf2e109f96275248e842b7a9649fca7efa633427ee85ab8fd19aa4  package.json
          191461e31bb2d50d9be7b6fd91e2a63e14e7eee00634461bb4bc32bac0b7f0c8  package-lock.json
          71d5e6329eb617384edf8742a64d9f8533ee5f7832d6586ac6c9150eab1967c8  .dockerignore
          76a662fb11e544cda927742a0c062ab7c88e20b17804ada414921f86dd2ebfc3  vitest.config.ts
          6d281d7d613376a97cd83b2e28bfc415282914a0fcf7fd937beaf87e40baeb1f  tsconfig.app.json
          9690d7cadafa5e989af1ca3b4f72d4edd525fb325bb5b39e34ac133b3dff2aee  tsconfig.node.json
          b7f6e8a59b73230c30425a366f1ce2731d24014a2029f36f1a5a6f2168911f9a  scripts/release/v2/identity.ts
          93f1e64490bccdd8c264a418a26263418c7ae4cf6afc711027db8d179e4e5521  scripts/release/v2/schema.ts
          fa6c741186a6df8a07c7067d0de020d17a36a2b8fec0b2a43024dae07526ef01  src/core/persistence/canonicalJson.ts
          0dd0e34375bc50c3c9f30d739ee571da438cac29988fc3dde28f9262a496cd4d  scripts/release/v2/isolatedCandidateGit.mjs
          2264016f64b06d920a42a54e48dbe7a74d30262130f34ae94a779fe5cba502b0  scripts/release/v2/isolatedCandidateGit.d.mts
          cb3a5ae7a57b067a7c191323a442bf4121577c29a8255de2c9cdb46876bb6228  scripts/release/v2/lineageCallerPolicy.ts
          143684b5fe942211e592a0d8f87e07a95c3809bc1265319a823123853caa9537  scripts/release/v2/trustedLineagePolicy.ts
          bdd746008fa7ebb284a7f8c9f91ca3e429427ac7470a48f11e2bb4b9676cc815  scripts/release/v2/signerTopology.ts
          491db8742ea5a544896cc56521fe9b4440849a49ec2577446d88fd1973884488  scripts/release/v2/callerNormalization.ts
          042bf3a707553f1ddd9fd3c3358f023692068ee759b9dae91169ac3a2d23a878  tests/unit/release/v2/isolatedCandidateGit.node-test.mjs
          510967ba0a3484ec636314723cc4f92e2ddcdd68d588db0e8b4b9b17fc3dde93  tests/unit/release/v2/lineageCallerPolicy.test.ts
          e95075b8f6082cc1c3cbe071cef1dddfa2f1f3c46a85aa67f5d8a993b3a5323f  tests/unit/release/v2/lineageCallerIsolated.test.ts
          796cc9d976aee3f8ffc2a586dd7b99ad64ff29669d5d980068ed7ab156bfe611  tests/local/signer-fixture-policy/policy.test.cjs
          3feab102f3f671f10267a609a3fd32bce2a71390ab8bd7036ddbd6ea5c69331c  tests/local/signer-fixture-policy/integration-empty.test.cjs
          e7b302b426097ebd7a72b7af2be7d3219f6aa274e3083fc11dbf3ca01d81b21d  tests/local/signer-fixture-policy/topology-check.test.cjs
          cfaf96acdc73726cb19f4f98d09efef9bf95ef28f2bbee7a57769312af4fb084  tests/local/signer-fixture-policy/run-fixed-validation.sh
          c8784d9778cbe4ae5a6a482b7f3340d221b7b019ff135f279df0599308e0bd7a  tests/local/signer-fixture-policy/original-wip.test.fixture
          b5350f9613f6d080ae72a2530b072d231bd0e8d793ae838fcb8d88eff2986c95  tests/local/signer-fixture-policy/release-checks-352.yml
          b5350f9613f6d080ae72a2530b072d231bd0e8d793ae838fcb8d88eff2986c95  .github/workflows/release-v2-checks.yml
          5771b4227de47eb8ec980012119732be6f439732ada8c9a2776cb67610ea7777  tests/local/qualification-probe/admission.test.mjs
          7e48b28ffeeb0f83d88738ca5601083d46d93f2aedf4fa4a7f906d9d0de6808e  tests/local/qualification-probe/resolve-ts.mjs
          775a57b75a6aabb69358dd1174dd9e0147926b1bbaf11648ec5289306a3a229a  tests/unit/release/v2/admission.test.ts
          2f8a94a67804fba90754d6d72bac5f733d8f3fe5c8d09ee5287fbab7fc1e2abd  scripts/release/v2/admission.ts
          c1a591a5777ef00778fddd0eb9b02af61cd095de52aadcb7dffe90d21fb715d5  scripts/release/v2/executionPlan.ts
          73ae190808c78a0e707a59da01df2c093368aeb50d45c2f6a15631c079f545c9  scripts/release/v2/attempts.ts
          1f7b3c9560ab6bc8adcd21e169462840aa3453678edccdd7d12c391c737eadd3  scripts/release/v2/verify.ts
          SHA256
          cmp tests/local/signer-fixture-policy/release-checks-352.yml .github/workflows/release-v2-checks.yml
      - name: Build fixed Node and locked dependencies
        env:
          IMAGE: signer-fixture-policy-validation:${{ github.run_id }}-${{ github.run_attempt }}
        run: docker build --target dependencies --tag "$IMAGE" .
      - name: Run isolated synthetic and Linux Git checks
        env:
          IMAGE: signer-fixture-policy-validation:${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          docker run --rm --network none --read-only --user 65534:65534
          --cap-drop ALL --security-opt no-new-privileges --cpus 2
          --memory 2g --memory-swap 2g --pids-limit 256
          --tmpfs /tmp:rw,nosuid,nodev,noexec,size=1g,uid=65534,gid=65534
          --tmpfs /tmp/lineage-exec:rw,nosuid,nodev,exec,size=96m,uid=65534,gid=65534
          --env HOME=/tmp --env TMPDIR=/tmp --env CI=true --env LINEAGE_EXEC_SCRATCH=/tmp/lineage-exec
          --mount "type=bind,source=${GITHUB_WORKSPACE}/scripts,target=/workspace/scripts,readonly"
          --mount "type=bind,source=${GITHUB_WORKSPACE}/src,target=/workspace/src,readonly"
          --mount "type=bind,source=${GITHUB_WORKSPACE}/tests,target=/workspace/tests,readonly"
          --mount "type=bind,source=${GITHUB_WORKSPACE}/.github,target=/workspace/.github,readonly"
          --mount "type=bind,source=${GITHUB_WORKSPACE}/vitest.config.ts,target=/workspace/vitest.config.ts,readonly"
          --mount "type=bind,source=${GITHUB_WORKSPACE}/tsconfig.app.json,target=/workspace/tsconfig.app.json,readonly"
          --mount "type=bind,source=${GITHUB_WORKSPACE}/tsconfig.node.json,target=/workspace/tsconfig.node.json,readonly"
          "$IMAGE" sh tests/local/signer-fixture-policy/run-fixed-validation.sh
