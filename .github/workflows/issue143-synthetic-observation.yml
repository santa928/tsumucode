name: Python synthetic Pages-to-Local observation (draft only)

on:
  pull_request:
    paths:
      - '.github/workflows/issue143-synthetic-observation.yml'
      - 'tests/observations/issue143/**'

permissions:
  contents: read

jobs:
  synthetic-observation:
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OBSERVATION_HEAD: ${{ github.event.pull_request.head.sha }}
      OBSERVATION_BASE: ${{ github.event.pull_request.base.sha }}
      TSUMUCODE_LOCAL_OWNER: tsumucode-p6-${{ github.run_id }}-${{ github.run_attempt }}
      TSUMUCODE_LOCAL_SOCKET: /var/run/docker.sock
      TSUMUCODE_NEXT_SOURCE_SHA: b9306eb3414e69a2068603cfdbf2706ebe4e9284
      COMPOSE_PARALLEL_LIMIT: 1
    steps:
      - name: Checkout this test candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: observation
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout the fixed product Source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: b9306eb3414e69a2068603cfdbf2706ebe4e9284
          path: source
          persist-credentials: false
      - name: Validate identity and isolated owner
        shell: bash
        run: |
          set -euo pipefail
          test "$OBSERVATION_BASE" = af8b7513a9304ae2fd82f8f43833698e8635b795
          test "$(git -C observation rev-parse HEAD)" = "$OBSERVATION_HEAD"
          git -C observation merge-base --is-ancestor "$OBSERVATION_BASE" "$OBSERVATION_HEAD"
          printf 'Observation commit/tree: %s %s\n' "$OBSERVATION_HEAD" "$(git -C observation rev-parse HEAD^{tree})"
          test "$(git -C source rev-parse HEAD)" = b9306eb3414e69a2068603cfdbf2706ebe4e9284
          test "$(git -C source rev-parse HEAD^{tree})" = fb74d1c12f1081b28dad4e45e87ecef19a67e729
          test -z "$(git -C source status --porcelain)"
          test -S "$TSUMUCODE_LOCAL_SOCKET"
          test -z "$(docker ps -aq --filter "label=com.docker.compose.project=$TSUMUCODE_LOCAL_OWNER")"
          if docker network inspect "${TSUMUCODE_LOCAL_OWNER}_web" >/dev/null 2>&1; then exit 1; fi
          if ss -H -ltn | grep -Eq ':(4173|4175)[[:space:]]'; then exit 1; fi
          node --test observation/tests/observations/issue143/check-report.test.mjs
          node --test observation/tests/observations/issue143/local-diagnostic.test.mjs observation/tests/observations/issue143/local-diagnostic-cli.test.mjs
          node --test observation/tests/observations/issue143/preview-diagnostic.test.mjs observation/tests/observations/issue143/preview-diagnostic-cli.test.mjs
          node --test observation/tests/observations/issue143/startup-diagnostic.test.mjs observation/tests/observations/issue143/startup-diagnostic-cli.test.mjs
          node --test observation/tests/observations/issue143/identity-http-diagnostic.test.mjs
          node --test observation/tests/observations/issue143/identity-preflight.test.mjs
          node --test observation/tests/observations/issue143/home-diagnostic.test.mjs observation/tests/observations/issue143/home-diagnostic-cli.test.mjs
          node observation/tests/observations/issue143/public-identity.mjs
          mkdir -m 700 "$RUNNER_TEMP/issue143-export" "$RUNNER_TEMP/issue143-home" "$RUNNER_TEMP/issue143-local"
      - name: Build fixed Source images in the hosted runner
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          docker pull python:3.14.2-slim-bookworm@sha256:e87711ef5c86aaeaa7031718a69db79d334d94c545c709583f651b8185870941
          ./scripts/docker-compose.sh -p "$TSUMUCODE_LOCAL_OWNER" -f compose.learning.yaml --profile build-project build
          ./scripts/docker-compose.sh -p "$TSUMUCODE_LOCAL_OWNER" -f compose.learning.yaml build web controller preview
          docker build --file Dockerfile.learning --target python-browser-checks --tag "$TSUMUCODE_LOCAL_OWNER-python-browser-checks" .
          docker run --rm --init --user "$(id -u):$(id -g)" --network none --read-only --tmpfs "/tmp:rw,nosuid,nodev,size=64m,uid=$(id -u),gid=$(id -g)" --cpus 1 --memory 512m --pids-limit 128 --cap-drop ALL --security-opt no-new-privileges:true \
            --mount "type=bind,src=$GITHUB_WORKSPACE/observation/tests/observations/issue143,dst=/workspace/tests/observations/issue143,readonly" \
            --entrypoint node "$TSUMUCODE_LOCAL_OWNER-python-browser-checks" --test /workspace/tests/observations/issue143/preview-diagnostic-compat.test.mjs
          for image in "$TSUMUCODE_LOCAL_OWNER-python-browser-checks" "$TSUMUCODE_LOCAL_OWNER-project:local"; do
            docker image inspect --format '{{.Id}}' "$image"
          done
      - name: Start only the isolated Local stack
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          ./scripts/docker-compose.sh -p "$TSUMUCODE_LOCAL_OWNER" -f compose.learning.yaml up --no-build -d web controller preview
          controller=$(./scripts/docker-compose.sh -p "$TSUMUCODE_LOCAL_OWNER" -f compose.learning.yaml ps -q controller)
          test -n "$controller"
          expected=$(sha256sum src/core/runtime/pythonLessonProfiles.mjs | cut -d' ' -f1)
          actual=$(docker exec "$controller" node --input-type=module -e 'import fs from "node:fs"; import crypto from "node:crypto"; process.stdout.write(crypto.createHash("sha256").update(fs.readFileSync("/app/pythonLessonProfiles.mjs")).digest("hex"))')
          test "$actual" = "$expected"
          web=$(./scripts/docker-compose.sh -p "$TSUMUCODE_LOCAL_OWNER" -f compose.learning.yaml ps -q web)
          test -n "$web"
          index_hash='import fs from "node:fs"; import crypto from "node:crypto"; process.stdout.write(crypto.createHash("sha256").update(fs.readFileSync(process.argv[1])).digest("hex"))'
          controller_index=$(docker exec "$controller" node --input-type=module -e "$index_hash" /app/python-course-index.json)
          web_index=$(docker exec "$web" node --input-type=module -e "$index_hash" /app/dist/generated/content/courses/python-basics/index.json)
          test "$controller_index" = "$web_index"
          test "$web_index" = 380b46f8bffe0aeebeb19394f0ef2b5c1c23e86004d6965241ed2f6157295698
          echo 'Fixed Source Python index and controller/web hashes match the published candidate'
      - name: Export fresh synthetic Pages data and check Home resume
        shell: bash
        run: |
          set -euo pipefail
          overlay="$GITHUB_WORKSPACE/observation/tests/observations/issue143"
          for phase in export home; do
            dir="$RUNNER_TEMP/issue143-$phase"
            if ! docker run --rm --init --user "$(id -u):$(id -g)" --network bridge --cpus 2 --memory 1g --pids-limit 256 --cap-drop ALL --security-opt no-new-privileges:true \
              --mount "type=bind,src=$overlay,dst=/workspace/tests/observations/issue143,readonly" \
              --mount "type=bind,src=$dir,dst=/exchange" --env "OBSERVATION_PHASE=$phase" \
              --entrypoint node "$TSUMUCODE_LOCAL_OWNER-python-browser-checks" node_modules/@playwright/test/cli.js test --config=/workspace/tests/observations/issue143/observation.config.ts >"$dir/private-run.log" 2>&1; then
              if [ "$phase" = home ]; then node "$overlay/home-diagnostic.mjs" "$dir/home-report.json" 2>/dev/null || true; fi
              echo "Synthetic $phase observation failed; private log not uploaded"; exit 1
            fi
            count=1; if [ "$phase" = home ]; then count=2; fi
            if ! node "$overlay/check-report.mjs" "$dir/$phase-report.json" "$count"; then
              if [ "$phase" = home ]; then node "$overlay/home-diagnostic.mjs" "$dir/home-report.json" 2>/dev/null || true; fi
              exit 1
            fi
          done
      - name: Import that same export into isolated Local
        shell: bash
        run: |
          set -euo pipefail
          overlay="$GITHUB_WORKSPACE/observation/tests/observations/issue143"
          input="$RUNNER_TEMP/issue143-export/synthetic-progress.json"
          localdir="$RUNNER_TEMP/issue143-local"
          test -f "$input"
          sha=$(sha256sum "$input" | cut -d' ' -f1)
          case "$sha" in *[!0-9a-f]*|'') exit 1;; esac
          test "${#sha}" -eq 64
          if ! docker run --rm --init --user "$(id -u):$(id -g)" --network "${TSUMUCODE_LOCAL_OWNER}_web" --cpus 2 --memory 1g --pids-limit 256 --cap-drop ALL --security-opt no-new-privileges:true \
            --mount "type=bind,src=$overlay,dst=/workspace/tests/observations/issue143,readonly" \
            --mount "type=bind,src=$input,dst=/p6-input/synthetic-progress.json,readonly" \
            --mount "type=bind,src=$localdir,dst=/exchange" --env OBSERVATION_PHASE=local --env "P6_RUN_EXPORT_SHA256=$sha" \
            --entrypoint node "$TSUMUCODE_LOCAL_OWNER-python-browser-checks" /workspace/tests/observations/issue143/local-bridge.mjs >"$localdir/private-run.log" 2>&1; then
            node "$overlay/local-diagnostic.mjs" "$localdir/local-report.json" 2>/dev/null || true
            node "$overlay/preview-diagnostic.mjs" "$localdir/local-preview.json" 2>/dev/null || true
            node "$overlay/startup-diagnostic.mjs" "$localdir/private-run.log" 2>/dev/null || true
            echo 'Synthetic Local observation failed; private log not uploaded'; exit 1
          fi
          if ! node "$overlay/check-report.mjs" "$localdir/local-report.json" 1; then
            node "$overlay/local-diagnostic.mjs" "$localdir/local-report.json" 2>/dev/null || true
            node "$overlay/preview-diagnostic.mjs" "$localdir/local-preview.json" 2>/dev/null || true
            exit 1
          fi
          test "$(sha256sum "$input" | cut -d' ' -f1)" = "$sha"
          printf 'Synthetic same-job export SHA-256: %s\n' "$sha"
      - name: Recheck public Source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f observation/tests/observations/issue143/public-identity.mjs
          node observation/tests/observations/issue143/public-identity.mjs
          test "$(git -C source rev-parse HEAD^{tree})" = fb74d1c12f1081b28dad4e45e87ecef19a67e729
          test -z "$(git -C source status --porcelain)"
      - name: Stop only this job's Local stack
        if: always()
        shell: bash
        run: |
          if test -f source/compose.learning.yaml && test -n "$(docker ps -aq --filter "label=com.docker.compose.project=$TSUMUCODE_LOCAL_OWNER")"; then
            cd source
            ./scripts/docker-compose.sh -p "$TSUMUCODE_LOCAL_OWNER" -f compose.learning.yaml stop
          fi
