name: Fixed same-run Pages publisher

# Called only by the explicit main/candidate publication gate in pages.yml; no direct trigger.
on:
  workflow_call:
    inputs:
      candidate_artifact_id:
        type: string
        required: true
      metadata_artifact_id:
        type: string
        required: true
      qualification_artifact_id:
        type: string
        required: true
      qualification_sha256:
        type: string
        required: true
    outputs:
      page_url:
        value: ${{ jobs.deploy.outputs.page_url }}
      record_state:
        value: ${{ jobs.record.outputs.state }}
      record_tag:
        value: ${{ jobs.record.outputs.tag_name }}

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    env:
      CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
      METADATA_ARTIFACT_ID: ${{ inputs.metadata_artifact_id }}
      QUALIFICATION_ARTIFACT_ID: ${{ inputs.qualification_artifact_id }}
      QUALIFICATION_SHA256: ${{ inputs.qualification_sha256 }}
    steps:
      - name: Download exact same-run public bytes
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          artifact-ids: ${{ inputs.candidate_artifact_id }}
          path: dist
      - name: Download exact same-run build metadata
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          artifact-ids: ${{ inputs.metadata_artifact_id }}
          path: .release-v2
      - name: Download pinned same-run aggregate qualification
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          artifact-ids: ${{ inputs.qualification_artifact_id }}
          path: .release-v2
      - name: Recheck fixed bytes and actual parent after Environment
        id: acceptance
        run: |
          node --input-type=module <<'JS'
          // This code is embedded in the reviewed workflow. It never imports candidate Source code.
          import {createHash} from 'node:crypto';
          import {readFile, readdir, lstat} from 'node:fs/promises';
          import path from 'node:path';
          const ensure = (condition,message) => { if (!condition) throw Error(message); };
          const digest = bytes => createHash('sha256').update(bytes).digest('hex');
          const codePoints = (a,b) => {
            const left=Array.from(a,c=>c.codePointAt(0)), right=Array.from(b,c=>c.codePointAt(0));
            for(let i=0;i<Math.min(left.length,right.length);i++) if(left[i]!==right[i]) return left[i]-right[i];
            return left.length-right.length;
          };
          const canonical = value => {
            if(Array.isArray(value)) return '['+value.map(canonical).join(',')+']';
            if(value!==null && typeof value==='object') return '{'+Object.keys(value).sort(codePoints).map(key=>JSON.stringify(key)+':'+canonical(value[key])).join(',')+'}';
            return JSON.stringify(value);
          };
          const hashValue = value => digest(canonical(value));
          const read = async file => {
            const bytes=await readFile(file); ensure(bytes.length<=4*1024*1024,'Oversized publication metadata');
            return {bytes,value:JSON.parse(bytes.toString('utf8'))};
          };
          const repository=process.env.GITHUB_REPOSITORY, source=process.env.GITHUB_SHA, runId=process.env.GITHUB_RUN_ID;
          ensure(/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repository??''),'Invalid repository');
          ensure(/^[a-f0-9]{40}$/.test(source??'') && /^[1-9]\d*$/.test(runId??''),'Invalid execution identity');
          ensure(process.env.GITHUB_EVENT_NAME==='workflow_dispatch' && process.env.GITHUB_REF==='refs/heads/main','Wrong publication context');
          for(const name of ['CANDIDATE_ARTIFACT_ID','METADATA_ARTIFACT_ID','QUALIFICATION_ARTIFACT_ID'])
            ensure(/^[1-9]\d*$/.test(process.env[name]??''),'Missing pinned same-run artifact');
          const {value:candidate}=await read('.release-v2/candidate.json');
          const {value:snapshot}=await read('.release-v2/preparation.json');
          const {value:baseline}=await read('.release-v2/baseline.json');
          const {value:executionPlan}=await read('.release-v2/execution-plan.json');
          const {bytes:qualificationBytes,value:qualification}=await read('.release-v2/qualification.json');
          ensure(/^[a-f0-9]{64}$/.test(process.env.QUALIFICATION_SHA256??'') && digest(qualificationBytes)===process.env.QUALIFICATION_SHA256,'Qualification byte pin differs');
          ensure(candidate.schemaVersion===1 && candidate.repository===repository && candidate.runId===runId && candidate.buildJobId==='build' && candidate.recipe.sourceCommit===source && candidate.artifactId===process.env.CANDIDATE_ARTIFACT_ID,'Unbound publication candidate');
          ensure(Number.isSafeInteger(candidate.buildAttempt) && candidate.buildAttempt>0 && Number.isSafeInteger(Number(process.env.GITHUB_RUN_ATTEMPT)) && candidate.buildAttempt<=Number(process.env.GITHUB_RUN_ATTEMPT),'Invalid candidate attempt');
          const base='/'+repository.split('/')[1]+'/';
          ensure(candidate.recipe.basePath===base,'Wrong public base path');
          ensure(candidate.planDigest===hashValue({plan:snapshot.plan,executionPlan}),'Frozen obligations differ');
          ensure(qualification.schemaVersion===1 && qualification.status==='qualified' && qualification.candidateDigest===hashValue(candidate) && qualification.technical?.status==='technical-passed' && qualification.technical.candidateDigest===hashValue(candidate) && qualification.technical.buildAttempt===candidate.buildAttempt,'Unqualified publication candidate');
          ensure(hashValue(qualification.parent)===hashValue(snapshot.plan.parent),'Qualification parent differs');
          ensure(Number.isFinite(Date.parse(qualification.qualifiedAt)) && Date.parse(qualification.qualifiedAt)<=Date.now() && Date.parse(qualification.technical.expiresAt)>Date.now(),'Qualification expired while awaiting publication');
          ensure(baseline.proof.repository===repository && baseline.baseline.deploymentId===baseline.proof.deploymentId && baseline.baseline.sourceCommit===baseline.proof.sourceCommit && baseline.baseline.artifactDigest===baseline.proof.artifactDigest && baseline.baseline.sourceRecordDigest===hashValue(baseline.proof) && baseline.proof.inventoryDigest===hashValue(baseline.baseline.inventory),'Invalid captured parent proof');
          ensure(snapshot.plan.parent?.deploymentId===baseline.proof.deploymentId && snapshot.plan.parent?.sourceRecordDigest===hashValue(baseline.proof),'Plan parent differs');
          for(const key of ['deploymentId','runId']) ensure(/^[1-9]\d*$/.test(baseline.proof[key]),'Invalid parent identity');
          const files=[];
          async function visit(directory) {
            for(const child of (await readdir(directory)).sort()) {
              const file=path.join(directory,child), stat=await lstat(file), relative=path.relative('dist',file).split(path.sep).join('/');
              ensure(!stat.isSymbolicLink() && !relative.split('/').some(part=>part==='.git'||part==='.github'),'Unsafe deployment file');
              if(stat.isDirectory()) await visit(file);
              else {
                ensure(stat.isFile() && !relative.includes('\\') && !/[\u0000-\u001f\u007f?#]/u.test(relative),'Unsafe deployment path');
                const bytes=await readFile(file); files.push({path:relative,bytes:bytes.length,sha256:digest(bytes)});
              }
            }
          }
          ensure((await lstat('dist')).isDirectory() && !(await lstat('dist')).isSymbolicLink(),'Invalid deployment root');
          await visit('dist');
          ensure(files.length>0 && hashValue(files)===candidate.artifactDigest,'Deployment bytes differ from the qualified artifact');
          const api=async relative => {
            const response=await fetch('https://api.github.com/repos/'+repository+relative,{redirect:'error',signal:AbortSignal.timeout(15000),headers:{Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}});
            ensure(response.status===200,'Publication state unavailable');
            ensure(response.body,'Missing publication state');
            const reader=response.body.getReader(), chunks=[]; let size=0;
            try {
              for(;;) { const result=await reader.read(); if(result.done) break; size+=result.value.length;
                if(size>1024*1024) { await reader.cancel(); throw Error('Oversized publication state'); }
                chunks.push(result.value);
              }
            } finally { reader.releaseLock(); }
            const bytes=new Uint8Array(size); let offset=0;
            for(const chunk of chunks) { bytes.set(chunk,offset); offset+=chunk.length; }
            return JSON.parse(new TextDecoder().decode(bytes));
          };
          ensure((await api('/git/ref/heads/main')).object?.sha===source,'Main changed while awaiting publication');
          // 既知の配信前失敗1件のみ、固定workflow・run・job・全status原本で再確認する。
          const verifyKnownPredeployFailure=async deployment=>{
            const failedId=7675216444, failedRun=42758114561, failedJob=129670621435;
            const failedSource='9d00cd6dfd12f096c87d486175acdcd6d9795c67';
            const failedLog='https://github.com/santa928/tsumucode/actions/runs/42758114561/job/129670621435';
            ensure(repository==='santa928/tsumucode' && deployment?.id===failedId && deployment.sha===failedSource && deployment.ref==='main' && deployment.environment==='github-pages','Unexpected pre-deploy failure');
            ensure(baseline.proof.deploymentId==='7593230441' && baseline.proof.workflowHeadCommit==='eb2fe6f8e06409569f173efb2fe6275c46a535cf' && baseline.proof.runId==='42154759825','Unexpected pre-deploy parent');
            const history=await api('/deployments/7675216444/statuses?per_page=100');
            const expectedHistory=[[21828353186,'failure'],[21828345728,'in_progress'],[21828344399,'queued'],[21828344164,'queued'],[21828342972,'waiting']];
            ensure(Array.isArray(history) && history.length===expectedHistory.length && history.every((row,i)=>row.id===expectedHistory[i][0] && row.state===expectedHistory[i][1] && row.log_url===failedLog && row.environment_url===''),'Pre-deploy status history differs');
            const runMatches=row=>row?.id===failedRun && row.run_attempt===1 && row.workflow_id===315500203 && row.path==='.github/workflows/pages.yml' && row.head_sha===failedSource && row.event==='workflow_dispatch' && row.head_branch==='main' && row.status==='completed' && row.conclusion==='failure';
            ensure(runMatches(await api('/actions/runs/42758114561')) && runMatches(await api('/actions/runs/42758114561/attempts/1')),'Pre-deploy run differs');
            const priorJob=await api('/actions/jobs/129670621435');
            const steps=[['Set up job','success'],['Download exact same-run public bytes','success'],['Download exact same-run build metadata','success'],['Download pinned same-run aggregate qualification','success'],['Recheck fixed bytes and actual parent after Environment','failure'],['Package the same verified files for Pages','skipped'],['Deploy the same verified files','skipped'],['Complete job','success']];
            ensure(priorJob?.id===failedJob && priorJob.run_id===failedRun && priorJob.run_attempt===1 && priorJob.head_sha===failedSource && priorJob.name==='publish / deploy' && priorJob.status==='completed' && priorJob.conclusion==='failure' && Array.isArray(priorJob.steps) && priorJob.steps.length===steps.length && priorJob.steps.every((step,i)=>step.number===i+1 && step.name===steps[i][0] && step.status==='completed' && step.conclusion===steps[i][1]),'Pre-deploy job differs');
            for(const [file,expected] of [['pages.yml','e26a0e10dab9c29325a372569809691feb3084c39c7d1892ef39d15d12b4aa00'],['release-v2-publish.yml','b0e7d952930b3ca64dd4677140bd98f96b5b5d71333d9c60b690b52abf207365']]) {
              const original=await api('/contents/.github/workflows/'+file+'?ref='+failedSource);
              ensure(original?.encoding==='base64' && typeof original.content==='string' && original.content.length<=100000,'Missing pre-deploy workflow');
              const encoded=original.content.replace(/\s/gu,''), bytes=Buffer.from(encoded,'base64');
              ensure(bytes.toString('base64')===encoded && digest(bytes)===expected,'Pre-deploy workflow bytes differ');
            }
          };
          const deployments=await api('/deployments?environment=github-pages&per_page=3');
          ensure(Array.isArray(deployments) && deployments.length>0 && deployments.length<=3,'Missing deployment history');
          const site='https://'+repository.split('/')[0]+'.github.io'+base;
          const verifyOwnDeployment=async own=>{
            ensure(
              /^[1-9]\d*$/.test(String(own?.id)) && own.sha===source &&
              own.ref==='main' && own.environment==='github-pages',
              'Unexpected deployment before the published parent'
            );
            const ownStatuses = await api('/deployments/'+own.id+'/statuses');
            const ownStatus = ownStatuses[0];
            const ownLog = new URL(ownStatus?.log_url??'https://invalid.invalid/');
            const ownRunPath = '/'+repository+'/actions/runs/'+runId;
            const ownJobPath = ownRunPath+'/job/';
            const ownPathMatches = ownLog.pathname===ownRunPath || (
              ownLog.pathname.startsWith(ownJobPath) &&
              /^[1-9]\d*$/.test(ownLog.pathname.slice(ownJobPath.length))
            );
            ensure(
              ['pending','queued','in_progress'].includes(ownStatus?.state) &&
              [undefined,'',site].includes(ownStatus?.environment_url) &&
              ownLog.origin==='https://github.com' && !ownLog.username && !ownLog.password &&
              !ownLog.search && !ownLog.hash && ownPathMatches,
              'Unverified current Environment deployment'
            );
          };
          let actual=deployments[0], nextIndex=1, recoveredFailure, ownDeployment;
          if(String(actual?.id)!==baseline.proof.deploymentId && actual?.id!==7675216444) {
            // Environmentへの入場で、配信前に今回run自身の未完了deploymentが生成される。
            ownDeployment=actual;
            await verifyOwnDeployment(ownDeployment);
            // 自己deployment1件だけを除外し、他runの介在は親不一致として停止する。
            actual = deployments[1];
            nextIndex = 2;
          }
          if(actual?.id===7675216444) {
            recoveredFailure=actual;
            await verifyKnownPredeployFailure(actual);
            actual=deployments[nextIndex];
          }
          ensure(actual && String(actual.id)===baseline.proof.deploymentId && actual.sha===baseline.proof.workflowHeadCommit && actual.ref==='main' && actual.environment==='github-pages','Actual deployed parent changed');
          const verifyParentStatus=async()=>{
            const statuses=await api('/deployments/'+actual.id+'/statuses');
            const log=new URL(statuses[0]?.log_url??'https://invalid.invalid/');
            const prefix='/'+repository+'/actions/runs/'+baseline.proof.runId+'/job/';
            ensure(statuses[0]?.state==='success' && statuses[0].environment_url===site && log.origin==='https://github.com' && log.pathname.startsWith(prefix) && /^[1-9]\d*$/.test(log.pathname.slice(prefix.length)),'Actual deployed parent is unverified');
          };
          await verifyParentStatus();
          if(recoveredFailure) {
            // 複数APIの照合中に履歴や親が変わった場合は配信せず停止する。
            await verifyKnownPredeployFailure(recoveredFailure);
            await verifyParentStatus();
            if(ownDeployment) await verifyOwnDeployment(ownDeployment);
            ensure((await api('/git/ref/heads/main')).object?.sha===source,'Main changed during parent recovery');
            ensure(Date.parse(qualification.technical.expiresAt)>Date.now(),'Qualification expired during parent recovery');
            const recent=await api('/deployments?environment=github-pages&per_page=3');
            const checkedCount=nextIndex+1;
            ensure(Array.isArray(recent) && recent.length>=checkedCount && recent.length<=3 && deployments.length>=checkedCount && recent.slice(0,checkedCount).every((row,i)=>row.id===deployments[i].id && row.sha===deployments[i].sha && row.ref===deployments[i].ref && row.environment===deployments[i].environment),'Deployment history changed during recovery');
          }
          console.log('Qualified bytes and actual parent confirmed after the protected Environment. No Source code executed.');
          JS
      - name: Package the same verified files for Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          name: v2-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
          include-hidden-files: true
          retention-days: 1
      - name: Deploy the same verified files
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
        with:
          artifact_name: v2-pages-${{ github.run_id }}-${{ github.run_attempt }}

  report:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      BASE_PATH: /${{ github.event.repository.name }}/
      RELEASE_FLOW_V2_QUALIFICATION_SHA256: ${{ inputs.qualification_sha256 }}
      TSUMUCODE_DOCKER_TARGET: app
    outputs:
      report_artifact_id: ${{ steps.public_report.outputs['artifact-id'] }}
      record_plan_sha256: ${{ steps.report_pins.outputs.record_plan_sha256 }}
      public_smoke_sha256: ${{ steps.report_pins.outputs.public_smoke_sha256 }}
      public_operations_sha256: ${{ steps.report_pins.outputs.public_operations_sha256 }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          artifact-ids: ${{ inputs.candidate_artifact_id }}
          path: dist
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          artifact-ids: ${{ inputs.metadata_artifact_id }}
          path: .release-v2
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          artifact-ids: ${{ inputs.qualification_artifact_id }}
          path: .release-v2
      - name: Build read-only publication observer
        run: ./scripts/docker-compose.sh build app
      - name: Verify every public file and prepare sanitized immutable record
        run: |
          ./scripts/docker-compose.sh run --rm -e BASE_PATH -e RELEASE_FLOW_V2_QUALIFICATION_SHA256 -e GITHUB_REPOSITORY -e GITHUB_RUN_ID -e GITHUB_JOB -e GITHUB_RUN_ATTEMPT -e GITHUB_SHA -e GITHUB_EVENT_NAME -e GITHUB_REF app npm run release:flow -- public-smoke --output .release-v2/public-smoke.json
          ./scripts/docker-compose.sh run --rm -e BASE_PATH -e RELEASE_FLOW_V2_QUALIFICATION_SHA256 -e GITHUB_REPOSITORY -e GITHUB_RUN_ID -e GITHUB_JOB -e GITHUB_RUN_ATTEMPT -e GITHUB_SHA -e GITHUB_EVENT_NAME -e GITHUB_REF app npm run release:flow -- public-operations --output .release-v2/public-operations.json
          ./scripts/docker-compose.sh run --rm -e BASE_PATH -e RELEASE_FLOW_V2_QUALIFICATION_SHA256 -e GITHUB_REPOSITORY -e GITHUB_RUN_ID -e GITHUB_JOB -e GITHUB_RUN_ATTEMPT -e GITHUB_SHA -e GITHUB_EVENT_NAME -e GITHUB_REF app npm run release:flow -- record-plan --output .release-v2/app-record-plan.json
      - name: Pin sanitized report bytes
        id: report_pins
        run: |
          digest="$(sha256sum .release-v2/app-record-plan.json)"
          echo "record_plan_sha256=${digest%% *}" >> "$GITHUB_OUTPUT"
          digest="$(sha256sum .release-v2/public-smoke.json)"
          echo "public_smoke_sha256=${digest%% *}" >> "$GITHUB_OUTPUT"
          digest="$(sha256sum .release-v2/public-operations.json)"
          echo "public_operations_sha256=${digest%% *}" >> "$GITHUB_OUTPUT"
      - name: Preserve exact public observation and record plan
        id: public_report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .release-v2/public-smoke.json
            .release-v2/public-operations.json
            .release-v2/app-record-plan.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Preserve unverified publication diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-observation-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release-v2/public-operation*
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Stop only publication observer
        if: always()
        run: ./scripts/docker-compose.sh down --remove-orphans

  record:
    needs: [deploy, report]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
      QUALIFICATION_SHA256: ${{ inputs.qualification_sha256 }}
      RECORD_PLAN_SHA256: ${{ needs.report.outputs.record_plan_sha256 }}
      PUBLIC_SMOKE_SHA256: ${{ needs.report.outputs.public_smoke_sha256 }}
      PUBLIC_OPERATIONS_SHA256: ${{ needs.report.outputs.public_operations_sha256 }}
    outputs:
      state: ${{ steps.write_record.outputs.state }}
      tag_name: ${{ steps.write_record.outputs.tag_name }}
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          artifact-ids: ${{ inputs.metadata_artifact_id }}
          path: .release-v2
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          artifact-ids: ${{ inputs.qualification_artifact_id }}
          path: .release-v2
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          artifact-ids: ${{ needs.report.outputs.report_artifact_id }}
          path: .release-v2
      - name: Record verified deployment without checkout or Source execution
        id: write_record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          // Reviewed workflow data boundary. No checkout, Source imports, package manager, or tag mutation.
          import {createHash} from 'node:crypto';
          import {readFile,writeFile} from 'node:fs/promises';
          const ensure=(condition,message)=>{if(!condition)throw Error(message);};
          const digest=bytes=>createHash('sha256').update(bytes).digest('hex');
          const codePoints=(a,b)=>{const x=Array.from(a,c=>c.codePointAt(0)),y=Array.from(b,c=>c.codePointAt(0));for(let i=0;i<Math.min(x.length,y.length);i++)if(x[i]!==y[i])return x[i]-y[i];return x.length-y.length;};
          const canonical=value=>Array.isArray(value)?'['+value.map(canonical).join(',')+']':value!==null&&typeof value==='object'?'{'+Object.keys(value).sort(codePoints).map(key=>JSON.stringify(key)+':'+canonical(value[key])).join(',')+'}':JSON.stringify(value);
          const hashValue=value=>digest(canonical(value));
          const read=async file=>{const bytes=await readFile(file);ensure(bytes.length<=4*1024*1024,'Oversized record metadata');return{bytes,value:JSON.parse(bytes.toString('utf8'))};};
          const pinned=async(file,expected)=>{ensure(/^[a-f0-9]{64}$/.test(expected??''),'Missing exact report pin');const result=await read(file);ensure(digest(result.bytes)===expected,'Report bytes differ');return result.value;};
          const repository=process.env.GITHUB_REPOSITORY,source=process.env.GITHUB_SHA,runId=process.env.GITHUB_RUN_ID;
          ensure(/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repository??'') && /^[a-f0-9]{40}$/.test(source??'') && /^[1-9]\d*$/.test(runId??''),'Invalid record identity');
          ensure(process.env.GITHUB_EVENT_NAME==='workflow_dispatch' && process.env.GITHUB_REF==='refs/heads/main','Wrong record context');
          const candidate=(await read('.release-v2/candidate.json')).value;
          const snapshot=(await read('.release-v2/preparation.json')).value;
          const qualification=await pinned('.release-v2/qualification.json',process.env.QUALIFICATION_SHA256);
          const prepared=await pinned('.release-v2/app-record-plan.json',process.env.RECORD_PLAN_SHA256);
          const smoke=await pinned('.release-v2/public-smoke.json',process.env.PUBLIC_SMOKE_SHA256);
          const operations=await pinned('.release-v2/public-operations.json',process.env.PUBLIC_OPERATIONS_SHA256);
          const record=prepared.record, now=Date.now();
          ensure(candidate.repository===repository && candidate.runId===runId && candidate.recipe.sourceCommit===source && candidate.artifactId===process.env.CANDIDATE_ARTIFACT_ID,'Wrong record candidate');
          ensure(qualification.status==='qualified' && qualification.candidateDigest===hashValue(candidate) && qualification.technical?.candidateDigest===hashValue(candidate) && qualification.technical.status==='technical-passed' && qualification.technical.buildAttempt===candidate.buildAttempt && Number.isFinite(Date.parse(qualification.technical.expiresAt)),'Unqualified record');
