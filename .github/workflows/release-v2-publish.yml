      - name: Preserve exact recording outcome
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: record-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: record-outcome.json
          if-no-files-found: warn
          retention-days: 90
