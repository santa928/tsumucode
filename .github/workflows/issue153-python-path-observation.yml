name: Issue 153 Python path observation

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the reviewed Source and observation only
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_REF: ${{ github.head_ref }}
          EVENT_BASE_REF: ${{ github.base_ref }}
          EVENT_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          source_sha=f723a45449a1d1b6c88f52c5c5130ce477b179af
          [[ "$EVENT_HEAD" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EVENT_BASE" == "$source_sha" ]]
          [[ "$EVENT_HEAD_REF" == codex/issue153-python-path-observation ]]
          [[ "$EVENT_BASE_REF" == codex/issue153-python-path-links ]]
          [[ "$EVENT_HEAD_REPO" == "$EVENT_REPO" ]]
          [[ "$(git rev-parse HEAD)" == "$EVENT_HEAD" ]]
          [[ "$(git rev-list --parents -n 1 HEAD)" == "$EVENT_HEAD c93d6fba4791ab0524f2e5f94bcb379760be9e4a $source_sha" ]]
          [[ "$(git diff --name-status --no-renames "$source_sha" HEAD)" == $'A\t.github/workflows/issue153-python-path-observation.yml' ]]
          git checkout --detach "$source_sha"
          [[ "$(git rev-parse HEAD)" == "$source_sha" ]]
          [[ -z "$(git status --porcelain)" ]]
      - name: Build the existing browser image
        run: docker build --target app --tag tsumucode-issue153-python-path .
      - name: Build the same-Source static preview
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: >-
          docker run --rm --cpus 2 --memory 4g --memory-swap 4g
          --pids-limit 512 --shm-size 512m
          --env BASE_PATH --env CI=true --env NODE_OPTIONS=--max-old-space-size=3072
          --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace"
          --mount type=volume,target=/workspace/node_modules
          tsumucode-issue153-python-path sh -c 'npm run content:compile && npm run build:app'
      - name: Observe the Python Path links
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: >-
          docker run --rm --cpus 2 --memory 4g --memory-swap 4g
          --pids-limit 512 --shm-size 512m
          --env BASE_PATH --env CI=true --env NODE_OPTIONS=--max-old-space-size=3072
          --env TSUMUCODE_RELEASE_V2=1
          --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace"
          --mount type=volume,target=/workspace/node_modules
          tsumucode-issue153-python-path node node_modules/@playwright/test/cli.js test
          --config=playwright.authoring.config.ts tests/e2e/python-release-smoke.spec.ts
          --project=chromium --project=firefox --project=webkit --grep 'Python Pathの3コース' --workers=1 --retries=0 --reporter=list
