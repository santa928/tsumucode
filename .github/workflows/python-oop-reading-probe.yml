name: Fixed Python OOP reading probe

on:
  pull_request:
    branches: [codex/issue152-combined-fixed-ci]
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  oop_reading:
    if: >-
      ${{ github.event.pull_request.draft == true &&
          github.repository == 'santa928/tsumucode' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'codex/verify-oop-reading-8fda' &&
          github.event.pull_request.base.sha == '75ec2e5a7df2faa3b566d58d34507e6788faea86' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      BASE_PATH: /tsumucode/
    steps:
      - name: Check out the bounded probe
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 75ec2e5a7df2faa3b566d58d34507e6788faea86
          path: fixed-candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Bind both source trees
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$EXPECTED_HEAD" in *[!0-9a-f]*|'') exit 1;; esac
          test "${#EXPECTED_HEAD}" = 40
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-list --parents -n 1 HEAD | wc -w | tr -d ' ')" = 3
          test "$(git rev-parse HEAD^1)" = e9d10ab49bca63fd1a7d3917ef5a1a953b1b172c
          test "$(git rev-parse HEAD^2)" = 75ec2e5a7df2faa3b566d58d34507e6788faea86
          test "$(git rev-parse HEAD^1^)" = 25272d3ad485a5c96f37ff36c462ab8d95a1bde3
          test "$(git rev-parse HEAD^2^)" = 8fdaeb61205ba8fad334af16886a725b49c50fde
          expected_paths=$(printf '%s\n' \
            '.github/workflows/python-oop-reading-probe.yml' \
            'tests/local/oop-reading-probe/check-dependencies.cjs' \
            'tests/local/oop-reading-probe/check-dependencies.node-test.cjs' \
            'tests/local/oop-reading-probe/check-dist.py' \
            'tests/local/oop-reading-probe/check-report.py' \
            'tests/local/oop-reading-probe/oop-horizontal.config.ts' \
            'tests/local/oop-reading-probe/oop-horizontal.spec.ts' \
            'tests/local/oop-reading-probe/volume-lifecycle.sh' \
            'tests/local/oop-reading-probe/volume-lifecycle.test.py')
          test "$(git diff --no-renames --name-only HEAD^2 HEAD)" = "$expected_paths"
          test "$(git -C fixed-candidate rev-parse HEAD)" = 75ec2e5a7df2faa3b566d58d34507e6788faea86
          test "$(git -C fixed-candidate rev-parse 'HEAD^{tree}')" = afe7e225ac61cfddf6090b03fb4b01a483899fe1
          test -z "$(git -C fixed-candidate status --porcelain --untracked-files=normal)"
      - name: Build the existing fixed Node and Browser image
        run: |
          set -euo pipefail
          log=$(mktemp "$RUNNER_TEMP/oop-image.XXXXXX")
          trap 'rm -f "$log"' EXIT
          if docker build --target app --tag oop-reading-probe fixed-candidate >"$log" 2>&1; then
            echo 'fixed-image=passed'
          else
            echo 'fixed-image=failed'
            exit 1
          fi
          if printf '%s\n' 'FROM oop-reading-probe' \
            'RUN test -d /workspace/node_modules && test ! -L /workspace/node_modules && test ! -e /workspace/node_modules/.vite-temp && test ! -L /workspace/node_modules/.vite-temp && mkdir -m 0755 /workspace/node_modules/.vite-temp' \
            | docker build --network none --tag oop-reading-probe-scratch - >"$log" 2>&1; then
            echo 'scratch-image=passed'
          else
            echo 'scratch-image=failed'
            exit 1
          fi
      - name: Verify volume ownership and dependency guards
        run: |
          set -euo pipefail
          log=$(mktemp "$RUNNER_TEMP/oop-guard.XXXXXX")
          trap 'rm -f "$log"' EXIT
          if ! python3 tests/local/oop-reading-probe/volume-lifecycle.test.py >"$log" 2>&1; then
            echo 'volume-guard-tests=failed'
            exit 1
          fi
          echo 'volume-guard-tests=passed'
          if docker run --rm --network none --read-only --user "$(id -u):$(id -g)" --cpus 1 --memory 512m --pids-limit 128 \
            --cap-drop ALL --security-opt no-new-privileges:true --env HOME=/tmp \
            --tmpfs "/tmp:rw,nosuid,nodev,size=64m,mode=1777,uid=$(id -u),gid=$(id -g)" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/tests/local/oop-reading-probe,target=/probe,readonly" \
            --entrypoint node oop-reading-probe --test /probe/check-dependencies.node-test.cjs >"$log" 2>&1; then
            echo 'dependency-guard-tests=passed'
          else
            echo 'dependency-guard-tests=failed'
            exit 1
          fi
      - name: Rebuild and match every existing preview byte
        run: |
          set -euo pipefail
          log=$(mktemp "$RUNNER_TEMP/oop-build.XXXXXX")
          trap 'rm -f "$log"' EXIT
          if docker run --rm --network none --user "$(id -u):$(id -g)" --cpus 2 --memory 4g --memory-swap 4g \
            --pids-limit 512 --shm-size 512m --env BASE_PATH --env CI=true \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --env HOME=/tmp --env NODE_OPTIONS=--max-old-space-size=3072 \
            --tmpfs "/workspace/node_modules/.vite-temp:rw,nosuid,nodev,size=64m,uid=$(id -u),gid=$(id -g)" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/fixed-candidate,target=/workspace" \
            --mount type=volume,target=/workspace/node_modules \
            oop-reading-probe npm run build >"$log" 2>&1; then
            echo 'candidate-build=passed'
          else
            echo 'candidate-build=failed'
            exit 1
          fi
          cd fixed-candidate
          python3 ../tests/local/oop-reading-probe/check-dist.py
      - name: Execute existing 34-slide reading checks and one horizontal scroll observation
        run: |
          set -euo pipefail
          mkdir -p fixed-candidate/tests/local/oop-reading-probe fixed-candidate/test-results probe-results
          log=$(mktemp "$RUNNER_TEMP/oop-browser.XXXXXX")
          source tests/local/oop-reading-probe/volume-lifecycle.sh
          container=''
          cleanup() {
            code=$?
            trap - EXIT
            if [ -n "$container" ] && ! docker rm -v "$container" >/dev/null 2>&1; then
              echo 'container-cleanup=failed'; code=1
            fi
            if ! probe_volume_cleanup; then code=1; fi
            rm -f "$log"
            exit "$code"
          }
          trap cleanup EXIT
          if ! expected=$(docker run --rm --network none --read-only --user "$(id -u):$(id -g)" --cpus 1 --memory 512m --pids-limit 128 \
            --cap-drop ALL --security-opt no-new-privileges:true --env HOME=/tmp \
            --mount "type=bind,source=$GITHUB_WORKSPACE/tests/local/oop-reading-probe,target=/probe,readonly" \
            --entrypoint node oop-reading-probe /probe/check-dependencies.cjs capture 2>"$log"); then
            echo 'image-dependencies=failed'; exit 1
          fi
          case "$expected" in *[!0-9a-f]*|'') echo 'image-dependencies=invalid'; exit 1;; esac
          test "${#expected}" = 64
          if ! derived=$(docker run --rm --network none --read-only --user "$(id -u):$(id -g)" --cpus 1 --memory 512m --pids-limit 128 \
            --cap-drop ALL --security-opt no-new-privileges:true --env HOME=/tmp \
            --mount "type=bind,source=$GITHUB_WORKSPACE/tests/local/oop-reading-probe,target=/probe,readonly" \
            --entrypoint node oop-reading-probe-scratch /probe/check-dependencies.cjs capture 2>"$log"); then
            echo 'scratch-image-dependencies=failed'; exit 1
          fi
          if [ "$derived" != "$expected" ]; then echo 'scratch-image-dependencies=mismatch'; exit 1; fi
          echo 'scratch-image-dependencies=matched'
          probe_volume_create
          for item in fixed probe results; do
            case "$item" in
              fixed) source_dir="$GITHUB_WORKSPACE/fixed-candidate" ;;
              probe) source_dir="$GITHUB_WORKSPACE/tests/local/oop-reading-probe" ;;
              results) source_dir="$GITHUB_WORKSPACE/probe-results" ;;
            esac
            if [ -d "$source_dir" ] && [ ! -L "$source_dir" ]; then
              echo "mount-source-$item=present"
            else
              echo "mount-source-$item=missing"
              exit 1
            fi
          done
          if [ -d fixed-candidate/node_modules ]; then
            echo 'node-modules-target=present'
          else
            echo 'node-modules-target=absent'
          fi
          mounts=(
            --tmpfs "/tmp:rw,nosuid,nodev,size=256m,uid=$(id -u),gid=$(id -g)"
            --tmpfs "/workspace/node_modules/.vite-temp:rw,nosuid,nodev,size=64m,uid=$(id -u),gid=$(id -g)"
            --mount "type=bind,source=$GITHUB_WORKSPACE/fixed-candidate,target=/workspace,readonly"
            --mount "type=bind,source=$GITHUB_WORKSPACE/tests/local/oop-reading-probe,target=/workspace/tests/local/oop-reading-probe,readonly"
            --mount "type=bind,source=$GITHUB_WORKSPACE/probe-results,target=/workspace/test-results"
            --mount "type=volume,source=$probe_volume_name,target=/workspace/node_modules,readonly"
          )
          if container=$(docker create --rm --network none --read-only --user "$(id -u):$(id -g)" --cpus 2 --memory 4g --memory-swap 4g \
            --pids-limit 512 --shm-size 512m --env BASE_PATH --env CI=true \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --env HOME=/tmp --env NODE_OPTIONS=--max-old-space-size=3072 --env "OOP_DEPENDENCY_DIGEST=$expected" \
            "${mounts[@]}" oop-reading-probe-scratch sh -ec ':' 2>"$log"); then
            case "$container" in *[!0-9a-f]*|'') exit 1;; esac
            test "${#container}" = 64
            docker rm -v "$container" >/dev/null 2>&1
            container=''
            if ! probe_volume_verify; then echo 'volume-ownership=unverified'; exit 1; fi
            echo 'mount-preflight=passed'
            : >"$log"
          else
            python3 tests/local/oop-reading-probe/check-report.py 1 "$log"
            exit 1
          fi
          if docker run --rm --network none --read-only --user "$(id -u):$(id -g)" --cpus 1 --memory 512m --pids-limit 128 \
            --cap-drop ALL --security-opt no-new-privileges:true --env HOME=/tmp \
            --mount "type=bind,source=$GITHUB_WORKSPACE/tests/local/oop-reading-probe,target=/probe,readonly" \
            --mount "type=volume,source=$probe_volume_name,target=/workspace/node_modules,readonly" \
            --entrypoint bash oop-reading-probe-scratch -ec 'source /probe/volume-lifecycle.sh; probe_scratch_prepare /workspace/node_modules' >"$log" 2>&1; then
            if [ "$(cat "$log")" = scratch=preexisting ]; then echo 'scratch=preexisting'; else echo 'scratch=invalid-output'; exit 1; fi
          else
            if grep -Fxq 'scratch=parent-not-writable' "$log"; then echo 'scratch=parent-not-writable'; else echo 'scratch=initialization-failed'; fi
            exit 1
          fi
          if ! probe_volume_verify; then echo 'volume-ownership=unverified'; exit 1; fi
          : >"$log"
          result=0
          docker run --rm --network none --read-only --user "$(id -u):$(id -g)" --cpus 2 --memory 4g --memory-swap 4g \
            --pids-limit 512 --shm-size 512m --env BASE_PATH --env CI=true \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --env HOME=/tmp --env NODE_OPTIONS=--max-old-space-size=3072 --env "OOP_DEPENDENCY_DIGEST=$expected" \
            "${mounts[@]}" \
            oop-reading-probe-scratch sh -ec '
              printf "%s\n" PROBE_STAGE=container-ready;
              test "$(node --version)" = v24.18.0;
              printf "%s\n" PROBE_STAGE=dependencies;
              node tests/local/oop-reading-probe/check-dependencies.cjs verify;
              printf "%s\n" PROBE_STAGE=list-reading;
              node node_modules/@playwright/test/cli.js test --config=tests/acceptance/python-oop.config.ts --list;
              printf "%s\n" PROBE_STAGE=list-horizontal;
              node node_modules/@playwright/test/cli.js test --config=tests/local/oop-reading-probe/oop-horizontal.config.ts --list;
              printf "%s\n" PROBE_STAGE=server-start;
              node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4173 --strictPort & server=$!;
              trap "kill $server 2>/dev/null || true" EXIT;
              node --input-type=module -e '"'"'let ok=false; for(let i=0;i<100;i++){try{const r=await fetch("http://127.0.0.1:4173/tsumucode/");if(r.ok){ok=true;break}}catch{}await new Promise(r=>setTimeout(r,200))}if(!ok){process.stderr.write("server-unavailable\n");process.exit(1)}'"'"';
              printf "%s\n" PROBE_STAGE=server-ready;
              kill "$server"; wait "$server" || true; trap - EXIT;
              printf "%s\n" PROBE_STAGE=test-reading;
              node node_modules/@playwright/test/cli.js test --config=tests/acceptance/python-oop.config.ts;
              printf "%s\n" PROBE_STAGE=test-horizontal;
              node node_modules/@playwright/test/cli.js test --config=tests/local/oop-reading-probe/oop-horizontal.config.ts;
              printf "%s\n" PROBE_STAGE=complete' >"$log" 2>&1 || result=1
          python3 tests/local/oop-reading-probe/check-report.py "$result" "$log"
      - name: Preserve bounded machine test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: oop-reading-probe-75ec-${{ github.run_attempt }}
          path: bounded-oop-reading.json
          if-no-files-found: warn
          retention-days: 7
