name: Qualification direct needs validation (draft only)
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/qualification-needs-validation.yml
      - .github/workflows/qualification-needs-validation-reusable.yml
      - scripts/release/v2/qualificationNeeds.ts
      - tests/unit/release/v2/qualificationNeeds.test.ts
permissions: {}
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: 'true'
  boundary:
    uses: ./.github/workflows/qualification-needs-validation-reusable.yml
  python_fixtures:
    uses: ./.github/workflows/qualification-needs-validation-reusable.yml
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: 'true'
  public_boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: 'true'
  performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: 'true'
  validate:
    if: >-
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/qualification-direct-needs-shape' &&
      github.event.pull_request.base.sha == '45fc0e5d672fc6d3dde237c458f8dc018bc6badf'
    needs: [unit, boundary, python_fixtures, browser, public_boundary, performance]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RELEASE_V2_NEEDS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Bind candidate and build the fixed image
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          sha256sum --check <<'PINS'
          2d26afccb2fc4d21791c1e176264e9a25a7d1b11308fae5262ac1cbd115b4677  Dockerfile
          71d5e6329eb617384edf8742a64d9f8533ee5f7832d6586ac6c9150eab1967c8  .dockerignore
          15c380765bbf2e109f96275248e842b7a9649fca7efa633427ee85ab8fd19aa4  package.json
          191461e31bb2d50d9be7b6fd91e2a63e14e7eee00634461bb4bc32bac0b7f0c8  package-lock.json
          ad799a5640ebbe948a24a11c3a90a7bc94ba8b9ab261e54cca8acb8b39751458  scripts/release/v2/qualificationNeeds.ts
          b5350f9613f6d080ae72a2530b072d231bd0e8d793ae838fcb8d88eff2986c95  .github/workflows/release-v2-checks.yml
          e147d71028cd6854e8d3413f4d67acf22ecbac0a2ae4a047c13a824333f0a96b  tests/unit/release/v2/qualificationNeeds.test.ts
          PINS
          docker build --target development --tag qualification-needs-validation .
      - name: Validate actual GitHub direct-needs serialization
        run: |
          set -eu
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 65532:65532 \
            --pids-limit 128 --memory 512m --cpus 1 \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m,mode=1777 \
            -e RELEASE_V2_NEEDS qualification-needs-validation \
            node --import tsx --input-type=module -e '
              import { parseQualificationNeeds } from "./scripts/release/v2/qualificationNeeds.ts";
              if (process.versions.node !== "24.18.0") throw Error("Wrong Node version");
              const needs = parseQualificationNeeds(process.env.RELEASE_V2_NEEDS);
              if (Object.keys(needs).length !== 6 || Object.values(needs).some((value) => value !== "success")) throw Error("Invalid direct needs");
              console.log("GitHub direct-needs shape accepted; no release authorization granted");
            '
