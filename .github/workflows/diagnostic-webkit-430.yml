name: One-shot WebKit diagnosis for PR 430
on:
  pull_request:
    types: [synchronize]
permissions: {}
jobs:
  diagnose:
    if: github.run_attempt == 1 && github.event.pull_request.number == 430 && github.event.pull_request.draft == true && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/webkit-busy-diagnostic' && github.base_ref == 'main' && github.event.pull_request.base.sha == 'ec53fcc85ab3e63242afe3921eb0f4b022bd8a15'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      BASE_PATH: /tsumucode/
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Bind one diagnostic commit to the reviewed head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = '6344cd5a84d958e830cbfb8e0a4eb26102541a2c'
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = '.github/workflows/diagnostic-webkit-430.yml'
      - name: Build fixed verification image
        run: ./scripts/docker-compose.sh build app
      - name: Build and select two synthetic lessons (not release evidence)
        run: |
          ./scripts/docker-compose.sh run --rm -e BASE_PATH app npm run build
          cat > diagnostic-prepare.mjs <<'NODE'
          import { mkdir, writeFile } from 'node:fs/promises';
          import { compileCourse } from './scripts/content/compileCourse.ts';
          import { buildInventory } from './scripts/release/v2/inventory.ts';
          import { PlanSchema } from './scripts/release/v2/schema.ts';
          const inventory = buildInventory([await compileCourse('content/python-practice')]);
          const lessonIds = ['python-practice-ch02-l01', 'python-practice-ch03-l01'];
          if (lessonIds.some(id => !inventory.courses[0].lessons.some(l => l.id === id))) throw Error('Missing lesson');
          const plan = PlanSchema.parse({schemaVersion:1,inventoryDigest:'0'.repeat(64),parent:null,publishedCourses:['python-practice'],targets:lessonIds.map(lessonId=>({key:'diagnostic/'+lessonId,kind:'learning-engine',engine:'webkit',courseId:'python-practice',lessonId,inputDigest:'0'.repeat(64)}))});
          await mkdir('.release-v2',{recursive:true});
          await writeFile('.release-v2/preparation.json',JSON.stringify({inventory,plan}),{mode:0o600});
          NODE
          ./scripts/docker-compose.sh run --rm app node --import tsx diagnostic-prepare.mjs
      - name: Execute exactly two WebKit cases once
        id: webkit
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: /workspace/.release-v2/diagnostic-report.json
          TSUMUCODE_RELEASE_V2: '1'
        run: >-
          ./scripts/docker-compose.sh run --rm -e BASE_PATH -e PLAYWRIGHT_JSON_OUTPUT_FILE -e TSUMUCODE_RELEASE_V2
          app node node_modules/@playwright/test/cli.js test tests/e2e/manifest-learning.spec.ts
          --config=playwright.qualification.config.ts --project=webkit
          '--grep=python-practice/python-practice-ch0[23]-l01 actual learning UI'
          --workers=1 --retries=0 --reporter=json
      - name: Emit only fixed diagnostic states
        if: always() && (steps.webkit.outcome == 'success' || steps.webkit.outcome == 'failure')
        run: |
          cat > diagnostic-summary.mjs <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          try {
          const report = JSON.parse(await readFile('.release-v2/diagnostic-report.json','utf8'));
          const titles=['python-practice/python-practice-ch02-l01 actual learning UI','python-practice/python-practice-ch03-l01 actual learning UI'];
          const tests=[];
          const pick=(v,allowed)=>allowed.includes(v)?v:null;
          const count=v=>Number.isInteger(v)&&v>=0&&v<=20?v:null;
          function visit(s) {
           for (const spec of s.specs??[]) if(titles.includes(spec.title)) for(const t of spec.tests??[]) {
            const annotations=(t.annotations??[]).filter(a=>a.type==='manifest-learning-diagnostic');
            if(annotations.length>1) throw Error('Duplicate annotation');
            const d=annotations.length?JSON.parse(annotations[0].description):null;
            tests.push({lesson:spec.title===titles[0]?'ch02':'ch03',status:pick(t.status,['expected','unexpected','flaky','skipped']),diagnostic:d?{
             phase:pick(d.phase,['setup','opening','writing-starter','writing-solution','history-before','history','click','feedback','saved-files']),round:count(d.round),beforeCapped:count(d.beforeCapped),afterCapped:count(d.afterCapped),grew:pick(d.grew,[true,false]),status:pick(d.status,['pass','incomplete','code-error','other']),ui:d.ui?{
              grade:pick(d.ui.grade,['ready-label','validating','waiting-lease','missing','other']),gradeDisabled:pick(d.ui.gradeDisabled,[true,false]),preview:pick(d.ui.preview,['ready-label','updating','preparing','waiting-lease','needs-prepare','unrecognized-or-missing','other']),operationError:pick(d.ui.operationError,[true,false])
             }:null
            }:null});
           }
           for(const child of s.suites??[]) visit(child);
          }
          for(const s of report.suites??[]) visit(s);
          if(tests.length!==2||new Set(tests.map(t=>t.lesson)).size!==2||tests.some(t=>t.status===null)) throw Error('Selection mismatch');
          await writeFile('.release-v2/diagnostic-summary.json',JSON.stringify({scope:'synthetic-webkit-diagnostic-only',tests}),{mode:0o644});
          } catch { process.stderr.write('Diagnostic report unavailable or invalid\n'); process.exitCode=1; }
          NODE
          ./scripts/docker-compose.sh run --rm app node diagnostic-summary.mjs
      - name: Preserve sanitized summary only
        if: always() && (steps.webkit.outcome == 'success' || steps.webkit.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: webkit-430-diagnostic-${{ github.run_id }}
          path: .release-v2/diagnostic-summary.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Stop only this diagnostic stack
        if: always()
        run: ./scripts/docker-compose.sh down --remove-orphans
