name: TsumuCode Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      migration_checks:
        description: 新フローの候補buildと同run成果物を検証する（配信なし・main限定）
        type: boolean
        required: true
        default: false
      deploy:
        description: main限定の保護Environmentを経由し検証済みArtifactを公開する
        type: boolean
        required: true
        default: false
      release_mode:
        description: 最新mainの正式候補（β・旧版への復旧はこの入口では未対応）
        type: choice
        options: [candidate]
        required: true
        default: candidate
      course_id:
        description: 旧入口との互換用。新方式は教材一覧から全対象を自動選択する
        type: string
        required: false
        default: ''
      source_sha:
        description: 空欄または現在mainの40文字SHAのみ。過去の候補へは配信しない
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true && 'release' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy != true }}

jobs:
  resolve:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      course_id: ${{ steps.target.outputs.course_id || 'html-css' }}
      draft_source_commit: ${{ steps.target.outputs.draft_source_commit || 'draft' }}
      draft_dist_hash: ${{ steps.target.outputs.draft_canonical_dist_sha256 || 'draft' }}
      learning_input_hash: ${{ steps.target.outputs.normalized_learning_input_sha256 || 'draft' }}
      checkout_sha: ${{ steps.target.outputs.checkout_sha || steps.default_target.outputs.checkout_sha }}
      verified_source_commit: ${{ steps.target.outputs.verified_source_commit || steps.default_target.outputs.verified_source_commit }}
      release_mode: ${{ steps.target.outputs.release_mode || 'quality-only' }}
      revision: ${{ steps.target.outputs.revision || '' }}
      expected_dist_hash: ${{ steps.target.outputs.canonical_dist_sha256 || '' }}
      expected_course_hash: ${{ steps.target.outputs.course_manifest_sha256 || '' }}
      expected_provenance_hash: ${{ steps.target.outputs.public_provenance_sha256 || '' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject mixed migration and deploy modes
        if: github.event_name == 'workflow_dispatch' && inputs.migration_checks == true && inputs.deploy == true
        run: exit 1
      - name: Reject migration outside main
        if: github.event_name == 'workflow_dispatch' && inputs.migration_checks == true && github.ref != 'refs/heads/main'
        run: exit 1
      - name: Reject deploy dispatch outside main
        if: github.event_name == 'workflow_dispatch' && inputs.deploy == true && github.ref != 'refs/heads/main'
        run: exit 1
      - name: Reject unsupported publication inputs
        if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
        env:
          RELEASE_MODE: ${{ inputs.release_mode }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          if [ "$RELEASE_MODE" != candidate ] || { [ -n "$SOURCE_SHA" ] && [ "$SOURCE_SHA" != "$EVENT_SHA" ]; }; then
            echo '::error::新しい公開入口は最新mainのcandidateだけを受け付けます。'
            exit 1
          fi
      - name: Bind the event SHA for checks and publication
        id: default_target
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          echo "checkout_sha=$EVENT_SHA" >> "$GITHUB_OUTPUT"
          echo "verified_source_commit=$EVENT_SHA" >> "$GITHUB_OUTPUT"
      - name: Build release verifier
        if: ${{ false }}
        run: ./scripts/docker-compose.sh build app
      - name: Compile selected candidate content for source review
        if: ${{ false }}
        run: ./scripts/docker-compose.sh run --rm app npm run content:compile
      - name: Resolve candidate, beta, or registered rollback
        if: ${{ false }}
        env:
          RELEASE_MODE: ${{ inputs.release_mode }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          WORKFLOW_HEAD_SHA: ${{ github.sha }}
          RELEASE_COURSE_ID: ${{ inputs.course_id }}
        run: >-
          ./scripts/docker-compose.sh run --rm app npm run release:target --
          --mode "$RELEASE_MODE"
          --source-sha "$SOURCE_SHA"
          --workflow-head-sha "$WORKFLOW_HEAD_SHA"
          --course-id "$RELEASE_COURSE_ID"
          --github-output /workspace/.release-target
      - name: Export resolved target
        if: ${{ false }}
        id: target
        run: sed -n '1,30p' .release-target >> "$GITHUB_OUTPUT"

  fast:
    if: (github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.deploy != true)) && inputs.migration_checks != true
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 30 || 15 }}
    env:
      TSUMUCODE_DOCKER_TARGET: development
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.checkout_sha }}
      - name: Build Docker image
        run: ./scripts/docker-compose.sh build app
      - name: Content provenance
        run: ./scripts/docker-compose.sh run --rm app npm run content:provenance
      - name: Fast quality
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          TEST_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
          CHECK_SCRIPT: ${{ github.event_name == 'pull_request' && 'check:ci' || 'check' }}
        run: ./scripts/docker-compose.sh run --rm -e BASE_PATH -e TEST_BASE_SHA app npm run "$CHECK_SCRIPT"
      - name: Bind the static preview to its checkout
        run: git rev-parse HEAD 'HEAD^{tree}' > static-preview-identity.txt
      - name: Preserve static preview for independent UI review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: static-preview-${{ needs.resolve.outputs.checkout_sha }}
          path: |
            dist
            static-preview-identity.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Content review status
        id: content_review
        continue-on-error: true
        run: ./scripts/docker-compose.sh run --rm app npm run content:review
      - name: Report pending content review
        if: steps.content_review.outcome == 'failure'
        run: |
          echo "::warning::教材レビューの確認が必要です。動作検証とは別の結果で、公開前には必須です。Content review statusのログを確認してください。"
          echo "教材レビュー: 要確認。通常CIの成功は教材承認を意味しません。公開前のcheck:releaseは未承認・hash不一致で停止します。" >> "$GITHUB_STEP_SUMMARY"

  # Both read-only admission and explicit publication freeze one candidate in this run.
  build:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && ((inputs.migration_checks == true && inputs.deploy != true) || (inputs.migration_checks != true && inputs.deploy == true && inputs.release_mode == 'candidate'))
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      BASE_PATH: /${{ github.event.repository.name }}/
      TSUMUCODE_TEST_MAX_WORKERS: '1'
    outputs:
      candidate_artifact_id: ${{ steps.candidate_files.outputs['artifact-id'] }}
      candidate_archive_digest: ${{ steps.candidate_files.outputs['artifact-digest'] }}
      metadata_artifact_id: ${{ steps.candidate_metadata.outputs['artifact-id'] }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build fixed verification image
        run: ./scripts/docker-compose.sh build app
      - name: Capture actual deployed parent and compile the single delivery tree
        env:
          SITE_URL: https://santa928.github.io/tsumucode/
        run: |
          ./scripts/docker-compose.sh run --rm app npm run release:flow -- baseline --repository "$GITHUB_REPOSITORY" --site-url "$SITE_URL" --output .release-v2/baseline.json
          ./scripts/docker-compose.sh run --rm app npm run release:flow -- prepare --baseline .release-v2/baseline.json --output .release-v2/preparation.json
          ./scripts/docker-compose.sh run --rm app npm run release:flow -- stage-content --output .release-v2/content-receipts.json
      - name: Build public app once
        run: ./scripts/docker-compose.sh run --rm -e BASE_PATH app npm run build:app
      - name: Check actual public bytes and early budgets
        run: |
          ./scripts/docker-compose.sh run --rm app npm run release:flow -- static --snapshot .release-v2/preparation.json --output .release-v2/static.json
      - name: Freeze required checks for the same candidate
        run: |
          ./scripts/docker-compose.sh run --rm -e BASE_PATH app npm run release:flow -- freeze --snapshot .release-v2/preparation.json --baseline .release-v2/baseline.json --output .release-v2/execution-plan.json
      - name: Preserve exact candidate files
        id: candidate_files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Bind uploaded candidate to frozen checks
        env:
          ARTIFACT_ID: ${{ steps.candidate_files.outputs['artifact-id'] }}
        run: >-
          ./scripts/docker-compose.sh run --rm -e BASE_PATH -e GITHUB_REPOSITORY -e GITHUB_RUN_ID
          -e GITHUB_JOB -e GITHUB_RUN_ATTEMPT -e GITHUB_SHA -e GITHUB_EVENT_NAME -e GITHUB_REF
          app npm run release:flow -- candidate --snapshot .release-v2/preparation.json
          --baseline .release-v2/baseline.json --execution-plan .release-v2/execution-plan.json
          --artifact-id "$ARTIFACT_ID" --output .release-v2/candidate.json
      - name: Execute artifact preflight against the frozen candidate
        run: >-
          ./scripts/docker-compose.sh run --rm -e BASE_PATH -e GITHUB_REPOSITORY -e GITHUB_RUN_ID
          -e GITHUB_JOB -e GITHUB_RUN_ATTEMPT -e GITHUB_SHA -e GITHUB_EVENT_NAME -e GITHUB_REF
          app npm run release:flow -- run-suite --suite artifact-preflight
          --output .release-v2/receipts/artifact-preflight-${{ github.run_attempt }}.json
      - name: Preserve immutable candidate metadata
        id: candidate_metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release-v2
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Report migration checkpoint
        run: echo '公開候補を一度buildし対象・同run成果物を凍結しました。続いて必須品質検査を実行します。' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve migration failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: migration-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release-v2
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Stop only candidate tool containers
        if: always()
        run: ./scripts/docker-compose.sh down --remove-orphans

  qualification:
    needs: build
    uses: ./.github/workflows/release-v2-checks.yml
    permissions:
      contents: read
    with:
      candidate_artifact_id: ${{ needs.build.outputs.candidate_artifact_id }}
      metadata_artifact_id: ${{ needs.build.outputs.metadata_artifact_id }}

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy == true && inputs.migration_checks != true && inputs.release_mode == 'candidate'
    needs: [build, qualification]
    uses: ./.github/workflows/release-v2-publish.yml
    # The reusable workflow narrows these existing capabilities per job:
    # Source observer is read-only; deployment and immutable record writer execute no Source.
    permissions:
      contents: write
      pages: write
      id-token: write
    with:
      candidate_artifact_id: ${{ needs.build.outputs.candidate_artifact_id }}
      metadata_artifact_id: ${{ needs.build.outputs.metadata_artifact_id }}
      qualification_artifact_id: ${{ needs.qualification.outputs.qualification_artifact_id }}
      qualification_sha256: ${{ needs.qualification.outputs.qualification_sha256 }}

  # Keep legacy job bodies suspended until representative publication and recovery are proven.
  quality:
    if: ${{ false }}
    needs: resolve
    runs-on: ubuntu-24.04
    env:
      RELEASE_COURSE_ID: ${{ needs.resolve.outputs.course_id }}
    permissions:
      contents: read
      pages: read
    outputs:
      artifact_digest: ${{ steps.artifact_hash.outputs.artifact_digest }}
      course_hash: ${{ steps.artifact_hash.outputs.course_hash }}
      provenance_hash: ${{ steps.artifact_hash.outputs.provenance_hash }}
      verified_source_commit: ${{ needs.resolve.outputs.verified_source_commit }}
      quality_evidence_artifact_id: ${{ steps.quality_evidence.outputs['artifact-id'] }}
      quality_evidence_digest: ${{ steps.quality_evidence.outputs['artifact-digest'] }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.checkout_sha }}
      - name: Build Docker image
        run: ./scripts/docker-compose.sh build app
      - name: Confirm candidate Product tree is unchanged
        if: needs.resolve.outputs.release_mode == 'candidate'
        env:
          VERIFIED_SOURCE_COMMIT: ${{ needs.resolve.outputs.verified_source_commit }}
          RELEASE_REVISION: ${{ needs.resolve.outputs.revision }}
        run: >-
          ./scripts/docker-compose.sh run --rm app npm run release:approval --
          --product-only --verified-source-sha "$VERIFIED_SOURCE_COMMIT"
          --course-id "$RELEASE_COURSE_ID" --revision "$RELEASE_REVISION"
      - name: Content provenance
        run: ./scripts/docker-compose.sh run --rm app npm run content:provenance
      - name: Release quality
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: ./scripts/docker-compose.sh run --rm -e BASE_PATH app npm run check:release
      - name: Bundle artifact preflight
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: ./scripts/docker-compose.sh run --rm -e BASE_PATH app npm run test:bundle
      - name: Static artifact gate
        run: ./scripts/docker-compose.sh run --rm app npm run release:check -- --course-id "$RELEASE_COURSE_ID"
      - name: Release continuity for deploy candidate
        if: needs.resolve.outputs.release_mode == 'candidate'
        run: ./scripts/docker-compose.sh run --rm app npm run release:continuity -- --course-id "$RELEASE_COURSE_ID"
      - name: Release continuity for beta deploy
        if: needs.resolve.outputs.release_mode == 'beta'
        run: ./scripts/docker-compose.sh run --rm app npm run release:continuity -- --quality-only --course-id "$RELEASE_COURSE_ID"
      - name: Keep existing HTML continuity in the all-site gate
        if: needs.resolve.outputs.course_id != 'html-css' && needs.resolve.outputs.release_mode != 'rollback'
        run: ./scripts/docker-compose.sh run --rm app npm run release:continuity -- --quality-only --course-id html-css
      - name: Keep existing JavaScript continuity in the all-site gate
        if: (needs.resolve.outputs.course_id == 'typescript' || needs.resolve.outputs.course_id == 'react' || needs.resolve.outputs.course_id == 'next' || needs.resolve.outputs.course_id == 'python-basics' || needs.resolve.outputs.course_id == 'tailwind') && needs.resolve.outputs.release_mode != 'rollback'
        run: ./scripts/docker-compose.sh run --rm app npm run release:continuity -- --quality-only --course-id javascript
      - name: Keep existing TypeScript continuity in the all-site gate
        if: (needs.resolve.outputs.course_id == 'react' || needs.resolve.outputs.course_id == 'next' || needs.resolve.outputs.course_id == 'python-basics' || needs.resolve.outputs.course_id == 'tailwind') && needs.resolve.outputs.release_mode != 'rollback'
        run: ./scripts/docker-compose.sh run --rm app npm run release:continuity -- --quality-only --course-id typescript
      - name: Keep existing React continuity in the all-site gate
        if: (needs.resolve.outputs.course_id == 'next' || needs.resolve.outputs.course_id == 'python-basics' || needs.resolve.outputs.course_id == 'tailwind') && needs.resolve.outputs.release_mode != 'rollback'
        run: ./scripts/docker-compose.sh run --rm app npm run release:continuity -- --quality-only --course-id react
      - name: Keep existing Next continuity in the all-site gate
        if: (needs.resolve.outputs.course_id == 'python-basics' || needs.resolve.outputs.course_id == 'tailwind') && needs.resolve.outputs.release_mode != 'rollback'
        run: ./scripts/docker-compose.sh run --rm app npm run release:continuity -- --quality-only --course-id next
      - name: Verify existing Python course continuity
        if: needs.resolve.outputs.course_id == 'tailwind' && needs.resolve.outputs.release_mode != 'rollback'
        run: ./scripts/docker-compose.sh run --rm app npm run release:continuity -- --quality-only --course-id python-basics
      - name: Confirm exact Next native CI before publication
        if: (needs.resolve.outputs.course_id == 'next' || needs.resolve.outputs.course_id == 'python-basics' || needs.resolve.outputs.course_id == 'tailwind') && needs.resolve.outputs.release_mode == 'candidate'
        env:
          WORKFLOW_HEAD_SHA: ${{ github.sha }}
        run: >-
          ./scripts/docker-compose.sh run --rm app node scripts/release/verifyNextNativeCi.mjs
          --source-sha "$WORKFLOW_HEAD_SHA" --output /workspace/.release-next-native-gate.json
      - name: Confirm rollback checkout
        if: needs.resolve.outputs.release_mode == 'rollback'
        env:
          VERIFIED_SOURCE_COMMIT: ${{ needs.resolve.outputs.verified_source_commit }}
        run: test "$(git rev-parse HEAD)" = "$VERIFIED_SOURCE_COMMIT"
      # 全3browserの網羅を保ち、1workerの直列実行を2工程へ分ける。
      # E2E全体の最大枠は120分から240分となるが、各testの期限と失敗条件は変えない。
      - name: Chromium full
        id: browser_chromium
        timeout-minutes: 120
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          PLAYWRIGHT_BLOB_OUTPUT_FILE: /workspace/test-results/e2e-blobs/chromium/report.zip
        run: >-
          ./scripts/docker-compose.sh run --rm -e BASE_PATH -e PLAYWRIGHT_BLOB_OUTPUT_FILE
          app npm run test:e2e -- --project=chromium --workers=1 --reporter=list,blob
          --output=test-results/e2e-artifacts/chromium
      - name: Firefox and WebKit smoke
        id: browser_smoke
        timeout-minutes: 120
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          PLAYWRIGHT_BLOB_OUTPUT_FILE: /workspace/test-results/e2e-blobs/smoke/report.zip
        run: >-
          ./scripts/docker-compose.sh run --rm -e BASE_PATH -e PLAYWRIGHT_BLOB_OUTPUT_FILE
          app npm run test:e2e -- --project=firefox --project=webkit --workers=1 --reporter=list,blob
          --output=test-results/e2e-artifacts/smoke
      - name: Merge full and smoke browser evidence
        if: always() && (steps.browser_chromium.outcome != 'skipped' || steps.browser_smoke.outcome != 'skipped')
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          CHROMIUM_OUTCOME: ${{ steps.browser_chromium.outcome }}
          SMOKE_OUTCOME: ${{ steps.browser_smoke.outcome }}
        run: |
          set -euo pipefail
          ./scripts/docker-compose.sh run --rm -e BASE_PATH -e CHROMIUM_OUTCOME -e SMOKE_OUTCOME app \
            bash -euo pipefail -c '
              if [ "$CHROMIUM_OUTCOME" = success ] && [ "$SMOKE_OUTCOME" = success ]; then
                test -s test-results/e2e-blobs/chromium/report.zip
                test -s test-results/e2e-blobs/smoke/report.zip
              fi
              mkdir -p test-results/e2e-blobs/merge
              for group in chromium smoke; do
                if [ -s "test-results/e2e-blobs/$group/report.zip" ]; then
                  cp "test-results/e2e-blobs/$group/report.zip" "test-results/e2e-blobs/merge/$group.zip"
                fi
              done
              node node_modules/playwright/cli.js merge-reports \
                --config=playwright.config.ts test-results/e2e-blobs/merge
            '
      - name: Performance budgets
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: ./scripts/docker-compose.sh run --rm -e BASE_PATH app npm run test:performance:browser
      - name: Lighthouse budgets
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: ./scripts/docker-compose.sh run --rm -e BASE_PATH app npm run test:lighthouse
      - name: Record artifact hashes
        run: >-
          ./scripts/docker-compose.sh run --rm app npm run release:report --
          --hash-only
          --course-id "$RELEASE_COURSE_ID"
          --github-output /workspace/.release-hashes
      - name: Export artifact hash outputs
        id: artifact_hash
        run: sed -n '1,20p' .release-hashes >> "$GITHUB_OUTPUT"
      - name: Bind candidate Artifact to approval
        if: needs.resolve.outputs.release_mode == 'candidate'
        run: >-
          ./scripts/docker-compose.sh run --rm app npm run release:approval --
          --artifact
          --course-id "$RELEASE_COURSE_ID"
          --actual-output /workspace/.release-hashes
      - name: Bind rollback Artifact to release ledger
        if: needs.resolve.outputs.release_mode == 'rollback'
        env:
          EXPECTED_DIST_HASH: ${{ needs.resolve.outputs.expected_dist_hash }}
          EXPECTED_COURSE_HASH: ${{ needs.resolve.outputs.expected_course_hash }}
          EXPECTED_PROVENANCE_HASH: ${{ needs.resolve.outputs.expected_provenance_hash }}
          ACTUAL_DIST_HASH: ${{ steps.artifact_hash.outputs.artifact_digest }}
          ACTUAL_COURSE_HASH: ${{ steps.artifact_hash.outputs.course_hash }}
          ACTUAL_PROVENANCE_HASH: ${{ steps.artifact_hash.outputs.provenance_hash }}
        run: |
          test "$ACTUAL_DIST_HASH" = "$EXPECTED_DIST_HASH"
          test "$ACTUAL_COURSE_HASH" = "$EXPECTED_COURSE_HASH"
          test "$ACTUAL_PROVENANCE_HASH" = "$EXPECTED_PROVENANCE_HASH"
      - name: Write passed quality summary
        env:
          VERIFIED_SOURCE_COMMIT: ${{ needs.resolve.outputs.verified_source_commit }}
        run: >-
          ./scripts/docker-compose.sh run --rm app npm run release:report --
          --quality-summary
          --course-id "$RELEASE_COURSE_ID"
          --source-sha "$VERIFIED_SOURCE_COMMIT"
          --output /workspace/release-quality.json
      - name: Normalize quality evidence permissions
        run: >-
          ./scripts/docker-compose.sh run --rm app chmod -R a+rX
          /workspace/release-quality.json
          /workspace/playwright-report
          /workspace/playwright-performance-report
          /workspace/test-results
          /workspace/lhci-report
      - name: Verify required quality evidence
        run: |
          test -s release-quality.json
          test -n "$(find playwright-report -type f -print -quit)"
          test -n "$(find playwright-performance-report -type f -print -quit)"
          test -n "$(find test-results -type f -print -quit)"
          test -n "$(find lhci-report -type f -print -quit)"
      - name: Upload quality evidence
        id: quality_evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quality-evidence-${{ needs.resolve.outputs.verified_source_commit }}
          include-hidden-files: true
          path: |
            release-quality.json
            .release-next-native-gate.json
            playwright-report
            playwright-performance-report
            test-results
            lhci-report
          if-no-files-found: error
          retention-days: 90
      - name: Configure Pages metadata
        if: github.event_name == 'workflow_dispatch' && inputs.deploy == true && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Upload reviewed Pages artifact
        if: github.event_name == 'workflow_dispatch' && inputs.deploy == true && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist
      - name: Stop only quality job containers
        if: always()
        run: ./scripts/docker-compose.sh down --remove-orphans
      - name: Prepare failure diagnostics
        if: failure()
        run: |
          {
            git rev-parse HEAD
            git status --short
            sha256sum playwright.config.ts tests/e2e/course-fixtures.spec.ts tests/e2e/javascript-errors.spec.ts tests/e2e/visual-regression.spec.ts
          } > failure-source-identity.txt
          for directory in playwright-report playwright-performance-report test-results lhci-report; do
            if [ -d "$directory" ]; then
              sudo chmod -R a+rX "$directory"
            fi
          done
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: failure-diagnostics-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            failure-source-identity.txt
            playwright-report
            playwright-performance-report
            test-results
            lhci-report
          if-no-files-found: warn
          retention-days: 7

  deploy:
    if: ${{ false }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: [resolve, quality]
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy reviewed artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128

  report:
    if: ${{ false }}
    needs: [resolve, quality, deploy]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      report_artifact_id: ${{ steps.release_report.outputs['artifact-id'] }}
      report_artifact_digest: ${{ steps.release_report.outputs['artifact-digest'] }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Build report tool
        run: ./scripts/docker-compose.sh build app
      - name: Write immutable release report
        env:
          VERIFIED_SOURCE_COMMIT: ${{ needs.resolve.outputs.verified_source_commit }}
          WORKFLOW_HEAD_SHA: ${{ github.sha }}
          RELEASE_MODE: ${{ needs.resolve.outputs.release_mode }}
          ARTIFACT_DIGEST: ${{ needs.quality.outputs.artifact_digest }}
          COURSE_HASH: ${{ needs.quality.outputs.course_hash }}
          PROVENANCE_HASH: ${{ needs.quality.outputs.provenance_hash }}
          QUALITY_ARTIFACT_ID: ${{ needs.quality.outputs.quality_evidence_artifact_id }}
          QUALITY_ARTIFACT_DIGEST: sha256:${{ needs.quality.outputs.quality_evidence_digest }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          RELEASE_COURSE_ID: ${{ needs.resolve.outputs.course_id }}
          RELEASE_REVISION: ${{ needs.resolve.outputs.revision }}
          DRAFT_SOURCE_SHA: ${{ needs.resolve.outputs.draft_source_commit }}
          DRAFT_DIST_HASH: ${{ needs.resolve.outputs.draft_dist_hash }}
          LEARNING_INPUT_HASH: ${{ needs.resolve.outputs.learning_input_hash }}
        run: >-
          ./scripts/docker-compose.sh run --rm app npm run release:report --
          --source-sha "$VERIFIED_SOURCE_COMMIT"
          --course-id "$RELEASE_COURSE_ID"
          --revision "$RELEASE_REVISION"
          --draft-source-sha "$DRAFT_SOURCE_SHA"
          --draft-dist-hash "$DRAFT_DIST_HASH"
          --learning-input-hash "$LEARNING_INPUT_HASH"
          --workflow-head-sha "$WORKFLOW_HEAD_SHA"
          --release-mode "$RELEASE_MODE"
          --artifact-digest "$ARTIFACT_DIGEST"
          --course-hash "$COURSE_HASH"
          --provenance-hash "$PROVENANCE_HASH"
          --quality-artifact-id "$QUALITY_ARTIFACT_ID"
          --quality-artifact-digest "$QUALITY_ARTIFACT_DIGEST"
          --workflow-run-id "$WORKFLOW_RUN_ID"
          --workflow-run-attempt "$WORKFLOW_RUN_ATTEMPT"
          --page-url "$PAGE_URL"
          --output /workspace/release-report.md
      - name: Upload release report artifact
        id: release_report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-report-${{ needs.resolve.outputs.verified_source_commit }}
          path: release-report.md
          if-no-files-found: error
          retention-days: 90

  record_release:
    if: ${{ false }}
    needs: [resolve, quality, deploy, report]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create annotated release tag without checkout
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: tsumucode-release-${{ needs.resolve.outputs.revision }}
          TARGET_SHA: ${{ needs.resolve.outputs.verified_source_commit }}
          WORKFLOW_HEAD_SHA: ${{ github.sha }}
          DIST_DIGEST: ${{ needs.quality.outputs.artifact_digest }}
          COURSE_DIGEST: ${{ needs.quality.outputs.course_hash }}
          PROVENANCE_DIGEST: ${{ needs.quality.outputs.provenance_hash }}
          QUALITY_ARTIFACT_ID: ${{ needs.quality.outputs.quality_evidence_artifact_id }}
          QUALITY_ARTIFACT_DIGEST: sha256:${{ needs.quality.outputs.quality_evidence_digest }}
          REPORT_ARTIFACT_ID: ${{ needs.report.outputs.report_artifact_id }}
          REPORT_ARTIFACT_DIGEST: sha256:${{ needs.report.outputs.report_artifact_digest }}
          WORKFLOW_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          RELEASE_COURSE_ID: ${{ needs.resolve.outputs.course_id }}
          RELEASE_REVISION: ${{ needs.resolve.outputs.revision }}
          DRAFT_SOURCE_SHA: ${{ needs.resolve.outputs.draft_source_commit }}
          DRAFT_DIST_HASH: ${{ needs.resolve.outputs.draft_dist_hash }}
          LEARNING_INPUT_HASH: ${{ needs.resolve.outputs.learning_input_hash }}
        run: |
          EXPECTED_MESSAGE="source=$TARGET_SHA head=$WORKFLOW_HEAD_SHA dist=$DIST_DIGEST course=$COURSE_DIGEST provenance=$PROVENANCE_DIGEST quality_id=$QUALITY_ARTIFACT_ID quality_digest=$QUALITY_ARTIFACT_DIGEST report_id=$REPORT_ARTIFACT_ID report_digest=$REPORT_ARTIFACT_DIGEST workflow=$WORKFLOW_RUN page_url=$PAGE_URL"
          if [ "$RELEASE_COURSE_ID" != html-css ]; then
            EXPECTED_MESSAGE="course_id=$RELEASE_COURSE_ID revision=$RELEASE_REVISION draft_source=$DRAFT_SOURCE_SHA draft_dist=$DRAFT_DIST_HASH learning_input=$LEARNING_INPUT_HASH $EXPECTED_MESSAGE"
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "::error::Release tag $TAG_NAME は既に存在するため、新しいRun evidenceで成功扱いにできません"
            echo "::error::元RunのRelease Reportからpromotionしてください"
            exit 1
          fi
          jq -n --arg tag "$TAG_NAME" --arg message "$EXPECTED_MESSAGE" --arg object "$TARGET_SHA" '{tag:$tag,message:$message,object:$object,type:"commit"}' > tag-request.json
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" --input tag-request.json > tag-response.json
          jq -n --arg ref "refs/tags/$TAG_NAME" --arg sha "$(jq -r .sha tag-response.json)" '{ref:$ref,sha:$sha}' > ref-request.json
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" --input ref-request.json
