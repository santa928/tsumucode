name: Author CPython memory observation

on:
  push:
    branches: [codex/issue137-cpython-oom-classification]
    paths:
      - scripts/ci/python-memory-observation.py
      - scripts/local/controller.mjs
      - .github/workflows/python-memory-observation.yml

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TSUMUCODE_OBSERVATION_OWNER: tsumucode-cpython-observe-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Prepare the existing fixed runtime images
        run: |
          docker pull node:24.18.0-bookworm-slim@sha256:cb4e8f7c443347358b7875e717c29e27bf9befc8f5a26cf18af3c3dec80e58c5
          docker pull python:3.14.2-slim-bookworm@sha256:e87711ef5c86aaeaa7031718a69db79d334d94c545c709583f651b8185870941
      - name: Build the existing controller with author-only observations
        run: |
          docker build --file Dockerfile.learning --target controller \
          --label "app.tsumucode.owner=$TSUMUCODE_OBSERVATION_OWNER" \
          --tag "$TSUMUCODE_OBSERVATION_OWNER-controller:author" .
          docker build --file Dockerfile.learning --target web \
          --label "app.tsumucode.owner=$TSUMUCODE_OBSERVATION_OWNER" \
          --tag "$TSUMUCODE_OBSERVATION_OWNER-web:author" .
      - name: Observe the original controller acceptance sequence once
        run: python3 scripts/ci/python-memory-observation.py
      - name: Clean only the disposable probe containers
        if: always()
        run: |
          mkdir -p test-results/python-memory-observation
          cleanup_status=0
          for role in learner web controller; do
            for container in $(docker ps -aq --filter "label=app.tsumucode.owner=$TSUMUCODE_OBSERVATION_OWNER" --filter "label=app.tsumucode.role=$role"); do
              if [ "$role" = controller ]; then
                docker logs "$container" > "test-results/python-memory-observation/fallback-$container.log" 2>&1 || cleanup_status=1
              fi
              docker stop --timeout 30 "$container" || cleanup_status=1
              docker rm "$container" || cleanup_status=1
            done
          done
          for role in controller web; do
            if docker image inspect "$TSUMUCODE_OBSERVATION_OWNER-$role:author" > /dev/null 2>&1; then
              docker image rm "$TSUMUCODE_OBSERVATION_OWNER-$role:author" || cleanup_status=1
            fi
          done
          for network in $(docker network ls -q --filter "label=app.tsumucode.owner=$TSUMUCODE_OBSERVATION_OWNER"); do
            docker network rm "$network" || cleanup_status=1
          done
          exit "$cleanup_status"
      - name: Preserve the author observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-memory-observation-${{ github.sha }}
          path: test-results/python-memory-observation/
          if-no-files-found: warn
          retention-days: 7
