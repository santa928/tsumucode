name: Author CPython memory observation

on:
  push:
    branches: [codex/issue137-cpython-oom-classification]
    paths:
      - scripts/ci/python-memory-observation.py
      - scripts/local/controller.mjs
      - .github/workflows/python-memory-observation.yml

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TSUMUCODE_OBSERVATION_OWNER: tsumucode-learning-cpython-observe-${{ github.run_id }}-${{ github.run_attempt }}
      TSUMUCODE_LOCAL_OWNER: tsumucode-learning-cpython-observe-${{ github.run_id }}-${{ github.run_attempt }}
      TSUMUCODE_LOCAL_SOCKET: /var/run/docker.sock
      TSUMUCODE_COOKIE_DIAGNOSTICS: '1'
      COMPOSE_PARALLEL_LIMIT: 1
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Prepare the existing fixed runtime images
        run: |
          docker pull node:24.18.0-bookworm-slim@sha256:cb4e8f7c443347358b7875e717c29e27bf9befc8f5a26cf18af3c3dec80e58c5
          docker pull python:3.14.2-slim-bookworm@sha256:e87711ef5c86aaeaa7031718a69db79d334d94c545c709583f651b8185870941
      - name: Build the original Compose targets with author-only observations
        run: python3 scripts/ci/python-memory-observation.py --prepare
      - name: Observe the original Browser and resident prefix once
        run: python3 scripts/ci/python-memory-observation.py
      - name: Clean only the disposable probe containers
        if: always()
        run: |
          mkdir -p test-results/python-memory-observation
          cleanup_status=0
          for owner in "$TSUMUCODE_OBSERVATION_OWNER" "$TSUMUCODE_OBSERVATION_OWNER-grade-sentinel" "$TSUMUCODE_OBSERVATION_OWNER-sentinel" "$TSUMUCODE_OBSERVATION_OWNER-diagnostic"; do
            containers=$(docker ps -aq --filter "label=app.tsumucode.owner=$owner") || { cleanup_status=1; continue; }
            for container in $containers; do
              docker logs "$container" > "test-results/python-memory-observation/fallback-$container.log" 2>&1 || cleanup_status=1
              docker stop --timeout 30 "$container" || cleanup_status=1
              docker rm "$container" || cleanup_status=1
            done
          done
          images=$(docker image ls -q --filter "label=app.tsumucode.owner=$TSUMUCODE_OBSERVATION_OWNER") || cleanup_status=1
          for image in $images; do
            docker image rm "$image" || cleanup_status=1
          done
          networks=$(docker network ls -q --filter "label=app.tsumucode.owner=$TSUMUCODE_OBSERVATION_OWNER") || cleanup_status=1
          for network in $networks; do
            docker network rm "$network" || cleanup_status=1
          done
          exit "$cleanup_status"
      - name: Preserve the author observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-memory-observation-${{ github.sha }}
          path: test-results/python-memory-observation/
          if-no-files-found: warn
          retention-days: 7
